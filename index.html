散布し養生することで，舗設する混合物層とその下層の接着を良くするために行う。","既設舗装を切削してポーラスアスファルト混合物を舗設する場合は，切削溝が排水の障害を起こしやすいため，できるだけ凹凸が大きくなるように切削する必要がある。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":123,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78530"},{"cat":"専門土木","year":"R6 No.37","q":"道路のコンクリート舗装の施工に関する次の記述のうち，適当でないものはどれか。","opts":["普通コンクリート版の施工をセットフォーム工法で行う場合は，ボルトで連結されたレールを走行する舗設機械の重量に耐えられる堅牢な型枠を用いなければならない。","普通コンクリート版の施工をスリップフォーム工法で行う場合は，履帯走行位置の平坦性と支持力の確保も重要である。","連続鉄筋コンクリート版の施工をスリップフォーム工法で行う場合は，舗設後の出来形や品質を確保するため，センサラインが正しく設置されていることを確認しておく。","連続鉄筋コンクリート版の施工をセットフォーム工法で行う場合は，コンクリートの敷均し，締固め，荒仕上げ，平坦仕上げを一台の施工機械で行う。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":124,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78531"},{"cat":"専門土木","year":"R6 No.38","q":"ダムの基礎処理として行われるグラウチングに関する次の記述のうち，適当でないものはどれか。","opts":["ダム基礎グラウチングの施工法であるステージ注入工法は，下位から上位のステージに向かって削孔と注入を交互に行っていく工法である。","重力式コンクリートダムのコンソリデーショングラウチングは，着岩部付近において，遮水性の改良，基礎地盤弱部の補強を目的として行う。","ダム基礎地盤の透水性は，通常ボーリング孔を利用した水の圧入によるルジオンテストにより調査され，ルジオン値（Lu）で評価される。","グラウチングのセメントミルクの配合は，水セメント比（W/C）で表わされ，一般に濃度の薄い配合から濃い配合へ順次切替え注入していく。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":125,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78532"},{"cat":"専門土木","year":"R6 No.39","q":"ダムのコンクリートの打込みに関する次の記述のうち，適当でないものはどれか。","opts":["柱状ブロック工法でコンクリート運搬用のバケットを用いてコンクリートを打ち込む場合は，バケットの下端が打込み面上1mに達するまで下ろし，コンクリートを放出する。","RCD用コンクリートの練混ぜから締固めまでの許容時間は，ダムコンクリートの材料や配合，気温や湿度等によって異なるが，夏季では3時間程度，冬季では4時間程度を標準とする。","横継目は，貯水池からの漏水経路となるため，横継目の上流端付近には主副1枚の止水板を設置する。","降雨時のダムコンクリートの打込みは，品質に悪影響を及ぼすため，一般に，RCD用コンクリートの場合は1時間当たり1mm以上の降雨強度のときは打込みを中止する。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":126,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78533"},{"cat":"専門土木","year":"R6 No.40","q":"トンネルの山岳工法における掘削工法に関する次の記述のうち，適当でないものはどれか。","opts":["補助ベンチ付き全断面工法は，ベンチを付けて切羽の安定を図ると共に，掘削効率の向上を図るために，上部半断面と下部半断面の同時施工を行う。","ベンチカット工法は，一般に上部半断面と下部半断面に分割して掘削する工法であり，地山が不良な場合にはベンチ長を長くする。","導坑先進工法は，導坑をトンネル断面内に設ける場合には，前方の地質確認や水抜き等の効果があり，導坑設置位置によって，頂設導坑，中央導坑，底設導坑等がある。","中壁分割工法は，大断面掘削の場合に多く用いられ，左右どちらか片側半断面を先進掘削し，反対側半断面を遅れて掘削する。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":127,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78534"},{"cat":"専門土木","year":"R6 No.41","q":"トンネルの山岳工法における補助工法に関する次の記述のうち，適当でないものはどれか。","opts":["地表面沈下対策は，地表面の沈下による地表や地中の構造物への影響抑制のために実施するもので，長尺フォアパイリング，パイプルーフ等がある。","地下水対策は，地下水による切羽の不安定化防止対策として実施するもので，水抜きボーリング，止水注入工法等がある。","脚部の安定対策は，脚部沈下と沈下に伴う地山の緩み抑制のために実施するもので，仮インバート，鏡ボルト等がある。","天端部の安定対策は，天端の崩落防止対策として実施するもので，充塡式フォアポーリング，注入式フォアポーリング等がある。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":128,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78535"},{"cat":"専門土木","year":"R6 No.42","q":"海岸の潜堤・人工リーフの機能や特徴に関する次の記述のうち，適当でないものはどれか。","opts":["潜堤・人工リーフは，捨石等の材料を用いた没水構造物であり，景観を損なうことなく，波浪の静穏化，沿岸漂砂の制御機能を有する。","潜堤・人工リーフは，海上からは見えないことから，船舶の航行，漁船の操業等の安全に配慮する。","潜堤・人工リーフは，天端水深，天端幅により，堤体背後への透過波が変化し，波高の小さい波浪はほとんど透過し，大きな波浪を選択的に減衰させる。","潜堤・人工リーフは，一般的に離岸堤や消波堤と比較して反射波が大きく，堤体背後の堆砂機能は離岸堤と比較して少ない。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":129,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78536"},{"cat":"専門土木","year":"R6 No.43","q":"海岸堤防の施工に関する次の記述のうち，適当でないものはどれか。","opts":["堤防建設位置は制約を受けることが多く，強度の低い地盤に施工せざるをえない場合には，必要に応じて押え盛土，地盤改良等を考慮する。","堤体の盛土材料には，原則として多少粘土を含む砂質又は砂礫質のものを用い，締固めは，土質や使用機械の種類に応じ，適当な含水量の状態で，各層，全面にわたり均等に行う。","表法被覆工でコンクリートを場所打ちする際，特に緩傾斜の場合には，施工継手はクラックを生じさせないように水平打ち継ぎとする。","海上工事となる場合には，波浪，潮汐，潮流の影響を強く受け，作業時間が制限される場合もあるため，施工条件に対する考慮が重要である。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":130,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78537"},{"cat":"専門土木","year":"R6 No.44","q":"港湾の防波堤の施工に関する次の記述のうち，適当でないものはどれか。","opts":["傾斜堤は，施工設備が簡単であり，工程が単純で，施工管理が容易であるが，直立堤より施工時に波の影響を受けやすい。","ブロック式の直立堤は，施工が確実，容易であり，施工設備も簡単であるが，海上作業期間は一般に長くなり，ブロック数の多い場合，広い製作用地を必要とする。","ケーソン式の直立堤は，本体製作をドライワークで行うことができるため，施工が確実であるが，荒天日数の多い場所では施工日数に著しく制限を受ける。","混成堤は，石材等の資材の入手の難易度や価格等を比較して捨石部と直立部の高さの割合を決め経済的な断面にすることができるが，施工法及び施工設備が多様となる。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":131,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78538"},{"cat":"専門土木","year":"R6 No.45","q":"港湾工事におけるケーソンヤードでのケーソンの製作・進水方式に関する次の記述のうち，適当でないものはどれか。","opts":["斜路（滑路）方式は，ケーソンを自重で降下進水させるため，製作函台部に勾配があり延長を長くすると奥側のケーソンの降下速度が大きくなり危険である。","ドライドック方式のケーソン進水は，ドック内に注水したのち，引き出す方法のため安全性に富んでおり，規模が大きく長期的な利用が可能な場合に有利で，初期投資は小さい。","ドルフィンドック方式は，ケーソン製作や進水時に船体全体を水面下に沈めるため，クレーン及び注水排水設備，発電設備等は別途，陸上や付属船に装備される。","吊り降し方式は，護岸の背後等でケーソンを製作し，大型起重機船で吊り降すため，製作時にケーソンの自重により既設構造物に影響を及ぼす場合があり，事前に安定の確認が必要である。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":132,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78539"},{"cat":"専門土木","year":"R6 No.46","q":"鉄道のコンクリート路盤の施工に関する次の記述のうち，適当でないものはどれか。","opts":["コンクリート路盤の施工は，盛土自身の沈下等による路盤や軌道の変状の影響を極力少なくするために，盛土施工後に速やかに実施する。","コンクリート路盤相互の連結部となる伸縮目地は，列車荷重等によるせん断力の伝達を円滑に行い，目違いの生じない構造としなければならない。","コンクリートの打込みは，横流しを避け，傾斜部にコンクリートを打ち込む場合，低い方から高い方へ打ち込む。","鉄筋コンクリート版の鉄筋は，コンクリートの打込みの際に移動しないように鉄筋相互を十分堅固に組み立て，スペーサを介して型枠に接する状態となっていることを原則とする。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":133,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78540"},{"cat":"専門土木","year":"R6 No.47","q":"鉄道の軌道における維持管理に関する次の記述のうち，適当でないものはどれか。","opts":["道床バラストには，吸水率が小さく，強固で靱性に富み，適当な粒径と粒度を持つ材料を用いることが適当である。","軌道狂いは，軌道が列車荷重の繰返し荷重を受けて次第に変形し，車両走行面の不整が生ずるものである。","レールは温度変化によって伸縮を繰り返すため，レールの継目部に遊間を設けることで処理し，遊間の整正は夏期及び冬期に行うのが適当である。","PCマクラギは，木マクラギに比べ，初期投資は多額となるが，耐用年数が長いことによる交換の軽減，保守費の削減が可能である。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":134,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78541"},{"cat":"専門土木","year":"R6 No.48","q":"鉄道（在来線）の営業線及びこれに近接して工事を施工する場合の保安対策に関する次の記述のうち，適当でないものはどれか。","opts":["き電停止の手続きを行う場合は，その手続きを工事管理者が行うこととし，使用間合，時間，作業範囲，競合作業等について，あらかじめ監督員等と十分打合せを行う。","建設用大型機械の留置場所は，直線区間の建築限界の外方2m以上離れた場所で，かつ列車の運転保安及び旅客公衆等に対し安全な場所とする。","可搬式特殊信号発光機の設置位置は，作業現場から800m以上離れた位置まで列車が進来したときに，列車の運転士が明滅を確認できる建築限界内を基本とする。","線路閉鎖工事手続及び保守作業手続による作業等のときは，列車見張員等の配置を省略することができる。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":135,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78542"},{"cat":"専門土木","year":"R6 No.49","q":"シールド工法の施工管理に関する次の記述のうち，適当でないものはどれか。","opts":["密閉型シールドでは，土圧，排土量，シールドジャッキ推力等の計測値に急激な変動があった場合は，切羽の崩壊や土砂の取り込み過多等の発生が考えられる。","土圧式シールド工法において，粘着力が大きい土層を掘削する場合には，カッターチャンバ内に水を注入することにより掘削土砂の塑性流動性を高めることが必要である。","泥水式シールド工法の泥水処理については，土砂を分離した余剰泥水は水や粘土，ベントナイト，増粘剤等を加えて比重，濃度，粘性等を調整して切羽に再循環される。","テールボイド沈下（隆起）は，シールドテールが通過した直後にテールボイドの発生による応力解放や過大な裏込め注入圧等が原因で発生する。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":136,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78543"},{"cat":"専門土木","year":"R6 No.50","q":"鋼構造物塗装の施工管理に関する次の記述のうち，適当でないものはどれか。","opts":["塗料は，製造後長時間経過すると密封した缶内でも品質に変化が生じることになるので，開缶時に固化等の変状の有無を確認する必要がある。","多液形塗料や高粘度塗料の攪拌は，塗料を均一化させ乾きむらを防止するため攪拌機を用いることが望ましい。","塗装を塗り重ねる場合の塗装間隔は，付着性を良くし良好な塗膜を得るために重要な要素であり，塗料ごとに定められている。","塗料の乾燥が不十分のうちに次層の塗料を塗り重ねると，下層塗膜中の溶剤の蒸発によって上層塗膜ににじみが生じることがある。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":137,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78544"},{"cat":"専門土木","year":"R6 No.51","q":"軟弱地盤や液状化の恐れがある地盤における上水道管布設に関する次の記述のうち，適当なものはどれか。","opts":["軟弱層が深く予想沈下量が大きい地盤に管を布設する場合は，伸縮可撓性が小さく，かつ離脱防止性能を持った継手を適所に用いることが望ましい。","砂質地盤で地下水位が高く，地震時に間隙水圧の急激な上昇による液状化の可能性が高いと判定される場所では，適切な管径を選定するほか必要に応じ地盤改良等を行う。","軟弱層が浅い地盤に管を布設する場合は，管の重量，管内水重，埋戻し土圧等を考慮して管底部での土圧増加分等を計算し，沈下量を推定した上で管径を選定する。","軟弱層が深い地盤に管を布設する場合は，薬液注入工法，サンドドレーン工法等により地盤改良を行うことが必要である。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":138,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78545"},{"cat":"専門土木","year":"R6 No.52","q":"下水道に用いられる剛性管渠の基礎の種類に関する次の記述のうち，適当でないものはどれか。","opts":["コンクリート及び鉄筋コンクリート基礎は，地盤が軟弱な場合や管渠に作用する外圧が小さい場合に採用し，管渠の底部をコンクリートで巻き立てて管渠を支持する。","砂又は砕石基礎は，比較的地盤が良い場所に採用し，砂又は細かい砕石等を管渠外周（下部）に満遍なく密着するように締め固めて管渠を支持する。","はしご胴木基礎は，地盤が軟弱な場合や，土質や上載荷重が不均質な場合に採用し，まくら木の下部に管渠と平行に縦木をはしご状に設置して管渠を支持する。","鳥居基礎は，極軟弱地盤でほとんど地耐力を期待できない場合に採用し，はしご胴木の下部を杭で支えて管渠を支持する。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":139,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78546"},{"cat":"専門土木","year":"R6 No.53","q":"下水道工事における小口径管推進工法の施工に関する次の記述のうち，適当でないものはどれか。","opts":["滑材の注入にあたっては，滑材吐出口の位置が先導体後部及び発進坑口止水器部に限定されるので，推進開始から推進力の推移をみながら厳密に管理して滑材注入を行わなければならない。","推進管理測量を行う際に，水平方向については，先導体と発進立坑の水位差で管理する液圧差レベル方式を用いることで，リアルタイムに比較的高精度の位置管理が可能となる。","先導体を曲進させる際には，機構を簡易なものとするために全断面を掘削し，外径を大きくする方法を採用するのが一般的である。","先導体の到達にあたっては，先導体の位置を確認し，地山の土質，補助工法の効果の状況，湧水の状態等に留意し，その対策を施してから到達の鏡切りを行わなければならない。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":140,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78547"},{"cat":"専門土木","year":"R6 No.54","q":"下水道工事における，薬液注入工法の注入効果の確認方法に関する次の記述のうち，適当でないものはどれか。","opts":["現場透水試験の評価は，注入改良地盤で行った現場透水試験の結果に基づき，透水性に関する目標値，設計値，得られた透水係数のばらつき等から総合的に評価する。","砂地盤の強度の増加を室内の三軸圧縮試験により確認する場合は，地盤の粘着力の値は変化しないといわれていることから，内部摩擦角の変化で判断する。","標準貫入試験結果の評価はＮ値の増減を見て行い，評価を行う際には同一地層でＮ値を平均する等の簡易的な統計処理を実施する。","アルカリ系薬液の浸透状況を直接確認する場合は，薬液注入を行った箇所周辺を掘削し，フェノールフタレイン試薬を散布して薄い赤色に変色することを確認する。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":141,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78548"},{"cat":"法規","year":"R6 No.55","q":"常時10人以上の労働者を使用する使用者が，就業規則に必ず記載しなければならない次の事項のうち，労働基準法上，正しいものはどれか。","opts":["表彰及び制裁の種類及び程度に関する事項","安全及び衛生に関する事項","職業訓練に関する事項","賃金（臨時の賃金等を除く）の支払の時期に関する事項"],"ans":3,"ex":"","src":"20240708_1kyu","qid":142,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78549"},{"cat":"法規","year":"R6 No.56","q":"労働時間，休憩及び休日に関する次の記述のうち，労働基準法上，誤っているものはどれか。","opts":["使用者は，労働者に，休憩時間を除き1週間について40時間を超えて，1週間の各日については休憩時間を除き1日について8時間を超えて，労働させてはならない。","使用者は，労働者の過半数で組織する労働組合と協定した場合でも，通常予見される時間外労働の範囲内においては，原則として，1箇月について50時間及び1年について360時間を超えて労働時間を延長してはならない。","使用者は，その雇入れの日から起算して6箇月間継続勤務し，全労働日の8割以上出勤した労働者に対して，継続し，又は分割した10労働日の有給休暇を与えなければならない。","使用者は，労働者に対して，労働時間が6時間を超える場合においては少なくとも45分，8時間を超える場合においては少なくとも1時間の休憩時間を労働時間の途中に，原則として一斉に与えなければならない。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":143,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78550"},{"cat":"法規","year":"R6 No.57","q":"事業者が統括安全衛生責任者に統括管理させなければならない次の事項のうち，労働安全衛生法上，誤っているものはどれか。","opts":["作業間の連絡及び調整を行うこと。","協議組織の設置及び運営を行うこと。","衛生管理者が行う労働者の安全又は衛生のための教育に対する指導及び援助を行うこと。","作業場所の巡視をすること。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":144,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78551"},{"cat":"法規","year":"R6 No.58","q":"高さが5m以上のコンクリート造の工作物の解体等の作業における危険を防止するために，事業者又はコンクリート造の工作物の解体等作業主任者（以下，解体等作業主任者という。）が行わなければならない事項に関する次の記述のうち，労働安全衛生法令上，誤っているものはどれか。","opts":["解体等作業主任者は，強風，大雨，大雪等の悪天候のため，作業の実施について危険が予想されるときは，当該作業を中止させなければならない。","解体等作業主任者は，作業の方法及び労働者の配置を決定し，作業を直接指揮しなければならない。","事業者は，外壁，柱等の引倒し等の作業を行うときは，引倒し等について一定の合図を定め，関係労働者に周知させなければならない。","事業者は，コンクリート造の工作物の解体等作業主任者技能講習を修了した者のうちから，解体等作業主任者を選任しなければならない。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":145,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78552"},{"cat":"法規","year":"R6 No.59","q":"元請負人の義務に関する次の記述のうち，建設業法上，誤っているものはどれか。","opts":["元請負人は，前払金の支払を受けたときは，下請負人に対して，資材の購入，労働者の募集その他建設工事の着手に必要な費用を前払金として支払うよう適切な配慮をしなければならない。","元請負人は，その請け負った建設工事を施工するために必要な工程の細目，作業方法その他元請負人において定めるべき事項を定めようとするときは，あらかじめ，下請負人の意見をきかなければならない。","元請負人は，検査によって下請負人の請け負った建設工事の完成を確認した後，下請負人が申し出たときは，特約がされている場合を除いて，当該申し出を受けた日から50日以内に当該建設工事の目的物の引渡しを受けなければならない。","元請負人は，請負代金の出来形部分に対する支払を受けたときは，施工した下請負人に対して，下請代金の一部を，当該支払を受けた日から1月以内で，かつ，できる限り短い期間内に支払わなければならない。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":146,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78553"},{"cat":"法規","year":"R6 No.60","q":"建設工事の請負契約に関する次の記述のうち，建設業法上，誤っているものはどれか。","opts":["建設工事の請負契約の当事者は，契約の締結に際して，価格等の変動若しくは変更に基づく請負代金の額又は工事内容の変更に関する事項等を書面に記載し，署名又は記名押印をして相互に交付しなければならない。","注文者は，自己の取引上の地位を不当に利用して，その注文した建設工事を施工するために通常必要と認められる原価に満たない金額を請負代金の額とする請負契約を締結してはならない。","建設業者は，建設工事の請負契約を締結するに際して，工事内容に応じ，工事の種別ごとの材料費，労務費その他の経費の内訳並びに工事の工程ごとの作業及びその準備に必要な日数を明らかにして，建設工事の見積りを行うよう努めなければならない。","注文者は，建設工事の請負契約を締結する以前，又は入札を行う以前に，工事内容，請負代金の額，工事着手の時期及び工事完成の時期等についてできる限り具体的な内容を提示しなければならない。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":147,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78554"},{"cat":"法規","year":"R6 No.61","q":"道路占用工事における道路の掘削に関する次の記述のうち，道路法令上，誤っているものはどれか。","opts":["舗装道の舗装の部分の切断は，のみ又は切断機を用いて，原則として直線に，かつ，路面に垂直に行うこと。","掘削部分に近接する道路の部分には，占用のために掘削した土砂をたい積しないで余地を設け，当該土砂が道路の交通に支障を及ぼすおそれのある場合は，他の場所に排出すること。","わき水又はたまり水の排出にあたっては，いかなる場合でも道路の排水施設や路面に排出してはならない。","道路の掘削面積は，道路の交通に著しい支障を及ぼすことのないよう覆工を施工する等の措置をした場合を除き，当日中に復旧可能な範囲とすること。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":148,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78555"},{"cat":"法規","year":"R6 No.62","q":"河川管理者以外の者が，河川区域内（高規格堤防特別区域を除く）で工事を行う場合の手続きに関する次の記述のうち，河川法令上，誤っているものはどれか。","opts":["河川管理者の許可を受けて設置されている排水施設の機能を維持するために排水口付近の土砂等の撤去は，河川管理者の許可を受ける必要はない。","河川管理者が管理する河川区域内の土地に工作物の新築等の許可を受ける者は，河川管理者から土地の占用許可も受ける必要がある。","河川区域内の上空を通過する電線や通信ケーブルを設置する場合は，河川管理者の許可を受ける必要はない。","河川区域内において土地の掘削，盛土等土地の形状を変更する行為は，民有地においても河川管理者の許可を受ける必要がある。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":149,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78556"},{"cat":"法規","year":"R6 No.63","q":"建築基準法令に関する次の記述のうち，誤っているものはどれか。","opts":["建築物は，土地に定着する工作物のうち，屋根及び柱若しくは壁を有するもの，これに附属する門若しくは塀又は地下若しくは高架の工作物内に設ける事務所，店舗，倉庫等をいい，建築設備を含むものとする。","都市計画区域において，工事を施工するために現場に仮設事務所を建築しようとする場合は，当該工事に着手する前にその計画が建築基準関係規定等に適合するか確かめるため，確認申請書を提出しなければならない。","原則として，建築物の敷地は，これに接する道の境より高くなければならず，建築物の地盤面は，これに接する周囲の土地より高くなければならない。","建築物の建築面積は，建築物の外壁又はこれに代わる柱の中心線で囲まれた部分の水平投影面積，敷地面積は敷地の水平投影面積による。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":150,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78557"},{"cat":"法規","year":"R6 No.64","q":"振動規制法令上，指定地域内で行う次の建設作業のうち，特定建設作業に該当するものはどれか。ただし，当該作業がその作業を開始した日に終わるものを除く。","opts":["舗装版破砕機を用いた舗装版の破砕作業で，1日の移動距離が50mを超えない作業","手持ち式ブレーカを用いた擁壁の取り壊し作業で，1日の移動距離が50mを超えない作業","振動ローラを用いた路体の締固め作業","圧入式杭打ち機を用いた鋼矢板の打込み作業"],"ans":0,"ex":"","src":"20240708_1kyu","qid":151,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78558"},{"cat":"法規","year":"R6 No.65","q":"特定建設作業を伴う建設工事を施工しようとする者が行う，届出に関する次の記述のうち，騒音規制法令上，誤っているものはどれか。","opts":["特定建設作業とは，建設工事として行われる作業のうち，当該作業がその作業を開始した日に終わるものを除き，著しい騒音を発生する作業であって政令で定めるものをいい，作業の実施にあたっては市町村長に届出が必要である。","指定地域内において，特定建設作業を伴う建設工事を施工しようとする者は，当該特定建設作業の開始の日の七日前までに，環境省令で定めるところにより，市町村長に届け出なければならない。","指定地域内において，特定建設作業の施工者が行う市町村長への実施の届出は，災害その他非常の事態の発生により特定建設作業を緊急に行う必要がある場合は，工事完成後に完了届を提出すれば足りる。","指定地域内において，特定建設作業の施工者が行う市町村長への特定建設作業の実施の届出は，当該特定建設作業の場所の附近の見取図その他環境省令で定める書類を添附しなければならない。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":152,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78559"},{"cat":"法規","year":"R6 No.66","q":"港長の許可に関する次の記述のうち，港則法令上，誤っているものはどれか。","opts":["特定港内又は特定港の境界附近で工事又は作業をしようとする者は，港長の許可を受けなければならない。","船舶は，特定港内又は特定港の境界付近において危険物を運搬しようとするときは，港長の許可を受けなければならない。","船舶は，特定港に入港したとき又は特定港を出港しようとするときは，港長の許可を受けなければならない。","船舶は，特定港において危険物の積込，積替又は荷卸をするには，港長の許可を受けなければならない。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":153,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78560"},{"cat":"施工管理法","year":"R6 問BNo.2","q":"工事目的物の引渡し等に関する次の記述のうち、公共工事標準請負契約約款上、誤っているものはどれか。","opts":["工事目的物の引渡し前に、受注者が、災害防止等のためにとった臨機の措置に要した費用は、受注者が請負代金額の範囲において負担することが適当でないと認められる部分については発注者が負担する。","工事目的物の引渡し前に、天災等の不可抗力により、工事目的物、仮設物又は工事現場に搬入済みの工事材料に生じた損害による費用のうち、保険等によりてん補されなかった部分については、発注者に請求することができない。","工事の施工に伴い通常避けることができない騒音、振動、地盤沈下、地下水の断絶等の理由により第三者に損害を及ぼしたときは、原則として、発注者がその損害を負担しなければならない。","引き渡された工事目的物が種類又は品質に関して契約不適合であるときは、発注者は受注者に対し、目的物の修補又は代替物の引渡しによる履行の追完を請求することができるが、過分の費用を要するときは、発注者は履行の追完を請求することができない。"],"ans":1,"ex":"","src":"20240708_1kyuB","qid":154,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78562"},{"cat":"施工管理法","year":"R6 問BNo.4","q":"建設工事における電気設備等に関する次の記述のうち、労働安全衛生規則上、誤っているものはどれか。","opts":["水等で濡れている場所や鉄板上で使用する移動式若しくは可搬式の電動機械器具は、漏電による感電防止のため自動電撃防止装置を取り付ける。","電気機械器具の操作を行う場合には、感電や誤った操作による危険を防止するために操作部分に必要な照度を保持する。","仮設の配線を通路面で使用する場合は、配線の上を車両等が通過すること等によって絶縁被覆が損傷するおそれのないような状態で使用する。","アーク溶接等（自動溶接を除く。）の作業に使用する溶接棒等のホルダーについては、感電の危険を防止するため、必要な絶縁効力及び耐熱性を有するものを使用する。"],"ans":0,"ex":"","src":"20240708_1kyuB","qid":155,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78564"},{"cat":"施工管理法","year":"R6 問BNo.5","q":"建設工事における施工計画立案に関する次の記述のうち、適当でないものはどれか。","opts":["資機材の輸送では、輸送ルートの道路状況や交通規制等を把握し、不明な点がある場合は、道路管理者や所轄警察署に相談して解決しておくことが重要である。","発注者から示される工程は、経済的な最適工期となっていることから、工程計画はこれをもとに作成する。","下請負業者の選定にあたっての調査では、技術力、過去の実績、信用度、労働力の供給、安全管理能力等について調査することが重要である。","工事内容を十分把握するためには、契約書類を正確に理解し、工事数量、仕様（規格）のチェックを行う。"],"ans":1,"ex":"","src":"20240708_1kyuB","qid":156,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78565"},{"cat":"施工管理法","year":"R6 問BNo.7","q":"特定元方事業者が、その労働者及び関係請負人の労働者の作業が同一の場所において行われることによって生ずる労働災害を防止するために講ずべき措置等に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。","opts":["工程に関する計画並びに主要な機械、設備及び作業用の仮設の建設物の配置に関する計画を関係請負人に作成させること。","当該作業場所の巡視を毎作業日に行うこと。","関係請負人が行う労働者の安全又は衛生のための教育に対する指導及び援助を行うこと。","発破が行われる場合、火災が発生した場合、土砂の崩壊等が発生した場合又は発生するおそれのある場合に行う警報を統一的に定めること。"],"ans":0,"ex":"","src":"20240708_1kyuB","qid":157,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78567"},{"cat":"施工管理法","year":"R6 問BNo.8","q":"安全衛生管理体制に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。","opts":["特定元方事業者は、関係請負人の労働者を含め、常時40人以上となる事業場（ずい道等の建設、圧気工法による作業、一定の橋梁の建設は除く）では、統括安全衛生責任者を選任する。","労働者数が常時20人以上となる事業場（ずい道等の建設、圧気工法による作業、一定の橋梁の建設、鉄骨造等の建築物の建設に限る）で、統括安全衛生責任者を選任しない事業場では、店社安全衛生管理者を選任する。","統括安全衛生責任者が選任された事業場では、元方安全衛生管理者を選任する。","統括安全衛生責任者が選任された事業場の下請事業場では、安全衛生責任者を選任する。"],"ans":0,"ex":"","src":"20240708_1kyuB","qid":158,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78568"},{"cat":"施工管理法","year":"R6 問BNo.9","q":"建設工事の労働災害防止対策に関する次の記述のうち、適当でないものはどれか。","opts":["足場、鉄骨等物体の落下しやすい高所には物を置かないこととするが、やむを得ず足場上に材料等を集積する場合には、集中荷重による足場のたわみ等の影響に留意する。","飛来落下の防止措置として、構造物の出入口と外部足場が交差する場所の出入口上部には、ネット、シート等による防護対策を講じる。","工事現場の周囲は、必要に応じて鋼板、シート又はガードフェンス等の立入防止施設を設置し、作業員及び第三者に対して工事区域を明確にする。","土留・支保工内の掘削において、切梁、腹起し等の部材上を通路として使用する際は、あらかじめ通路であることを表示する。"],"ans":3,"ex":"","src":"20240708_1kyuB","qid":159,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78569"},{"cat":"施工管理法","year":"R6 問BNo.11","q":"土工工事における明り掘削の作業にあたり事業者が講じなければならない措置に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。","opts":["地山の崩壊等により労働者に危険を及ぼすおそれのあるときは、あらかじめ、土止め支保工や防護網を設置し、労働者の立入禁止等の措置を講じなければならない。","運搬機械、掘削機械、積込機械の運行経路及び土石の積卸し場所への出入の方法をあらかじめ定めて、これを関係労働者に周知させなければならない。","掘削機械、積込機械等の使用による地中電線路等の損壊により労働者に危険を及ぼすおそれのあるときは、これらの機械を十分に注意して使用しなければならない。","地山の崩壊等による労働者の危険を防止するため、点検者を指名してその日の作業開始前、大雨や中震（震度4）以上の地震の後、浮石及びき裂等の状態を点検させなければならない。"],"ans":2,"ex":"","src":"20240708_1kyuB","qid":160,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78571"},{"cat":"施工管理法","year":"R6 問BNo.16","q":"JIS A 5308に準拠したレディーミクストコンクリートの受入れ検査に関する次の記述のうち、適当なものはどれか。","opts":["スランプ試験を行ったところ、スランプ12.0cmの指定に対して14.5cmであったため、合格と判定した。","空気量試験を行ったところ、空気量4.5％の指定に対して6.5％であったため、合格と判定した。","塩化物含有量の検査を行ったところ、塩化物イオン（Cl-）量として1.2kg/m3であったため、合格と判定した。","アルカリシリカ反応抑制対策について、コンクリート中のアルカリ総量が4.0kg/m3であったため、合格と判定した。"],"ans":0,"ex":"","src":"20240708_1kyuB","qid":161,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78576"},{"cat":"施工管理法","year":"R6 問BNo.17","q":"建設工事に伴う環境保全対策に関する次の記述のうち、適当でないものはどれか。","opts":["建設工事周辺地域の生活環境を損なわないように、住民の生活に影響の少ない時間帯を作業時間とすることや、建設機械の整備や取扱いを適正にする。","工事用車両による沿道交通への障害を防止するためには、工事現場周辺の道路における交通量、通学路等の有無、迂回路の状況について事前に十分調査する。","遮音壁は、音が直進する性質を利用して騒音低減を図ろうとするもので、遮音壁の設置長さに関係なく効果がある。","土砂を運搬する時は、飛散を防止するために荷台のシート掛けを行うと共に、作業場から公道に出る際には土砂の散逸防止に努める。"],"ans":2,"ex":"","src":"20240708_1kyuB","qid":162,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78577"},{"cat":"施工管理法","year":"R6 問BNo.18","q":"建設工事における土壌汚染対策に関する次の記述のうち、適当でないものはどれか。","opts":["地盤汚染対策工事においては、汚染土壌対策の作業エリアを区分し、作業エリアと場外の間に除洗区域を設置し、作業服等の着替えを行う。","地盤汚染対策工事においては、工事車両のタイヤ等に汚染土壌が付着し、場外に出ることのないように、車両の出口にタイヤ洗浄装置及び車体の洗浄施設を備える。","地盤汚染対策工事における屋外掘削の場合、飛散防止ネットを設置し、散水して飛散を防止する。","汚染土壌の運搬の過程において、汚染土壌から岩、コンクリートくずその他の物を分別する。"],"ans":3,"ex":"","src":"20240708_1kyuB","qid":163,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78578"},{"cat":"施工管理法","year":"R6 問BNo.19","q":"「建設工事に係る資材の再資源化等に関する法律」（建設リサイクル法）に関する次の記述のうち、誤っているものはどれか。","opts":["再資源化とは、分別解体等に伴って生じた建設資材廃棄物について、資材や原材料又は燃焼により熱を得ることに利用することができる状態にする行為をいう。","伐採木、抜根材、梱包材は、建設リサイクル法による分別解体等・再資源化等の義務付けの対象となる。","都道府県は、建設廃棄物のリサイクルが十分に推進できない地域が存在する場合、対象建設工事の規模の基準について、条例により上乗せ基準を設定することができる。","解体工事における技術管理者は、分別解体の機械操作等について、解体工事の施工に従事する他の者の監督を行わなければならない。"],"ans":1,"ex":"","src":"20240708_1kyuB","qid":164,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78579"},{"cat":"施工管理法応用","year":"R6 問BNo.21","q":"仮設工事計画立案の留意事項に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。\n・仮設工事計画では、取扱いが容易で（イ）を心がけると共に、作業員不足を考慮し、省力化が図れる計画とする。\n・仮設工事計画では、材料は（ロ）を使用し、可能な限り（ハ）を統一する。また、他工事にも転用できるような計画とする。\n・仮設工事計画では、仮設物の運搬、設置、運用、メンテナンス、撤去等の面から（ニ）に考慮する。","opts":["（イ）分散化　（ロ）市販品　（ハ）納期　（ニ）部分的","（イ）分散化　（ロ）特注品　（ハ）規格　（ニ）部分的","（イ）ユニット化　（ロ）特注品　（ハ）納期　（ニ）総合的","（イ）ユニット化　（ロ）市販品　（ハ）規格　（ニ）総合的"],"ans":3,"ex":"","src":"20240708_1kyuB","qid":165,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78581"},{"cat":"施工管理法応用","year":"R6 問BNo.22","q":"工事の施工に伴う関係機関への届出及び許可に関する下記の①〜④の記述のうち、適当なものの数は次のうちどれか。\n①打設しようとするコンクリート構造物において、型枠支保工の支柱高さが3.5m以上の場合は、所轄の労働基準監督署長に工事の計画を届け出なければならない。\n②道路上に工事用板囲、足場、詰所その他の工事用施設を設置し、継続して道路を使用する者は、道路管理者から道路占用許可を受けなければならない。\n③特殊な車両にあたる自走式建設機械を通行させようとする者は、所轄の警察署長に申請し、特殊車両の通行許可を受けなければならない。\n④つり足場又は張出し足場以外の足場で、高さが10m以上、組立てから解体までの期間が60日以上の場合は、市町村長に工事の計画を届け出なければならない。","opts":["2つ","3つ","4つ","5つ"],"ans":1,"ex":"","src":"20240708_1kyuB","qid":166,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78582"},{"cat":"施工管理法応用","year":"R6 問BNo.23","q":"土留め工の施工に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。\n・親杭横矢板壁は、壁面に（イ）がないため、地下水の状況に注意を払い、必要に応じて地下水位低下工法等の検討を行う。\n・鋼杭の現場継手を溶接で行う場合、原則として（ロ）を用いる。\n・油圧圧入工法を硬質地盤に適用する場合で、ウォータジェット等を併用する際には、（ハ）に注意する。\n・親杭及び鋼矢板の割付けは、隅角部の（ニ）や隅矢板等の形状を考慮して計画を行う。","opts":["（イ）止水性　（ロ）アーク溶接　（ハ）地盤の緩み　（ニ）杭配置","（イ）透水性　（ロ）アーク溶接　（ハ）騒音・振動　（ニ）杭深度","（イ）透水性　（ロ）加圧溶接　（ハ）騒音・振動　（ニ）杭深度","（イ）止水性　（ロ）加圧溶接　（ハ）地盤の緩み　（ニ）杭配置"],"ans":0,"ex":"","src":"20240708_1kyuB","qid":167,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78583"},{"cat":"施工管理法応用","year":"R6 問BNo.24","q":"施工計画における建設機械の選定に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。\n①組合せ建設機械の選定においては、従作業の施工能力は主作業の施工能力と同等、あるいは幾分高めにする。\n②組合せ建設機械の選定においては、主要機械の能力を最大限に発揮させるため作業体系を並列化する。\n③建設機械の選定においては、作業量をできるだけ平滑化し、施工期間中の使用機械の必要量が大きく変動しないように計画するのが原則である。\n④建設機械の選定においては、機械の能力・性能、作業場の面積等により最も適したものを選定し、その機械が平均能率を発揮できる施工法を選定する。","opts":["①②","③④","①②③","②③④"],"ans":2,"ex":"","src":"20240708_1kyuB","qid":168,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78584"},{"cat":"施工管理法応用","year":"R6 問BNo.25","q":"工程管理に用いる工程表に関する下記の①〜④の4つの記述のうち、適当なものの数は次のうちどれか。\n①ガントチャート及びバーチャートは、一般に広く用いられている横線式の工程表であり、バーチャートはガントチャートから発展したものである。\n②ガントチャートは、各作業を施工の順序に矢印で左から右に結び、工事全体を網状の矢線図で表したもので、工程遅延の処置ではどの作業を早めたら良いかを的確に判断できる。\n③バーチャートは、作業の流れが左から右に移行していくことで、進捗度合いがわかるが、各作業の所要日数がわからない。\n④バーチャートの作成には、全作業が工期内に完成できるように、各作業の所要時間と施工期間、施工順序を勘案のうえ、各作業を工程表に割り付ける。","opts":["2つ","3つ","4つ","5つ"],"ans":1,"ex":"","src":"20240708_1kyuB","qid":169,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78585"},{"cat":"施工管理法応用","year":"R6 問BNo.26","q":"工程管理を行う上で、品質・工程・原価に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。\n・品質と原価との関係は、悪い品質のものは一般的に安くでき、良い品質のものは原価が（イ）なる。\n・品質と工程との関係は、品質の良いものは一般的に時間がかかり、施工を速めて突貫作業をすると品質は（ロ）なる。\n・工程と原価との関係は、施工を速めていくと原価は段々安くなるが、さらに施工を速めて突貫作業を行うと原価は（ハ）なる。\n・品質・工程・原価との間には相反する性質があり、（ニ）して計画することが大切である。","opts":["（イ）高く　（ロ）悪く　（ハ）逆に高く　（ニ）これらを良く調整","（イ）さらに安く　（ロ）良く　（ハ）ますます安く　（ニ）これらを良く調整","（イ）高く　（ロ）悪く　（ハ）逆に高く　（ニ）原価を最も優先","（イ）さらに安く　（ロ）良く　（ハ）ますます安く　（ニ）原価を最も優先"],"ans":0,"ex":"","src":"20240708_1kyuB","qid":170,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78586"},{"cat":"施工管理法応用","year":"R6 問BNo.28","q":"車両系建設機械を用いる作業の安全確保のために事業者が講じなければならない措置に関する下記の①〜④の4つの記述のうち、労働安全衛生法令上、正しいものの数は次のうちどれか。\n①車両系建設機械は路肩や傾斜地等における転倒又は転落に備え、転倒時保護構造を有し、かつ、シートベルトを備えたもの以外の機械を使用しないように努めなければならない。\n②車両系建設機械のうち、コンクリートポンプ車における輸送管等の組立てや解体では、作業方法や手順を定めて労働者に周知させ、かつ、作業主任者を指名して直接指揮させなければならない。\n③車両系建設機械のブーム、アーム等を上げ、その下で修理や点検等の作業を行うときは、不意な降下防止のため、労働者に安全支柱や安全ブロック等を使用させなければならない。\n④車両系建設機械の運転について誘導者を置くときは、一定の合図を定め、誘導者に当該合図を行わせなければならない。","opts":["2つ","3つ","4つ","5つ"],"ans":2,"ex":"","src":"20240708_1kyuB","qid":171,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78588"},{"cat":"施工管理法応用","year":"R6 問BNo.29","q":"移動式クレーンの安全確保に関する措置のうち、下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、クレーン等安全規則上、正しいものは次のうちどれか。\n・クレーン機能付き油圧ショベルを小型移動式クレーンとして使用する場合、車両系建設機械の運転技能講習を修了している者を、クレーン作業の運転者として従事させることが（イ）。\n・移動式クレーンの定格荷重とは、フックやグラブバケット等のつり具の重量を（ロ）荷重をいい、ブームの傾斜角や長さにより変化する。\n・移動式クレーンを用いて作業を行うときは、（ハ）に、巻過防止装置、過負荷警報装置等の機能について点検を行わなければならない。\n・移動式クレーンを用いる作業においては、移動式クレーンの運転者が単独で作業する場合を除き、（ニ）を行うものを指名しなければならない。","opts":["（イ）できる　（ロ）含む　（ハ）その作業の前日まで　（ニ）合図","（イ）できない　（ロ）含む　（ハ）その日の作業を開始する前　（ニ）監視","（イ）できる　（ロ）含まない　（ハ）その作業の前日まで　（ニ）監視","（イ）できない　（ロ）含まない　（ハ）その日の作業を開始する前　（ニ）合図"],"ans":3,"ex":"","src":"20240708_1kyuB","qid":172,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78589"},{"cat":"施工管理法応用","year":"R6 問BNo.30","q":"建設工事における埋設物ならびに架空線等上空施設の保安措置に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。\n①施工者は、管理者の不明な埋設物を発見した場合、必要に応じて専門家の立会いを求め、埋設物に関する調査を再度行い、安全を確認した後に措置しなければならない。\n②架空線等上空施設に近接して工事を行う場合は、必ず発注者に施工方法の確認や立会いを求める。\n③架空線等上空施設に近接した工事の施工にあたっては、架空線等と機械、工具、材料等について安全な離隔を確保する。\n④施工者は、試掘等によって埋設物を確認した場合においては、その位置（平面・深さ）や周辺地質の状況等の情報を埋設物の管理者等に報告しなければならない。","opts":["①②","②③","①③④","②③④"],"ans":2,"ex":"","src":"20240708_1kyuB","qid":173,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78590"},{"cat":"施工管理法応用","year":"R6 問BNo.31","q":"酸素欠乏等のおそれのある工事を行う際、事業者が講じなければならない措置に関する下記の①〜④の4つの記述のうち、酸素欠乏症等防止規則上、正しいものの数は次のうちどれか。\n①第一種酸素欠乏危険作業に係る業務に労働者を就かせるときは、作業指揮者に対し、酸素欠乏症の防止等に関する特別の教育を行わなければならない。\n②硫化水素の発生のおそれがある第二種酸素欠乏危険作業に係る作業場では、酸素濃度及び硫化水素濃度を測定した上で作業に着手しなければならない。\n③労働者が酸素欠乏症等にかかって転落するおそれがあるときは、労働者に要求性能墜落制止用器具その他の命綱を使用させなければならない。\n④労働者が酸素欠乏症等にかかったときは遅滞なく、その旨を当該作業を行う場所を管轄する労働基準監督署長に報告しなければならない。","opts":["2つ","3つ","4つ","5つ"],"ans":2,"ex":"","src":"20240708_1kyuB","qid":174,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78591"},{"cat":"施工管理法応用","year":"R6 問BNo.32","q":"品質管理の測定値をプロットしたときの管理図の点の並び方に関する下記の①〜④の記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。\n①点が管理限界線内の範囲にあり、中心線の近くに全ての点が集まる場合は、品質が安定しているので改善の必要はない。\n②点が管理限界線内の範囲にあっても、管理限界線に接近してしばしば現われたら、工程に異常があったと考えられる。\n③点が管理限界線内の範囲にあり、連続して上昇又は下降するような傾向がない場合は、品質が安定しているので改善の必要はない。\n④点が管理限界線内の範囲にあっても、中心線に対して、上下どちらか一方の側に並んでいた場合は、工程に異常があったと考えられる。","opts":["①②","②④","①③④","②③④"],"ans":3,"ex":"","src":"20240708_1kyuB","qid":175,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78592"},{"cat":"施工管理法応用","year":"R6 問BNo.33","q":"情報化施工におけるTS（トータルステーション）・GNSS（全球測位衛星システム）を用いた盛土の締固め管理に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。\n・TS・GNSSを用いて締固め機械の走行記録をもとに、盛土の締固め管理をする方法は、（イ）の一つである。\n・TS・GNSSを用いた盛土の締固め管理は、締固め機械の走行位置をリアルタイムに計測し、（ロ）を確認する。\n・盛土材料をまき出す際は、盛土施工範囲の全面にわたって、試験施工で決定したまき出し厚（ハ）のまき出し厚となるように管理する。\n・盛土材料を締め固める際は、盛土施工範囲の全面にわたって、（ニ）だけ締め固めたことを示す色が車載パソコンのモニタに表示されるまで締め固める。","opts":["（イ）品質規定方式　（ロ）締固め度　（ハ）以上　（ニ）規定回数","（イ）工法規定方式　（ロ）締固め回数　（ハ）以下　（ニ）規定時間","（イ）品質規定方式　（ロ）締固め度　（ハ）以上　（ニ）規定時間","（イ）工法規定方式　（ロ）締固め回数　（ハ）以下　（ニ）規定回数"],"ans":3,"ex":"","src":"20240708_1kyuB","qid":176,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78593"},{"cat":"施工管理法応用","year":"R6 問BNo.34","q":"鉄筋の継手に関する下記の①〜④の4つの記述のうち、適当なものの数は次のうちどれか。\n①重ね継手における重ね合わせ長さは、鉄筋の径に関わらず一定とする。\n②重ね継手では、焼なまし鉄線を長く巻くほど継手の強度が向上する。\n③ガス圧接継手では、径が少しでも異なる鉄筋同士は、接合してはならない。\n④モルタル充塡継手では、施工後にモルタルが排出孔から排出していることを確認する。","opts":["2つ","3つ","4つ","5つ"],"ans":0,"ex":"","src":"20240708_1kyuB","qid":177,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78594"},{"cat":"施工管理法応用","year":"R6 問BNo.35","q":"微破壊・非破壊試験によるコンクリート構造物の強度測定に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。\n①リバウンドハンマによるコンクリート表層の反発度は、コンクリートの含水状態や中性化等の影響を受けることもあり、一定以上の材齢が経過したコンクリートの圧縮強度を精度良く推定することは困難である。\n②超音波法によるコンクリートの強度推定は、構造物中の鉄筋の影響を受けないので、配筋状況によらず任意の位置で実施することができる。\n③衝撃弾性波法でコンクリートの強度を精度良く推定するためには、強度を推定しようとするコンクリートごとに、伝播する弾性波の速度と強度の関係を事前に求めておく必要がある。\n④圧縮強度試験を小径コア（φ50mm以下として）で行うときには、通常用いられているφ100mmコアに対する強度補正方法が確立されている方法で行う。","opts":["①②","②④","①③④","②③④"],"ans":2,"ex":"","src":"20240708_1kyuB","qid":178,"srcUrl":""},{"cat":"土木一般","year":"R7 No.2","q":"コンシステンシー限界に関する下記の文章中のB，C，Dに当てはまる語句の次の組合せのうち，適当なものはどれか。土が塑性状から液状に移るときの境界の含水比をB，土が塑性状から半固体状に移るときの境界の含水比をC，BとCの含水比の幅をD，という。","opts":["塑性限界 … 液性限界 … 液性指数","液性限界 … 塑性限界 … 液性指数","液性限界 … 塑性限界 … 塑性指数","塑性限界 … 液性限界 … 塑性指数"],"ans":2,"ex":"","src":"20250707_1kyu","qid":179,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86606"},{"cat":"土木一般","year":"R7 No.6","q":"土の原位置試験の結果の利用に関する次の記述のうち，適当でないものはどれか。","opts":["標準貫入試験は，土層の構成の判定や構造物基礎の設計等に用いるN値を求めるために行う。","ポータブルコーン貫入試験は，地盤の強さの把握や建設機械のトラフィカビリティーの判定等に用いるコーン貫入抵抗を求めるために行うものである。","透水試験は，地下掘削に際しての湧水量や水位低下量の算定等に用いる透水係数を求めるために行うものである。","砂置換による土の密度試験は，土工の出来形管理基準に用いる土の密度を求めるために行う。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":180,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86610"},{"cat":"土木一般","year":"R7 No.7","q":"道路盛土等の材料として現場発生土を使用する場合の，留意点に関する次の記述のうち，適当でないものはどれか。","opts":["盛土の安定や沈下等が問題となる材料は，障害が生じにくい法面表層部，緑地等に使用する。","高含水比の材料は，できるだけ厚く敷き均して急速に脱水を促進させた後，ばっ気乾燥を行うか，処理材を混合調整し使用する。","安定が懸念される材料は，盛土法面勾配の変更や排水処理等の対策を講じるか，セメントや石灰による安定処理を行って使用する。","透水性の良い砂質土等の材料は，排水材料に使用し，岩塊や礫質土は，排水処理と安定性向上等のため，法尻に使用する。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":181,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86611"},{"cat":"土木一般","year":"R7 No.9","q":"土工における土量の変化率に関する次の記述のうち，適当でないものはどれか。","opts":["土量の変化率Lは，土の運搬計画を立てるときに用いられ，地山の土量とほぐした土量の体積比を測定して求める。","土量の変化率Cは，土の配分計画を立てるときに必要であり，ほぐした土量と締め固めた土量の体積比を測定して求める。","土量の変化率の決め方には，簡易な測定方法から試験施工による方法，あるいは既往の工事の結果から推定する方法等がある。","土の掘削・運搬中の損失及び基礎地盤の沈下による盛土量の増加は，原則として土量の変化率に含まれない。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":182,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86613"},{"cat":"土木一般","year":"R7 No.10","q":"軟弱地盤対策工法に関する次の記述のうち，適当なものはどれか。","opts":["サンドマット工法は，透水性の高い砂を用いた砂柱を地盤中に鉛直に造成することにより，水平方向の排水距離を短くして圧密を促進し，地盤の強度増加を図る工法である。","サンドコンパクションパイル工法は，地盤内に鋼管を貫入して管内に砂等を投入し，振動により締め固めた砂杭を地中に造成する工法で，液状化防止及び水平抵抗の増大等を図る工法である。","表層混合処理工法は，表面に一定の厚さの砂を敷設することで，軟弱層の圧密のための上部排水の促進と施工機械のトラフィカビリティーの確保を図る工法である。","高圧噴射攪拌工法は，原位置の軟弱土とセメント系固化材とを攪拌翼を用いて強制的に攪拌混合することで強固な柱体状等の安定処理土を形成し，すべり抵抗の増加，液状化防止等を図る工法である。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":183,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86614"},{"cat":"土木一般","year":"R7 No.11","q":"コンクリート用細骨材の品質に関する次の記述のうち，適当でないものはどれか。","opts":["異なる種類の細骨材を混合して用いる場合の吸水率については，混合後の試料で吸水率を測定し規定に適合すればよい。","異なる種類の細骨材を混合して用いる場合の塩化物量については，混合後の試料で塩化物量を測定し規定に適合すればよい。","砕砂は，粒形判定実積率試験により粒形の良否を判定し，角ばりの程度はできるだけ小さく，細長い粒や扁平な粒の少ないものを選定する。","細骨材中に含まれる多孔質の粒子は，一般に密度が小さく骨材の吸水率が大きいため，コンクリートの耐凍害性を損なう原因となる。"],"ans":0,"ex":"","src":"20250707_1kyu","qid":184,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86615"},{"cat":"土木一般","year":"R7 No.12","q":"コンクリート用骨材に関する次の記述のうち，適当でないものはどれか。","opts":["JIS A 5021に規定されるコンクリート用再生粗骨材Hは，吸水率が3.0％以下でなければならない。","高炉スラグ細骨材は，粒度調整等の目的で，細骨材の一部として山砂等の天然細骨材と混合して用いられる場合が多い。","凍結融解の繰返しによる気象作用に対する骨材の安定性を判断するための試験は，硫酸ナトリウムの結晶圧による破壊作用を応用した試験方法により行われる。","砂は，材料分離に対する抵抗性を持たせるため，粘土塊量が2.0％以上のものを用いなければならない。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":185,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86616"},{"cat":"土木一般","year":"R7 No.13","q":"コンクリート用混和材料に関する次の記述のうち，適当でないものはどれか。","opts":["膨張材を適切に用いると，コンクリートの乾燥収縮や硬化収縮等に起因するひび割れの発生の低減が期待できる。","石灰石微粉末を用いると，コンクリートの材料分離やブリーディングを抑制する等の効果が期待できる。","高性能AE減水剤を用いると，コンクリート温度や使用材料等の諸条件の変化に対して，ワーカビリティー等が影響を受けにくい傾向がある。","収縮低減材を用いると，乾燥収縮ひずみを低減することが期待できるが，硬化コンクリートの凍結融解抵抗性を低下させる場合があることに留意が必要である。"],"ans":2,"ex":"","src":"20250707_1kyu","qid":186,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86617"},{"cat":"土木一般","year":"R7 No.15","q":"コンクリートの打込みに関する次の記述のうち，適当でないものはどれか。","opts":["勾配のある部位にコンクリートを打ち込む場合，低い位置から順に打ち上げる。","スラブのコンクリートが壁又は柱のコンクリートと連続している場合には，これらを連続して打ち込むようにする。","コールドジョイントの発生を防ぐための許容打重ね時間間隔は，外気温が高いほど短くなる。","1回の打込み面積が大きく許容打重ね時間間隔の確保が困難な場合には，階段状にコンクリートを打ち込むことが有効である。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":187,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86619"},{"cat":"土木一般","year":"R7 No.16","q":"鉄筋の加工・組立に関する次の記述のうち，適当でないものはどれか。","opts":["鉄筋を保持するために用いるスペーサの数は必要最小限とし，1m2当たり4個以下を目安に配置する。","重ね継手は，所定の長さを重ね合わせて，直径0.8mm以上の焼なまし鉄線で数箇所緊結する。","鉄筋を組み立ててから長時間経過した場合には，コンクリートを打ち込む前に，付着を害するおそれのある浮き錆等を取り除くものとする。","エポキシ樹脂塗装鉄筋は，加工・組立後，塗膜に損傷が生じていないことを確認する。"],"ans":0,"ex":"","src":"20250707_1kyu","qid":188,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86620"},{"cat":"土木一般","year":"R7 No.17","q":"道路橋で用いられる基礎形式の種類とその特徴に関する次の記述のうち，適当でないものはどれか。","opts":["ケーソン基礎は，沈設時に基礎周面の摩擦抵抗を小さくできるよう構造的な配慮が行われることから，永続的な鉛直荷重に対し，原則として基礎底面のみで支持する。","摩擦杭基礎は，長期的な鉛直変位について十分検討を行い，周面摩擦力と基礎底面の支持により所要の支持力が得られるように根入れ深さを確保する必要がある。","直接基礎の支持層は，砂層及び砂礫層においては十分な強度が，粘性土層では圧密のおそれのない良質な層が，それぞれ必要である。","鋼管矢板基礎は，打込み工法，又は中掘り工法による先端支持とし，また井筒部の下端拘束を地盤により期待する構造体であるため，支持層への根入れが必要となる。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":189,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86621"},{"cat":"土木一般","year":"R7 No.18","q":"鋼管杭の現場溶接の施工に関する次の記述のうち，適当なものはどれか。","opts":["現場溶接施工に先立って，継手部の錆，土，油等はワイヤブラシ，グラインダ等を用いて除去し，水分はそのまま残しておく。","現場溶接施工に先立って，上杭と下杭の軸線の位置をずらしながら，目違い，ルート間隔等のチェック及び修正を行う。","現場溶接継手は，所要の強度，剛性及び形状を有すると共に，施工性にも配慮した構造とするため，一般に半自動溶接法によることが多い。","現場溶接完了後の有害な外部傷は，肉眼によって溶接部の割れ，溶け落ち等の有害な欠陥をすべての溶接部について確認し，内部の傷も同様に肉眼で確認する。"],"ans":2,"ex":"","src":"20250707_1kyu","qid":190,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86622"},{"cat":"土木一般","year":"R7 No.19","q":"場所打ち杭工法の施工に関する次の記述のうち，適当でないものはどれか。","opts":["オールケーシング工法では，ケーシングチューブを引き抜く際に，コンクリートの天端が下がるので，あらかじめ下がり量を考慮し，流動性の低いコンクリートを使用する。","オールケーシング工法では，コンクリート打込み中は，ケーシングチューブの先端も一般にコンクリート上面から所定の深さ以上挿入する。","リバース工法では，安定液のように粘性のあるものを使用しないため，泥水循環時において粗粒子の沈降が期待でき，一次孔底処理により泥水中のスライムはほとんど処理できる。","リバース工法では，スタンドパイプ内の土砂をハンマグラブで除去するが，ハンマグラブによる掘削がスタンドパイプより先行すると地盤を緩めたり崩壊させたりする。"],"ans":0,"ex":"","src":"20250707_1kyu","qid":191,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86623"},{"cat":"専門土木","year":"R7 No.22","q":"鋼道路橋の溶接施工上の留意事項に関する次の記述のうち，適当でないものはどれか。","opts":["組立溶接は，本溶接と同様に管理が必要であり，組立終了時までにスラグを除去し，溶接部表面に割れがないことを確認しなければならない。","開先溶接及び主桁のフランジと腹板のすみ肉溶接では，原則としてエンドタブを取り付け，溶接の始端及び終端が溶接する部材上に入らないようにしなければならない。","溶接を行う部分は，溶接に有害な黒皮，錆，塗料，油等の除去を行えば，溶接線近傍はあらためて乾燥させなくてよい。","設計において，特に仕上げの指定のない開先溶接は，ビード幅と余盛高さが規定の範囲内であれば，余盛りの仕上げはしなくてよい。"],"ans":2,"ex":"","src":"20250707_1kyu","qid":192,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86626"},{"cat":"専門土木","year":"R7 No.23","q":"鋼橋に用いる耐候性鋼材に関する次の記述のうち，適当なものはどれか。","opts":["耐候性鋼材で緻密な錆層を生成させるためには，雨水の滞留等で鋼材表面の湿潤状態が継続しないことや，乾湿の繰返しがないこと等の環境条件が要求される。","耐候性鋼材を用いた箱桁や鋼製橋脚等の内面は，閉鎖された空間であり結露が生じやすいため，普通鋼材と同様に内面用塗装仕様とする。","耐候性鋼材は，耐候性鋼用表面処理剤を塗布したものであれば，塩分過多な地域での使用が推奨される。","耐候性鋼材の黒皮の除去には，原板ブラストによる方法と製品ブラストによる方法があり，原板ブラストは，製品ブラストに比べ，汚れが少なく錆の均一性に優れている。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":193,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86627"},{"cat":"専門土木","year":"R7 No.24","q":"アルカリシリカ反応が生じたコンクリート構造物の補修・補強に関する次の記述のうち，適当でないものはどれか。","opts":["表面被覆材を選定する場合には，ひび割れに対する追従性やコンクリートのひび割れの開閉による疲労に対して優れた抵抗性を有する材料を採用するとよい。","予想されるコンクリート膨張量が大きい場合には，鋼板や連続繊維巻立て等の対策も検討する。","アルカリシリカ反応によるひび割れが顕著になると，鉄筋の曲げ加工部に亀裂や破断が生じるおそれがあるので，補修・補強対策を検討するとよい。","アルカリシリカ反応の補修・補強の時には，できるだけ水分を供給し構造物を湿潤に保つ対策を講じるとよい。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":194,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86628"},{"cat":"専門土木","year":"R7 No.26","q":"河川堤防の盛土施工に関する次の記述のうち，適当でないものはどれか。","opts":["嵩上げや拡幅に用いる堤体材料は，表腹付けには既設堤防より透水性の大きい材料を，裏腹付けには既設堤防より透水性の小さい材料を使用するのが原則である。","築堤盛土の施工中は，法面の一部に雨水が集中して流下すると法面浸食の主要因となるため，堤防横断方向に4〜5％程度の勾配を設けながら施工する。","既設の堤防に腹付け盛土を行う場合は，新旧法面をなじませるため段切りを行い，一般的にその高さは堤防締固め1層仕上り厚の倍の50〜60cm程度とすることが多い。","築堤盛土の締固めは，堤防法線に平行に行うことが望ましく，締固めに際しては締固め幅が重複するように常に留意して施工する。"],"ans":0,"ex":"","src":"20250707_1kyu","qid":195,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86630"},{"cat":"専門土木","year":"R7 No.27","q":"河川護岸に関する次の記述のうち，適当でないものはどれか。","opts":["現地の残土や土砂等を利用して植生の回復を図るかご系の護岸では，覆土に河川水を掛けること等による空隙の充塡を行い，背面土砂の流出を防ぐために吸出し防止材を設置する。","河床が低下傾向の河川において，復旧護岸の基礎を埋め戻す際は，可能な限り粒径の大きい材料で寄石すること等により，粗度を小さくして護岸近傍の流速を低減する等の工夫を行う。","護岸には，一般的に水抜きは設けないが，掘込河道等で残留水圧が大きくなる場合には，必要に応じて水抜きを設けるものとする。","縦帯工は，護岸の法肩部の破損を防ぐために設け，横帯工は，護岸の変位や破損が他に波及しないよう絶縁するために，法覆工の延長方向の一定区間ごとに設ける。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":196,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86631"},{"cat":"専門土木","year":"R7 No.28","q":"堤防を開削する場合の仮締切工の施工に関する次の記述のうち，適当でないものはどれか。","opts":["仮締切内の掘削は，水替え工による排水の濁りやその量の変化及び仮締切工である鋼矢板の変形等を監視しながら施工する。","砂質地盤では，テルツァギの方法でボイリングに対する検討を行い，その安全率を満足するような矢板の根入れ長さを確保したうえで施工する。","砂質地盤，粘性土地盤ともにパイピングの検討を行い，その安全率を満足するような矢板の根入れ長さ，あるいは壁体幅を決定したうえで施工する。","掘削底面付近が砂質地盤の場合にはヒービングの検討を行う必要があり，仮締切に対し安定数を用いて検討し，その所要の安定数以下になるように施工する。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":197,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86632"},{"cat":"専門土木","year":"R7 No.30","q":"地すべり防止工に関する次の記述のうち，適当でないものはどれか。","opts":["地すべり地域内に設ける地表水排除工は，柔軟な構造とし，ある程度の変状に対してもそれに応じて機能を維持でき，また修理の容易なものとする。","集水井に設ける集水ボーリングは，滞水層ごとに一ないし数段，放射状に配置し，浅層地下水の排除も同時に行うものとする。","排土工は，排土による応力除荷に伴う吸水膨潤による強度劣化の範囲を斜面表層部に限定するため，原則として，地すべり全域に渡って，斜面に平行に切土を行うものとする。","押え盛土工は，盛土部の下方斜面に潜在性の地すべりがある場合，下方斜面の地すべりを誘発する可能性があるので，盛土部基盤の安定性について十分に検討を行うものとする。"],"ans":2,"ex":"","src":"20250707_1kyu","qid":198,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86634"},{"cat":"専門土木","year":"R7 No.31","q":"急傾斜地崩壊防止工に関する次の記述のうち，適当なものはどれか。","opts":["重力式コンクリート擁壁工は，施工にあたって擁壁背面の水を排除するために水抜き孔を水平に設置する。","もたれ式コンクリート擁壁工は，斜面崩壊を直接抑止することが困難な場合に，斜面脚部から離して設置される擁壁である。","プレキャスト法枠工は，地山に金網等で作成した枠を張り付け，モルタル等を直接吹き付けるため，凹凸のある不整形な斜面にも施工できる工法である。","現場打ちコンクリート枠工は，切土法面の安定勾配が取れない場合や湧水をともなう場合等に用いられ，桁の構造は一般に鉄筋コンクリートである。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":199,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86635"},{"cat":"専門土木","year":"R7 No.32","q":"道路のアスファルト舗装における路床の施工に関する次の記述のうち，適当でないものはどれか。","opts":["盛土路床は，使用する盛土材の性質をよく把握したうえで均一に敷き均し，過転圧による強度低下を招かないように十分に締め固めて仕上げる必要がある。","安定処理路床でセメント及びセメント系安定材の散布及び混合に際して粉塵対策を施す必要がある場合には，防塵型の安定材を用いたり，シートを設置する等の対策をとる。","路床の置換え工法では，軟弱な原地盤を所定の深さまで掘削し，置換え土と掘削面が付着するよう掘削面を十分にかきほぐしながら施工する。","路床を構築後，上層の施工までに相当の期間がある場合には，構築路床面の保護を行うと共に仮排水等を施し，工事用車両の通過による荒れと降雨による軟弱化や流出の防止に配慮する。"],"ans":2,"ex":"","src":"20250707_1kyu","qid":200,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86636"},{"cat":"専門土木","year":"R7 No.33","q":"道路のアスファルト舗装における上層路盤の施工に関する次の記述のうち，適当なものはどれか。","opts":["粒度調整路盤は，材料分離に留意しながら粒度調整路盤材料を均一に敷き均し，材料が乾燥しすぎている場合は，液性限界付近の状態で締め固めて仕上げる。","セメント安定処理路盤は，敷き均した路盤材料は速やかに表面を整え，セメントの硬化が始まる前までに締固めを完了することが重要である。","加熱アスファルト安定処理路盤は，一般にモータグレーダを用いて敷き均すが，それ以外で敷き均す場合は，材料の分離に留意する。","石灰安定処理路盤は，前日の施工端部を垂直に切り取り，各々新しい材料を打ち継ぐことで，横方向の施工継目を施工する。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":201,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86637"},{"cat":"専門土木","year":"R7 No.34","q":"道路のアスファルト舗装における基層・表層の施工に関する次の記述のうち、適当なものはどれか。","opts":["寒冷期に加熱アスファルト混合物を舗設すると、混合物温度の低下が早く、所定の締固め度を得られにくいため、混合物の運搬中の保温方法を改善するとよい。","アスファルト混合物の敷均し作業中に雨が降り始めた場合は、敷均し作業を中止して、敷き均した混合物は雨が降りやむのを待ってから締め固めて仕上げる。","改質アスファルト混合物を舗設する場合は、通常の加熱アスファルト混合物に比べて、より低い温度で舗設を行う場合が多く、特に温度管理に留意して敷き均して締め固める。","二次転圧にタイヤローラを用いる場合は、振動ローラを用いるよりも少ない転圧回数で所定の締固め度が得られるが、転圧速度が速すぎると不陸や小波が発生する。"],"ans":0,"ex":"","src":"20250707_1kyu","qid":202,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86638"},{"cat":"専門土木","year":"R7 No.35","q":"道路のアスファルト舗装の各種補修工法に関する次の記述のうち、適当でないものはどれか。","opts":["オーバーレイ工法は、施工に先立ち既設アスファルト舗装の破損箇所を状況に応じて補修しておく必要があり、破損の原因が路床路盤の欠陥による場合は局部的に打ち換える。","加熱アスファルト混合物をシックリフト工法で舗設する場合の打換え工法は、即日交通開放すると交通開放後早期にわだち掘れが生じることがあるので、舗装を冷却する等の対策をとることが望ましい。","路上表層再生工法は、新たなアスファルト混合物の使用量が少ないほど、気象条件の影響を受けやすく、温度低下も早いのでアスファルト混合物の保温対策を行って既設表層も十分に加熱して速やかに締め固める。","コンクリート床版上の切削オーバーレイ工法は、床版の不陸のため舗装厚さが一定でない場合、既設舗装を切削する際に床版も切削して不陸をなくしておく。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":203,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86639"},{"cat":"専門土木","year":"R7 No.36","q":"道路の排水性舗装に用いるポーラスアスファルト混合物の施工に関する次の記述のうち、適当でないものはどれか。","opts":["プライムコートは、補修工事等で既設舗装を施工の基盤とする場合は、浸透水による剥離への対策を検討する必要があり、下層の防水処理としての役割が期待されている。","混合物の締固めは、供用後の耐久性及び機能性に大きく影響を及ぼすため、所定の締固め度を確保することが特に重要である。","ポーラスアスファルト混合物は、敷均し後の温度低下が早いため、設定した温度で締固めが行えるよう敷均し終了後、速やかに初転圧を行う。","継目は、よく清掃したのち加温を行い、敷き均したポーラスアスファルト混合物を締め固めて、相互に接着させる。"],"ans":0,"ex":"","src":"20250707_1kyu","qid":204,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86640"},{"cat":"専門土木","year":"R7 No.37","q":"道路のセットフォーム工法による普通コンクリート舗装の施工に関する次の記述のうち、適当でないものはどれか。","opts":["コンクリートの受入れは、荷下ろし前に所要のコンクリートが搬入されたか確認することが重要であり、観察と確認の結果、不良なコンクリートの場合は廃棄処分する。","初期養生は、コンクリート版の表面仕上げに引き続き行い、後期養生ができるようになるまでの間、コンクリート表面の乾燥を速めるために行う。","横収縮目地に設ける目地溝は、カッタによる切削時において、コンクリート版に有害な角欠けが生じない範囲内でできるだけ早期に行い、所定の位置に所要の幅及び深さまで垂直に切り込む。","コンクリートの敷均しは、敷均し機械を用いて行い、全体ができるだけ均等な密度になるように適切な余盛をつけて行う。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":205,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86641"},{"cat":"専門土木","year":"R7 No.39","q":"ダムのコンクリートの打込みに関する次の記述のうち、適当でないものはどれか。","opts":["ダムコンクリートに用いる骨材の貯蔵においては、安定した表面水率を確保するため、特に細骨材は雨水を避ける上屋を設け、水切り時間を確保する。","柱状ブロック工法におけるコンクリートのリフト高は、一般的にコンクリート熱放散、打設工程、打継面の処理等を考慮して0.3〜0.5mを標準としている。","RCD用コンクリートは、ブルドーザによって、一般的に0.75mリフトの場合には3層、1mリフトの場合には4層と薄層に敷き均し、振動ローラで締め固める。","ダムの越流部、導流部及び減勢部のコンクリートの表面は、流水によるすりへり作用に耐えるように、局部不陸の許容値を標準として平滑に仕上げる。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":206,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86643"},{"cat":"専門土木","year":"R7 No.40","q":"トンネルの山岳工法における掘削工法に関する次の記述のうち、適当なものはどれか。","opts":["ベンチカット工法は、一般に上部半断面と下部半断面に分割して掘削する工法であり、地山が不良な場合にはベンチ長を長くする。","全断面工法は、小断面のトンネルや地質の安定した地山で採用され、施工途中での地山条件の変化に対する順応性が高い。","補助ベンチ付き全断面工法は、全断面工法では施工が困難となる地山において、ベンチを付けて切羽の安定を図るものである。","導坑先進工法の一つである側壁導坑先進工法は、側壁脚部の地盤支持力が十分にある場合に適用される。"],"ans":2,"ex":"","src":"20250707_1kyu","qid":207,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86644"},{"cat":"専門土木","year":"R7 No.41","q":"トンネルの山岳工法における覆工コンクリートの施工に関する次の記述のうち、適当でないものはどれか。","opts":["覆工コンクリートの打込みは、原則として内空変位の収束前に行うことから、覆工の施工時期を判断するために変位計測の結果を利用する必要がある。","覆工コンクリートの締固めは、コンクリートのワーカビリティーが低下しないうちに、上層と下層が一体となるように行う。","覆工コンクリートの養生は、坑内換気やトンネル貫通後の外気の影響について注意し、一定期間において、コンクリートを適当な温度及び湿度に保つ必要がある。","覆工コンクリートの型枠の取外しは、打ち込んだコンクリートが自重等に耐えられる強度に達した後に行う。"],"ans":0,"ex":"","src":"20250707_1kyu","qid":208,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86645"},{"cat":"専門土木","year":"R7 No.42","q":"海岸堤防の根固工の施工に関する次の記述のうち、適当でないものはどれか。","opts":["捨石根固工は、一般には表層に所要の質量のものを三個並び以上とし、内部に向かって次第に大きな石を設置する。","捨石根固工を汀線付近に設置する場合は、地盤を掘り込むか、若しくは、天端幅を広くとることにより、海底土砂の吸出しを防止する。","根固工の基礎工は、法先地盤が砂地盤等で波による洗掘や吸出しを受けやすい箇所等では栗石、捨石等で施工する必要がある。","異形ブロック根固工は、異形ブロック間の空隙が大きいため、その下部に空隙の少ない捨石層を設けることが望ましい。"],"ans":0,"ex":"","src":"20250707_1kyu","qid":209,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86646"},{"cat":"専門土木","year":"R7 No.43","q":"消波工の施工に関する次の記述のうち、適当でないものはどれか。","opts":["消波工は、波の規模に応じた適度な空隙を持つことが必要である。","消波工は、消波効果を高めるために表面粗度を小さくすることが必要である。","消波工の断面は、中詰石の上に数層の消波ブロックを並べることもあれば、全断面を消波ブロックで施工することもある。","消波工の天端は、極端な凹凸を生じないように消波ブロックをかみ合わせ良く据え付けることが大切であり、消波ブロックを反転して据え付けることもある。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":210,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86647"},{"cat":"専門土木","year":"R7 No.44","q":"ケーソンの施工に関する次の記述のうち、適当でないものはどれか。","opts":["ケーソンに大廻しワイヤを回して回航する場合には、原則として二重回しとし、その取付け位置はケーソンの吃水線以下で、できれば浮心付近の高さに取り付ける。","ケーソンの据付け時の注水方法は、各隔室に平均的に注水してヘッド差を小さくする必要があり、隔室間に導水孔を設ける場合もある。","ケーソンの据付け時には、うねり等によるケーソンどうしの接触が生じるので、破損防止策として、ケーソン相互間にゴムタイヤ等の緩衝材を用いる。","ケーソンの据付けは、ケーソンを据付場所まで曳航し、所定の位置上にあることを確かめてから注水を開始し、注水を開始したら中断することなく一気に着底させる。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":211,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86648"},{"cat":"専門土木","year":"R7 No.50","q":"鋼構造物塗装の施工管理に関する次の記述のうち、適当でないものはどれか。","opts":["多液形塗料や高粘度塗料の攪拌は、塗料を均一化させ乾きむらを防止するため、攪拌機を用いることが望ましい。","塗料は、可使時間を過ぎると性能が十分でないばかりか欠陥となりやすいので、塗料ごとに定められた可使時間を守る必要がある。","塗装作業時の気温、塗付方法、塗付面の状態に適した塗料粘度に調整する場合は、塗料に適したプライマーで適切に希釈する必要がある。","塗装作業場所が屋内で、温度、湿度が調整されている場合は、屋外の気象条件に関係なく塗装を行うことができる。"],"ans":2,"ex":"","src":"20250707_1kyu","qid":212,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86654"},{"cat":"専門土木","year":"R7 No.54","q":"下水道における、薬液注入工事の施工管理に関する次の記述のうち、適当でないものはどれか。","opts":["薬液注入工事においては、注入箇所から20m以内に複数の地下水監視のために井戸を設置して、注入中のみならず注入後も一定期間、地下水を監視する義務がある。","薬液の注入量が500kℓ以上の大型の工事では、水ガラスの原料タンクと調合槽との間に流量積算計の設置が義務付けられているので、これにより水ガラスの使用量を確認する。","薬液注入工事における25m以上の大深度の削孔では、ダブルパッカー工法のパーカッションドリルによる削孔よりも、二重管ストレーナー工法の方が削孔の精度は低い。","材料の調合に使用する水は原則として水道水を使用するものとし、水道水が使用できない時は、水質基準のpHが5.8〜8.6の範囲内にある水を使用することが望ましい。"],"ans":0,"ex":"","src":"20250707_1kyu","qid":213,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86658"},{"cat":"法規","year":"R7 No.55","q":"労働基準法に定めている労働契約に関する次の記述のうち、誤っているものはどれか。","opts":["使用者は、労働契約の締結に際し、労働者に対して賃金、労働時間その他の労働条件を明示しなければならない。","労働者が退職の場合において、使用期間、業務の種類、賃金等について証明書を請求した場合においては、使用者は、遅滞なくこれを交付しなければならない。","使用者は、労働契約の不履行について違約金を定め、又は損害賠償額を予定する契約をする必要がある。","この法律で定める基準に達しない労働条件を定める労働契約は、その部分については無効とし、無効となった部分は、この法律で定める基準によるものとする。"],"ans":2,"ex":"","src":"20250707_1kyu","qid":214,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86659"},{"cat":"法規","year":"R7 No.56","q":"労働時間、休憩及び休日に関する次の記述のうち、労働基準法令上、誤っているものはどれか。","opts":["災害その他避けることのできない事由によって、臨時の必要がある場合においては、使用者は、行政官庁の許可を受けて、その必要の限度において労働時間を延長し、又は休日に労働させることができる。","使用者は、労働者に対して、労働時間が6時間を超える場合においては少なくとも45分、8時間を超える場合においては少なくとも1時間の休憩時間を労働時間の途中に、原則として一斉に与えなければならない。","労働者の過半数で組織する労働組合と使用者が協定し、通常予見される時間外労働の範囲内において労働時間を延長して労働させることができる時間は、原則として、1箇月について45時間及び1年について360時間を限度とする。","坑内労働の労働時間は、労働者が坑口に入った時刻から坑口を出た時刻までの時間のうち、休憩時間を除いた時間を労働時間とみなす。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":215,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86660"},{"cat":"法規","year":"R7 No.57","q":"事業者が統括安全衛生責任者に統括管理させなければならない事項に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。","opts":["協議組織の設置及び運営を行うこと。","作業場所の巡視を行うこと。","店社安全衛生管理者の指揮を行うこと。","作業間の連絡及び調整を行うこと。"],"ans":2,"ex":"","src":"20250707_1kyu","qid":216,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86661"},{"cat":"法規","year":"R7 No.59","q":"主任技術者及び監理技術者の職務等に関する次の記述のうち、建設業法令上、誤っているものはどれか。","opts":["主任技術者及び監理技術者は、施工計画の作成、工程管理、品質管理その他の技術上の管理及び工事の施工に従事する者の技術上の指導監督の職務を誠実に行わなければならない。","工事現場における建設工事の施工に従事する者は、主任技術者又は監理技術者がその職務として行う指導に従わなければならない。","監理技術者は、監理技術者資格者証の交付を受けている者又は、国土交通大臣の登録を受けた講習を受講した者のどちらかひとつの条件を満たしたものから選任しなければならない。","監理技術者は、当該監理技術者の行うべき職務を補佐する者として、当該建設工事に関し建設業法の規定で定める者を当該工事現場に専任で置くときは、当該工事現場については、専任の必要は無い。"],"ans":2,"ex":"","src":"20250707_1kyu","qid":217,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86663"},{"cat":"法規","year":"R7 No.60","q":"建設工事の請負契約に関する次の記述のうち、建設業法令上、誤っているものはどれか。","opts":["注文者は、その注文した建設工事を施工するために通常必要と認められる期間に比して著しく短い期間を工期とする請負契約を締結してはならない。","注文者は、自己の取引上の地位を不当に利用して、その注文した建設工事を施工するために通常必要と認められる原価に満たない金額を請負代金の額とする請負契約を締結してはならない。","請負人は、請負契約の履行に関し工事現場に現場代理人を置く場合においては、現場代理人の権限に関する事項及び当該現場代理人の行為についての注文者の請負人に対する意見書の申出の方法を、書面により注文者に通知しなければならない。","建設工事の注文者は、請負契約の方法を競争入札に付する場合にあっては、工事内容等についてできる限り具体的な内容を契約直前までに提示しなければならない。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":218,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86664"},{"cat":"法規","year":"R7 No.61","q":"特殊な車両の通行時の許可等に関する次の記述のうち、道路法令上、誤っているものはどれか。","opts":["特殊な車両を通行させようとする者は、通行する道路の道路管理者が複数となる場合には、通行するそれぞれの道路管理者に通行許可の申請を行わなければならない。","車両制限令には、道路の構造を保全し、又は交通の危険を防止するため、車両の幅、重量、高さ、長さ及び最小回転半径の最高限度が定められている。","特殊な車両の通行許可を受けた者は、当該許可に係る通行中、当該許可証を当該車両に備え付けなければならない。","道路管理者は、車両に積載する貨物が特殊であるためやむを得ないと認めるときは、必要な条件を付して、通行を許可することができる。"],"ans":0,"ex":"","src":"20250707_1kyu","qid":219,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86665"},{"cat":"法規","year":"R7 No.62","q":"河川管理者以外の者が、河川区域内（高規格堤防特別区域を除く）で工事を行う場合の手続きに関する次の記述のうち、河川法令上、誤っているものはどれか。","opts":["河川区域内で一時的に仮設の資材置き場を設置する場合は、河川管理者の許可を受ける必要がある。","河川区域内に設置されている取水施設の機能維持のために取水口付近に堆積した土砂を撤去する場合は、河川管理者の許可を受ける必要がある。","河川区域内の上空を通過する電線や通信ケーブルを設置する場合は、河川管理者の許可を受ける必要がある。","河川区域内の民有地において土地の掘削、盛土など土地の形状を変更する場合は、河川管理者の許可を受ける必要がある。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":220,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86666"},{"cat":"法規","year":"R7 No.63","q":"工事現場に仮設の現場事務所を設置する場合、建築基準法令上、仮設建築物の制限の緩和が適用されないものは、次の記述のうちどれか。","opts":["建築物の各部分の高さは、建築物を建築しようとする地域、地区又は区域及び容積率の限度の区分に応じて決定される高さ以下としなければならない。","建築物の敷地には、雨水及び汚水を排出し、又は処理するための適当な下水管、下水溝又はためますその他これらに類する施設を設置しなければならない。","建築物の敷地は、道路（自動車のみの交通の用に供する道路及び地区計画の区域内の道路を除く）に2m以上接しなければならない。","居室には換気のための窓その他の開口部を設け、その換気に有効な部分の面積は、その居室の床面積に対して、原則として、20分の1以上としなければならない。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":221,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86667"},{"cat":"法規","year":"R7 No.65","q":"振動規制法令上、特定建設作業に伴う建設工事を施工しようとする者が行う、市町村長への届け出に関する次の記述のうち、誤っているものはどれか。","opts":["指定地域内において特定建設作業を施工しようとする者が行う市町村長への実施の届け出には、当該特定建設作業の場所の付近の見取図その他環境省令で定める書類を添付しなければならない。","指定地域内において特定建設作業を施工しようとする者は、当該特定建設作業の開始の日の七日前までに、氏名、工作物の種類、特定建設作業の種類、振動の防止の方法等について環境省令で定めるところにより、市町村長に届け出なければならない。","特定建設作業とは、建設工事として行われる作業のうち、当該作業がその作業を開始した日に終わるものを除き、著しい振動を発生する作業であって政令で定めるものをいい、作業の実施に当たっては市町村長への届け出が必要である。","指定地域内において特定建設作業を施工する者が行う市町村長への実施の届け出は、災害その他非常の事態の発生により特定建設作業を緊急に行う必要がある場合は、工事完成後に完了届を提出すれば足りる。"],"ans":3,"ex":"","src":"20250707_1kyu","qid":222,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86669"},{"cat":"法規","year":"R7 No.66","q":"港則法令上、港長の許可又は届け出に関する次の記述のうち、正しいものはどれか。","opts":["船舶は、特定港において危険物の積込、積替又は荷卸をするには、港長に届け出なければならない。","特定港内において竹木材を船舶から水上に卸そうとする者は、港長の許可を受けなければならない。","特定港内において使用すべき私設信号を定めようとする者は、港長に届け出なければならない。","船舶は、特定港に入港したとき又は特定港を出港しようとするときは、国土交通省令の定めるところにより、港長の許可を受けなければならない。"],"ans":1,"ex":"","src":"20250707_1kyu","qid":223,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86670"},{"cat":"施工管理法","year":"R7 問BNo.2","q":"公共工事標準請負契約約款上、工事の施工に当たり受注者が監督員に通知し、その確認を請求しなければならない事項に該当しないものは、次の記述のうちどれか。","opts":["図面、仕様書、現場説明書及び現場説明に対する質問回答書が一致しないこと。","設計図書の表示が明確でないこと。","契約書及び設計図書に特定の定めがない仮設、施工方法について明示されていないこと。","工事現場の形状、地質、湧水等の状態が設計図書に示された施工条件と実際の工事現場が一致しないこと。"],"ans":2,"ex":"","src":"20250707_1kyuB","qid":224,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86672"},{"cat":"施工管理法","year":"R7 問BNo.4","q":"建設機械の最近の動向に関する次の記述のうち、適当でないものはどれか。","opts":["情報化施工は、GNSS（全球測位衛星システム）等の測位技術を用い、機械制御の自動化等により高い生産性や施工品質をもたらす様々な技術やその技術を用いた施工方法のことである。","マシンコントロール（MC）は、建設機械の位置と設計データとの差分をモニタ等に表示して、操作するオペレータに案内するシステムである。","情報化施工の出来形管理では、ICTを活用した計測機器により、計測から計測結果の取りまとめまでを行うことが可能である。","UAV（無人飛行機）は機材の軽量化と共に、機体制御のプロセッサ、GNSS（全球測位衛星システム）、慣性センサ等の技術的進歩により自律飛行ができ、計測や点検に利用されている。"],"ans":1,"ex":"","src":"20250707_1kyuB","qid":225,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86674"},{"cat":"施工管理法","year":"R7 問BNo.8","q":"建設工事現場における保護具使用に関する次の記述のうち、誤っているものはどれか。","opts":["保護帽は、頭にあったものを使用し、一度でも大きな衝撃を受けた保護帽は、外観に損傷がなくても使用してはならない。","衝撃、圧迫を受けた安全靴及び足の甲のプロテクタは、外観に損傷がなくても速やかに交換する。","防毒マスク及び防じんマスクは、酸素欠乏症の防止には全く効力がなく、酸素欠乏危険作業には絶対用いてはならない。","ボール盤、面取り盤等の回転する刃物に、労働者の手が巻き込まれるおそれのある作業の場合は、手袋を使用させなければならない。"],"ans":3,"ex":"","src":"20250707_1kyuB","qid":226,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86678"},{"cat":"施工管理法","year":"R7 問BNo.10","q":"型枠支保工の組立や安全作業等に関する次の記述のうち、誤っているものはどれか。","opts":["型枠支保工は、コンクリートの打設方法に応じた堅固な構造とし、組立図に従って組立てる。","型枠支保工及び型枠は、コンクリート打設作業前に点検し、不備な箇所は作業前に補修する。","型枠支保工の支柱の継手は、重ね継手又は差込み継手とし、鋼材はボルト、クランプ等の金具を用いて緊結すること。","型枠支保工は支柱の沈下、滑動を防止するため、必要に応じ敷砂・敷板の使用、コンクリート基礎の打設、根がらみの取付け等の措置を行うこと。"],"ans":2,"ex":"","src":"20250707_1kyuB","qid":227,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86680"},{"cat":"施工管理法","year":"R7 問BNo.11","q":"土工工事における明り掘削の作業に当たり事業者が遵守しなければならない事項に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。","opts":["運搬機械、掘削機械及び積込機械については、あらかじめ、運行の経路並びにこれらの機械の土石の積卸し場所への出入りの方法を定めて、これを地山の掘削作業主任者に知らせなければならない。","掘削機械、積込機械等の使用によるガス導管、地中電線路等の損壊により労働者に危険を及ぼすおそれのあるときは、これらの機械を使用してはならない。","地山の崩壊等による労働者の危険を防止するため、点検者を指名して、その日の作業開始前や大雨や中震（震度4）以上の地震の後に浮石及びき裂の有無及び状態並びに含水、湧水及び凍結の状態の変化を点検させなければならない。","地山の崩壊又は土石の落下により危険を及ぼすおそれのあるときは、あらかじめ、土止め支保工を設け、防護網を張り、作業に従事する者の立入りを禁止する等の措置を講じなければならない。"],"ans":0,"ex":"","src":"20250707_1kyuB","qid":228,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86681"},{"cat":"施工管理法","year":"R7 問BNo.12","q":"建設工事における墜落災害の防止において、事業者が講じなければならない措置に関する次の記述のうち、労働安全衛生法令上、作業の高さの基準として正しいものはどれか。","opts":["高さ2m以上の箇所で作業を行うときは、原則として、労働者が安全に昇降するための設備等を設けなければならない。","高さ1.5m以上の作業床の端、開口部等で墜落により労働者に危険を及ぼすおそれのある箇所には、囲い、手すり、覆い等を設けなければならない。","高さ1.5m以上の作業床の端で囲い等の設置が困難又は作業上、囲いを取りはずすときは、防網を張り、労働者に要求性能墜落制止用器具を使用させなければならない。","高さ2m以上の箇所で作業を行う場合、強風、大雨等の悪天候のため、危険が予想されるときは、当該作業を行わせてはならない。"],"ans":3,"ex":"","src":"20250707_1kyuB","qid":229,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86682"},{"cat":"施工管理法","year":"R7 問BNo.15","q":"道路舗装の品質管理における「測定対象」、「品質特性」及び「試験の方法」に関する次の組合せのうち、適当でないものはどれか。","opts":["路床 - 支持力 - 平板載荷試験","路盤 - 締固め度 - RI計器による密度測定","表層 - たわみ量 - ベンケルマンビームによる測定","アスファルト混合物 - すべり抵抗値 - 針入度試験"],"ans":3,"ex":"","src":"20250707_1kyuB","qid":230,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86685"},{"cat":"施工管理法","year":"R7 問BNo.17","q":"建設工事に伴う水質汚濁対策に関する次の記述のうち、適当でないものはどれか。","opts":["建設工事に伴って発生する濁水に対して処理が必要になる場合には、工事に先立って経済的で効果的な濁水処理施設を設置しなければならない。","建設工事に伴って発生する濁水に対して処理が必要になる場合には、濁水の放流水域や排水基準に関する法規制、濁水の性質等をあらかじめ調査、予測する必要がある。","切土面や盛土面の濁水防止対策として、シート養生、法面侵食防止剤の散布、種子やコンクリート吹付、永久緑化等をできるだけ早期に行う。","濁水は、切土面や盛土面の表流水として発生することが多いことから、他の条件が許す限りできるだけ切土面や盛土面の面積が大きくなるよう計画する。"],"ans":3,"ex":"","src":"20250707_1kyuB","qid":231,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86687"},{"cat":"施工管理法","year":"R7 問BNo.19","q":"資源の有効な利用の促進に関する法律に基づく、建設発生土の有効利用に関する次の記述のうち、誤っているものはどれか。","opts":["建設工事事業者は、建設発生土の品質等に関する技術的知見に基づき、建設工事の施工又は完成後の工作物の安全及び機能に支障が生じないよう、適切な施工を行うものとする。","建設工事事業者は、適切な施工方法の選択、資材置場の確保及び施工機械の選定に配慮し、再生資源が発生した場合、当該工事現場から全て搬出するものとする。","元請建設工事事業者等は、体積が500m3以上の土砂を搬入する建設工事を施工する場合には、あらかじめ再生資源利用計画を作成するものとする。","元請建設工事事業者等は、再生資源利用計画及びその実施状況の記録について、当該建設工事の完成後5年間保存するものとする。"],"ans":1,"ex":"","src":"20250707_1kyuB","qid":232,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86689"},{"cat":"施工管理法","year":"R7 問BNo.20","q":"コンクリート又は鉄筋コンクリート工作物の解体工事に関する次の記述のうち、適当でないものはどれか。","opts":["コンクリート圧砕機は、コンクリート構造物を押し砕くため、はさみ状のアタッチメントを装着した機械であり、鉄筋コンクリート構造物の解体に使用するものである。","油圧孔拡大機は、コアボーリング機等で穿孔した穿孔内にテーパー付きのウェッジを油圧力で押し込み、孔を拡大することによってコンクリート部材に亀裂を入れ取り壊すものである。","コンクリートカッタは、ダイヤモンドチップを埋め込んだブレードの丸のこで、柱等のコンクリート部材を適当な大きさに切断するものである。","ワイヤーソーは、切断解体しようとする部材にダイヤモンドビーズを取り付けたワイヤーを環状に巻き付け、潤滑油をかけながら高速回転させてコンクリートを切断するものである。"],"ans":3,"ex":"","src":"20250707_1kyuB","qid":233,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86690"},{"cat":"施工管理法応用","year":"R7 問BNo.22","q":"工事の施工に伴う関係機関への届出に関する下記の①〜④の記述のうち、届出先として適当なものの数は次のうちどれか。①騒音規制法に係る指定地域内において特定建設作業を伴う建設工事を施工しようとする者は、都道府県知事に当該特定建設作業の開始の7日前までに届け出なければならない。②吊り足場、又は張出し足場の組立てから解体までの期間が60日以上となる場合は、労働基準監督署長に計画を届け出なければならない。③ガス溶接作業において圧縮アセチレンガスを40kg以上貯蔵し、又は取り扱う者は、その旨をあらかじめ市町村長に届け出なければならない。④型枠支保工の支柱の高さが3.5m以上のコンクリート構造物の工事現場の場合は、警察署長に計画を届け出なければならない。","opts":["1つ","2つ","3つ","4つ"],"ans":0,"ex":"","src":"20250707_1kyuB","qid":234,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86692"},{"cat":"施工管理法応用","year":"R7 問BNo.23","q":"公共工事における施工体制台帳に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。・施工体制台帳には、建設工事の名称、内容及び工期、許可を受けて営む建設業の種類、（イ）の加入状況等を記載しなければならない。・元請業者は、施工体制台帳と合わせて施工の分担関係を表示した（ロ）を作成し、工事関係者や公衆が見やすい場所に掲げなければならない。・施工体制台帳を作成する建設工事の下請負人は、その請け負った工事を他の建設業を営む者に請け負わせたときは、再下請負通知書を（ハ）に提出しなければならない。・発注者から直接工事を請け負った建設業者は、施工するために下請契約を締結する場合には、下請金額（ニ）、施工体制台帳を作成しなければならない。","opts":["（イ）健康保険 （ロ）施工手順 （ハ）発注者 （ニ）が一定額以上の場合","（イ）健康保険 （ロ）施工体系図 （ハ）元請業者 （ニ）にかかわらず","（イ）建設業協会 （ロ）施工手順 （ハ）元請業者 （ニ）が一定額以上の場合","（イ）建設業協会 （ロ）施工体系図 （ハ）発注者 （ニ）にかかわらず"],"ans":1,"ex":"","src":"20250707_1kyuB","qid":235,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86693"},{"cat":"施工管理法応用","year":"R7 問BNo.24","q":"工事の原価管理に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。①原価管理は、最も経済的な施工計画を立て、これに基づいた実行予算の作成時点から始まって、「P-D-C-A」の管理サイクルを循環させることが基本になる。②施工担当者は、常に工事の原価を把握し、発生原価と実行予算の対比・評価を踏まえて、施工過程での品質・工程・安全等の管理を行うことが必要である。③原価管理を有効に実施するには、過度に細かい管理レベルを設定すると、大本を見失うことになるので、重点管理対象工種と管理精度を適切に設定しておくことが重要である。④原価管理の目的は、発生原価と実行予算を比較して差異を見出し、これを分析・検討して適時適切な措置をとり、発生原価を実行予算よりも高めに設定することが含まれる。","opts":["①②","②④","①②③","①③④"],"ans":2,"ex":"","src":"20250707_1kyuB","qid":236,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86694"},{"cat":"施工管理法応用","year":"R7 問BNo.25","q":"ネットワーク式工程表作成上の留意点と特徴に関する下記の①〜④の記述のうち、適当なものの数は次のうちどれか。①工事を独立した作業（アクティビティ）に分類し、これら各作業を施工順序に従って矢線（アロー）の形で、左から右に向けて結び、工事全体を網状の矢線図（ネットワーク）で表す。②作業と作業の結合点及びその作業の開始、終了を示すものとしてマル（〇）をつけイベントと呼び、〇の中には正整数を記入し、これをイベント番号という。③ネットワーク手法には、日程、配員、費用の計画を行うPERT系と、時間を費用との関連で捉えて工期短縮と費用の増加の関係を見ながら、最適な工期と費用を設定する系がある。④ダミーとは所要時間を持たない擬似作業で、アクティビティ相互の関係を示すために使われるものである。","opts":["1つ","2つ","3つ","4つ"],"ans":3,"ex":"","src":"20250707_1kyuB","qid":237,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86695"},{"cat":"施工管理法応用","year":"R7 問BNo.26","q":"一般的な建設工事において、工事の工程管理を行う上で、品質・工程・原価に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。・一般的に工程と原価の関係は、施工を速めると単位数量当たりの原価はだんだん安くなり、さらに施工を速めると原価は（イ）なる。・原価と品質の関係は、品質の悪いものは原価が安くできるが、良いものは原価が（ロ）なる。・一般的に品質と工程の関係は、品質の良いものは時間がかかり、施工を速めて突貫作業をすると品質は（ハ）。・品質・工程・原価の関係は、それぞれ（ニ）性質があることから、これらの調整を図りながら計画し、工期を守り、品質を保つように管理することが大切である。","opts":["（イ）ますます安く （ロ）高く （ハ）かわらない （ニ）相反する","（イ）逆に高く （ロ）高く （ハ）悪くなる （ニ）相反する","（イ）逆に高く （ロ）さらに安く （ハ）悪くなる （ニ）同じような","（イ）ますます安く （ロ）さらに安く （ハ）かわらない （ニ）同じような"],"ans":1,"ex":"","src":"20250707_1kyuB","qid":238,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86696"},{"cat":"施工管理法応用","year":"R7 問BNo.27","q":"工程管理を行う上で、工程管理曲線（バナナ曲線）に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。①実施工程曲線がバナナ曲線の上方限界を超えたときには、工程が進み過ぎているので、必要以上に大型機械を入れている等、不経済となっていないかを検討する必要がある。②実施工程曲線がバナナ曲線の下方限界を下回るときには、どうしても工程が遅れることになり、突貫工事が不可避となるので施工計画を根本的に再検討する必要がある。③予定工程曲線が限度内に進行を維持しながらも、下方限界に近づいたときには、直ちに対策をとる必要がある。④予定工程曲線が許容限界内にあるときは、S形工程曲線の中期における正常工程部分を、許容限界曲線に平行な理想工程曲線よりできるだけ緩勾配となるよう、合理的に工程を調整する必要がある。","opts":["①②","②③","①③④","①②③④"],"ans":3,"ex":"","src":"20250707_1kyuB","qid":239,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86697"},{"cat":"施工管理法応用","year":"R7 問BNo.29","q":"移動式クレーンの安全確保措置に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、クレーン等安全規則上、正しいものは次のうちどれか。・移動式クレーンの運転者及び玉掛けをする者が当該移動式クレーンの（イ）荷重を常時知ることができるよう、表示その他の措置を講じなければならない。・作業の性質上やむを得ない場合又は安全な作業の遂行上必要な場合、移動式クレーンのつり具に専用のとう乗設備を設けて労働者を乗せること（ロ）。・クレーン機能付き油圧ショベルを小型移動式クレーンとして使用する場合、車両系建設機械の運転技能講習を修了している者は、クレーン作業の運転者として従事すること（ハ）。・移動式クレーンを用いて作業を行うときは、その日の作業を開始する前に、巻過防止装置、過負荷警報装置その他の警報装置、（ニ）について点検を行わなければならない。","opts":["（イ）定格 （ロ）ができる （ハ）はできない （ニ）ブレーキ、クラッチ及びコントローラーの機能","（イ）つり （ロ）はできない （ハ）はできない （ニ）ワイヤロープ及びつりチェーンの損傷の有無","（イ）定格 （ロ）はできない （ハ）ができる （ニ）ブレーキ、クラッチ及びコントローラーの機能","（イ）つり （ロ）ができる （ハ）ができる （ニ）ワイヤロープ及びつりチェーンの損傷の有無"],"ans":0,"ex":"","src":"20250707_1kyuB","qid":240,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86699"},{"cat":"施工管理法応用","year":"R7 問BNo.30","q":"埋設物ならびに架空線に近接して行う工事の安全管理に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。①発注者又は施工者は、試掘等によって埋設物を確認した場合においては、その位置や周辺地質の状況等の情報を労働基準監督署及び埋設物の管理者に報告しなければならない。②明り掘削で露出したガス管のつり防護等の作業には、作業を指揮する者を指名し、その者の直接指揮のもと当該作業を行わなければならない。③架空線等上空施設に近接して工事を行う場合は、必要に応じてその管理者に施工方法の確認や立会いを求める。④架空線の近接箇所で建設機械のブーム操作やダンプトラックのダンプアップを行う場合は、防護カバーや看板の設置、立入禁止区域の設定を行う。","opts":["①②","③④","①②④","②③④"],"ans":3,"ex":"","src":"20250707_1kyuB","qid":241,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86700"},{"cat":"施工管理法応用","year":"R7 問BNo.31","q":"酸素欠乏症等のおそれのある工事を行う場合、事業者が行うべき措置に関する下記の①〜④の4つの記述のうち、酸素欠乏症等防止規則上、正しいものの数は次のうちどれか。①酸素欠乏危険作業に労働者を従事させる場合で、爆発、酸化等を防止するため換気することができない場合又は作業の性質上換気することが著しく困難な場合は、同時に就業する労働者の人数と同数以上の空気呼吸器等を備え、労働者に使用させなければならない。②酸素欠乏危険作業に労働者を従事させるときは、労働者を、当該作業を行う場所に入場させ、及び退場させるときに、保護具を点検しなければならない。③酸素欠乏危険場所又はこれに隣接する場所で作業を行うときは、酸素欠乏危険作業に従事する労働者以外の労働者が当該酸素欠乏危険場所に立ち入ることを禁止し、かつ、その旨を見やすい箇所に表示しなければならない。④第二種酸素欠乏危険作業に労働者を従事させるときは、その日の作業を開始する前に、空気中の酸素及び硫化水素の濃度を測定しなければならない。","opts":["1つ","2つ","3つ","4つ"],"ans":2,"ex":"","src":"20250707_1kyuB","qid":242,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86701"},{"cat":"施工管理法応用","year":"R7 問BNo.32","q":"土木工事の品質管理図の特徴に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。①管理図とは、工程が安定な状況にあるかどうか調べるため、又は工程を安定な状態に保持するために用いる図である。②測定データには、長さ・重さ・強度・スランプ等のように連続量として測定される計数値と、不良品の個数・事故の回数等のように数えられる計量値がある。③品質に関する測定データをグラフにプロットし、一対の管理限界線と比較した場合、プロットした点がこの管理限界線の中にあれば工程は安定な状態と判断する。④コンクリート強度の品質管理を行う場合、強度、ばらつき、試験誤差の管理を行うためにはp管理図を用いるとよい。","opts":["①②","①③","①②③","②③④"],"ans":1,"ex":"","src":"20250707_1kyuB","qid":243,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86702"},{"cat":"施工管理法応用","year":"R7 問BNo.34","q":"鉄筋のガス圧接に関する下記の①〜④の4つの記述のうち、適当なものの数は次のうちどれか。①鉄筋の種類がSD345のものとSD490のものを圧接して良い。②手動ガス圧接の場合、鉄筋の径がD29のものとD32のものを圧接して良い。③圧接しようとする鉄筋両端部は、鉄筋冷間直角切断機で切断し、圧接作業直前に、両側の圧接端面が直角かつ平滑であることを確認する。④手動ガス圧接継手の超音波探傷検査では、圧接面の欠陥からの反射波の強さを捉えて内部欠陥を検査する。","opts":["1つ","2つ","3つ","4つ"],"ans":2,"ex":"","src":"20250707_1kyuB","qid":244,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/86704"},{"cat":"施工管理法応用","year":"R7 問BNo.35","q":"コンクリートの施工の品質管理に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。①締固めを行う際には、バイブレータを鉄筋にあてて鉄筋を振動させる。②コンクリートを打ち重ねる場合、上層コンクリートの締固めでは、棒状バイブレータが下層のコンクリートに10cm程度挿入するようにして締め固める。③コンクリートの仕上げは、締固めが終わり、上面にしみ出た水が残った状態で行う。④仕上げ作業後、コンクリートが硬化するまでに発生したひび割れは、タンピングと再仕上げによって修復する。","opts":["①③","②④","①②④","②③④"],"ans":1,"ex":"","src":"20250707_1kyuB","qid":245,"srcUrl":""}]};
</script>
<script>
'use strict';
(function(){
  var S = window.SRS;
  // 級ごとのデータセット。__DATASETS__ = { '1kyu': [...], '2kyu': [...] }
  var DATASETS = window.__DATASETS__ || { '2kyu': (window.__QUESTIONS__||[]) };

  // 級ごとの設定。すべて一次情報（jctc.jp / 国交省）に基づく。
  var GRADE_CONFIG = {
    '1kyu': {
      label: '1級',
      badge: '1級 · 公式過去問',
      // 1級一次の分野別解答数（本番=全101問中70問。応用能力=足切り対象）。予想得点の換算重み。
      subjectOrder: ['施工管理法応用','施工管理法','土木一般','専門土木','法規'],
      examWeights: {'施工管理法応用':15,'施工管理法':16,'土木一般':13,'専門土木':17,'法規':9},
      passLine: 60,
      // 応用能力（施工管理法応用）に独立の足切り（15問中9問=60%）
      cutoffCat: '施工管理法応用', cutoffLine: 60,
      defaultExam: '2027-07-04', // 令和9年度1級一次の推定日（例年7月第1日曜。正式日程は2026年12月公表）
      examNote: '令和9年度 1級一次（推定・正式日程は2026年12月公表）',
      intro: '1級土木一次の公式過去問（令和5〜7年度・全国建設研修センター公表）。正解番号は公式正答表と機械照合済み。図表を要する問題は除外。応用能力には本番同様の足切りがあります。'
    },
    '2kyu': {
      label: '2級',
      badge: '2級 · 公式過去問',
      subjectOrder: ['施工管理法','土木一般','専門土木','法規'],
      examWeights: {'施工管理法':19,'土木一般':11,'専門土木':6,'法規':9},
      passLine: 60,
      cutoffCat: null, cutoffLine: null,
      defaultExam: '2026-10-25', // 2級後期一次（一次情報）
      examNote: '2級後期 一次検定',
      intro: '2級土木一次の公式過去問（令和5〜8年度前期・全国建設研修センター公表）。正解番号は公式正答表と機械照合済み。図表を要する問題は除外。'
    }
  };

  var GRADE_KEY = 'sekokan-drill-grade';
  var currentGrade = loadGrade();
  var CFG = GRADE_CONFIG[currentGrade];
  var QUESTIONS = DATASETS[currentGrade] || [];
  var SUBJECT_ORDER = CFG.subjectOrder;
  var EXAM_WEIGHTS = CFG.examWeights;
  var PASS_LINE = CFG.passLine;

  function loadGrade(){
    var g = null;
    try{ g = localStorage.getItem(GRADE_KEY); }catch(e){}
    if(g && GRADE_CONFIG[g] && (DATASETS[g]||[]).length) return g;
    // データがある級を優先（1級があれば1級、なければ2級）
    if((DATASETS['1kyu']||[]).length) return '1kyu';
    return '2kyu';
  }
  function setGrade(g){
    if(!GRADE_CONFIG[g] || !(DATASETS[g]||[]).length) return;
    currentGrade = g;
    try{ localStorage.setItem(GRADE_KEY, g); }catch(e){}
    CFG = GRADE_CONFIG[g]; QUESTIONS = DATASETS[g]; SUBJECT_ORDER = CFG.subjectOrder;
    EXAM_WEIGHTS = CFG.examWeights; PASS_LINE = CFG.passLine;
    state = load();
    renderHome();
  }

  // 学習記録は級ごとに分離（キーに級を含める）
  function storeKey(){ return 'sekokan-drill-v1-' + currentGrade; }

  var state = load();

  function load(){
    try{
      var raw = localStorage.getItem(storeKey());
      if(raw){ var p = JSON.parse(raw); if(p && p.cards) return normalize(p); }
    }catch(e){}
    return normalize({cards:{}, streak:0, lastStudyDay:null, examDate:CFG.defaultExam, goalDoneDay:null, goalDoneCount:0});
  }
  function normalize(p){
    p.cards = p.cards||{}; p.streak = p.streak||0; p.examDate = p.examDate||CFG.defaultExam;
    p.lastStudyDay = (p.lastStudyDay===undefined)?null:p.lastStudyDay;
    p.goalDoneDay = (p.goalDoneDay===undefined)?null:p.goalDoneDay;
    p.goalDoneCount = p.goalDoneCount||0;
    return p;
  }
  function save(){ try{ localStorage.setItem(storeKey(), JSON.stringify(state)); }catch(e){} }
  function today(){ return S.epochDay(Date.now()); }
  function examDaysLeft(){
    if(!state.examDate) return null;
    var ex = S.epochDay(new Date(state.examDate+'T00:00:00').getTime());
    return ex - today();
  }

  // --- helpers ---
  function el(id){ return document.getElementById(id); }
  function go(name){
    document.querySelectorAll('.scr').forEach(function(s){ s.classList.remove('on'); });
    el(name).classList.add('on');
    window.scrollTo(0,0);
    if(name==='home') renderHome();
    if(name==='cats') renderCats();
  }
  function toast(msg){
    var t = el('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 1900);
  }
  function fmtDate(iso){
    if(!iso) return '';
    var d = new Date(iso+'T00:00:00');
    var w = ['日','月','火','水','木','金','土'][d.getDay()];
    return (d.getMonth()+1)+'月'+d.getDate()+'日('+w+')';
  }

  // --- streak update on study ---
  function bumpStreak(){
    var t = today();
    if(state.lastStudyDay === t) return; // 今日すでにカウント済み
    if(state.lastStudyDay === t-1) state.streak += 1;
    else state.streak = 1;
    state.lastStudyDay = t;
  }
  function goalCountToday(){
    return (state.goalDoneDay===today()) ? state.goalDoneCount : 0;
  }
  function addGoalProgress(n){
    var t = today();
    if(state.goalDoneDay!==t){ state.goalDoneDay=t; state.goalDoneCount=0; }
    state.goalDoneCount += n;
  }

  // --- queue building ---
  function reviewQueue(){
    return QUESTIONS.filter(function(q){ return S.isDue(state.cards[q.qid], today()); });
  }
  function newQueue(){
    return QUESTIONS.filter(function(q){ var c=state.cards[q.qid]; return !c || !c.seen; });
  }
  function todayGoal(){
    var remaining = QUESTIONS.filter(function(q){ var c=state.cards[q.qid]; return !c || !c.mastered; }).length;
    var dl = examDaysLeft();
    return S.dailyGoal(remaining, dl==null?null:Math.max(dl,1), 10);
  }
  function todayQueue(){
    // 復習優先→未着手→既習。buildQueueの順で、今日の目標数だけ取る
    var q = S.buildQueue(QUESTIONS, state.cards, today(), SUBJECT_ORDER);
    // masteredで期限前のものは今日やる対象から外す（無限に既習を混ぜない）
    var pri = q.filter(function(x){
      var c = state.cards[x.qid];
      if(S.isDue(c, today())) return true;
      if(!c || !c.seen) return true;
      return false;
    });
    var goal = todayGoal();
    return pri.slice(0, Math.max(goal,1));
  }

  // --- quiz session ---
  var session = null;
  function startSession(title, list, opts){
    opts = opts||{};
    if(!list.length){ toast('対象の問題がありません'); return; }
    session = { title:title, list:list, idx:0, correct:0, answered:false, mode:opts.mode||'', masteredBefore:countMastered() };
    go('quiz');
    renderQuestion();
  }
  function countMastered(){
    return QUESTIONS.filter(function(q){ var c=state.cards[q.qid]; return c && c.mastered; }).length;
  }
  function renderQuestion(){
    session.answered = false;
    var q = session.list[session.idx];
    el('qProg').style.width = (session.idx/session.list.length*100)+'%';
    el('qCount').textContent = (session.idx+1)+' / '+session.list.length;
    var meta = '<span class="chip cat">'+q.cat+'</span><span class="chip src">'+q.year+'</span>';
    if(S.isDue(state.cards[q.qid], today()) && state.cards[q.qid] && state.cards[q.qid].seen) meta += '<span class="chip rev">復習</span>';
    el('qMeta').innerHTML = meta;
    el('qText').textContent = q.q;
    var wrap = el('qOpts'); wrap.innerHTML = '';
    q.opts.forEach(function(text, i){
      var b = document.createElement('button');
      b.className = 'opt'; b.type='button';
      b.innerHTML = '<span class="num">'+(i+1)+'</span><span>'+escapeHtml(text)+'</span>';
      b.addEventListener('click', function(){ answer(i); });
      wrap.appendChild(b);
    });
    el('expl').classList.remove('show');
    el('nextBtn').classList.remove('show');
    el('nextBtn').textContent = (session.idx === session.list.length-1) ? '結果を見る →' : '次の問題 →';
  }
  function answer(pick){
    if(session.answered) return;
    session.answered = true;
    var q = session.list[session.idx];
    var correct = (pick === q.ans);
    if(correct) session.correct++;
    // 分野別集計（足切り判定用）
    if(!session.byCat) session.byCat = {};
    if(!session.byCat[q.cat]) session.byCat[q.cat] = {total:0, correct:0};
    session.byCat[q.cat].total++;
    if(correct) session.byCat[q.cat].correct++;
    // SRS更新
    state.cards[q.qid] = S.reviewCard(state.cards[q.qid], correct, today());
    bumpStreak();
    save();
    // 視覚フィードバック
    var opts = el('qOpts').children;
    for(var i=0;i<opts.length;i++){
      opts[i].classList.add('dis');
      opts[i].disabled = true;
      if(i===q.ans){ opts[i].classList.add(i===pick?'pick-ok':'reveal-ok'); }
      else if(i===pick){ opts[i].classList.add('pick-ng'); }
      else { opts[i].classList.add('faded'); }
    }
    var flash = el('flash'); flash.className='flash '+(correct?'f-ok':'f-ng');
    setTimeout(function(){ flash.className='flash'; }, 560);
    // 解説（過去問は公式解説なし→正解番号を表示し、詳しい解説は外部サイトへのリンクに委ねる）
    var v = el('verdict'); v.textContent = correct?'正解':'不正解';
    v.className = 'verdict '+(correct?'ok':'ng');
    var linkEl = el('explLink');
    if(q.ex && q.ex.trim()){
      el('explText').textContent = q.ex;
      linkEl.classList.remove('show');
    } else {
      var ansText = q.opts[q.ans];
      el('explText').textContent = '正解は ('+(q.ans+1)+') 「'+ansText+'」。 出典: '+CFG.label+' '+q.year;
      if(q.srcUrl){
        linkEl.href = q.srcUrl;
        linkEl.classList.add('show');
      } else {
        el('explText').textContent += ' この問題は解説ページが見つかっていないため、選択肢の正誤は各自でご確認ください。';
        linkEl.classList.remove('show');
      }
    }
    el('expl').classList.add('show');
    el('nextBtn').classList.add('show');
    el('qProg').style.width = ((session.idx+1)/session.list.length*100)+'%';
  }
  function next(){
    if(!session.answered) return;
    if(session.idx < session.list.length-1){ session.idx++; renderQuestion(); }
    else finish();
  }
  function finish(){
    // 今日の目標に反映（今日やる／復習／新規のときだけ）
    if(session.mode==='today' || session.mode==='review' || session.mode==='new'){
      addGoalProgress(session.list.length);
      save();
    }
    var total = session.list.length, correct = session.correct;
    var pct = Math.round(correct/total*100);
    var overallPass = pct >= PASS_LINE;
    // 足切り判定（1級の模試のみ）: 応用能力分野が60%未満なら、総合が合格でも不合格
    var cutoffFail = false, cutoffPct = null;
    if(CFG.cutoffCat && session.mode==='exam' && session.byCat && session.byCat[CFG.cutoffCat]){
      var cc = session.byCat[CFG.cutoffCat];
      cutoffPct = cc.total>0 ? Math.round(cc.correct/cc.total*100) : null;
      if(cutoffPct!==null && cutoffPct < CFG.cutoffLine) cutoffFail = true;
    }
    var pass = overallPass && !cutoffFail;
    go('results');
    el('resTitle').textContent = pass ? 'よくできました' : (cutoffFail ? '足切りに注意' : 'あと少し');
    el('resSub').textContent = session.title;
    el('resPct').textContent = pct+'%';
    el('resFrac').textContent = correct+' / '+total;
    el('resCorrect').textContent = correct;
    el('resStreak').textContent = state.streak;
    el('resMastered').textContent = countMastered();
    var newlyMastered = countMastered() - session.masteredBefore;
    var msg;
    if(cutoffFail) msg = '総合は'+pct+'%ですが、'+CFG.cutoffCat+'が'+cutoffPct+'%で足切りライン'+CFG.cutoffLine+'%に届いていません。1級一次は総合60%かつ応用能力60%の両方が必要です。応用能力を重点的に。';
    else if(pass && newlyMastered>0) msg = '合格ライン'+PASS_LINE+'%を超えました。今回'+newlyMastered+'問が「習得済み」に。間違えた問題は間隔をあけて再出題されます。';
    else if(pass) msg = '合格ライン'+PASS_LINE+'%を超えました。この調子で続けましょう。2回連続で正解した問題は「習得済み」になります。';
    else msg = '合格ラインは'+PASS_LINE+'%（本番も60%）。間違えた問題は明日また出題されます。解説を読み直して次に備えましょう。';
    el('resMsg').textContent = msg;
    var ring = el('resRing');
    ring.classList.toggle('pass', pass);
    setTimeout(function(){ ring.style.strokeDashoffset = String(427 - 427*pct/100); }, 80);
  }

  function escapeHtml(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // --- home render ---
  function renderHome(){
    var dl = examDaysLeft();
    el('cdDays').innerHTML = (dl==null?'—':Math.max(dl,0))+' <span class="u">日</span>';
    el('cdDate').textContent = state.examDate ? fmtDate(state.examDate)+' 実施' : '';
    el('streakN').textContent = state.streak;
    var goal = todayGoal();
    var done = goalCountToday();
    el('goalTotal').textContent = goal;
    el('goalDone').textContent = Math.min(done,goal);
    el('goalBar').style.width = (goal>0?Math.min(done/goal*100,100):0)+'%';
    var startBtn = el('startToday');
    if(goal>0 && done>=goal){ startBtn.textContent='今日のノルマ達成 ✓'; startBtn.classList.add('done'); }
    else { startBtn.textContent='今日の学習を始める'; startBtn.classList.remove('done'); }
    el('reviewCount').textContent = reviewQueue().length+' 問';
    el('newCount').textContent = newQueue().length+' 問';
    el('examCount').textContent = QUESTIONS.length+' 問';
    var catCount = SUBJECT_ORDER.filter(function(c){ return QUESTIONS.some(function(q){ return q.cat===c; }); }).length;
    el('catAll').textContent = '全'+catCount+'分野';
    el('qTotal2').textContent = QUESTIONS.length;
    // 予想得点
    var proj = S.projectedScore(QUESTIONS, state.cards, EXAM_WEIGHTS);
    var pct = proj.totalExam>0 ? Math.round(proj.totalProjected/proj.totalExam*100) : 0;
    el('projPct').textContent = pct;
    var answeredAny = QUESTIONS.some(function(q){ var c=state.cards[q.qid]; return c&&c.seen; });
    el('boardNote').textContent = answeredAny
      ? '解いた問題の正答率を本番の配点に換算した推定値です（合格ライン60%）。'
      : 'まだ学習記録がありません。問題を解くと、本番の配点に換算した推定得点がここに表示されます。';
    var bars = el('catBars'); bars.innerHTML='';
    SUBJECT_ORDER.forEach(function(cat){
      var c = proj.byCat[cat]; if(!c) return;
      var rate = Math.round(c.rate*100);
      var color = c.answered===0 ? 'var(--el)' : (rate>=60?'var(--ok)':(rate>=40?'var(--acc)':'var(--ng)'));
      var row = document.createElement('div');
      row.className='catbar'; row.style.marginBottom='10px';
      row.innerHTML = '<div class="cr"><span class="cn">'+cat+'</span>'+
        '<span class="cv">'+(c.answered===0?'未着手':rate+'% · '+c.answered+'問')+'</span></div>'+
        '<div class="track"><i style="width:'+(c.answered===0?4:Math.max(rate,3))+'%;background:'+color+'"></i></div>';
      bars.appendChild(row);
    });
    el('gradeBadge').textContent = CFG.badge;
    el('examDate').value = state.examDate||'';
    el('introText').textContent = CFG.intro;
    el('examSetNote').textContent = CFG.examNote;
    // 級切替タブの状態
    var has1 = (DATASETS['1kyu']||[]).length>0, has2 = (DATASETS['2kyu']||[]).length>0;
    var sw = el('gradeSwitch');
    if(has1 && has2){
      sw.style.display='flex';
      el('grade1').classList.toggle('on', currentGrade==='1kyu');
      el('grade2').classList.toggle('on', currentGrade==='2kyu');
    } else { sw.style.display='none'; }
  }

  function renderCats(){
    var list = el('catList'); list.innerHTML='';
    SUBJECT_ORDER.forEach(function(cat){
      var qs = QUESTIONS.filter(function(q){ return q.cat===cat; });
      if(!qs.length) return;
      var done = qs.filter(function(q){ var c=state.cards[q.qid]; return c&&c.seen; }).length;
      var mastered = qs.filter(function(q){ var c=state.cards[q.qid]; return c&&c.mastered; }).length;
      var card = document.createElement('button');
      card.className='mode'; card.style.gridColumn='1 / -1'; card.style.marginBottom='0';
      card.innerHTML = '<div class="m-t">'+cat+'</div>'+
        '<div class="m-s">'+qs.length+'問中 '+done+'問学習・'+mastered+'問習得</div>'+
        '<div class="m-b">解く →</div>';
      card.addEventListener('click', function(){
        startSession(cat, shuffle(qs.slice()), {mode:'cat'});
      });
      list.appendChild(card);
    });
  }

  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  // --- theme ---
  function applyTheme(t){
    if(t==='auto'){ document.documentElement.removeAttribute('data-theme'); }
    else document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('sekokan-theme', t); }catch(e){}
  }
  function initTheme(){
    var t = 'auto';
    try{ t = localStorage.getItem('sekokan-theme')||'auto'; }catch(e){}
    applyTheme(t);
  }
  function cycleTheme(){
    var cur = document.documentElement.getAttribute('data-theme')||'auto';
    var order = ['auto','light','dark'];
    var nextT = order[(order.indexOf(cur)+1)%3];
    applyTheme(nextT);
    toast(nextT==='auto'?'テーマ: 端末に合わせる':(nextT==='light'?'テーマ: ライト':'テーマ: ダーク'));
  }

  // --- wire up ---
  el('startToday').addEventListener('click', function(){
    var goal = todayGoal(), done = goalCountToday();
    if(goal>0 && done>=goal){ toast('今日のノルマは達成済みです'); return; }
    startSession('今日やる', todayQueue(), {mode:'today'});
  });
  el('modeReview').addEventListener('click', function(){
    var q = reviewQueue();
    if(!q.length){ toast('今日復習する問題はありません'); return; }
    startSession('復習', S.buildQueue(q, state.cards, today(), SUBJECT_ORDER), {mode:'review'});
  });
  el('modeNew').addEventListener('click', function(){
    var q = newQueue();
    if(!q.length){ toast('未着手の問題はありません（全問学習済み）'); return; }
    startSession('新しい問題', S.buildQueue(q, state.cards, today(), SUBJECT_ORDER).slice(0,10), {mode:'new'});
  });
  el('modeCat').addEventListener('click', function(){ go('cats'); });
  el('modeExam').addEventListener('click', function(){
    startSession('模試（全'+QUESTIONS.length+'問）', shuffle(QUESTIONS.slice()), {mode:'exam'});
  });
  el('nextBtn').addEventListener('click', next);
  el('qClose').addEventListener('click', function(){
    if(confirm('学習を中断してホームに戻りますか？（ここまでの記録は保存されます）')) go('home');
  });
  el('resAgain').addEventListener('click', function(){ startSession('今日やる', todayQueue(), {mode:'today'}); });
  el('themeBtn').addEventListener('click', cycleTheme);
  el('examDate').addEventListener('change', function(e){
    state.examDate = e.target.value||null; save(); renderHome();
    toast(state.examDate?'試験日を設定しました':'試験日をクリアしました');
  });
  el('resetBtn').addEventListener('click', function(){
    if(confirm('学習記録（正誤・習得状況・連続日数）をすべて消去します。よろしいですか？')){
      state = normalize({cards:{}, streak:0, lastStudyDay:null, examDate:state.examDate, goalDoneDay:null, goalDoneCount:0});
      save(); renderHome(); toast('学習記録をリセットしました');
    }
  });
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(){ go(b.getAttribute('data-go')); });
  });
  el('grade1').addEventListener('click', function(){ if(currentGrade!=='1kyu'){ setGrade('1kyu'); toast('1級に切り替えました'); } });
  el('grade2').addEventListener('click', function(){ if(currentGrade!=='2kyu'){ setGrade('2kyu'); toast('2級に切り替えました'); } });

  el('verLabel').textContent = 'v2 · '+QUESTIONS.length+'問';
  initTheme();
  renderHome();
})();
</script>
