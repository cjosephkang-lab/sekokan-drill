収縮低減剤","AE 剤","流動化剤"],"ans":2,"ex":"","src":"20260608_2kyu","qid":153,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93870"},{"cat":"土木一般","year":"R8前期 No.11","q":"コンクリートの打込みに関する記述のうち、適当なものはどれか。","opts":["打ち込んだコンクリートは型枠内で横移動させる。","打込み前には、鉄筋や型枠の配置、清掃状態等を確認する。","圧送管等の吐出口とコンクリートの打込み面までの高さは 2.0 m 以下とする。","2 層以上に分けて打ち込む場合、1 層あたりの打込み高さは 1.0 m 以下とする。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":154,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93871"},{"cat":"土木一般","year":"R8前期 No.12","q":"各種のコンクリートに関する記述のうち、適当でないものはどれか。","opts":["マスコンクリートでは、セメントの水和熱による圧縮応力に伴うひび割れに対する注意が必要である。","膨張コンクリートは、膨張の効果によって体積変化によるひび割れの発生や拡大を防ぐものである。","寒中コンクリートとしての施工は、日平均気温が 4 ℃ 以下になると想定されるときに行う。","流動化コンクリートは、あらかじめ練り混ぜられたフレッシュコンクリートに流動化剤を添加し、流動性を増大させたものであり、そのスランプは原則として 18 cm 以下とする。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":155,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93872"},{"cat":"土木一般","year":"R8前期 No.13","q":"コンクリートの養生に関する記述のうち、適当でないものはどれか。","opts":["養生期間中は、有害な応力や変形を加えないようコンクリートを保護する。","湿潤養生の標準日数は、混合セメントに比べて普通ポルトランドセメントの方が長い。","コンクリートの水和反応を十分に進行させるよう、湿潤状態に保つ。","コンクリートを湿潤状態に保つためには、散水や養生マット等を使用する。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":156,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93873"},{"cat":"土木一般","year":"R8前期 No.14","q":"既製杭の中掘り杭工法に関する記述のうち、適当でないものはどれか。","opts":["既製杭の中をアースオーガで掘削しながら杭を貫入する。","先端処理工法には、最終打撃方式とセメントミルク噴出攪拌方式がある。","打撃・振動による方法に比べると、大きな支持力が得られる。","打撃・振動による方法に比べると、施工時の騒音や振動が小さい。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":157,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93874"},{"cat":"土木一般","year":"R8前期 No.15","q":"場所打ち杭の「工法名」と「孔壁保護の主な資機材」に関する組合せとして、適当なものはどれか。","opts":["アースドリル工法 － スタンドパイプ","深礎工法 － 土留め材（ライナープレート）","オールケーシング工法 － 安定液（ベントナイト水）","リバースサーキュレーション工法 － ケーシングチューブ"],"ans":1,"ex":"","src":"20260608_2kyu","qid":158,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93875"},{"cat":"土木一般","year":"R8前期 No.16","q":"土留め壁の「種類」と「特徴」に関する組合せとして、適当なものはどれか。","opts":["柱列杭 － 剛性が大きく、深い掘削に適する。","連続地中壁 － あらゆる地盤に適用でき、他に比べ経済的である。","鋼矢板 － 掘削時のたわみ性が小さく、施工が容易である。","親杭・横矢板 － 遮水性が高く、地下水位の高い地盤に適する。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":159,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93876"},{"cat":"専門土木","year":"R8前期 No.17","q":"鋼材に関する記述のうち、適当でないものはどれか。","opts":["応力度が弾性限度に達するまでは塑性を示し、それを超えると弾性を示す。","塑性領域で応力度をゼロに戻しても、ひずみはゼロとはならない永久ひずみが残る。","強さや靭性等を長期間にわたり維持するための耐久性が求められる。","疲労の激しい鋼材では、急激な破壊が生じることがある。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":160,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93877"},{"cat":"専門土木","year":"R8前期 No.18","q":"鋼道路橋に用いる高力ボルトに関する記述のうち、適当でないものはどれか。","opts":["高力ボルトの長さは、部材を十分に締め付けられるものとしなければならない。","高力ボルトの締付けは、設計ボルト軸力が得られるように締め付けなければならない。","トルク法による高力ボルトの締付け検査は、トルク係数値が安定する数日後に行う。","回転法による締付け検査は、マーキングの回転角が規定の範囲内であることを確認する。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":161,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93878"},{"cat":"専門土木","year":"R8前期 No.19","q":"コンクリート構造物の耐久性に関する記述のうち、適当でないものはどれか。","opts":["コンクリートの凍害対策として、AE 剤若しくは AE 減水剤を使用する。","アルカリシリカ反応対策として、通常の早強ポルトランドセメントを使用する。","コンクリートの中性化が進行すると、鉄筋が腐食しやすくなる。","化学的侵食は、温泉地域や下水道管等で起こりやすい。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":162,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93879"},{"cat":"専門土木","year":"R8前期 No.20","q":"河川堤防に用いる土質材料に関する記述のうち、適当でないものはどれか。","opts":["水で飽和したとき、法面のすべりが起きにくい材料がよい。","締固めを満足する施工のためには単一な粒径の材料がよい。","堤体の安定に支障を及ぼすような圧縮変形や膨張性がない材料がよい。","浸水、乾燥等の環境変化に対して、法すべりやクラック等が生じにくい材料がよい。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":163,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93880"},{"cat":"専門土木","year":"R8前期 No.21","q":"河川護岸の法覆工に関する記述のうち、適当でないものはどれか。","opts":["間地ブロック積工は、一般に、法勾配が緩く、流速が小さい場所で施工する工法である。","コンクリート法枠工は、法勾配の急な場所では施工が難しい工法である。","横帯工は、河川の流水方向の一定区間ごとに設け、護岸の変位や破損が他に波及しないように絶縁するものである。","縦帯工は、護岸の法肩部に設けられるもので、法肩の施工を容易にすると共に、護岸の法肩部の破壊を防ぐものである。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":164,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93881"},{"cat":"専門土木","year":"R8前期 No.22","q":"砂防堰堤の構造に関する記述のうち、適当なものはどれか。","opts":["砂防堰堤は、渓流から流出する砂礫を速やかに流下させるための構造物である。","堤体基礎の根入れは、基礎地盤が岩盤の場合、砂礫の場合よりも深くするのが一般的である。","副堰堤は、本堰堤への土石流の直撃を防止するために設ける。","水叩きは、本堰堤からの落下水の衝撃を緩和し、洗掘を防止するために設ける。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":165,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93882"},{"cat":"専門土木","year":"R8前期 No.23","q":"地すべり防止工に関する記述のうち、適当でないものはどれか。","opts":["地すべり防止工には、大別して抑制工と抑止工があり、抑制工としては水路工、排土工等が、抑止工としては杭工、シャフト工等がある。","横ボーリング工は、地下水調査等の結果をもとに、帯水層に向けてボーリングを行い、地下水を排除する工法である。","杭工は、鋼管等の杭によって斜面の安定を高める工法で、杭を建て込む位置は、地すべり部分の下部のすべり面の勾配が急な場所とする。","排水トンネル工は、トンネルから帯水層へボーリングを行い、トンネルを使って排水する工法で、地すべり規模が大きい場合等に用いられる。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":166,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93883"},{"cat":"専門土木","year":"R8前期 No.24","q":"道路のアスファルト舗装における路床の施工に関する記述のうち、適当でないものはどれか。","opts":["構築路床は、交通荷重を支持する層として、適切な支持力と変形抵抗性が求められる。","構築路床の施工終了後から舗装施工までに相当の期間がある場合は、仕上げ面の保護を行う。","置換え工法は、軟弱な現状路床土の一部又は全部を良質土で置き換える工法である。","安定処理工法は、現状路床土と砕石やぐり石等の粒状材料を混合する工法である。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":167,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93884"},{"cat":"専門土木","year":"R8前期 No.25","q":"道路のアスファルト舗装の施工に関する記述のうち、適当でないものはどれか。","opts":["タックコートの散布量は、一般に 0.3 ～ 0.6 ℓ/m2 が標準である。","敷均し時の混合物の温度は、一般に 110 ℃ を下回らないようにする。","転圧温度が高すぎると、ヘアクラックや変形を起こすことがある。","締固め作業は、初転圧、二次転圧、継目転圧、仕上げ転圧の順で行う。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":168,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93885"},{"cat":"専門土木","year":"R8前期 No.26","q":"道路のアスファルト舗装の維持修繕に関する記述のうち、適当でないものはどれか。","opts":["表面処理工法は、既設舗装の上に厚さ 3 cm 未満の封かん層を設ける。","薄層オーバーレイ工法は、既設舗装の上に厚さ 3 cm 未満の加熱アスファルト混合物を舗設する。","切削工法は、路面に生じている段差や凹凸を解消するため、路面の凸部等を切削除去する。","パッチング工法は、局部的なくぼみや段差等に、シール材で応急的に充塡する。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":169,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93886"},{"cat":"専門土木","year":"R8前期 No.27","q":"道路の普通コンクリート舗装の施工に関する記述のうち、適当でないものはどれか。","opts":["コンクリートの敷均しは、全体ができるだけ均等な密度になるように適切な余盛をつけて行う。","表面仕上げ後のコンクリート版は、所定の強度になるまで乾燥状態を保つ。","温度変化によりコンクリート版が膨張・収縮できるよう、路盤上に路盤紙を敷いたりする。","カッタによる目地溝は、所定の位置に所要の幅及び深さまで垂直に切り込んで設置する。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":170,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93887"},{"cat":"専門土木","year":"R8前期 No.28","q":"フィルダムの施工に関する記述のうち、適当でないものはどれか。","opts":["フィルダムは、中央コア型ロックフィルダムの場合、一般的に堤体の中央部に遮水用の土質材料を用いる。","フィルダムは、ダム近傍でも盛立材料を得やすいため、運搬距離が短く経済的に材料調達を行うことができる。","フィルダムは、重機による土工が中心であるため、コンクリートダムに比べてコンクリートプラント等の仮設備費を少なくできる。","フィルダムは、一般的にコンクリートダムに比べて堤体積が大きく、また大きな基礎岩盤強度を必要とする。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":171,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93888"},{"cat":"専門土木","year":"R8前期 No.29","q":"トンネルの山岳工法における掘削に関する記述のうち、適当でないものはどれか。","opts":["発破掘削は、地質が硬岩質等の場合に用いられる。","機械掘削は、余掘りが少ない等の利点がある。","導坑先進工法は、トンネルの全断面を一度に掘削する工法である。","ベンチカット工法は、一般にトンネル断面を上半分と下半分に分けて掘削する工法である。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":172,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93889"},{"cat":"専門土木","year":"R8前期 No.30","q":"海岸における異形コンクリートブロック（消波ブロック）による消波工に関する記述のうち、適当でないものはどれか。","opts":["乱積みは、層積みに比べて据付けが容易であり、据付け時は安定性がよい。","乱積みは、高波を受けるたびに沈下し、徐々にブロックのかみ合わせがよくなり安定する。","層積みは、乱積みに比べて据付けに手間がかかり、海岸線の曲線部等では施工が難しい。","層積みは、規則正しく配列する積み方で、整然と並び外観が美しく安定性がよい。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":173,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93890"},{"cat":"専門土木","year":"R8前期 No.31","q":"グラブ浚渫船の施工に関する記述のうち、適当でないものはどれか。","opts":["余掘は、計画水深より浅い箇所を残さないために行う。","出来形確認測量は、音響測深機等により、グラブ浚渫船が工事現場にいる間に行う。","グラブ浚渫船の標準的な船団は、グラブ浚渫船、引船、土運船、揚びょう船である。","グラブ浚渫船は、岸壁等の構造物前面の浚渫や狭い場所での浚渫には使用できない。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":174,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93891"},{"cat":"専門土木","year":"R8前期 No.32","q":"鉄道工事における軌道の施工に関する記述のうち、適当でないものはどれか。","opts":["マクラギは、列車荷重を支持するのに十分な強度を有し、耐用年数が長いものを選定する。","道床内の水を速やかに排除するために、路盤面を水平に仕上げる。","道床に用いる砕石は、強固で耐摩耗性に優れたものを選び、念入りな締固めを行う。","レール継目部の遊間の整正は、レール伸縮が著しい夏期及び冬期に先立ち実施する。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":175,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93892"},{"cat":"専門土木","year":"R8前期 No.33","q":"鉄道（在来線）の営業線内及び営業線近接工事の保安対策に関する記述のうち、適当でないものはどれか。","opts":["重機械を使用する場合、列車の近接から通過の完了まで、慎重に作業する。","工事管理者は、工事現場ごとに専任の者を常時配置し、必要により複数配置する。","見通し距離を確保できない場合は、見通し距離を確保できる位置に中継見張員を配置する。","事故発生等により列車運行に支障するおそれのある場合、直ちに列車防護手配を行う。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":176,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93893"},{"cat":"専門土木","year":"R8前期 No.34","q":"シールド工法に関する記述のうち、適当でないものはどれか。","opts":["土圧式や泥水式等の密閉型シールドは、フード部とガーダー部が隔壁で仕切られている。","泥水式シールド工法は、ずりが流体輸送となるため、泥水処理設備が必要になる。","シールド掘進時は、土質や土被り等の変化に留意し、掘削土砂を取り込み過ぎないように切羽の安定を図る。","シールド掘進後は、セグメント外周に空隙が生じるため、地盤の安定後にモルタルを注入する。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":177,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93894"},{"cat":"専門土木","year":"R8前期 No.35","q":"上水道の管布設工に関する記述のうち、適当でないものはどれか。","opts":["管の布設にあたっては、原則として低所から高所に向けて行う。","鋼管の据付けは、管体保護のため基礎に良質な砕石を敷き均して行う。","埋戻しは片埋めに注意しながら、現地盤と同程度以上の密度になるように締め固める。","塩化ビニル管を横積みで保管する場合は、平地に積み上げ崩れないように注意する。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":178,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93895"},{"cat":"専門土木","year":"R8前期 No.36","q":"下水道管渠の更生工法に関するイ、ロの説明とその工法名の組合せとして、適当なものはどれか。イ 既設管渠より小さな管径で工場製作された二次製品をけん引挿入し、間隙にモルタル等の充塡材を注入することで更生管渠を構築する。ロ 硬化性樹脂を含浸させた材料や熱可塑性樹脂で成形した材料をマンホールから引き込み、加圧し、拡張・圧着後、硬化や冷却固化することで更生管渠を構築する。","opts":["イ さや管工法 ／ ロ 製管工法","イ 形成工法 ／ ロ 製管工法","イ 製管工法 ／ ロ 形成工法","イ さや管工法 ／ ロ 形成工法"],"ans":3,"ex":"","src":"20260608_2kyu","qid":179,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93896"},{"cat":"法規","year":"R8前期 No.37","q":"労働基準法上、労働時間、休憩及び休暇に関する記述のうち、誤っているものはどれか。","opts":["使用者は、原則として、休憩時間を労働時間の途中に労働者ごとに開始時刻を変えて与えることができる。","雇入れの日から 6 箇月間継続勤務し全労働日の 8 割以上出勤した労働者に対して、使用者は、10 労働日の有給休暇を与えなければならない。","災害その他避けることのできない事由によって、臨時の必要がある場合、使用者は、行政官庁の許可を受けて、法令で定められた労働時間を延長することができる。","使用者は、原則として、労働者に休憩時間を除き 1 週間について 40 時間を超えて、労働させてはならない。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":180,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93897"},{"cat":"法規","year":"R8前期 No.38","q":"労働基準法上、災害補償に関する記述のうち、正しいものはどれか。","opts":["療養補償を受ける労働者が、療養開始後、所定年数を経過しても疾病がなおらない場合には、使用者は、その後の一切の補償を行わなくてもよい。","労働者が業務上負傷し治った場合に、その身体に障害が存するときは、使用者は、その障害が重度な場合に限り、障害補償を行わなければならない。","労働者が業務上負傷し、又は疾病にかかった場合の補償を受ける権利は、これを譲渡し、又は差し押えてはならない。","労働者が重大な過失によって業務上負傷し、かつ使用者がその過失について行政官庁に届出た場合には、使用者は障害補償を行わなくてもよい。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":181,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93898"},{"cat":"法規","year":"R8前期 No.39","q":"労働安全衛生法上、作業主任者の選任を必要とする作業に関する記述のうち、正しいものはどれか。","opts":["掘削面の高さが 1 m 以上の地山の掘削の作業","土止め支保工の切りばり又は腹起しの取付け又は取り外しの作業","橋梁の下部構造であって、金属製の部材で構成されるものの架設、解体又は変更の作業","既製コンクリート杭の杭打ちの作業"],"ans":1,"ex":"","src":"20260608_2kyu","qid":182,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93899"},{"cat":"法規","year":"R8前期 No.40","q":"建設業法上、元請負人の義務及び施工技術の確保に関する記述のうち、誤っているものはどれか。","opts":["元請負人は、作業方法を定めるときは、あらかじめ下請負人の意見を聞かなければならない。","元請負人は、公共性のある施設に関する重要な工事である場合、請負代金の額にかかわらず、工事現場ごとに専任の主任技術者又は監理技術者を置かなければならない。","建設工事の施工に従事する者は、主任技術者又は監理技術者がその職務として行う指導に従わなければならない。","建設業者は、建設工事の担い手の育成及び確保その他の施工技術の確保に努めなければならない。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":183,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93900"},{"cat":"法規","year":"R8前期 No.41","q":"建設業法上、工事現場における主任技術者及び監理技術者の職務に関する記述のうち、誤っているものはどれか。","opts":["当該建設工事の施工に従事する者の技術上の指導監督を行わなければならない。","当該建設工事の工程管理を行わなければならない。","当該建設工事の下請契約書の作成を行わなければならない。","当該建設工事の品質管理を行わなければならない。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":184,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93901"},{"cat":"法規","year":"R8前期 No.42","q":"河川法上、河川区域内において、河川管理者の許可を必要としないものはどれか。","opts":["河川区域内の農業施設において、機能維持のために取水口付近の堆積土砂を排除する場合","河川区域内の民有地において、堆積した土砂を採取する場合","河川区域内の地下において、河川を横断する下水道管を推進工法にて新設する場合","河川区域内の上空において、河川を横断する送電線を架設する場合"],"ans":0,"ex":"","src":"20260608_2kyu","qid":185,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93902"},{"cat":"法規","year":"R8前期 No.43","q":"建築基準法の用語に関する記述のうち、誤っているものはどれか。","opts":["容積率とは、敷地面積の建築物の延べ面積に対する割合をいう。","建築物とは、土地に定着する工作物のうち、屋根及び柱若しくは壁を有するもの、これに附属する門若しくは塀等をいう。","建築設備とは、建築物に設ける電気、ガス、給水、排水、換気、暖房、冷房、消火、排煙若しくは汚物処理の設備又は煙突、昇降機若しくは避雷針をいう。","建築とは、建築物を新築し、増築し、改築し、又は移転することをいう。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":186,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93903"},{"cat":"法規","year":"R8前期 No.44","q":"道路法上、道路の占用の許可に関し、道路管理者に提出すべき申請書に記載する事項に該当しないものはどれか。","opts":["道路の占用の目的","道路の占用の場所","工事実施の方法","建設業の許可番号"],"ans":3,"ex":"","src":"20260608_2kyu","qid":187,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93904"},{"cat":"法規","year":"R8前期 No.45","q":"騒音規制法上、指定地域内における特定建設作業の規制基準に関する記述のうち、誤っているものはどれか。","opts":["特定建設作業の敷地の境界線において騒音の大きさは、75 dB を超えてはならない。","夜間・深夜作業の禁止時間帯は、原則として午後 7 時から翌日の午前 7 時までである。","1 日の作業時間は、原則として 10 時間を超えてはならない。","特定建設作業は、原則として同一場所においては連続 6 日間を超えてはならない。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":188,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93905"},{"cat":"法規","year":"R8前期 No.46","q":"振動規制法上、特定建設作業の対象となる建設機械はどれか。ただし、当該作業がその作業を開始した日に終わるものを除き、1 日における当該作業に係る 2 地点間の最大移動距離が 50 m を超えない作業とする。","opts":["ブルドーザ","振動ローラ","バックホウ","ジャイアントブレーカ"],"ans":3,"ex":"","src":"20260608_2kyu","qid":189,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93906"},{"cat":"法規","year":"R8前期 No.47","q":"港則法上、許可申請に関する記述のうち、誤っているものはどれか。","opts":["特定港内又は特定港の境界附近で工事又は作業をしようとする者は、港長に届け出なければならない。","船舶は、特定港において危険物の積込、積替又は荷卸をするには、港長の許可を受けなければならない。","特定港内において竹木材を船舶から水上に卸そうとする者は、港長の許可を受けなければならない。","船舶は、特定港に入港したとき又は特定港を出港しようとするときは、港長に届け出なければならない。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":190,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93907"},{"cat":"施工管理法","year":"R8前期 No.48","q":"新点Bの標高を求めるため、新点Bから TS（トータルステーション）で既知点Aに設置した反射鏡中心の鉛直角観測と距離測定を行って、次の観測結果を得た。新点Bの標高として、正しいものはどれか。ただし、既知点Aの標高は 50.00 m とし、AB 両点ともに偏心はなく、球差と気差を合わせた両差は考慮しないものとする。なお、sin（-30°）＝ -0.5。観測結果：高低角 αB ＝ -30°00′00″、斜距離 LB ＝ 200.00 m、既知点Aの測標高 fA ＝ 1.30 m、新点Bの器械高 iB ＝ 1.50 m。","opts":["147.20 m","149.80 m","150.20 m","152.80 m"],"ans":1,"ex":"","src":"20260608_2kyu","qid":191,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93908"},{"cat":"施工管理法","year":"R8前期 No.49","q":"公共工事標準請負契約約款に関する記述のうち、誤っているものはどれか。","opts":["受注者は約款及び設計図書に特別の定めがない場合には仮設、施工方法その他工事目的物を完成させるために必要な一切の手段を、自らの責任において定める。","受注者は、工事の施工に当たり、設計図書の表示が明確でない事実を発見したときは、その旨を直ちに監督員に通知し、その確認を請求しなければならない。","受注者は、必要があるときは、設計図書の変更内容を発注者に通知して、設計図書を変更することができる。","受注者は、工事の施工部分が設計図書に適合しない場合において、監督員がその改造を請求したときは、請求に従わなければならない。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":192,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93909"},{"cat":"施工管理法","year":"R8前期 No.51","q":"建設工事における建設機械の「機械名」と「性能表示」に関する組合せとして、適当なものはどれか。","opts":["コンクリートブレーカ － 質量［kg］","コンクリートポンプ車 － 打込み能力［m3/h］","アスファルトフィニッシャ － 施工幅［m］","クレーン － ブーム長［m］"],"ans":3,"ex":"","src":"20260608_2kyu","qid":193,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93911"},{"cat":"施工管理法","year":"R8前期 No.52","q":"建設工事のための施工計画作成に関する記述のうち、適当でないものはどれか。","opts":["事前調査は、契約条件、設計図面及び仕様書の内容を検討し、工事数量の確認を行う。","施工技術計画のうち工程計画は、使用する機械、設備、人などの 1 日当たりの作業量を算出し、各工種の開始と終了時期を決める。","仮設備計画は、仮設備の使用目的や期間に応じて構造計算を行い、品質管理計画に合致するものとする。","管理計画は、現場周辺の環境に影響しないよう、公害問題、交通問題等への対策を立てる。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":194,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93912"},{"cat":"施工管理法","year":"R8前期 No.53","q":"労働安全衛生法上、高さ 2 m 以上の足場（つり足場を除く）に設ける作業床に関する記述のうち、事業者が講じなければならない措置として、誤っているものはどれか。","opts":["床材と建地との隙間は、原則として 12 cm 未満とする。","作業床の幅は、30 cm 以上とする。","床材間の隙間は、3 cm 以下とする。","作業床より物体の落下を防ぐ幅木の高さは、原則として 10 cm 以上とする。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":195,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93913"},{"cat":"施工管理法","year":"R8前期 No.54","q":"労働安全衛生法上、高さ 5 m 以上のコンクリート造の工作物の解体作業に伴う危険を防止するために、事業者が行うべき事項に関する記述のうち、誤っているものはどれか。","opts":["外壁、柱等の引倒し等の作業を行う場合において、引倒し等について一定の合図を定め、関係労働者に周知させなければならない。","解体用機械を用いて作業を行うときは、物体の飛来等により危険が生じるおそれのある箇所に、作業主任者以外の者を立ち入らせてはならない。","強風、大雨、大雪等の悪天候のため、作業の実施について危険が予想されるときは、当該作業を中止しなければならない。","工作物の倒壊、物体の飛来又は落下等による労働者の危険を防止するため、あらかじめ、当該工作物の形状等を調査し、作業計画を定め、これにより作業を行わなければならない。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":196,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93914"},{"cat":"施工管理法","year":"R8前期 No.55","q":"アスファルト舗装の品質特性と試験方法に関する記述のうち、適当なものはどれか。","opts":["アスファルトの伸度を確認するためには、マーシャル安定度試験を行う。","アスファルトの硬さを調べるためには、すり減り試験を行う。","アスファルト舗装の平坦性を確認するためには、プルーフローリング試験を行う。","アスファルト舗装の路床の強さを判定するためには、CBR 試験を行う。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":197,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93915"},{"cat":"施工管理法","year":"R8前期 No.56","q":"レディーミクストコンクリート（JIS A 5308）の受入検査に関する記述のうち、適当でないものはどれか。","opts":["スランプ 12 cm のコンクリートで許容されるスランプの上限値は 15.0 cm である。","塩化物含有量は、塩化物イオン量として原則 0.30 kg/m3 以下であること。","空気量 4.5 ％ のコンクリートで許容される空気量の上限値は 6.0 ％ である。","1 回の圧縮強度試験結果は、購入者の指定した呼び強度の値の 85 ％ 以上であること。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":198,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93916"},{"cat":"施工管理法","year":"R8前期 No.57","q":"建設工事における騒音や振動に関する記述のうち、適当でないものはどれか。","opts":["大きな騒音や振動を発生する作業は、できるだけ人家への影響を小さくするように季節、時間帯、場所を選定できるよう作業段取りを計画する等の配慮が必要である。","履帯式（クローラ式）の建設機械は、車輪式（ホイール式）の建設機械に比べて、一般に騒音や振動のレベルが小さい。","建設機械の運転を行わない作業待ち時は、建設機械等のエンジンをできる限り止める等、騒音や振動を発生させない。","ブルドーザを用いて掘削押し土を行う場合、無理な負荷をかけないようにし、後進時の高速走行を避けて、ていねいに運転する。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":199,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93917"},{"cat":"施工管理法","year":"R8前期 No.58","q":"「建設工事に係る資材の再資源化等に関する法律」（建設リサイクル法）に定められている特定建設資材に該当するものはどれか。","opts":["廃プラスチック","廃油","木材","ゴムくず"],"ans":2,"ex":"","src":"20260608_2kyu","qid":200,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93918"},{"cat":"施工管理法応用","year":"R8前期 No.59","q":"施工計画における建設機械の作業効率に関する①～④の記述のうち、適当なものの数はどれか。① 建設機械の作業能力は、単独又は組み合わされた機械の時間当たりの平均作業量で表す。② ワーカビリティーとは建設機械の走行性をいい、一般にコーン指数で判断される。③ リッパビリティーとは、大型ブルドーザに装着されたリッパで作業できる程度をいう。④ ダンプトラックの作業効率は、運搬路の沿道条件、路面状態、昼夜の別等で変わる。","opts":["1つ","2つ","3つ","4つ"],"ans":2,"ex":"","src":"20260608_2kyu","qid":201,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93919"},{"cat":"施工管理法応用","year":"R8前期 No.60","q":"公共工事における施工体制台帳及び施工体系図に関する文章中の(イ)～(ニ)に当てはまる語句の組合せとして、適当なものはどれか。・施工体制台帳は、原則としてその写しを(イ)に提出しなければならない。・施工体制台帳は、(ロ)を記載しなければならない。・施工体系図は、(ハ)の要約版ともいえ、必ず作成しなければならない。・施工体系図は、変更があった場合は、(ニ)に変更を行わなければならない。","opts":["(イ)元請負人 (ロ)下請負人の名称 (ハ)設計図 (ニ)工事完成検査まで","(イ)発注者 (ロ)下請負人の施工実績 (ハ)設計図 (ニ)工事完成検査まで","(イ)発注者 (ロ)下請負人の名称 (ハ)施工体制台帳 (ニ)速やか","(イ)元請負人 (ロ)下請負人の施工実績 (ハ)施工体制台帳 (ニ)速やか"],"ans":2,"ex":"","src":"20260608_2kyu","qid":202,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93920"},{"cat":"施工管理法応用","year":"R8前期 No.61","q":"工程表の種類と特徴に関する記述のうち、適当なもののみを全てあげている組合せはどれか。① バーチャートは、各工事の必要日数を棒線で表した図表である。② ガントチャートは、工事内容を系統だてて作業相互の関連、順序や日数を表した図表である。③ グラフ式工程表は、工種ごとの工程を斜線で表した図表である。④ 出来高累計曲線は、工事全体の出来高比率の累計を曲線で表した図表である。","opts":["①②","②③","①③④","②③④"],"ans":2,"ex":"","src":"20260608_2kyu","qid":203,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93921"},{"cat":"施工管理法応用","year":"R8前期 No.63","q":"労働安全衛生法上、複数の事業者が混在している事業場の安全衛生管理体制に関する文章中の(イ)～(ニ)に当てはまる語句の組合せとして、正しいものはどれか。・事業者のうち、一の場所で行う事業でその一部を請負人に請け負わせているものを(イ)という。・(イ)のうち、建設業等の事業を行う者を(ロ)という。・(ロ)は、労働災害を防止するため、(ハ)の運営を行わなくてはならない。・(ロ)は、作業場所の巡視を(ニ)少なくとも 1 回行わなくてはならない。","opts":["(イ)元方事業者 (ロ)特定元方事業者 (ハ)協議組織 (ニ)毎作業日に","(イ)特定元方事業者 (ロ)元方事業者 (ハ)技能講習 (ニ)毎作業日に","(イ)元方事業者 (ロ)特定元方事業者 (ハ)技能講習 (ニ)毎週","(イ)特定元方事業者 (ロ)元方事業者 (ハ)協議組織 (ニ)毎週"],"ans":0,"ex":"","src":"20260608_2kyu","qid":204,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93923"},{"cat":"施工管理法応用","year":"R8前期 No.64","q":"労働安全衛生法上、車両系建設機械を用いた作業において、事業者が行うべき事項に関する文章中の(イ)～(ニ)に当てはまる語句の組合せとして、正しいものはどれか。・作業を行うときに定める作業計画には、使用する機械の種類及び能力、(イ)、作業の方法が示されていなければならない。・車両系建設機械の転倒又は転落により運転者に危険が生ずるおそれのある場所においては、転倒時保護構造を有し、かつ、(ロ)を備えたもの以外の車両系建設機械を使用しないように努めなければならない。・運転について誘導者を置くときは、一定の合図を定め、(ハ)に当該合図を行わせなければならない。・作業を行うときは、(ニ)に、ブレーキ及びクラッチの機能について点検を行わなければならない。","opts":["(イ)運行経路 (ロ)安全ブロック (ハ)運転者 (ニ)その日の作業開始前","(イ)機械の所有者 (ロ)シートベルト (ハ)運転者 (ニ)作業の前日","(イ)機械の所有者 (ロ)安全ブロック (ハ)誘導者 (ニ)作業の前日","(イ)運行経路 (ロ)シートベルト (ハ)誘導者 (ニ)その日の作業開始前"],"ans":3,"ex":"","src":"20260608_2kyu","qid":205,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93924"},{"cat":"施工管理法応用","year":"R8前期 No.65","q":"品質管理に用いられるヒストグラムに関する記述のうち、適当なもののみを全てあげている組合せはどれか。① ヒストグラムは、測定値のばらつきを知るのに最も簡単で効率的な統計手法である。② ヒストグラムは、データがどんな分布をしているのかを表した柱状図である。③ 平均値が規格値の中央で左右対称なヒストグラムは、品質管理が良好である。④ ヒストグラムでは、縦軸に平均値、横軸に測定値を示している。","opts":["①④","②③","①②③","②③④"],"ans":2,"ex":"","src":"20260608_2kyu","qid":206,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93925"},{"cat":"施工管理法応用","year":"R8前期 No.66","q":"盛土の締固めにおける品質管理に関する①～④の記述のうち、適当なもののみを全てあげている組合せはどれか。① 工法規定方式は、盛土の品質を仕様書に明示し、締固めの工法を施工者に任せる方法である。② 品質規定方式は、締固め機械の機種や締固め回数、盛土材料の敷均し厚さ等を規定する方法である。③ 盛土の締固めは、法面の安定や土の支持力の増加等を目的とし、必要な強度特性が得られるように行う。④ ICT 土工とは、土木工事で、電子情報を活用して効率的で高精度な施工を行うものである。","opts":["①②","③④","①②③","②③④"],"ans":1,"ex":"","src":"20260608_2kyu","qid":207,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93926"}],"1kyu":[{"cat":"土木一般","year":"R5 No.1","q":"土質試験結果の活用に関する次の記述のうち、適当でないものはどれか。","opts":["土の含水比試験結果は、土粒子の質量に対する間隙に含まれる水の質量の割合を表したもので、土の乾燥密度との関係から締固め曲線を描くのに用いられる。","CBR試験結果は、供試体表面に貫入ピストンを一定量貫入させたときの荷重強さを標準荷重強さに対する百分率で表したもので、地盤の許容支持力の算定に用いられる。","土の圧密試験結果は、求められた圧密係数や体積圧縮係数等から、飽和粘性土地盤の沈下量と沈下時間の推定に用いられる。","土の一軸圧縮試験結果は、求められた自然地盤の非排水せん断強さから、地盤の土圧、斜面安定等の強度定数に用いられる。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":0,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74717"},{"cat":"土木一般","year":"R5 No.2","q":"法面保護工の施工に関する次の記述のうち、適当でないものはどれか。","opts":["植生土のう工は、法枠工の中詰とする場合には、施工後の沈下やはらみ出しが起きないように、土のうの表面を平滑に仕上げる。","種子散布工は、各材料を計量した後、水、木質材料、浸食防止材、肥料、種子の順序でタンクへ投入し、十分攪拌して法面へムラなく散布する。","モルタル吹付工は、吹付けに先立ち、法面の浮石、ほこり、泥等を清掃した後、一般に菱形金網を法面に張り付けてアンカーピンで固定する。","ブロック積擁壁工は、原則として胴込めコンクリートを設けない空積で、水平方向の目地が直線とならない谷積で積み上げる。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":1,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74718"},{"cat":"土木一般","year":"R5 No.3","q":"TS（トータルステーション）・GNSS（全球測位衛星システム）を用いた盛土の情報化施工に関する次の記述のうち、適当でないものはどれか。","opts":["盛土の締固め管理システムは、締固め判定・表示機能、施工範囲の分割機能等を有するものとしシステムを選定する段階でカタログその他によって確認する。","TS・GNSSを施工管理に用いる時は、現場内に設置している工事基準点等の座標既知点を複数箇所で観測し、既知座標とTS・GNSSの計測座標が合致していることを確認する。","まき出し厚さは、まき出しが完了した時点から締固め完了までに仕上り面の高さが下がる量を試験施工により確認し、これを基に決定する。","現場密度試験は、盛土材料の品質、まき出し厚及び締固め回数等が、いずれも規定通りとなっている場合においても、必ず実施する。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":2,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74719"},{"cat":"土木一般","year":"R5 No.4","q":"道路土工における地下排水工に関する次の記述のうち、適当でないものはどれか。","opts":["しゃ断排水層は、降雨による盛土内の浸透水を排水するため、路盤よりも下方に透水性の極めて高い荒目の砂利、砕石を用い、適切な厚さで施工する。","水平排水層は、盛土内部の間隙水圧を低下させて盛土の安定性を高めるため、透水性の良い材料を用い、適切な排水勾配及び層厚を確保し施工する。","基盤排水層は、地山から盛土への水の浸透を防止するため、地山の表面に砕石又は砂等の透水性が高く、せん断強さが大きい材料を用い、適切な厚さで施工する。","地下排水溝は、主に盛土内に浸透してくる地下水や地表面近くの浸透水を排水するため、山地部の沢部を埋めた盛土では、旧沢地形に沿って施工する。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":3,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74720"},{"cat":"土木一般","year":"R5 No.5","q":"軟弱地盤上における道路盛土の施工に関する次の記述のうち、適当でないものはどれか。","opts":["盛土荷重の載荷による軟弱地盤の変形は、非排水せん断変形による沈下及び隆起・側方変位と、圧密による沈下とからなる。","盛土は、現地条件等を把握したうえで、工事の進捗状況や地盤の挙動、土工構造物の品質、形状・寸法を確認しながら施工を行う必要がある。","盛土の施工中は、雨水の浸透を防止するため、施工面に数％の横断勾配をつけて、表面を平滑に仕上げる。","サンドマット施工時や盛土高が低い間は、局部破壊を防止するため、盛土中央から法尻に向かって施工する。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":4,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74721"},{"cat":"土木一般","year":"R5 No.6","q":"コンクリート用骨材に関する次の記述のうち、適当でないものはどれか。","opts":["異なる種類の細骨材を混合して用いる場合の吸水率については、混合後の試料で吸水率を測定し規定と比較する。","凍結融解の繰返しに対する骨材品質の適否の判定は、硫酸ナトリウムによる骨材の安定性試験方法によって行う。","砕石を用いた場合にワーカビリティーの良好なコンクリートを得るためには、砂利を用いた場合に比べて単位水量を大きくする必要がある。","粗骨材は、清浄、堅硬、劣化に対する抵抗性を持ったもので、耐火性を必要とする場合には、耐火的な粗骨材を用いる。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":5,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74722"},{"cat":"土木一般","year":"R5 No.7","q":"コンクリートに用いるセメントに関する次の記述のうち、適当でないものはどれか。","opts":["普通ポルトランドセメントは、幅広い工事で使用されているセメントで、小規模工事や左官用モルタルでも使用される。","早強ポルトランドセメントは、初期強度を要するプレストレストコンクリート工事等に使用される。","中庸熱ポルトランドセメントは、水和熱を抑制することが求められるダムコンクリート工事等に使用される。","耐硫酸塩ポルトランドセメントは、製鉄所から出る高炉スラグの微粉末を混合したセメントで、海岸など塩分が飛来する環境に使用される。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":6,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74723"},{"cat":"土木一般","year":"R5 No.8","q":"コンクリート用混和材料に関する次の記述のうち、適当でないものはどれか。","opts":["フライアッシュを適切に用いると、コンクリートのワーカビリティーを改善し単位水量を減らすことができることや水和熱による温度上昇の低減等の効果を期待できる。","膨張材を適切に用いると、コンクリートの乾燥収縮や硬化収縮等に起因するひび割れ発生を低減できる。","石灰石微粉末を用いると、ブリーディングの抑制やアルカリシリカ反応を抑制する等の効果がある。","高性能AE減水剤を用いると、コンクリート温度や使用材料等の諸条件の変化に対して、ワーカビリティー等が影響を受けやすい傾向にある。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":7,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74724"},{"cat":"土木一般","year":"R5 No.9","q":"寒中コンクリート及び暑中コンクリートの施工に関する次の記述のうち、適当でないものはどれか。","opts":["コンクリートの施工時、日平均気温が、N℃以下になることが予想される場合は、寒中コンクリートとしての施工を行わなければならない。","寒中コンクリートでは、保温養生あるいは給熱養生終了後に急に寒気にさらすと、表面にひび割れが生じるおそれがあるので、適当な方法で保護し表面の急冷を防止する。","日平均気温が25℃を超える時期にコンクリートを施工することが想定される場合には、暑中コンクリートとしての施工を行うことを標準とする。","暑中コンクリートでは、コールドジョイントの発生防止のため、減水剤、AE減水剤については、促進形のものを用いる。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":8,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74725"},{"cat":"土木一般","year":"R5 No.10","q":"コンクリートの打込み・締固めに関する次の記述のうち、適当なものはどれか。","opts":["コンクリート打込み時にシュートを用いる場合は、斜めシュートを標準とする。","打ち込んだコンクリートの粗骨材が分離してモルタル分が少ない部分があれば、その分離した粗骨材をすくい上げてモルタルの多いコンクリートの中に埋め込んで締め固める。","型枠内に打ち込んだコンクリートは、材料分離を防ぐため、棒状バイブレータを用いてコンクリートを横移動させながら充填する。","コールドジョイント発生を防ぐための許容打重ね時間間隔は、外気温が高いほど長くなる。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":9,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74726"},{"cat":"土木一般","year":"R5 No.11","q":"鉄筋の継手に関する次の記述のうち、適当でないものはどれか。","opts":["重ね継手は、所定の長さを重ね合せて、直径0.8mm以上の焼なまし鉄線で数箇所緊結する。","重ね継手の重ね合わせ長さは、鉄筋直径の20倍以上とする。","ガス圧接継手における鉄筋の圧接端面は、軸線に傾斜させて切断する。","手動ガス圧接の場合、直近の異なる径の鉄筋の接合は、可能である。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":10,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74727"},{"cat":"土木一般","year":"R5 No.12","q":"道路橋で用いられる基礎形式の種類とその特徴に関する次の記述のうち、適当でないものはどれか。","opts":["ケーソン基礎の場合、鉛直荷重に対しては、基礎底面地盤の鉛直地盤反力のみで抵抗させることを原則とする。","支持杭基礎の場合、水平荷重は杭のみで抵抗させ、鉛直荷重は杭とフーチング根入れ部分で抵抗させることを原則とする。","鋼管矢板基礎の場合、圧密沈下が生じると考えられる地盤への打設は、負の周面摩擦力等による影響を考慮して検討しなければならない。","直接基礎の場合、通常、フーチング周面の摩擦抵抗はあまり期待できないので、鉛直荷重は基礎底面地盤の鉛直地盤反力のみで抵抗させなければならない。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":11,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74728"},{"cat":"土木一般","year":"R5 No.13","q":"既製杭の支持層の確認、及び打止め管理に関する次の記述のうち、適当でないものはどれか。","opts":["打撃工法では、支持杭基礎の場合、打止め時一打当たりの貫入量及びリバウンド量等が、試験杭と同程度であることを確認する。","中掘り杭工法のセメントミルク噴出攪拌方式では、支持層付近で掘削速度を極力一定に保ち、掘削抵抗値を測定・記録することにより確認する。","プレボーリング杭工法では、積分電流値の変化が試験杭とは異なる場合、駆動電流値の変化、採取された土の状態、事前の土質調査の結果や他の杭の施工状況等により確認する。","回転杭工法では、回転速度、付加する押込み力を一定に保ち、回転トルク（回転抵抗値）とN値の変化を対比し、支持層上部よりも回転トルクが減少していることにより確認する。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":12,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74729"},{"cat":"土木一般","year":"R5 No.14","q":"場所打ち杭工法の施工に関する次の記述のうち、適当でないものはどれか。","opts":["オールケーシング工法の掘削では、孔壁の崩壊防止等のために、ケーシングチューブの先端が常に掘削底面より上方にあるようにする。","オールケーシング工法では、鉄筋かごの最下端には軸方向鉄筋が自重により孔底に貫入することを防ぐため、井桁状に組んだ底部鉄筋を配置するのが一般的である。","リバース工法では、トレミーによる孔底処理を行うことから、鉄筋かごを吊った状態でコンクリートを打ち込むのが一般的である。","リバース工法では、安定液のように粘性があるものを使用しないため、一次孔底処理により泥水中のスライムはほとんど処理できる。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":13,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74730"},{"cat":"土木一般","year":"R5 No.15","q":"土留め支保工の施工に関する次の記述のうち、適当なものはどれか。","opts":["ヒービングに対する安定性が不足すると予測された場合には、掘削底面下の地盤改良を行い、強度の増加をはかる。","盤ぶくれに対する安定性が不足すると予測された場合には、地盤改良により不透水層の層厚を薄くするとよい。","ボイリングに対する安定性が不足すると予測された場合には、水頭差を大きくするため、背面側の地下水位を上昇させる。","土留め壁又は支保工の応力度、変形が許容値を超えると予測された場合には、切ばりのプレロードを解除するとよい。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":14,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74731"},{"cat":"専門土木","year":"R5 No.16","q":"鋼道路橋の架設上の留意事項に関する次の記述のうち、適当でないものはどれか。","opts":["供用中の道路に近接するベントと架設橋桁は、架設橋桁受け点位置でズレが生じないよう、ワイヤーロープや固定治具で固定するのが有効である。","箱形断面の桁は、重量が重く吊りにくいので、吊り状態における安全性を確認するため、吊り金具や補強材は現場で取り付ける必要がある。","曲線桁橋の桁を、横取り、ジャッキによるこう上又は降下等、移動する作業を行う場合は、必要に応じてカウンターウエイト等を用いて重心位置の調整を行う。","トラス橋の架設においては、最終段階でのそりの調整は部材と継手の数が多く難しいため、架設の各段階における上げ越し量の確認を入念に行う必要がある。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":15,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74732"},{"cat":"専門土木","year":"R5 No.17","q":"鋼道路橋の鉄筋コンクリート床版におけるコンクリート打込みに関する次の記述のうち、適当でないものはどれか。","opts":["打継目は、一般に、床版の主応力が橋軸方向に作用し、打継目の完全な一体化が困難なことから、橋軸方向に設けた方がよい。","片持部床版の張出し量が大きくなると、コンクリート打込み時の振動による影響や型枠のたわみが大きくなるので、十分に堅固な型枠支保工を組み立てることが重要である。","床版に縦断勾配及び横断勾配が設けられている場合は、コンクリートが低い方に流動することを防ぐため、低い方から高い方へ向かって打ち込むのがよい。","連続桁では、ある径間に打ち込まれたコンクリート重量により桁がたわむことで、他径間が持ち上げられることがあるので、床版への引張力が小さくなるよう打込み順序を検討する。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":16,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74733"},{"cat":"専門土木","year":"R5 No.18","q":"鋼道路橋における高力ボルトの施工に関する次の記述のうち、適当なものはどれか。","opts":["ボルト、ナットについては、原則として現場搬入時にその特性及び品質を保証する試験、検査を行い、規格に合格していることを確認する。","継手の中央部からボルトを締め付けると、連結版が浮き上がり、密着性が悪くなる傾向があるため、外側から中央に向かって締め付け、0度締めを行う。","回転法又は耐力点法によって締め付けたボルトに対しては、全数についてマーキングによって所要の回転角があるか否かを検査する。","ボルトの軸力の導入は、ボルトの頭部を回して行うのを原則とし、やむを得ずナットを回して行う場合は、トルク係数値の変化を確認する。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":17,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74734"},{"cat":"専門土木","year":"R5 No.19","q":"塩害を受けた鉄筋コンクリート構造物への対策や補修に関する次の記述のうち、適当でないものはどれか。","opts":["劣化が顕在化した箇所に部分的に断面修復工法を適用すると、断面修復箇所と断面修復しない箇所の境界部付近においては腐食電流により防食される。","表面処理工法の適用後からの残存予定供用期間が長い場合には、表面処理材の再塗布を計画しておく必要がある。","電気防食工法を適用する場合には、陽極システムの劣化や電流供給の安定性について考慮しておく必要がある。","脱塩工法では、工法適用後に残存する塩化物イオンの挙動が、補修効果の持続期間に大きく影響する。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":18,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74735"},{"cat":"専門土木","year":"R5 No.21","q":"河川堤防の盛土施工に関する次の記述のうち、適当でないものはどれか。","opts":["築堤盛土の締固めは、堤防法線に平行に行うことが望ましく、締固めに際しては締固め幅が重複するように常に留意して施工する必要がある。","築堤盛土の施工中は、法面の一部に雨水が集中して流下すると法面侵食の主要因となるため、堤防横断方向にP〜Q％程度の勾配を設けながら施工する。","既設の堤防に腹付けを行う場合は、新旧法面をなじませるため段切りを行い、一般にその大きさは堤防締固め1層仕上り厚の倍の20〜30cm程度とすることが多い。","高含水比粘性土を盛土材料として使用する際は、わだち掘れ防止のために接地圧の小さいブルドーザによる盛土箇所までの二次運搬を行う。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":19,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74737"},{"cat":"専門土木","year":"R5 No.22","q":"河川護岸に関する次の記述のうち、適当でないものはどれか。","opts":["法覆工に連節ブロック等の透過構造を採用する場合は、裏込め材の設置は不要となるが、背面土砂の吸出しを防ぐため、吸出し防止材の布設が代わりに必要となる。","石張り又は石積みの護岸工の施工方法には、谷積みと布積みがあるが、一般には強度の強い谷積みが用いられる。","かごマット工では、底面に接する地盤で土砂の吸出し現象が発生するため、これを防止する目的で吸出し防止材を施工する。","コンクリートブロック張工では、平板ブロックと控えのある間知ブロックが多く使われており、平板ブロックは、流速が大きいところに使用される。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":20,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74738"},{"cat":"専門土木","year":"R5 No.23","q":"堤防を開削する場合の仮締切工の施工に関する次の記述のうち、適当でないものはどれか。","opts":["堤防の開削は、仮締切工が完成する以前に開始してはならず、また、仮締切工の撤去は、堤防の復旧が完了、又はゲート等代替機能の構造物ができた後に行う。","鋼矢板の二重仮締切内の掘削は、鋼矢板の変形、中埋め土の流出、ボイリング・ヒービングの兆候の有無を監視しながら行う必要がある。","仮締切工の撤去は、構造物の構築後、締切り内と外との土圧、水圧をバランスさせつつ撤去する必要があり、流水の影響がある場合は、上流側、下流側、流水側の順で撤去する。","鋼矢板の二重仮締切工に用いる中埋め土は、壁体の剛性を増す目的と鋼矢板等の壁体に作用する土圧を低減するために、良質の砂質土とする。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":21,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74739"},{"cat":"専門土木","year":"R5 No.24","q":"砂防堰堤の施工に関する次の記述のうち、適当でないものはどれか。","opts":["基礎地盤の透水性に問題がある場合は、グラウト等の止水工により改善を図り、また、パイピングに対しては、止水壁や水抜き暗渠を設けて改善を図るのが一般的である。","砂防堰堤の基礎は、一般に所定の強度が得られる地盤であっても、基礎の不均質性や風化の速度を考慮し、一定以上の根入れを確保する必要がある。","基礎掘削によって緩められた岩盤を取り除く等の岩盤清掃を行うとともに、湧水や漏水の処理を行った後に、堤体のコンクリートを打ち込む必要がある。","砂礫基礎で所要の強度を得ることができない場合は、堰堤の底幅を広くして応力を分散させたり、基礎杭工法やセメントの混合による土質改良等により改善を図る方法がある。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":22,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74740"},{"cat":"専門土木","year":"R5 No.25","q":"渓流保全工に関する次の記述のうち、適当でないものはどれか。","opts":["渓流保全工は、山間部の平地や扇状地を流下する渓流等において、縦断勾配の規制により渓床や渓岸の侵食等を防止することを目的とした施設である。","渓流保全工は、多様な渓流空間、生態系の保全及び自然の土砂調節機能の観点から、拡幅部や狭窄部等の自然の地形を活かして計画することが求められる。","護岸工は、渓岸の侵食や崩壊の防止、山脚の固定等を目的に設置され、湾曲部外湾側では河床変動が大きいことから、根固工を併用する等の検討が求められる。","床固工は、渓床の縦侵食防止、河床堆積物の再移動防止により河床を安定させるとともに、護岸工等の工作物の上流に設置することにより、工作物の基礎を保護する機能も有する。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":23,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74741"},{"cat":"専門土木","year":"R5 No.26","q":"急傾斜地崩壊防止工に関する次の記述のうち、適当なものはどれか。","opts":["コンクリート張工は、斜面の風化、侵食及び崩壊等を防止することを目的とし、比較的勾配の急な斜面に用いられ、設計においては土圧を考慮する必要がある。","もたれ式コンクリート擁壁工は、斜面崩壊を直接抑止することが困難な場合に、斜面脚部から離して擁壁を設置する工法で、斜面地形の変化に対し比較的適応性がある。","切土工は、斜面勾配の緩和、斜面上の不安定な土塊や岩石の一部又は全部を除去するもので、切土した斜面の高さにかかわらず小段の設置を必要としない工法である。","重力式コンクリート擁壁工は、小規模な斜面崩壊を直接抑止するほか、押さえ盛土の安定、法面保護工の基礎等として用いられる工法であり、排水に対して特に留意する必要がある。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":24,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74742"},{"cat":"専門土木","year":"R5 No.27","q":"道路のアスファルト舗装における路床の施工に関する次の記述のうち、適当でないものはどれか。","opts":["盛土路床は、施工後の降雨排水対策として、縁部に仮排水溝を設けておくことが望ましい。","凍上抑制層は、凍結深さから求めた必要な置換え深さと舗装の厚さを比較し、舗装の厚さが大きい場合に、路盤の下にその厚さの差だけ凍上の生じにくい材料で置き換える。","安定処理土は、セメント及びセメント系安定材を使用する場合、六価クロムの溶出量が所定の土壌環境基準に適合していることを確認して施工する。","構築路床は、現状路床の支持力を低下させないよう、所定の品質、高さ及び形状に仕上げる。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":25,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74743"},{"cat":"専門土木","year":"R5 No.28","q":"道路のアスファルト舗装における路盤の施工に関する次の記述のうち、適当でないものはどれか。","opts":["アスファルトコンクリート再生骨材を多く含む再生路盤材料は、締め固めにくい傾向にあるので、使用するローラの選択や転圧の方法等に留意して施工するとよい。","セメント安定処理路盤を締固め直後に交通開放する場合は、含水比を一定に保つとともに、表面を保護する目的で必要に応じてアスファルト乳剤等を散布するとよい。","粒状路盤材料が乾燥しすぎている場合は、施工中に適宜散水して、最適含水比付近の状態で締め固めるとよい。","シックリフト工法による加熱アスファルト安定処理路盤は、早期交通開放すると初期わだち掘れが発生しやすいので、舗設後に加熱するとよい。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":26,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74744"},{"cat":"専門土木","year":"R5 No.29","q":"道路のアスファルト舗装における基層・表層の施工に関する次の記述のうち、適当でないものはどれか。","opts":["タックコート面の保護や乳剤による施工現場周辺の汚れを防止する場合は、乳剤散布装置を搭載したアスファルトフィニッシャを使用することがある。","アスファルト混合物の敷均し作業中に雨が降り始めた場合は、敷均し作業を中止するとともに、敷き均した混合物を速やかに締め固めて仕上げる。","施工の終了時又はやむを得ず施工を中断した場合は、道路の縦断方向に縦継目を設け、縦継目の仕上りの良否が走行性に直接影響を与えるので平坦に仕上げるように留意する。","振動ローラにより転圧する場合は、転圧速度が速すぎると不陸や小波が発生し、遅すぎると過転圧になることがあるので、転圧速度に注意する。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":27,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74745"},{"cat":"専門土木","year":"R5 No.30","q":"道路のアスファルト舗装の補修工法に関する次の記述のうち、適当でないものはどれか。","opts":["オーバーレイ工法は、既設の舗装上にアスファルト混合物の層を重ねる工法で、既設舗装の破損が著しく、その原因が路床や路盤の欠陥によると思われるときは局部的に打ち換える。","表層・基層打換え工法は、既設舗装を表層又は基層まで打ち換える工法で、コンクリート床版に不陸があって舗装厚が一定でない場合、床版も適宜切削して不陸をなくしておく。","路上表層再生工法は、現位置において既設アスファルト混合物層を新しい表層として再生する工法で、混合物の締固め温度が通常より低いため、能力の大きな締固め機械を用いるとよい。","打換え工法は、既設舗装のすべて又は路盤の一部まで打ち換える工法で、路盤以下の掘削時は、既設埋設管等の占用物の調査を行い、試掘する等して破損しないように施工する。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":28,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74746"},{"cat":"専門土木","year":"R5 No.31","q":"道路の各種アスファルト舗装に関する次の記述のうち、適当なものはどれか。","opts":["グースアスファルト舗装は、グースアスファルト混合物を用いた不透水性やたわみ性等の性能を有する舗装で、一般にコンクリート床版の橋面舗装に用いられる。","大粒径アスファルト舗装は、最大粒径の大きな骨材をアスファルト混合物に用いる舗装で、耐流動性や耐摩耗性等の性能を有するため、一般に鋼床版舗装等の橋面舗装に用いられる。","フォームドアスファルト舗装は、加熱アスファルト混合物を製造する際に、アスファルトを泡状にして容積を増大させて混合性を高めて製造した混合物を用いる舗装である。","砕石マスチック舗装は、細骨材に対するフィラーの量が多い浸透用セメントミルクで粗骨材の骨材間隙を充填したギャップ粒度のアスファルト混合物を用いる舗装である。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":29,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74747"},{"cat":"専門土木","year":"R5 No.32","q":"道路のコンクリート舗装の補修工法に関する次の記述のうち、適当なものはどれか。","opts":["注入工法は、コンクリート版と路盤との間にできた空隙や空洞を充填し、沈下を生じた版を押し上げて平常の位置に戻す工法である。","粗面処理工法は、コンクリート舗装面を粗面に仕上げることによって、舗装版の強度を回復させる工法である。","付着オーバーレイ工法は、既設コンクリート版とコンクリートオーバーレイとが一体となるように、既設版表面に路盤紙を敷いたのち、コンクリートを打ち継ぐ工法である。","バーステッチ工法は、既設コンクリート版に発生したひび割れ部に、ひび割れと平行に切り込んだカッタ溝に異形棒鋼等の鋼材を埋設する工法である。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":30,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74748"},{"cat":"専門土木","year":"R5 No.33","q":"ダムの基礎処理として行うグラウチングに関する次の記述のうち、適当でないものはどれか。","opts":["重力式コンクリートダムのコンソリデーショングラウチングは、着岩部付近において、遮水性の改良、基礎地盤弱部の補強を目的として行う。","グラウチングは、ルジオン値に応じた初期配合及び地盤の透水性状等を考慮した配合切換え基準に従って、濃度の濃いものから薄いものへ順に注入を行う。","カーテングラウチングの施工位置は、コンクリートダムの場合は上流フーチング又は堤内通廊から行うのが一般的である。","グラウチング仕様は、当初計画を日々の施工の結果から常に見直し、必要に応じて修正していくことが効率的かつ経済的な施工のために重要である。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":31,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74749"},{"cat":"専門土木","year":"R5 No.34","q":"重力式コンクリートダムで各部位のダムコンクリートの配合区分と必要な品質に関する次の記述のうち、適当なものはどれか。","opts":["着岩コンクリートは、所要の水密性、すりへり作用に対する抵抗性や凍結融解作用に対する抵抗性が要求される。","外部コンクリートは、水圧等の作用を自重で支える機能を持ち、所要の単位容積質量と強度が要求され、発熱量が小さく、施工性に優れていることが必要である。","内部コンクリートは、岩盤との付着性及び不陸のある岩盤に対しても容易に打ち込めて一体性を確保できることが要求される。","構造用コンクリートは、鉄筋や埋設構造物との付着性、鉄筋や型枠等の狭隘部への施工性に優れていることが必要である。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":32,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74750"},{"cat":"専門土木","year":"R5 No.35","q":"トンネルの山岳工法における支保工の施工に関する次の記述のうち、適当でないものはどれか。","opts":["吹付けコンクリートは、防水シートの破損や覆工コンクリートのひび割れを防止するために、吹付け面をできるだけ平滑に仕上げなければならない。","吹付けコンクリートは、吹付けノズルを吹付け面に斜め方向に保ち、ノズルと吹付け面との距離及び衝突速度が適正になるように行わなければならない。","鋼製支保工は、一般に地山条件が悪い場合に用いられ、一次吹付けコンクリート施工後すみやかに建て込まなければならない。","鋼製支保工は、十分な支保効果を確保するために、吹付けコンクリートと一体化させなければならない。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":33,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74751"},{"cat":"専門土木","year":"R5 No.36","q":"トンネルの山岳工法における施工時の観察・計測に関する次の記述のうち、適当でないものはどれか。","opts":["観察・計測の目的は、施工中に切羽の状況や既施工区間の支保部材、周辺地山の安全性を確認し、現場の実情にあった設計に修正して、工事の安全性と経済性を確保することである。","観察・計測の項目には、坑内からの切羽の観察調査、内空変位測定、天端沈下測定や、坑外からの地表等の観察調査、地表面沈下測定等がある。","観察調査結果や変位計測結果は、施工中のトンネルの現状を把握して、支保パターンの変更等施工に反映するために、速やかに整理しなければならない。","変位計測の測定頻度は、地山と支保工の挙動の経時変化ならびに経距変化が把握できるように、掘削前後は疎に、切羽が離れるに従って密になるように設定しなければならない。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":34,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74752"},{"cat":"専門土木","year":"R5 No.37","q":"海岸保全施設の養浜の施工に関する次の記述のうち、適当でないものはどれか。","opts":["養浜材に浚渫土砂等の混合粒径土砂を効果的に用いる場合や、シルト分による海域への濁りの発生を抑えるためには、あらかじめ投入土砂の粒度組成を調整することが望ましい。","投入する土砂の養浜効果には投入土砂の粒径が重要であり、養浜場所にある砂よりも粗な粒径を用いた場合、その平衡勾配が小さいため沖合部の保全効果が期待できる。","養浜の施工においては、陸上であらかじめ汚濁の発生源となるシルト、有機物、ゴミ等を養浜材から取り除く等の汚濁の発生防止に努める必要がある。","養浜の陸上施工においては、工事用車両の搬入路の確保や、投入する養浜砂の背後地への飛散等、周辺への影響について十分検討し施工する。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":35,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74753"},{"cat":"専門土木","year":"R5 No.38","q":"離岸堤の施工に関する次の記述のうち、適当でないものはどれか。","opts":["開口部や堤端部は、施工後の波浪によってかなり洗掘されることがあり、計画の1基分はなるべくまとめて施工する。","離岸堤を砕波帯付近に設置する場合は、沈下対策を講じる必要があり、従来の施工例からみれば捨石工よりもマット、シート類を用いる方が優れている。","離岸堤を大水深に設置する場合は、沈下の影響は比較的少ないが、荒天時に一気に沈下する恐れもあるので、容易に補強や嵩上げが可能な工法を選ぶ等の配慮が必要である。","離岸堤の施工順序は、侵食区域の上手側（漂砂供給源に近い側）から設置すると下手側の侵食の傾向を増長させることになるので、下手側から着手し、順次上手に施工する。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":36,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74754"},{"cat":"専門土木","year":"R5 No.39","q":"港湾における浚渫工事のための事前調査に関する次の記述のうち、適当でないものはどれか。","opts":["浚渫工事の浚渫能力が、土砂の硬さや強さ、締り具合や粒の粗さ等に大きく影響することから、土質調査としては、一般に粒度分析、平板載荷試験、標準貫入試験を実施する。","水深の深い場所での深浅測量は音響測深機による場合が多く、連続的な記録が取れる利点があるが、海底の状況をよりきめ細かく測深する場合には未測深幅を狭くする必要がある。","水質調査の目的は、海水汚濁の原因が、バックグラウンド値か浚渫による濁りか確認するために実施するもので、事前及び浚渫中の調査が必要である。","磁気探査を行った結果、一定値以上の磁気反応を示す異常点がある場合は、その位置を求め潜水探査を実施する。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":37,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74755"},{"cat":"専門土木","year":"R5 No.40","q":"水中コンクリートに関する次の記述のうち、適当でないものはどれか。","opts":["水中コンクリートの打込みは、水と接触する部分のコンクリートの材料分離を極力少なくするため、打込み中はトレミー及びポンプの先端を固定しなければならない。","水中不分離性コンクリートは、水中落下させても信頼性の高い性能を有しているが、トレミー及びポンプの筒先は打込まれたコンクリートに埋め込んだ状態で打ち込むことが望ましい。","水中不分離性コンクリートをポンプ圧送する場合は、通常のコンクリートに比べて圧送圧力は小さく、打込み速度は速くなるので注意を要する。","水中コンクリートの打込みは、打上がりの表面をなるべく水平に保ちながら所定の高さ又は水面上に達するまで、連続して打ち込まなければならない。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":38,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74756"},{"cat":"専門土木","year":"R5 No.41","q":"鉄道のコンクリート路盤の施工に関する次の記述のうち、適当でないものはどれか。","opts":["粒度調整砕石層の締固めは、ロードローラ又は振動ローラ等にタイヤローラを併用し、所定の密度が得られるまで十分に締め固める。","プライムコートの施工は、粒度調整砕石層を仕上げた後、速やかに散布し、粒度調整砕石に十分に浸透させ砕石部を安定させる。","鉄筋コンクリート版の鉄筋は、正しい位置に配置し鉄筋相互を十分堅固に組み立て、スペーサーを介して型枠に接する状態とする。","鉄筋コンクリート版のコンクリートは、傾斜部は高い方から低い方へ打ち込み、棒状バイブレータを用いて十分に締め固める。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":39,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74757"},{"cat":"専門土木","year":"R5 No.42","q":"鉄道の軌道における維持管理に関する次の記述のうち、適当でないものはどれか。","opts":["スラブ軌道は、プレキャストコンクリートスラブを堅固な路盤に据え付け、スラブと路盤との間に填充材を注入したものであり、敷設位置の修正が困難である。","水準変位は、左右のレールの高さの差のことであり、曲線部では内側レールが沈みやすく、一様に連続した水準変位が発生する傾向がある。","PCマクラギは、木マクラギに比べ初期投資は多額となり、重量が大きく交換が困難であるが、耐用年数が長いことから保守費の削減が可能である。","軌道変位の増大は、脱線事故にもつながる可能性があるため、軌道変位の状態を常に把握し不良箇所は速やかに補修する必要がある。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":40,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74758"},{"cat":"専門土木","year":"R5 No.43","q":"鉄道（在来線）の営業線及びこれに近接して工事を施工する場合の保安対策に関する次の記述のうち、適当でないものはどれか。","opts":["既設構造物等に影響を与える恐れのある工事の施工にあたっては、異常の有無を検測し、これを監督員等に報告する。","建設用大型機械は、直線区間の建築限界の外方に離れた場所で、かつ列車の運転保安及び旅客公衆等に対し安全な場所に留置する。","列車見張員は、作業等の責任者及び従事員に対して列車接近の合図が可能な範囲内で、安全が確保できる離れた場所に配置する。","工事管理者は、線閉責任者に列車又は車両の運転に支障がないことを確認するとともに、自らも作業区間における建築限界内支障物の確認を行う。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":41,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74759"},{"cat":"専門土木","year":"R5 No.44","q":"シールド工法の施工に関する次の記述のうち、適当でないものはどれか。","opts":["掘進にあたっては、土質、土被り等の変化に留意しながら、掘削土砂の取り込み過ぎや、チャンバー内の閉塞を起こさないように切羽の安定を図らなければならない。","セグメントの組立ては、所定の内空を確保するために正確かつ堅固に施工し、セグメントの目開きや目違い等の防止について、精度の高い管理を行う。","裏込め注入工は、セグメントからの漏水の防止、トンネルの蛇行防止等に役立つため、シールド掘進後に周辺地山が安定してから行わなければならない。","地盤変位を防止するためには、掘進に伴うシールドと地山との摩擦を低減し、周辺地山をできるかぎり乱さないように、ヨーイングやピッチング等を少なくして蛇行を防止する。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":42,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74760"},{"cat":"専門土木","year":"R5 No.45","q":"鋼橋の防食法に関する次の記述のうち、適当でないものはどれか。","opts":["塗装は、鋼材表面に形成した塗膜が腐食の原因となる酸素と水や、塩類等の腐食を促進する物質を遮断し鋼材を保護する防食法である。","耐候性鋼では、鋼材表面における緻密な錆層の生成には、鋼材の表面が大気中にさらされ適度な乾湿の繰返しを受けることが必要である。","電気防食は、鋼材に電流を流して表面の電位差をなくし、腐食電流の回路を形成させない方法であり、流電陽極方式と外部電源方式がある。","金属溶射は、加熱溶融された微細な金属粒子を鋼材表面に吹き付けて皮膜を形成する方法であり、得られた皮膜の表面は粗さがなく平滑である。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":43,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74761"},{"cat":"専門土木","year":"R5 No.46","q":"上水道の配水管の埋設位置及び深さに関する次の記述のうち、適当でないものはどれか。","opts":["配水管は、維持管理の容易性への配慮から、原則として公道に布設するもので、この場合は道路法及び関係法令によるとともに、道路管理者との協議による。","道路法施行令では、土被りの標準は1.2mと規定されているが、土被りの標準又は規定値までとれない場合は道路管理者と協議して0.6mまで減少できる。","配水管を他の地下埋設物と交差又は近接して布設するときは、維持補修や漏水による加害事故発生の恐れに配慮し、少なくとも0.2m以上の間隔を保つものとする。","地下水位が高い場合又は高くなることが予想される場合には、管内空虚時に配水管の浮上防止のため最小土被りを確保する。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":44,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74762"},{"cat":"専門土木","year":"R5 No.47","q":"下水道管渠の更生工法に関する次の記述のうち、適当なものはどれか。","opts":["製管工法は、熱で硬化する樹脂を含浸させた材料をマンホールから既設管渠内に加圧しながら挿入し、加圧状態のまま樹脂が硬化することで更生管渠を構築する。","形成工法は、硬化性樹脂を含浸させた材料や熱可塑性樹脂で形成した材料をマンホールから引込み、加圧し、拡張及び圧着後、硬化や冷却固化することで更生管渠を構築する。","反転工法は、既設管渠より小さな管径で工場製作された二次製品をけん引挿入し、間隙にモルタル等の充填材を注入することで更生管渠を構築する。","さや管工法は、既設管渠内に硬質塩化ビニル樹脂材等をかん合し、その樹脂パイプと既設管渠との間隙にモルタル等の充填材を注入することで更生管渠を構築する。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":45,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74763"},{"cat":"専門土木","year":"R5 No.48","q":"下水道工事における小口径管推進工法の施工に関する次の記述のうち、適当でないものはどれか。","opts":["圧入方式は、誘導管推進の途中で中断し時間をおくと、土質によっては推進管が締め付けられ推進が不可能となる場合があるため、推進中に中断せず一気に到達させなければならない。","オーガ方式は、高地下水圧に対抗する装置を有していないので、地下水位以下の粘性土地盤に適用する場合は、取り込み土量に特に注意しなければならない。","ボーリング方式は、先導体前面が開放しているので、地下水位以下の砂質土地盤に適用する場合は、補助工法の使用を前提とする。","泥水方式は、掘進機の変位を直接制御することができないため、変位の小さなうちに方向修正を加えて掘進軌跡の最大値が許容値を超えないようにする。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":46,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74764"},{"cat":"専門土木","year":"R5 No.49","q":"薬液注入工事の施工管理に関する次の記述のうち、適当でないものはどれか。","opts":["薬液の注入量が500kℓ以上の大型の工事では、水ガラスの原料タンクと調合槽との間に流量積算計の設置が義務づけられているので、これにより水ガラスの使用量を確認する。","削孔時の施工管理項目は、深度、角度及び地表に戻ってくる削孔水の状態の管理があり、特に削孔中は削孔水を観察し調査ボーリングと異なっていないか確認する。","材料の調合に使用する水は原則として水道水を使用するものとし、水道水が使用できない時は、水質基準のpHが5.7以下の水を使用することが望ましい。","埋設物の損傷等の防止として、埋設管がある深度においては、ロータリーによるボーリングを避け、ジェッテングによる削孔を行うことが望ましい。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":47,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74765"},{"cat":"法規","year":"R5 No.50","q":"労働者に支払う賃金に関する次の記述のうち、労働基準法令上、誤っているものはどれか。","opts":["使用者は、労働契約の不履行について違約金を定め、又は損害賠償額を明示して契約しなければならない。","使用者は、労働者が出産、疾病、災害など非常の場合の費用に充てるために請求する場合においては、支払期日前であっても、既往の労働に対する賃金を支払わなければならない。","使用者は、出来高払制その他の請負制で使用する労働者については、労働時間に応じ一定額の賃金の保障をしなければならない。","使用者は、労働契約の締結に際し、労働者に対して賃金の決定、計算及び支払の方法、賃金の締切り及び支払の時期並びに昇給に関する事項を明示しなければならない。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":48,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74766"},{"cat":"法規","year":"R5 No.51","q":"災害補償に関する次の記述のうち、労働基準法令上、誤っているものはどれか。","opts":["労働者が業務上負傷し、又は疾病にかかった場合の療養のため、労働することができないために賃金を受けない場合においては、使用者は、休業補償を行わなければならない。","労働者が業務上負傷し、又は疾病にかかり補償を受ける場合、療養開始後3年を経過しても負傷又は疾病がなおらない場合においては、使用者は、打切補償を行い、その後はこの法律の規定による補償を行わなくてもよい。","労働者が業務上負傷し、又は疾病にかかった場合においては、使用者は、その費用で必要な療養を行い、又は必要な療養費用の100分の50を負担しなければならない。","労働者が重大な過失によって業務上負傷し、又は疾病にかかり、かつ使用者がその過失について行政官庁の認定を受けた場合においては、休業補償又は障害補償を行わなくてもよい。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":49,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74767"},{"cat":"法規","year":"R5 No.52","q":"次の作業のうち、労働安全衛生法令上、作業主任者の選任を必要とする作業はどれか。","opts":["掘削面の高さが2mの地山の掘削（ずい道及びたて坑以外の坑の掘削を除く）の作業","掘削面の高さが5mの土止め支保工の切りばり又は腹起こしの取付け又は取り外しの作業","高さが4mの構造の足場の組立て、解体の作業","高さが3mのコンクリート橋梁上部構造の架設の作業"],"ans":1,"ex":"","src":"20230703_1kyu","qid":50,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74768"},{"cat":"法規","year":"R5 No.53","q":"高さが5m以上のコンクリート造の工作物の解体作業における危険を防止するために、事業者又はコンクリート造の工作物の解体等作業主任者が行うべき事項に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。","opts":["事業者は、外壁、柱等の引倒し等の作業を行うときは、引倒し等について一定の合図を定め、関係労働者に周知させなければならない。","コンクリート造の工作物の解体等作業主任者は、作業の方法及び労働者の配置を決定し、作業を直接指揮しなければならない。","コンクリート造の工作物の解体等作業主任者は、作業を行う区域内には関係労働者以外の労働者の立入りを禁止しなければならない。","事業者は、強風、大雨、大雪等の悪天候のため、作業の実施について危険が予想されるときは、当該作業を中止しなければならない。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":51,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74769"},{"cat":"法規","year":"R5 No.54","q":"元請負人の義務に関する次の記述のうち、建設業法令上、誤っているものはどれか。","opts":["元請負人は、その請け負った建設工事を施工するために必要な工程の細目、作業方法その他元請負人において定めるべき事項を定めようとするときは、あらかじめ、下請負人の意見をきかなければならない。","元請負人は、請負代金の出来形部分に対する支払を受けたときは、施工した下請負人に対して、下請代金の一部を、当該支払を受けた日から40日以内で、かつ、できる限り短い期間内に支払わなければならない。","元請負人は、前払金の支払を受けたときは、下請負人に対して、資材の購入、労働者の募集その他建設工事の着手に必要な費用を前払金として支払うよう適切な配慮をしなければならない。","元請負人は、下請負人からその請け負った建設工事が完成した旨の通知を受けたときは、当該通知を受けた日から20日以内で、かつ、できる限り短い期間内に、その完成を確認するための検査を完了しなければならない。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":52,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74770"},{"cat":"法規","year":"R5 No.55","q":"火薬の取扱いに関する次の記述のうち、火薬類取締法令上、正しいものはどれか。","opts":["火薬類取扱所には、帳簿を備え、責任者を定めて、火薬類の受払い及び消費残数量をその都度明確に記録させること。","消費場所において火薬類を取り扱う場合の火薬類を収納する容器は、木その他電気不良導体で作った丈夫な構造のものとし、内面は鉄類で表したものとすること。","火薬類取扱所には地下構造の建物を設け、その構造は、火薬類を存置するときに見張人を常時配置する場合を除き、盗難及び火災を防ぎ得る構造とすること。","火薬類取扱所の周囲には、保安距離を確保し、かつ、立入禁止、火気厳禁等と書いた警戒札を掲示すること。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":53,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74771"},{"cat":"法規","year":"R5 No.56","q":"道路上で行う工事、又は行為についての許可、又は承認に関する次の記述のうち、道路法令上、誤っているものはどれか。","opts":["道路管理者以外の者が、沿道で行う工事のために交通に支障を及ぼすおそれのない道路の区域内に、工事材料の置き場を設ける場合は、道路管理者の許可を受ける必要がない。","道路管理者以外の者が、民地への車両乗入れのために歩道切下げ工事を行う場合は、道路管理者の承認を受ける必要がある。","道路占用者が、電線、上下水道、ガス等を道路に設け、継続して道路を使用する場合は、道路管理者の許可を受ける必要がある。","道路占用者が、道路の構造又は交通に支障を及ぼすおそれがないと認められる重量の増加を伴わない占用物件の構造を変更する場合は、あらためて道路管理者の許可を受ける必要がない。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":54,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74772"},{"cat":"法規","year":"R5 No.57","q":"河川管理者以外の者が河川区域（高規格堤防特別区域を除く）で工事を行う場合の許可に関する次の記述のうち、河川法令上、誤っているものはどれか。","opts":["河川区域内の土地の地下を横断して工業用水のサイホンを設置する場合は、河川管理者の許可を受ける必要がある。","河川区域内の野球場に設置されている老朽化したバックネットを撤去する場合は、河川管理者の許可を受ける必要がない。","河川区域内に設置されている取水施設の機能維持のために取水口付近に積もった土砂を撤去する場合は、河川管理者の許可を受ける必要がない。","河川区域内で一時的に仮設の資材置場を設置する場合は、河川管理者の許可を受ける必要がある。"],"ans":1,"ex":"","src":"20230703_1kyu","qid":55,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74773"},{"cat":"法規","year":"R5 No.58","q":"工事現場に設置する仮設の現場事務所に関する次の記述のうち、建築基準法令上、正しいものはどれか。","opts":["現場事務所を建築する場合は、当該工事に着手する前に、その計画が建築基準関係規定に適合するものであることについて、建築主事の確認を受けなければならない。","現場事務所を湿潤な土地、出水のおそれの多い土地に建築する場合においては、盛土、地盤の改良その他衛生上又は安全上必要な措置を講じなければならない。","現場事務所ががけ崩れ等による被害を受けるおそれのある場合においては、擁壁の設置その他安全上適当な措置を講じなければならない。","現場事務所は、自重、積載荷重、積雪荷重、風圧、土圧及び水圧並びに地震その他の震動及び衝撃に対して安全な構造でなければならない。"],"ans":3,"ex":"","src":"20230703_1kyu","qid":56,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74774"},{"cat":"法規","year":"R5 No.59","q":"騒音規制法令上、特定建設作業における環境省令で定める基準に関する次の記述のうち、誤っているものはどれか。","opts":["特定建設作業に伴って発生する騒音が、特定建設作業の場所の敷地の境界線において、75dBを超える大きさのものでないこと。","都道府県知事が指定した第1号区域では、原則として午後7時から翌日の午前7時まで行われる特定建設作業に伴って騒音が発生するものでないこと。","特定建設作業の全部又は一部に係る作業の期間が当該特定建設作業の場合においては、原則として連続して6日間を超えて行われる特定建設作業に伴って騒音が発生するものでないこと。","都道府県知事が指定した第1号区域では、原則として1日10時間を超えて行われる特定建設作業に伴って騒音が発生するものでないこと。"],"ans":0,"ex":"","src":"20230703_1kyu","qid":57,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74775"},{"cat":"法規","year":"R5 No.60","q":"振動規制法令上、指定地域内で行う次の建設作業のうち、特定建設作業に該当しないものはどれか。ただし、当該作業がその作業を開始した日に終わるものを除く。","opts":["ジャイアントブレーカを使用したコンクリート構造物の取り壊し作業","1日の移動距離が50m未満の舗装版破砕機による道路舗装面の破砕作業","1日の移動距離が50m未満の振動ローラによる路体の締固め作業","ディーゼルハンマによる既製コンクリート杭の打込み作業"],"ans":2,"ex":"","src":"20230703_1kyu","qid":58,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74776"},{"cat":"法規","year":"R5 No.61","q":"港長の許可又は届け出に関する次の記述のうち、港則法令上、正しいものはどれか。","opts":["特定港内又は特定港の境界附近で工事又は作業をしようとする者は、港長に届け出なければならない。","船舶は、特定港に入港したとき又は特定港を出港しようとするときは、国土交通省令の定めるところにより、港長の許可を受けなければならない。","特定港内において竹木材を船舶から水上に卸そうとする者は、港長の許可を受けなければならない。","船舶は、特定港内又は特定港の境界附近において危険物を運搬しようとするときは、港長に届け出なければならない。"],"ans":2,"ex":"","src":"20230703_1kyu","qid":59,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74777"},{"cat":"施工管理法","year":"R5 問BNo.1","q":"TS（トータルステーション）を用いて行う測量に関する次の記述のうち、適当でないものはどれか。","opts":["TSでの鉛直角観測は、2視準2読定、望遠鏡正及び反の観測を3対回とする。","TSでの水平角観測において、対回内の観測方向数は、5方向以下とする。","TSでの距離測定は、2視準3読定を2セットとする。","TSでの水平角観測、鉛直角観測及び距離測定は、2視準で同時に行うことを原則とする。"],"ans":0,"ex":"","src":"20230703_1kyuB","qid":60,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74778"},{"cat":"施工管理法","year":"R5 問BNo.2","q":"公共工事標準請負契約約款に関する次の記述のうち、適当でないものはどれか。","opts":["工期を変更する場合は、発注者と受注者が協議して定めるが、所定の期日までに協議が整わないときは、発注者が定めて受注者に通知する。","発注者は、必要があると認めるときは、設計図書の変更内容を受注者に通知して、設計図書を変更することができる。","受注者は、現場代理人を工事現場に常駐させなければならないが、工事現場における運営等に支障がなく、かつ、発注者との連絡体制が確保されれば受注者の判断で、工事現場への常駐を必要としないことができる。","受注者は、工事目的物の引渡し前に、天災等で発注者と受注者のいずれの責めにも帰すことができないものにより、工事目的物等に損害が生じたときは、発注者が確認し、受注者に通知したときには損害による費用の負担を発注者に請求することができる。"],"ans":2,"ex":"","src":"20230703_1kyuB","qid":61,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74779"},{"cat":"施工管理法","year":"R5 問BNo.4","q":"道路工事における締固め機械に関する次の記述のうち、適当でないものはどれか。","opts":["振動ローラは、自重による重力に加え、転圧輪を強制振動させて締め固める機械であり比較的小型でも高い締固め効果を得ることができる。","タイヤローラは、タイヤの空気圧を変えて輪荷重を調整し、バラストを付加して接地圧を増加させ締固め効果を大きくすることができ、路床、路盤の施工に使用される。","ロードローラは、鉄輪を用いた締固め機械でマカダム型とタンデム型があり、アスファルト混合物や路盤の締固め及び路床の仕上げ転圧等に使用される。","タンピングローラは、突起の先端に荷重を集中させることができ、土塊や岩塊等の破砕や締固めに効果があり、厚層の土の転圧に適している。"],"ans":1,"ex":"","src":"20230703_1kyuB","qid":62,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74781"},{"cat":"施工管理法","year":"R5 問BNo.5","q":"施工計画立案のための事前調査に関する次の記述のうち、適当でないものはどれか。","opts":["市街地の工事や既設施設物に近接した工事の事前調査では、既設施設物の変状防止対策や使用空間の確保等を施工計画に反映することが必要である。","下請負業者の選定にあたっての調査では、技術力、過去の実績、労働力の供給、信用度、専門性等と安全管理能力を持っているか等について調査することが重要である。","資機材の輸送調査では、事前に輸送ルートの道路状況や交通規制等を把握し、不明な点がある場合には、陸運事務所や所轄警察署に相談して解決しておくことが重要である。","現場条件の調査では、調査項目の落ちがないように選定し、複数の人で調査したり、調査回数を重ねる等により、精度を高めることが必要である。"],"ans":2,"ex":"","src":"20230703_1kyuB","qid":63,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74782"},{"cat":"施工管理法","year":"R5 問BNo.7","q":"特定元方事業者が講ずべき措置等に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。","opts":["特定元方事業者は、すべての関係請負人が参加する協議組織を設置し、会議の運営を行わなければならない。","特定元方事業者は、関係請負人が行う労働者の安全又は衛生のための教育に対する指導及び援助を行わなければならない。","特定元方事業者は、工程、機械、設備の配置等に関する計画を作成しなければならない。","特定元方事業者は、当該作業場所の巡視を作業前日に行わなければならない。"],"ans":3,"ex":"","src":"20230703_1kyuB","qid":64,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74784"},{"cat":"施工管理法","year":"R5 問BNo.8","q":"安全管理体制における、安全衛生管理組織に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。","opts":["元方事業者は、関係請負人の労働者を含め、常時50人以上となる事業場（ずい道、圧気工法、一定の橋梁工事は除く）では、統括安全衛生責任者を選任する。","元方事業者は、関係請負人の労働者を含め、常時50人以上となる事業場では、安全管理者を選任する。","元方事業者は、関係請負人の労働者を含め、常時50人以上となる事業場では、衛生管理者を選任する。","元方事業者は、関係請負人の労働者を含め、常時50人以上100人未満となる事業場では、安全衛生推進者を選任する。"],"ans":3,"ex":"","src":"20230703_1kyuB","qid":65,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74785"},{"cat":"施工管理法","year":"R5 問BNo.9","q":"建設工事現場における異常気象時の安全対策に関する次の記述のうち、適当でないものはどれか。","opts":["降雨によって冠水流出の恐れがある仮設物は、早めに撤去するか、水裏から仮設物内に水を呼び込み内外水位差による倒壊を防ぐか、補強する等の措置を講じること。","警報及び注意報が解除された場合は、工事現場の地盤のゆるみ、崩壊、陥没等の危険がないか、点検と併行しながら作業を再開すること。","強風によってクレーン、杭打ち機等のような風圧を大きく受ける作業用大型機械の休止場所での転倒、逸走防止には十分注意すること。","異常気象等の情報の収集にあたっては、事務所、現場詰所及び作業場所間の連絡伝達のため、複数の手段を確保し瞬時に連絡できるようにすること。"],"ans":1,"ex":"","src":"20230703_1kyuB","qid":66,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74786"},{"cat":"施工管理法","year":"R5 問BNo.10","q":"足場、作業床の組立て等に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。","opts":["高さ3m以上の足場（一側足場及びつり足場を除く）で作業を行う場合は、幅40cm以上の作業床を設けなければならない。","高さ3m以上の足場（一側足場及びわく組足場を除く）の作業床であって墜落の危険のある箇所には、高さ85cm以上の手すり又はこれと同等以上の機能を有する設備を設けなければならない。","高さ3m以上の足場（一側足場及びわく組足場を除く）の作業床であって墜落の危険のある箇所には、高さ35cm以上50cm以下の桟又はこれと同等以上の機能を有する設備を設けなければならない。","高さ3m以上の足場（一側足場を除く）の作業床には、物体の落下防止のため、高さ5cm以上の幅木、メッシュシート若しくは、防網等を設けなければならない。"],"ans":3,"ex":"","src":"20230703_1kyuB","qid":67,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74787"},{"cat":"施工管理法","year":"R5 問BNo.11","q":"土工工事における明り掘削の作業にあたり事業者が遵守しなければならない事項に関する次の記述のうち、労働安全衛生法令上、誤っているものはどれか。","opts":["地山の崩壊等による労働者の危険を防止するため、点検者を指名して、その日の作業を開始する前、大雨の後及び中震（震度4）以上の地震の後、浮石及びき裂の有無及び状態並びに含水、湧水及び凍結の状態の変化を点検させなければならない。","地山の崩壊又は土石の落下により労働者に危険を及ぼすおそれのあるときは、予め土止め支保工を設け、防護網を張り、労働者の立入りを禁止する等の措置を講じなければならない。","土止め支保工の部材の取付け等については、切りばり及び腹おこしは、脱落を防止するため、矢板、くい等に確実に取り付けるとともに、圧縮材（火打ちを除く）の継手は、重ね継手とする。","運搬機械等が、労働者の作業箇所に後進して接近するとき、又は転落するおそれのあるときは、誘導者を配置し、その者にこれらの機械を誘導させなければならない。"],"ans":2,"ex":"","src":"20230703_1kyuB","qid":68,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74788"},{"cat":"施工管理法","year":"R5 問BNo.12","q":"建設工事における墜落災害の防止に関する次の記述のうち、事業者が講じなければならない措置として、労働安全衛生法令上、正しいものはどれか。","opts":["高さ1.5m以上の作業床の端、開口部等で墜落により労働者に危険を及ぼすおそれのある箇所には、囲い、手すり、覆い等を設けなければならない。","高さ1m以上の箇所で囲い等の設置が困難又は作業上、囲いを取りはずすときは、防網を張り、労働者に要求性能墜落制止用器具を使用させなければならない。","高さ5m以上の箇所での作業で、労働者に要求性能墜落制止用器具等を使用させるときは要求性能墜落制止用器具等の取付設備等を設け、異常の有無を随時点検しなければならない。","高さ3m以上の箇所で作業を行なうときは、当該作業を安全に行なうため必要な照度を保持しなければならない。"],"ans":3,"ex":"","src":"20230703_1kyuB","qid":69,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74789"},{"cat":"施工管理法","year":"R5 問BNo.13","q":"コンクリート構造物の解体作業に関する次の記述のうち、適当でないものはどれか。","opts":["圧砕機及び大型ブレーカによる取壊しでは、解体する構造物からコンクリート片の飛散、構造物の倒壊範囲を予測し、作業員、建設機械を安全作業位置に配置しなければならない。","転倒方式による取壊しでは、解体する主構造部に複数本の引きワイヤを堅固に取付け、引きワイヤで加力する際は、繰返して荷重をかけるようにして行う。","カッタによる取壊しでは、撤去側躯体ブロックへのカッタ取り付けを禁止するとともに、切断面付近にシートを設置して冷却水の飛散防止を図る。","ウォータージェットによる取壊しでは、病院、民家等が隣接している場合にはノズル付近に防音カバーをしたり、周辺に防音シートによる防音対策を実施する。"],"ans":1,"ex":"","src":"20230703_1kyuB","qid":70,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74790"},{"cat":"施工管理法","year":"R5 問BNo.14","q":"道路のアスファルト舗装の品質管理に関する次の記述のうち、適当でないものはどれか。","opts":["管理結果を工程能力図にプロットし、その結果が管理の限界をはずれた場合、あるいは一方に片寄っている等の結果が生じた場合、直ちに試験頻度を増して異常の有無を確かめる。","管理の合理化を図るためには、密度や含水比等を非破壊で測定する機器を用いたり、作業と同時に管理できる敷均し機械や締固め機械等を活用することが望ましい。","各工程の初期においては、品質管理の各項目に関する試験の頻度を適切に増し、その時点の作業員や施工機械等の組合せにおける作業工程を速やかに把握しておく。","下層路盤の締固め度の管理は、試験施工あるいは工程の初期におけるデータから、所定の締固め度を得るのに必要な転圧回数が求められた場合でも、密度試験を必ず実施する。"],"ans":3,"ex":"","src":"20230703_1kyuB","qid":71,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74791"},{"cat":"施工管理法","year":"R5 問BNo.15","q":"路床や路盤の品質管理に用いられる試験方法に関する次の記述のうち、適当でないものはどれか。","opts":["修正CBR試験は、所要の締固め度における路盤材料の支持力値を知り、材料選定の指標として利用することを目的として実施する。","RIによる密度の測定は、現場における締め固められた路床・路盤材料の密度及び含水比を求めることを目的として実施する。","平板載荷試験は、地盤支持力係数K値を求め、路床や路盤の支持力を把握することを目的として実施する。","プルーフローリング試験は、路床、路盤の表面の浮き上がりや緩みを十分に締め固め、かつ不良箇所を発見することを目的として実施する。"],"ans":0,"ex":"","src":"20230703_1kyuB","qid":72,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74792"},{"cat":"施工管理法","year":"R5 問BNo.16","q":"レディーミクストコンクリートの受入れ検査に関する次の記述のうち、適当でないものはどれか。","opts":["荷卸し時のフレッシュコンクリートのワーカビリティーの良否を、技術者による目視により判定した。","コンクリートのコンシステンシーを評価するため、スランプ試験を行った。","フレッシュコンクリートの単位水量を推定する試験方法として、エアメータ法を用いた。","アルカリシリカ反応対策を確認するため、荷卸し時の試料を採取してモルタルバー法を行った。"],"ans":3,"ex":"","src":"20230703_1kyuB","qid":73,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74793"},{"cat":"施工管理法","year":"R5 問BNo.17","q":"建設工事に伴い発生する濁水の処理に関する次の記述のうち、適当なものはどれか。","opts":["発生した濁水は、沈殿池等で浄化処理して放流するが、その際、濁水量が多いほど処理が困難となるため、処理が不要な清水は、できるだけ濁水と分離する。","建設工事からの排出水が一時的なものであっても、明らかに河川、湖沼、海域等の公共水域を汚濁する場合、水質汚濁防止法に基づく放流基準に従って濁水を処理しなければならない。","濁水は、切土面や盛土面の表流水として発生することが多いことから、他の条件が許す限りできるだけ切土面や盛土面の面積が大きくなるよう計画する。","水質汚濁処理技術のうち、凝集処理には、天日乾燥、遠心力を利用する遠心脱水機、加圧力を利用するフィルタープレスやベルトプレス脱水装置等による方法がある。"],"ans":0,"ex":"","src":"20230703_1kyuB","qid":74,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74794"},{"cat":"施工管理法","year":"R5 問BNo.18","q":"建設工事における近接施工での周辺環境対策に関する次の記述のうち、適当でないものはどれか。","opts":["リバース工法では、比重の高い泥水等を用いて孔壁の安定を図るが、掘削速度を遅くすると保護膜（マッドケーキ）が不完全となり孔壁崩壊の原因となる。","既製杭工法には、打撃工法や振動工法があるが、これらの工法は、周辺環境への影響が大きいため、都市部では減少傾向にある。","盛土工事による近接施工では、法先付近の地盤に深層撹拌混合処理工法等で改良体を造成することにより、盛土の安定対策や周辺地盤への側方変位を抑制する。","シールド工事における掘進時の振動は、特にシールドトンネルの土被りが少なく、シールドトンネル直上又はその付近に民家等があり、砂礫層等を掘進する場合は注意が必要である。"],"ans":0,"ex":"","src":"20230703_1kyuB","qid":75,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74795"},{"cat":"施工管理法","year":"R5 問BNo.19","q":"建設工事で発生する建設副産物の有効利用及び廃棄物の適正処理に関する次の記述のうち、適当なものはどれか。","opts":["元請業者は、建設工事の施工にあたり、適切な工法の選択等により、建設発生土の抑制に努め、建設発生土は全て現場外に搬出するよう努めなければならない。","元請業者は、当該工事に係る特定建設資材廃棄物の再資源化等に着手する前に、その旨を当該工事の発注者に書面で報告しなければならない。","排出事業者は、建設廃棄物の処理を他人に委託する場合は、収集運搬業者及び中間処理業者又は最終処分業者とそれぞれ事前に委託契約を書面にて行う。","伐採木、伐根材、梱包材等は、建設資材ではないが、「建設工事に係る資材の再資源化等に関する法律」による分別解体等・再資源化等の義務づけの対象となる。"],"ans":2,"ex":"","src":"20230703_1kyuB","qid":76,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74796"},{"cat":"施工管理法","year":"R5 問BNo.20","q":"「廃棄物の処理及び清掃に関する法律」に関する次の記述のうち、誤っているものはどれか。","opts":["産業廃棄物収集運搬業者は、産業廃棄物が飛散し、及び流出し、並びに悪臭が漏れるおそれのない運搬車、運搬船、運搬容器その他の運搬施設を有していなければならない。","排出事業者は、産業廃棄物の運搬又は処分を業とする者に委託した場合、産業廃棄物の処分の終了確認後、産業廃棄物管理票（マニフェスト）を交付しなければならない。","国、地方公共団体、事業者その他の関係者は、非常災害時における廃棄物の適正な処理が円滑かつ迅速に行われるよう適切に役割分担、連携、協力するよう努めなければならない。","排出事業者が当該産業廃棄物を生ずる事業場の外において自ら保管するときは、原則として、あらかじめ都道府県知事に届け出なければならない。"],"ans":1,"ex":"","src":"20230703_1kyuB","qid":77,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74797"},{"cat":"施工管理法応用","year":"R5 問BNo.21","q":"調達計画立案に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。\n・資材計画では、特別注文品等、（イ）納期を要する資材の調達は、施工に支障をきたすことのないよう品質や納期に注意する。\n・下請発注計画では、すべての職種の作業員を常時確保することは極めてむずかしいので、作業員を常時確保するリスクを避けてこれを下請業者に（ロ）するように計画することが多い。\n・資材計画では、用途、仕様、必要数量、納期等を明確に把握し、資材使用予定に合わせて、無駄な費用の発生を（ハ）にする。\n・機械計画では、機械が効率よく稼働できるよう（ニ）所用台数を計画することが最も望ましい。","opts":["（イ）長い（ロ）分散（ハ）最小限（ニ）平均化して","（イ）短い（ロ）集中（ハ）最大限（ニ）短期間のピークに合わせて","（イ）短い（ロ）集中（ハ）最大限（ニ）平均化して","（イ）長い（ロ）分散（ハ）最小限（ニ）短期間のピークに合わせて"],"ans":0,"ex":"","src":"20230703_1kyuB","qid":78,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74798"},{"cat":"施工管理法応用","year":"R5 問BNo.22","q":"工事の安全確保及び環境保全の施工計画立案時における留意事項に関する下記の①〜④の4つの記述のうち、適当なものの数は次のうちどれか。\n① 施工機械の選定にあたっては、沿道環境等に与える影響を考慮し、低騒音型、低振動型及び排出ガスの低減に配慮したものを採用し、沿道環境に最も影響の少ない稼働時間帯を選択する等の検討を行う。\n② 工事の着手にあたっては、工事に先がけ現場に広報板を設置し必要に応じて地元の自治会等に挨拶や説明を行うとともに、戸別訪問による工事案内やチラシ配布を行う。\n③ 公道上で掘削を行う工事の場合は、電気、ガス及び水道等の地下埋設物の保護が重要であり、施工計画段階で調査を行い、埋設物の位置、深さ等を確認する際は労働基準監督署の立ち合いを求める。\n④ 施工現場への資機材の搬入及び搬出等は、交通への影響をできるだけ減らすように、施工計画の段階で資機材の搬入経路や交通規制方法等を十分に検討し最適な計画を立てる。","opts":["2つ","3つ","1つ","4つ"],"ans":2,"ex":"","src":"20230703_1kyuB","qid":79,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74799"},{"cat":"施工管理法応用","year":"R5 問BNo.23","q":"施工管理体制に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。\n・元請負者は、すべての関係請負人の（イ）を明確にして、これらのすべてを管理・監督しつつ工事の適正な施工の確保を図ることが必要である。\n・元請負者は、下請負人の名称、当該下請負人に係る（ロ）を記載した施工体制台帳を現場ごとに備え付け、発注者から請求があれば、閲覧に供しなければならない。\n・元請負者は、下請負人に対して、その下請けした工事を他の建設業者に下請けさせた場合は、（ハ）の提出を書面で義務づけ、その書面を工事現場の見やすい場所に掲示しなければならない。\n・元請負者は、各下請負人の施工分担関係を表示した（ニ）を作成し、工事関係者全員に施工分担関係がわかるように工事現場の見やすい場所に掲示しなければならない。","opts":["（イ）保証人（ロ）使用資機材及び金額等（ハ）再下請通知書（ニ）工程管理図","（イ）役割分担（ロ）工事の内容及び工期等（ハ）再下請通知書（ニ）施工体系図","（イ）保証人（ロ）工事の内容及び工期等（ハ）下請契約書（ニ）工程管理図","（イ）役割分担（ロ）使用資機材及び金額等（ハ）下請契約書（ニ）施工体系図"],"ans":1,"ex":"","src":"20230703_1kyuB","qid":80,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74800"},{"cat":"施工管理法応用","year":"R5 問BNo.24","q":"工事原価管理に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。\n① 原価管理とは、工事の適正な利潤の確保を目的として、工事遂行過程で投入・消費される資材・労務・機械や施工管理等に費やされるすべての費用を対象とする管理統制機能である。\n② コストコントロールとは、施工計画に基づきあらかじめ設定された予定原価に対し品質よりも安価となることを採用し原価をコントロールすることにより、工事原価の低減を図るものである。\n③ コストコントロールの結果、得られた実施原価をフィードバックし以降の工事に反映させ、工事の経済性向上を図る総合的な原価管理をコストマネジメントという。\n④ 原価管理は、品質・工程・安全・環境の各管理項目と並んで施工管理を行う上で不可欠な管理要素で、個々の項目の判断基準として費用対効果が常に考慮されるため重要である。","opts":["①②","③④","①③④","②③④"],"ans":2,"ex":"","src":"20230703_1kyuB","qid":81,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74801"},{"cat":"施工管理法応用","year":"R5 問BNo.25","q":"工程管理に関する下記の①〜④の4つの記述のうち、適当なものの数は次のうちどれか。\n① 工程の設定においては、施工のやり方、施工の順序によって工期、工費が大きく変動する恐れがあり、施工手順・組合せ機械の検討を経て、最も適正な施工方法を選定する。\n② 工程計画は初期段階で設定した施工方法に基づき、工事数量の正確な把握と作業可能日数及び作業能率を的確に推定し、各部分工事の経済的な所要時間を見積もることから始める。\n③ 作業可能日数は、暦日による日数から休日と作業不可能日数を差し引いて求められ、作業不可能日数は、現場の地形、地質、気象等の自然条件や工事の技術的特性から推定する。\n④ 各部分作業の時間見積りができたら、タイムスケール上に割付け、全体の工期を超過した場合には投入する人数・機械台数の変更や工法の修正等の試行錯誤を繰り返し工期に収める。","opts":["2つ","3つ","1つ","4つ"],"ans":3,"ex":"","src":"20230703_1kyuB","qid":82,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74802"},{"cat":"施工管理法応用","year":"R5 問BNo.26","q":"工程管理に用いられる各工程表の特徴に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。\n・座標式工程表は、一方の軸に工事期間を、他の軸に工事量等を座標で表現するもので、（イ）工事では工事内容を確実に示すことができる。\n・グラフ式工程表は、横軸に工期を、縦軸に各作業の（ロ）を表示し、予定と実績の差を直視的に比較でき、施工中の作業の進捗状況もよくわかる。\n・バーチャートは、横軸に時間をとり各工種が時間経過に従って表現され、作業間の関連がわかり、工期に影響する作業がどれであるか（ハ）。\n・ネットワーク式工程表は、2つの作業の遅れや変化が工事全体の工期にどのように影響してくるか（ニ）。","opts":["（イ）路線に沿った（ロ）出来高比率（ハ）は掴みにくい（ニ）正確に捉えることができる","（イ）平面的に広がりのある（ロ）工事費構成率（ハ）も掴みやすい（ニ）把握することは難しい","（イ）平面的に広がりのある（ロ）出来高比率（ハ）は掴みにくい（ニ）正確に捉えることができる","（イ）路線に沿った（ロ）工事費構成率（ハ）も掴みやすい（ニ）把握することは難しい"],"ans":0,"ex":"","src":"20230703_1kyuB","qid":83,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74803"},{"cat":"施工管理法応用","year":"R5 問BNo.27","q":"工程管理曲線（バナナ曲線）を用いた工程管理に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。\n① 工程計画は、全工期に対して出来高を表すバナナ曲線の勾配が、工事の初期→中期→後期において、急→緩→急となるようにする。\n② 実施工程曲線が限度内に進行を維持しながらも、バナナ曲線の下方限界に接近している場合は、直ちに対策をとる必要がある。\n③ 実施工程曲線がバナナ曲線の上方限界を超えたときは、工程遅延により突貫工事が不可避となるので、施工計画を再検討する。\n④ 予定工程曲線がバナナ曲線の許容限界からはずれるときには、一般的に不合理な工程計画と考えられるので、再検討を要する。","opts":["①③","①④","②③","②④"],"ans":3,"ex":"","src":"20230703_1kyuB","qid":84,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74804"},{"cat":"施工管理法応用","year":"R5 問BNo.28","q":"車両系建設機械の災害防止のために事業者が講じるべき措置に関する下記の①〜④の4つの記述のうち、労働安全衛生法令上、正しいものの数は次のうちどれか。\n① 車両系建設機械を用いて作業を行うときは、あらかじめ、使用する車両系建設機械の種類及び能力、運行経路、作業の方法を示した作業計画を定め、作業を行わなければならない。\n② 路肩、傾斜地等で車両系建設機械を用いて作業を行う場合で、当該車両系建設機械が転倒又は転落する危険性があるときは、誘導者を配置して誘導させなければならない。\n③ 車両系建設機械を用いて作業を行うときは、運転中の車両系建設機械に接触することにより労働者に危険が生ずるおそれのある箇所に、労働者を立ち入らせてはならない。\n④ 車両系建設機械の運転者が離席する時は、原動機を止め、又は、走行ブレーキをかける等の逸走を防止する措置を講じなければならない。","opts":["2つ","3つ","1つ","4つ"],"ans":2,"ex":"","src":"20230703_1kyuB","qid":85,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74805"},{"cat":"施工管理法応用","year":"R5 問BNo.29","q":"移動式クレーンの災害防止のために事業者が講じるべき措置に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、労働安全衛生規則及びクレーン等安全規則上、正しいものは次のうちどれか。\n・移動式クレーンの運転者及び玉掛けをする者が当該移動式クレーンの（イ）を常時知ることができるよう、表示その他の措置を講じなければならない。\n・移動式クレーンの運転について一定の合図を定め、合図を行う者を（ロ）して、その者に合図を行わせなければならない。\n・移動式クレーンを使用する作業において、クレーン上部旋回体と接触するおそれのある箇所や（ハ）の下に労働者を立ち入らせてはならない。\n・強風のため、移動式クレーンの作業の実施について危険が予想されるときは、当該作業を（ニ）。","opts":["（イ）定格荷重（ロ）複数名確保（ハ）クレーンのブーム（ニ）注意して実施","（イ）最大つり荷重（ロ）指名（ハ）クレーンのブーム（ニ）中止","（イ）最大つり荷重（ロ）複数名確保（ハ）つり上げられている荷（ニ）注意して実施","（イ）定格荷重（ロ）指名（ハ）つり上げられている荷（ニ）中止"],"ans":3,"ex":"","src":"20230703_1kyuB","qid":86,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74806"},{"cat":"施工管理法応用","year":"R5 問BNo.30","q":"工事中の埋設物の損傷等の防止のために行うべき措置に関する下記の①〜④の4つの記述のうち、建設工事公衆災害防止対策要綱上、適当なもののみを全てあげている組合せは次のうちどれか。\n① 発注者又は施工者は、施工に先立ち、埋設物の管理者等が保管する台帳と設計図面を照らし合わせて位置を確認した上で、細心の注意のもとで試掘等を行い、その埋設物の種類、位置、規格、構造等を原則として目視により確認しなければならない。\n② 発注者又は施工者は、試掘等によって埋設物を確認した場合においては、その位置や周辺地質の状況等の情報を道路管理者及び埋設物の管理者に報告しなければならない。\n③ 発注者又は施工者は、埋設物に近接して工事を施工する場合には、あらかじめその埋設物の管理者及び関係機関と協議し、埋設物の防護方法、立会の有無、緊急時の連絡先及びその方法等を決定するものとする。\n④ 発注者又は施工者は、埋設物の位置、名称、管理者の連絡先等を記載した標示板を取り付ける等により明確に認識できるようにし、近隣住民に確実に伝達しなければならない。","opts":["①②","①②③","②③④","③④"],"ans":1,"ex":"","src":"20230703_1kyuB","qid":87,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74807"},{"cat":"施工管理法応用","year":"R5 問BNo.31","q":"酸素欠乏のおそれのある工事を行う場合、事業者が行うべき措置に関する下記の①〜④の4つの記述のうち、酸素欠乏症等防止規則上、正しいものの数は次のうちどれか。\n① 酸素欠乏危険場所においては、その作業の前日に、空気中の酸素の濃度を測定し、測定日時や測定方法及び測定結果等の記録を一定の期間保存しなければならない。\n② 酸素欠乏危険作業に労働者を従事させる場合で、爆発、酸化等を防止するため換気することができない場合又は作業の性質上換気することが著しく困難な場合は、同時に就業する労働者の人数と同数以上の空気呼吸器等を備え、労働者に使用させなければならない。\n③ 酸素欠乏危険作業に労働者を従事させるときは、労働者を当該作業を行う場所に入場させ、及び退場させる時に、保護具を点検しなければならない。\n④ 酸素欠乏危険場所又はこれに隣接する場所で作業を行うときは、酸素欠乏危険作業に従事する労働者以外の労働者が当該酸素欠乏危険場所に立ち入ることを禁止し、かつ、その旨を見やすい箇所に表示しなければならない。","opts":["2つ","3つ","1つ","4つ"],"ans":1,"ex":"","src":"20230703_1kyuB","qid":88,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74808"},{"cat":"施工管理法応用","year":"R5 問BNo.32","q":"品質管理に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。\n① 品質は必ずある値付近にばらつくので、設計値を十分満足するような品質を実現するためには、ばらつき度合いを考慮し、余裕を持った品質を目標とする必要がある。\n② 品質管理は、施工計画立案の段階で管理特性を検討し、それを完成検査時にチェックする考え方である。\n③ 品質管理は、品質特性や品質標準を決め、作業標準に従って実施し、できるだけ早期に異常を見つけ品質の安定をはかるために行う。\n④ 品質特性を決める場合には、構造物の品質に及ぼす影響が小さく、測定しやすい特性であること等に留意する。","opts":["①②","①③","②③","②④"],"ans":1,"ex":"","src":"20230703_1kyuB","qid":89,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74809"},{"cat":"施工管理法応用","year":"R5 問BNo.33","q":"情報化施工におけるTS（トータルステーション）、GNSS（全球測位衛星システム）を用いた盛土の締固め管理に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。\n・盛土材料を締め固める際には、モニタに表示される締固め回数分布図において、盛土施工範囲の（イ）について、規定回数だけ締め固めたことを示す色になるまで締め固める。\n・盛土施工に使用する材料は、事前の土質試験で品質を確認し、試験施工でまき出し厚や（ロ）を決定したものと同じ土質の材料であることを確認する。\n・TS・GNSSを用いた盛土の締固め管理は、締固め機械の走行位置を（ハ）に計測し、（ロ）を確認する。\n・TS・GNSSを用いた盛土の締固め管理システムの適用にあたっては、（ニ）や電波障害の有無等を事前に調査して、システムの適用の可否を確認する。","opts":["（イ）代表ブロック（ロ）締固め度（ハ）施工完了後（ニ）地形条件","（イ）全面（ロ）締固め度（ハ）リアルタイム（ニ）地質条件","（イ）全面（ロ）締固め回数（ハ）リアルタイム（ニ）地形条件","（イ）代表ブロック（ロ）締固め回数（ハ）施工完了後（ニ）地質条件"],"ans":2,"ex":"","src":"20230703_1kyuB","qid":90,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74810"},{"cat":"施工管理法応用","year":"R5 問BNo.34","q":"鉄筋の組立ての検査に関する下記の①〜④の4つの記述のうち、適当なものの数は次のうちどれか。\n① 鉄筋の平均間隔を求める際には、配置された10本程度の鉄筋間隔の平均値とする。\n② 型枠に接するスペーサは、原則として、コンクリート製あるいはモルタル製とする。\n③ 鉄筋のかぶりは、鉄筋の中心から構造物表面までの距離とする。\n④ 設計図書に示されていない組立用鉄筋や金網等も、所定のかぶりを確保する。","opts":["2つ","3つ","1つ","4つ"],"ans":2,"ex":"","src":"20230703_1kyuB","qid":91,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74811"},{"cat":"施工管理法応用","year":"R5 問BNo.35","q":"プレキャストコンクリート構造物の施工におけるプレキャスト部材の接合に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。\n① 部材の接合にあたっては、接合面の密着性を確保するとともに、接合部の断面やダクトを正確に一致させておく必要がある。\n② ダクトの接合部に塗布する接着剤は、十分な量をダクト内に流入させる。\n③ 接着剤の取扱いについては、製品安全シート（SDS）に従った安全対策を講じる。\n④ モルタルやコンクリートを接合材料として用いる場合は、これらを打ち込む前に、接合面のコンクリートを乾燥状態にしておく必要がある。","opts":["①②","①③","②④","③④"],"ans":1,"ex":"","src":"20230703_1kyuB","qid":92,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/74812"},{"cat":"土木一般","year":"R6 No.4","q":"下図の台形の図心Ｇに関する次の記述のうち，適当でないものはどれか。ただし，図形の密度及び厚さは均一なものとする。","opts":["図心Ｇとは，その図形の重心の位置を表すものであり，座標Ｇ（x0，y0）で表すことができる。","図心Ｇを求める場合，単純な形の図形の組合せによる断面一次モーメントは，中心があきらかな断面に分割し，それぞれの断面一次モーメントを求めて足し合せる。","断面一次モーメントは，分割した断面ごとに断面積に座標値をかけ合わせた和と定義されている。","図心は，ｘ軸，ｙ軸に関する断面一次モーメントが，ともにG以外の値となる直交軸の交点である。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":93,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78498"},{"cat":"土木一般","year":"R6 No.6","q":"土質試験における「試験の名称」，「試験結果から求められるもの」及び「試験結果の利用」の組合せとして，次のうち適当なものはどれか。","opts":["土の粒度試験 ― 流動曲線 ― 建設材料としての適性の判定","突固めによる土の締固め試験 ― 締固め曲線 ― 施工時含水比の決定","土の透水試験 ― 透水係数 ― 軟弱層の厚さの推定","土の三軸圧縮試験 ― 強度定数 ― 地盤沈下量の推定"],"ans":1,"ex":"","src":"20240708_1kyu","qid":94,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78500"},{"cat":"土木一般","year":"R6 No.7","q":"現場発生土を道路の盛土材料として使用する場合の留意点に関する次の記述のうち，適当でないものはどれか。","opts":["支持力や施工性が確保できない材料は，現場内で発生する他の材料と混合したり，セメントや石灰による安定処理を行って使用する。","高含水比の材料は，なるべく薄く敷き均した後，十分な放置期間をとり，ばっ気乾燥を行うか，処理材を混合調整し使用する。","盛土の安定や沈下等が問題となる材料は，盛土の下層部になるべく厚く敷き均すか，法肩等に使用する。","透水性の良い砂質土等の材料は，排水材料に使用し，岩塊や礫質土は，排水処理と安定性向上のため，法尻に使用する。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":95,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78501"},{"cat":"土木一般","year":"R6 No.9","q":"建設発生土を工作物の埋戻しに利用する際の留意点に関する次の記述のうち，適当でないものはどれか。","opts":["埋戻しに用いる土は，道路供用開始後に工作物との間に隙間や段差が生じないように圧縮性の大きい材料を用いる。","泥土や取扱いの難しい高含水比の粘性土は，当該土に自硬性をもたせる等の機能を付加することにより埋戻し材として利用できる。","埋戻しに用いる土は，地震時の液状化防止や道路の路盤・路床と同等の支持力を要求される場合もあるので，使用場所に応じた材料を選定する必要がある。","埋戻しに用いる土をセメント及び石灰による安定処理で改良する際には，改良対象の土質により所定の強度が得られないことがあるので，事前の試験で性状を把握する必要がある。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":96,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78503"},{"cat":"土木一般","year":"R6 No.10","q":"軟弱地盤対策工法に関する次の記述のうち，適当でないものはどれか。","opts":["緩速載荷工法は，できるだけ軟弱地盤の処理を行わない代わりに，圧密の進行に合わせ時間をかけてゆっくり盛土することで，地盤の強度増加を進行させて安定を図るものである。","サンドドレーン工法は，透水性の高い砂を用いた砂柱を地盤中に鉛直に造成し，水平方向の排水距離を短くして圧密を促進することで，地盤の強度増加を図るものである。","ディープウェル工法は，地盤中の地下水位を低下させることにより，それまで受けていた浮力に相当する荷重を下層の軟弱層に載荷して，地盤の強度増加を図るものである。","高圧噴射攪拌工法は，原位置の軟弱土と固化材を攪拌翼を用いて強制的に攪拌混合することにより，安定処理土を形成し，すべり抵抗の増加を図るものである。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":97,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78504"},{"cat":"土木一般","year":"R6 No.11","q":"コンクリート用粗骨材に関する次の記述のうち，適当でないものはどれか。","opts":["粗骨材は，5mm網ふるいにかけたときに質量で85％以上留まる骨材である。","粗骨材として用いる砂利は，一般に絶乾密度が2.5g/cm3以上である。","JISに規定されるコンクリート用再生粗骨材Ｈは，通常の骨材とほぼ同様の品質を有しているため，レディーミクストコンクリート用骨材として使用することが可能である。","砕石を用いた場合は，ワーカビリティーの良好なコンクリートを得るために，砂利を用いた場合と比べて単位水量を小さくする必要がある。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":98,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78505"},{"cat":"土木一般","year":"R6 No.12","q":"コンクリート用骨材の試験方法に関する次の記述のうち，適当でないものはどれか。","opts":["骨材の粒形の良否は，粒形判定実積率試験によって判定することができる。","凍結融解の繰返しに対する骨材品質の適否は，ロサンゼルス試験機による粗骨材のすり減り試験によって判定する。","砂に含まれる有機不純物は，細骨材の有機不純物試験方法によって判定する。","骨材のアルカリシリカ反応性は，骨材のアルカリシリカ反応性試験方法（化学法）によって判定することができる。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":99,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78506"},{"cat":"土木一般","year":"R6 No.13","q":"コンクリートの配合に関する次の記述のうち，適当なものはどれか。","opts":["締固め作業高さを考慮してスランプを設定する場合，締固め作業高さが1mと0.5mでは，1mの方のスランプの値を大きく設定する。","高性能AE減水剤を用いたコンクリートは，水セメント比及びスランプが同じで，通常のAE減水剤を用いたコンクリートに比較して，細骨材率を0〜1％小さく設定する。","スランプは，運搬，打込み，締固め等の作業に適する範囲内で，できるだけ大きくなるように設定する。","圧送において管内閉塞を生じることなく円滑な圧送を行うためには，できるだけ単位粉体量を減らす必要がある。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":100,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78507"},{"cat":"土木一般","year":"R6 No.14","q":"寒中コンクリート及び暑中コンクリートの施工に関する次の記述のうち，適当でないものはどれか。","opts":["寒中コンクリートでは，保温養生あるいは給熱養生終了後に急に寒気にさらすと，表面にひび割れが生じる恐れがあるので，適当な方法で保護し表面の急冷を防止する。","暑中コンクリートでは，練混ぜ後できるだけ早い時間に打ち込まなければならないことから，練混ぜ開始から打ち終わるまでの時間は1.5時間以内を原則とする。","暑中コンクリートでは，コールドジョイントの発生防止のため，減水剤，AE減水剤については，遅延形のものを用いると良い。","コンクリートの施工時，日最低気温が4℃以下になることが予想される場合は，寒中コンクリートとしての施工を行わなければならない。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":101,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78508"},{"cat":"土木一般","year":"R6 No.15","q":"コンクリートの養生に関する次の記述のうち，適当でないものはどれか。","opts":["マスコンクリートの養生では，コンクリート部材内外の温度差が大きくならないように，コンクリート温度をできるだけ緩やかに外気温に近づけることが必要である。","高流動コンクリートは，プラスティック収縮ひび割れが発生しやすい傾向があり，表面の乾燥を防ぐ対策を行う。","混合セメントＢ種を用いたコンクリートの養生では，普通ポルトランドセメントを用いたコンクリートより湿潤養生期間が短くなる。","膨張コンクリートは，所要の強度発現及び膨張力を得るために，打込み後，湿潤状態に保つことがきわめて重要である。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":102,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78509"},{"cat":"土木一般","year":"R6 No.16","q":"施工条件が同じ場合に，型枠に作用するフレッシュコンクリートの側圧に関する次の記述のうち，適当でないものはどれか。","opts":["コンクリートの温度が高いほど，側圧は大きく作用する。","コンクリートの単位重量が大きいほど，側圧は大きく作用する。","コンクリートの打上がり速度が速いほど，側圧は大きく作用する。","コンクリートのスランプが大きいほど，側圧は大きく作用する。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":103,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78510"},{"cat":"土木一般","year":"R6 No.17","q":"道路橋下部工における各種基礎形式に関する次の記述のうち，適当でないものはどれか。","opts":["杭基礎のうち摩擦杭基礎は，長期的な鉛直変位について十分な検討を行い，所要の支持力を摩擦力によって得られるように根入れ深さを確保する必要がある。","杭基礎のうち支持杭基礎においては，杭先端の支持層への根入れ深さを設計では少なくとも杭径程度確保することが基本となる。","直接基礎のフーチング底面は，支持地盤に密着させることにより，滑動抵抗を十分に期待できるように地盤に応じた処理が必要である。","直接基礎においては，基礎が滑動する際のせん断面が基礎の床付け面の深い箇所に生じることから，施工時に地盤に過度の乱れを生じさせないことが基本となる。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":104,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78511"},{"cat":"土木一般","year":"R6 No.18","q":"打込み杭工法による鋼管杭基礎の施工に関する次の記述のうち，適当なものはどれか。","opts":["ヤットコを使用したり，地盤状況等から偏打を起こす恐れのある場合には，鋼管杭の板厚を薄くする。","支持杭基礎の打止め管理は，根入れ深さ，打止め時一打当たりのリバウンド量等により，試験杭と同程度であることを確認して打ち止める。","硬質地盤への打込みを容易にするには，鋼管の先端外側の補強バンドを取り外す。","打撃力により杭頭部に座屈が生じる恐れがある場合は，適切なハンマの選定で打撃力を小さくするか，鋼管杭の断面積を小さくすることにより座屈を防止する。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":105,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78512"},{"cat":"土木一般","year":"R6 No.19","q":"場所打ち杭工法における施工に関する次の記述のうち，適当でないものはどれか。","opts":["リバース工法では，安定液のように粘性のあるものを使用しないため，一次孔底処理により泥水中のスライムはほとんど処理できる。","オールケーシング工法では，掘削孔全長にわたってケーシングチューブを用いて孔壁を保護し，適切な施工を行えば，孔壁崩壊の懸念はほとんどない。","リバース工法では，表層地盤の崩落防止のためにスタンドパイプを使用し，スタンドパイプ下端は安定性の高い粘性土層に根入れするのが良い。","オールケーシング工法では，コンクリート打込み完了後に，ケーシングチューブを引き抜くことにより，コンクリート天端が下がることはない。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":106,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78513"},{"cat":"土木一般","year":"R6 No.20","q":"各種土留め工の特徴に関する次の記述のうち，適当でないものはどれか。","opts":["切梁式土留めは，切梁，腹起し等の支保工と掘削側の地盤の抵抗により土留め壁を支持する工法で，掘削面積が広い場合には支保工が増える。","アンカー式土留めは，土留めアンカーと掘削側の地盤の抵抗によって土留め壁を支持する工法で，掘削面内に切梁がないので掘削が容易である。","自立式土留めは，土留め壁の剛性によって抵抗する工法で，土留め壁の変形が小さく，掘削面内に支保工がないために掘削は容易である。","控え杭タイロッド式土留めは，控え杭と土留め壁をタイロッドでつなげ，これと地盤の抵抗により土留め壁を支持する工法で，比較的良質な地盤で浅い掘削に適する。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":107,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78514"},{"cat":"専門土木","year":"R6 No.21","q":"鋼道路橋の架設上の留意事項に関する次の記述のうち，適当でないものはどれか。","opts":["架設部材を横方向に移動する場合には，その両端における作業誤差が生じやすいため，移動量及び移動速度が計画量に適合しているかを施工段階ごとに確認しながら行う。","架設部材を縦方向に移動する場合には，送出し作業の安全性を高めるため，送出し勾配は，下り勾配にすることが望ましい。","曲線桁橋を吊り上げる際には，架設の各段階において，ねじれ，傾き及び転倒等が生じないように重心位置を把握し，ベント等の反力を検討する。","トラス橋は，架設の最終段階でのそりの調整が難しいため，架設の各段階における上げ越し量の確認を入念に行う。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":108,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78515"},{"cat":"専門土木","year":"R6 No.22","q":"鋼道路橋における溶接施工上の留意事項に関する次の記述のうち，適当でないものはどれか。","opts":["組立溶接は，一般に，一部又は大部分が本溶接内に残留することが多いので，組立溶接に従事する溶接作業者は本溶接に従事する溶接作業者と同じ資格を有していなければならない。","アンダーカットは，応力集中の主因となり腐食の促進にもつながるので，疲労の影響を受けないと考えられる継手においても，あってはならない。","溶接ビード表面のピットは，異物や水分の存在によって発生したガスの抜け穴であり，断面に考慮する突合せ溶接継手では，ビード表面にピットがあってはならない。","開先溶接及び主桁のフランジと腹板のすみ肉溶接は，原則としてエンドタブを取り付け，溶接の始端及び終端が溶接する部材上に入らないようにしなければならない。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":109,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78516"},{"cat":"専門土木","year":"R6 No.23","q":"鋼道路橋における高力ボルトの締付け作業に関する次の記述のうち，適当なものはどれか。","opts":["高力ボルトの締付けは，連結板の中央のボルトから順次端部のボルトに向かって行い，二度締めを行うものとする。","曲げモーメントを主として受ける部材のフランジ部と腹板部とで，溶接と高力ボルト摩擦接合をそれぞれ用いるような場合には，高力ボルトの締付け完了後に溶接するのを原則とする。","回転法により締め付けた高力ボルトは，全数についてマーキングによる外観検査を行い，回転角が不足するものについては，新しいボルトに取り換えて締め直す。","トルク法により締め付けたトルシア形高力ボルトは，各ボルト群の半分のボルト本数を標準として，ピンテールの切断の確認とマーキングによる外観検査を行う。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":110,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78517"},{"cat":"専門土木","year":"R6 No.24","q":"コンクリート構造物の補強工法に関する次の記述のうち，適当でないものはどれか。","opts":["鋼板接着工法は，補強後に防食等に関する維持管理が必要である。","プレストレス導入工法は，適用する部材のコンクリート強度の照査が必要である。","連続繊維接着工法は，人力で施工が可能である。","免震工法は，地震時の部材の変位を小さくすることが可能である。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":111,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78518"},{"cat":"専門土木","year":"R6 No.25","q":"コンクリート構造物の中性化による劣化とその特徴に関する次の記述のうち，適当でないものはどれか。","opts":["大気中の二酸化炭素による中性化は，乾燥・湿潤が繰り返される場合と比べて常時乾燥している場合の方が中性化速度は速い。","中性化と水の浸透に伴う鉄筋腐食は，乾燥・湿潤が繰り返される場合と比べて常時滞水している場合の方が腐食速度は遅い。","コンクリートの中性化深さは，一般的に構造物完成後の供用年数の二乗に比例すると考えて良い。","コンクリートの中性化深さを調査する場合は，フェノールフタレイン溶液をコンクリート割裂面に噴霧し，コンクリート表面から，発色が認められない範囲までの深さを測定する。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":112,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78519"},{"cat":"専門土木","year":"R6 No.26","q":"河川堤防の盛土施工に関する次の記述のうち，適当なものはどれか。","opts":["築堤盛土の施工開始にあたっては，基礎地盤と盛土の一体性を確保するために地盤の表面を乱さないようにして盛土材料の締固めを行う。","築堤盛土の施工では，降雨による法面浸食防止のため適当な間隔で仮排水路を設けて降雨を流下させたり，降水の集中を防ぐため堤防横断方向に排水勾配を設ける。","築堤盛土の締固めは，堤防法線に直角に行うことが望ましく，締固めに際しては締固め幅が重複するように常に留意して施工する。","既設の堤防に腹付け盛土を行う場合は，新旧法面をなじませるため段切りを行い，一般的にその大きさは堤防締固め一層仕上り厚程度とすることが多い。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":113,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78520"},{"cat":"専門土木","year":"R6 No.27","q":"河川護岸前面に設置する根固工に関する次の記述のうち，適当でないものはどれか。","opts":["根固工は，大きな流速の作用する場所に設置されるため，流体力に耐える重量で，護岸基礎前面に洗掘を生じさせない敷設量であること。","捨石工の施工は，土砂の吸出し防止のために表層に大きな石を用い，内側に栗石又は砂礫を目つぶしとして用いる。","かご系の根固工は，屈撓性があり多孔質であるため，河床変動を抑制すると共に水際の多様化にも適している。","異形コンクリートブロックの乱積みの施工は，河床整正を行って積み上げるので，水深が深くなると施工は困難となる。"],"ans":3,"ex":"","src":"20240708_1kyu","qid":114,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78521"},{"cat":"専門土木","year":"R6 No.28","q":"河川堤防の開削工事に関する次の記述のうち，適当でないものはどれか。","opts":["樋門・樋管を施工する場合は，取付け盛土等が容易に施工できるよう既設堤防の開削は大きくすることが望ましく，河川管理の観点からも同様である。","出水期を避けて非出水期間中に施工する時の仮締切り工の高さは，施工期間中の設計対象水位に余裕高さを加えた高さを確保する。","仮締切り工は，開削する堤防と同等の機能が要求されるものであり，天端高さ，堤体の強度の確保はもとより，法面や河床の洗掘対策を行うことが必要である。","樋門工事を行う場合の床付け面は，堤防開削による荷重の除去に伴って緩むことが多いので，乱さないで施工すると共に転圧によって締め固めることが望ましい。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":115,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78522"},{"cat":"専門土木","year":"R6 No.29","q":"砂防堰堤の施工に関する次の記述のうち，適当でないものはどれか。","opts":["基礎地盤は，安全性等から岩盤が原則であるが，計画上やむを得ず砂礫盤とする場合は，できる限り堰堤高を15m未満に抑えると共に，原則として均一な地層を選定しなければならない。","砂礫基礎上にコンクリートを打設する場合は，打設前に転石の泥を洗浄すると共に，漏水や湧水の処理を十分に行う必要がある。","砂防堰堤における間詰めは，一般に掘削部において行い，基礎掘削部が岩盤の場合は砂礫で間詰めを行う。","基礎の根入れは，一般に所定の強度が得られる地盤であっても，基礎の不均質性や風化の速度を考慮して，岩盤の場合は1m以上，砂礫盤の場合は2m以上行う。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":116,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78523"},{"cat":"専門土木","year":"R6 No.30","q":"地すべり防止工に関する次の記述のうち，適当なものはどれか。","opts":["アンカー工は，斜面から不動地盤にテンドン（鋼材等）を挿入し，基盤内に定着させた鋼材の引張強さを利用して斜面を安定化させる工法で，締付け効果を期待するものと引き止め効果を利用するものがある。","アンカーの定着長は，地盤とグラウトとの間及びテンドン（鋼材等）とグラウトの間の付着長について比較を行い，それらのうち短いほうを採用する。","杭工は，杭をすべり面を貫いて不動土塊まで挿入することによって，移動土塊の滑動力に対して直接抵抗する工法で，杭の根入れ部となる基盤が弱く，地盤反力が期待できない場所に用いられる。","杭工に用いられる杭材は，鋼管杭，Ｈ型鋼杭，RC杭，PC杭等があり，杭の配列は地すべりの運動方向に対して概ね平行とし，杭の間隔は等間隔とする。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":117,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78524"},{"cat":"専門土木","year":"R6 No.31","q":"急傾斜地崩壊防止工に関する次の記述のうち，適当でないものはどれか。","opts":["排水工は，斜面の安定を損なう可能性のある地表水，地下水の斜面への流入を防止することにより，斜面の安定性を高めることを目的に設けられる。","現場打ちコンクリート枠工は，切土法面の安定勾配が取れない場合等に用いられ，桁の構造は一般に無筋コンクリートが用いられる。","落石対策工のうち落石予防工は，斜面上の転石の除去等により落石の発生を未然に防ぐものであり，落石防護工は，落下してくる落石を斜面下部や中部で止めるものである。","待受式コンクリート擁壁工は，斜面下部より離して設置した擁壁で崩壊土砂を待ち受ける工法であり，一般に擁壁天端には落石防護柵（ストーンガード）を設置する。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":118,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78525"},{"cat":"専門土木","year":"R6 No.32","q":"道路のアスファルト舗装における路床の施工に関する次の記述のうち，適当なものはどれか。","opts":["盛土路床は，使用する盛土材の性質をよく把握したうえで均一に敷き均し，過転圧による強度低下を招かないように十分に締め固めて仕上げる。","切土路床は，路床面下1m以内に木根，転石等といった路床の均一性を損なうものがあれば，これらをすべて取り除いてから仕上げる。","安定処理による構築路床は，必ず中央プラント方式で行い，現状路床土と安定材を均一に混合して，所定の締固め度を得られることが確認できれば全厚を1層で仕上げる。","置換え工法による路床は，原地盤を所定の深さまで掘削し，さらに掘削面以下の層をしっかりと掻きほぐしながら良質土を敷き均し，締め固めて仕上げる。"],"ans":0,"ex":"","src":"20240708_1kyu","qid":119,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78526"},{"cat":"専門土木","year":"R6 No.33","q":"道路のアスファルト舗装における上層路盤の施工に関する次の記述のうち，適当でないものはどれか。","opts":["石灰安定処理路盤の施工で，安定処理材料を均一に敷き均した後，締め固めて仕上げるときは，最適含水比よりやや湿潤状態で締め固めると良い。","加熱アスファルト安定処理路盤の施工で，ブルドーザやモータグレーダ等，アスファルトフィニッシャ以外で敷き均す場合は，材料の分離に留意する。","シックリフト工法による加熱アスファルト安定処理路盤の施工で，側方端部を拘束するものがない場合は，振動ローラ等の大型の締固め機械で締め固めると良い。","セメント安定処理路盤の施工で，縦方向の施工継目を新しい材料で打ち継ぐ場合は，日時をおくと施工継目にひび割れを生じることがあるため，できるだけ早い時期に打ち継ぐことが望ましい。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":120,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78527"},{"cat":"専門土木","year":"R6 No.34","q":"道路のアスファルト舗装における基層・表層の施工に関する次の記述のうち，適当でないものはどれか。","opts":["タックコート面を保護し，乳剤による施工現場周辺の汚れを防止するために，運搬車両や舗設機械のタイヤに付着しにくい乳剤を使用する。","表層の縦継目の位置は，原則としてレーンマークの位置とはずらし，既設舗装の補修・拡幅の場合を除いて，下層の継目の上に上層の継目を重ねないようにする。","夏期や夜間作業等で作業時間に制約がある場合には，舗装冷却機械等による強制的な冷却による温度低下の方法や，中温化技術の適用等について検討する。","ローラへの混合物の付着防止に軽油を使用すると，アスファルト混合物をカットバックする性質を持っているため，必要に応じて非石油系の付着防止剤を使用する。"],"ans":1,"ex":"","src":"20240708_1kyu","qid":121,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78528"},{"cat":"専門土木","year":"R6 No.35","q":"道路のアスファルト舗装における各種補修工法に関する次の記述のうち，適当でないものはどれか。","opts":["表面処理工法は，路面の老化やひび割れ，摩耗等が生じた場合や予防保全の観点から，既設舗装上に薄い封かん層を設ける工法で，舗装の表面を再生することで舗装の機能を回復・向上させる。","切削工法は応急的な処置であり，舗装表面に連続的あるいは断続的に凹凸が発生して平坦性が極端に悪くなった場合にその部分を機械によって削り取る工法で，早期に凹凸が再発する恐れがある。","オーバーレイ工法は，既設舗装上にアスファルト混合物の層を重ねる工法で，わだち掘れが生じている路面に適用するときは，事前にシール材注入やリフレクションクラック対策を行う。","打換え工法は，既設舗装のアスファルト混合物層を全層及び路盤の一部，又は既設舗装すべてを打ち換える工法で，路盤や基層の転圧では縁部や隅角部の転圧が不十分になりやすい。"],"ans":2,"ex":"","src":"20240708_1kyu","qid":122,"srcUrl":"https://1dobokusekou.kakomonn.com/questions/78529"},{"cat":"専門土木","year":"R6 No.36","q":"ポーラスアスファルト混合物の施工に関する次の記述のうち，適当なものはどれか。","opts":["ポーラスアスファルト混合物は，密粒度系の混合物を用いる場合よりも温度の低下が早いため，温度管理に十分注意して敷き均して，できるだけ速やかに初転圧を行う。","ポーラスアスファルト混合物の締固めにあたっては，初転圧と二次転圧にはタイヤローラによる締固めで所定の締固め度を確保することが望ましい。","タックコートは，原則として浸透用アスファルト乳剤PK-3を使用し，所定量を均一に
