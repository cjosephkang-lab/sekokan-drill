ればならない。","指定地域内において特定建設作業を伴う建設工事を施工しようとする者は，当該特定建設作業の開始の日のU日前までに，環境省令で定める事項を市町村長に届け出なければならない。"],"ans":2,"ex":"","src":"20220704_1kyu","qid":299},{"cat":"法規","year":"R4 No.61","q":"船舶の入出港及び停泊に関する次の記述のうち，港則法令上，誤っているものはどれか。","opts":["船舶は，特定港に入港したとき，又は特定港を出港しようとするときは，国土交通省令の定めるところにより，港長の許可を受けなければならない。","特定港内においては，汽艇等以外の船舶を修繕し，又は係船しようとする者は，その旨を港長に届け出なければならない。","特定港内に停泊する船舶は，港長にびょう地を指定された場合を除き，各々そのトン数，又は積載物の種類に従い，当該特定港内の一定の区域内に停泊しなければならない。","汽艇等及びいかだは，港内においては，みだりにこれを係船浮標若しくは他の船舶に係留し，又は他の船舶の交通の妨げとなるおそれのある場所に停泊させ，若しくは停留させてはならない。"],"ans":0,"ex":"","src":"20220704_1kyu","qid":300},{"cat":"施工管理法","year":"R4 問BNo.1","q":"TS（トータルステーション）を用いて行う測量に関する次の記述のうち，適当でないものはどれか。","opts":["TS での距離測定は，測定開始直前又は終了直後に，気温及び気圧の測定を行う。","TS での水平角観測において，目盛変更が不可能な機器は，2対回の繰り返し観測を行う。","TS では，器械高，反射鏡高及び目標高は，センチメートル位まで測定を行う。","TS では，水平角観測の必要対回数に合せ取得された距離測定値は，その平均値を用いる。"],"ans":2,"ex":"","src":"20220704_1kyuB","qid":301},{"cat":"施工管理法","year":"R4 問BNo.2","q":"公共工事標準請負契約約款に関する次の記述のうち，適当でないものはどれか。","opts":["受注者は，設計図書において監督員の検査を受けて使用すべきものと指定された工事材料が，検査の結果不合格と決定された場合，工事現場内に保管しなければならない。","受注者は，工事目的物の引渡し前に，天災等で発注者と受注者のいずれの責めにも帰すことができないものにより，工事目的物等に損害が生じたときは，その事実の発生直後直ちにその状況を発注者に通知しなければならない。","発注者は，工期の延長又は短縮を行うときは，この工事に従事する者の労働時間その他の労働条件が適正に確保されるよう，やむを得ない事由により工事等の実施が困難であると見込まれる日数等を考慮しなければならない。","発注者は，設計図書の変更を行った場合において，必要があると認められるときは，工期若しくは請負代金額を変更しなければならない。"],"ans":0,"ex":"","src":"20220704_1kyuB","qid":302},{"cat":"施工管理法","year":"R4 問BNo.4","q":"工事用電力設備に関する次の記述のうち，適当でないものはどれか。","opts":["工事現場における電気設備の容量は，月別の電気設備の電力合計を求め，このうち最大となる負荷設備容量に対して受電容量不足をきたさないように決定する。","小規模な工事現場等で契約電力が，電灯，動力を含め50 kW 未満のものについては，低圧の電気の供給を受ける。","工事現場で高圧にて受電し現場内の自家用電気工作物に配電する場合，電力会社との責任分界点に保護施設を備えた受電設備を設置する。","工事現場に設置する変電設備の位置は，一般にできるだけ負荷の中心から遠い位置を選定する。"],"ans":3,"ex":"","src":"20220704_1kyuB","qid":303},{"cat":"施工管理法","year":"R4 問BNo.5","q":"施工計画立案に関する次の記述のうち，適当でないものはどれか。","opts":["施工計画立案に使用した資料は，施工過程における計画変更等に重要な資料となったり，工事を安全に完成するための資料となる。","施工計画立案のための資機材等の輸送調査では，輸送ルートの道路状況や交通規制等を把握し，不明があれば道路管理者や労働基準監督署に相談して解決しておく必要がある。","施工計画の立案にあたっては，発注者から示された工程が最適工期とは限らないので，示された工程の範囲でさらに経済的な工程を探し出すことも大切である。","施工計画の立案にあたっては，発注者の要求品質を確保するとともに，安全を最優先にした施工を基本とした計画とする。"],"ans":1,"ex":"","src":"20220704_1kyuB","qid":304},{"cat":"施工管理法","year":"R4 問BNo.7","q":"元方事業者が講ずべき措置等に関する次の記述のうち，労働安全衛生法令上，誤っているものはどれか。","opts":["元方事業者は，関係請負人又は関係請負人の労働者が，当該仕事に関し，法律又はこれに基づく命令の規定に違反していると認めるときは，是正の措置を自ら行わなければならない。","元方事業者は，関係請負人及び関係請負人の労働者が，当該仕事に関し，法律又はこれに基づく命令の規定に違反しないよう必要な指導を行わなければならない。","元方事業者は，土砂等が崩壊するおそれのある場所において，関係請負人の労働者が当該事業の仕事の作業を行うときは，当該場所に係る危険を防止するための措置が適正に講ぜられるように，技術上の指導その他の措置を講じなければならない。","元方事業者の講ずべき技術上の指導その他の必要な措置には，技術上の指導のほか，危険を防止するために必要な資材等の提供，元方事業者が自ら又は関係請負人と共同して危険を防止するための措置を講じること等が含まれる。"],"ans":0,"ex":"","src":"20220704_1kyuB","qid":305},{"cat":"施工管理法","year":"R4 問BNo.8","q":"建設工事現場における保護具の使用に関する次の記述のうち，適当なものはどれか。","opts":["大きな衝撃を受けた保護帽は，外観に異常がなければ使用することができる。","防毒マスク及び防塵マスクは，酸素欠乏危険作業に用いることができる。","ボール盤等の回転する刃物に，労働者の手が巻き込まれるおそれのある作業の場合は，手袋を使用させなければならない。","通路等の構造又は当該作業の状態に応じて安全靴その他の適当な履物を定め，作業中の労働者に使用させなければならない。"],"ans":3,"ex":"","src":"20220704_1kyuB","qid":306},{"cat":"施工管理法","year":"R4 問BNo.9","q":"建設工事の労働災害防止対策に関する次の記述のうち，適当でないものはどれか。","opts":["ロープ高所作業では，メインロープ及びライフラインを設け，作業箇所の上方にある同一の堅固な支持物に外れないよう確実に緊結し作業する。","墜落のおそれがある人力のり面整形作業等では，親綱を設置し，要求性能墜落制止用器具を使用する。","工事現場における架空線等上空施設について，施工に先立ち現地調査を実施し，種類，位置（場所，高さ等）及び管理者を確認する。","上下作業は極力さけることとするが，やむを得ず上下作業を行うときは，事前に両者の作業責任者と場所，内容，時間等をよく調整し，安全確保をはかる。"],"ans":0,"ex":"","src":"20220704_1kyuB","qid":307},{"cat":"施工管理法","year":"R4 問BNo.10","q":"足場，作業床の組立等に関する次の記述のうち，労働安全衛生規則上，誤っているものはどれか。","opts":["事業者は，足場の組立て等作業主任者に，作業の方法及び労働者の配置を決定し，作業の進行状況を監視するほか，材料の欠点の有無を点検し，不良品を取り除かせなければならない。","事業者は，強風，大雨，大雪等の悪天候若しくは中震（震度O）以上の地震の後において，足場における作業を行うときは，作業開始後直ちに，点検しなければならない。","事業者は，足場の組立て等作業において，材料，器具，工具等を上げ，又は下ろすときは，つり綱，つり袋等を労働者に使用させなければならない。","事業者は，足場の構造及び材料に応じて，作業床の最大積載荷重を定め，かつ，これを超えて積載してはならない。"],"ans":1,"ex":"","src":"20220704_1kyuB","qid":308},{"cat":"施工管理法","year":"R4 問BNo.11","q":"墜落による危険を防止するための安全ネット（防網）の使用上の留意点に関する次の記述のうち，適当でないものはどれか。","opts":["人体又はこれと同等以上の重さを有する落下物による衝撃を受けたネットは，入念に点検したうえで使用すること。","ネットが有毒ガスに暴露された場合等においては，ネットの使用後に試験用糸について，等速引張試験を行うこと。","溶接や溶断の火花，破れや切れ等で破損したネットは，その破損部分が補修されていない限り使用しないこと。","ネットの材料は合成繊維とし，支持点の間隔は，ネット周辺からの墜落による危険がないものであること。"],"ans":0,"ex":"","src":"20220704_1kyuB","qid":309},{"cat":"施工管理法","year":"R4 問BNo.12","q":"土工工事における明り掘削の作業にあたり事業者が遵守しなければならない事項に関する次の記述のうち，労働安全衛生法令上，正しいものはどれか。","opts":["運搬機械，掘削機械，積込機械については，運行の経路，これらの機械の土石の積卸し場所への出入りの方法を定め，地山の掘削作業主任者に知らせなければならない。","掘削機械，積込機械等の使用によるガス導管，地中電線路等の損壊により労働者に危険を及ぼすおそれのあるときは，これらの機械を使用してはならない。","地山の崩壊又は土石の落下により労働者に危険を及ぼすおそれのあるときは，あらかじめ，土止め支保工を設け，防護網を張り，労働者の立入り措置を講じなければならない。","掘削面の高さ3ｍ以上の場合，土止め支保工作業主任者に，作業の方法を決定し，作業を直接指揮すること，器具及び工具を点検し，不良品を取り除くことを行わせる。"],"ans":1,"ex":"","src":"20220704_1kyuB","qid":310},{"cat":"施工管理法","year":"R4 問BNo.13","q":"コンクリート構造物の解体作業に関する次の記述のうち，適当でないものはどれか。","opts":["転倒方式による取り壊しでは，解体する主構造部に複数本の引きワイヤを堅固に取り付け，引きワイヤで加力する際は，繰り返し荷重をかけてゆすってはいけない。","ウォータージェットによる取り壊しでは，取り壊し対象物周辺に防護フェンスを設置するとともに，水流が貫通するので取り壊し対象物の裏側は立ち入り禁止とする。","カッタによる取り壊しでは，撤去側躯体ブロックにカッタを堅固に取り付けるとともに，切断面付近にシートを設置して冷却水の飛散防止をはかる。","圧砕機及び大型ブレーカによる取り壊しでは，解体する構造物からコンクリート片の飛散，構造物の倒壊範囲を予測し，作業員，建設機械を安全作業位置に配置しなければいけない。"],"ans":2,"ex":"","src":"20220704_1kyuB","qid":311},{"cat":"施工管理法","year":"R4 問BNo.14","q":"道路のアスファルト舗装の品質管理に関する次の記述のうち，適当でないものはどれか。","opts":["表層，基層の締固め度の管理は，通常は切取コアの密度を測定して行うが，コア採取の頻度は工程の初期は多めに，それ以降は少なくして，混合物の温度と締固め状況に注意して行う。","工事施工途中で作業員や施工機械等の組合せを変更する場合は，品質管理の各項目に関する試験頻度を増し，新たな組合せによる品質の確認を行う。","下層路盤の締固め度の管理は，試験施工や工程の初期におけるデータから，現場の作業を定常化して締固め回数による管理に切り替えた場合には，必ず密度試験による確認を行う。","管理結果を工程能力図にプロットし，その結果が管理の限界をはずれた場合，あるいは一方に片寄っている等の結果が生じた場合，直ちに試験頻度を増やして異常の有無を確認する。"],"ans":2,"ex":"","src":"20220704_1kyuB","qid":312},{"cat":"施工管理法","year":"R4 問BNo.15","q":"路床や路盤の品質管理に用いられる試験方法に関する次の記述のうち，適当でないものはどれか。","opts":["突固め試験は，土が締め固められた時の乾燥密度と含水比の関係を求め，路床や路盤を構築する際における材料の選定や管理することを目的として実施する。","RI による密度の測定は，路床や路盤等の現場における締め固められた材料の密度及び含水比を求めることを目的として実施する。","平板載荷試験は，地盤支持力係数K 値を求め，路床や路盤の支持力を把握することを目的として実施する。","プルーフローリング試験は，路床や路盤のトラフィカビリティーを判定することを目的として実施する。"],"ans":3,"ex":"","src":"20220704_1kyuB","qid":313},{"cat":"施工管理法","year":"R4 問BNo.16","q":"JISA5308 に準拠したレディーミクストコンクリートの受入れ検査に関する次の記述のうち，適当でないものはどれか。","opts":["スランプ試験を行ったところ，12.0 cm の指定に対して10.0 cm であったため，合格と判定した。","空気量試験を行ったところ，4.5 ％の指定に対して3.0 ％であったため，合格と判定した。","塩化物含有量の検査を行ったところ，塩化物イオン（Cl）量として1.0 kg/m³であったため，合格と判定した。","アルカリシリカ反応対策について，コンクリート中のアルカリ総量が2.0 kg/m³であったため，合格と判定した。"],"ans":2,"ex":"","src":"20220704_1kyuB","qid":314},{"cat":"施工管理法","year":"R4 問BNo.17","q":"建設工事における騒音・振動対策に関する次の記述のうち，適当でないものはどれか。","opts":["騒音・振動の防止対策については，騒音・振動の大きさを下げるほか，発生期間を短縮する等全体的に影響が小さくなるよう検討しなければならない。","騒音防止対策は，音源対策が基本だが，伝搬経路対策及び受音側対策をバランスよく行うことが重要である。","建設工事に伴う地盤振動に対する防止対策においては，振動エネルギーが拡散した状態となる受振対象で実施することは，一般に大規模になりがちであり効果的ではない。","建設機械の発生する音源の騒音対策は，発生する騒音と作業効率には大きな関係があり，低騒音型機械の導入においては，作業効率が低下するので，日程の調整が必要となる。"],"ans":3,"ex":"","src":"20220704_1kyuB","qid":315},{"cat":"施工管理法","year":"R4 問BNo.18","q":"建設工事における土壌汚染対策に関する次の記述のうち，適当でないものはどれか。","opts":["土壌汚染対策は，汚染状況（汚染物質，汚染濃度等），将来的な土地の利用方法，事業者や土地所有者の意向等を考慮し，覆土，完全浄化，原位置封じ込め等，適切な対策目標を設定することが必要である。","地盤汚染対策工事においては，工事車両のタイヤ等に汚染土壌が付着し，場外に出ることのないよう，車両の出口にタイヤ洗浄装置及び車体の洗浄施設を備え，洗浄水は直ちに場外に排水する。","地盤汚染対策工事においては，汚染土壌対策の作業エリアを区分し，作業エリアと場外の間に除洗区域を設置し，作業服等の着替えを行う。","地盤汚染対策工事における屋外掘削の場合，飛散防止ネットを設置し，散水して飛散を防止する。"],"ans":1,"ex":"","src":"20220704_1kyuB","qid":316},{"cat":"施工管理法","year":"R4 問BNo.19","q":"\u0002建設工事に係る資材の再資源化等に関する法律\u0003（建設リサイクル法）に関する次の記述のうち，正しいものはどれか。","opts":["発注者に義務付けられている対象建設工事の事前届出に関し，元請負業者は，届出に係る事項について発注者に書面で説明しなければならない。","特定建設資材は，コンクリート，コンクリート及び鉄から成る建設資材，木材，アスファルト・コンクリート，プラスチックの品目が定められている。","対象建設工事の受注者は，分別解体等に伴って生じた特定建設資材廃棄物について，すべて再資源化をしなければならない。","解体工事業者は，工事現場における解体工事の施工に関する技術上の管理をつかさどる安全責任者を選任しなければならない。"],"ans":0,"ex":"","src":"20220704_1kyuB","qid":317},{"cat":"施工管理法","year":"R4 問BNo.20","q":"建設工事に伴う産業廃棄物（特別管理産業廃棄物を除く）の処分に関する次の記述のうち，廃棄物の処理及び清掃に関する法令上，正しいものはどれか。","opts":["多量排出事業者は，当該事業場に係る産業廃棄物の減量その他その処理に関する計画を作成し，都道府県知事に提出しなければならない。","排出事業者が，当該産業廃棄物を生ずる事業場の外において自ら保管するときは，あらかじめ当該工事の発注者へ届け出なければならない。","排出事業者は，産業廃棄物の運搬又は処分を業とする者に委託した場合，産業廃棄物の処分の終了後，産業廃棄物管理票を交付しなければならない。","排出事業者は，非常災害時に応急処置として行う建設工事に伴い生ずる産業廃棄物を事業場の外に保管する場合には，規模の大小にかかわらず市町村長に届け出なければならない。"],"ans":0,"ex":"","src":"20220704_1kyuB","qid":318},{"cat":"施工管理法応用","year":"R4 問BNo.21","q":"仮設工事計画立案の留意事項に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・仮設工事の材料は，一般の市販品を使用して可能な限り規格を統一し，その主要な部材については他工事（イ）計画にする。・仮設構造物設計における安全率は，本体構造物よりも割引いた値を（ロ）。・仮設工事計画では，取扱いが容易でできるだけユニット化を心がけるとともに，（ハ）を考慮し，省力化が図れるものとする。・仮設構造物設計における荷重は短期荷重で算定する場合が多く，また，転用材を使用するときには，一時的な短期荷重扱い（ニ）。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["からの転用はさける ― 採用してはならない ― 資機材不足 ― が妥当である","にも転用できる ― 採用することが多い ― 作業員不足 ― は妥当ではない","からの転用はさける ― 採用してはならない ― 資機材不足 ― は妥当ではない","にも転用できる ― 採用することが多い ― 作業員不足 ― が妥当である"],"ans":1,"ex":"","src":"20220704_1kyuB","qid":319},{"cat":"施工管理法応用","year":"R4 問BNo.22","q":"公共工事における施工体制台帳に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・下請業者は，請負った工事をさらに他の建設業を営む者に請け負わせたときは，施工体制台帳を修正するため再下請通知書を（イ）に提出しなければならない。・施工体制台帳には，建設工事の名称，内容及び工期，許可を受けて営む建設業の種類，（ロ）等を記載しなければならない。・発注者から直接工事を請負った建設業者は，当該工事を施工するため，（ハ），施工体制台帳を作成しなければならない。・元請業者は，施工体制台帳と合わせて施工の分担関係を表示した（ニ）を作成し，工事関係者や公衆が見やすい場所に掲げなければならない。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["発注者 ― 健康保険の加入状況 ― 一定額以上の下請金額の場合は ― 施工体系図","元請業者 ― 建設工事の作業手順 ― 一定額以上の下請金額の場合は ― 緊急連絡網","元請業者 ― 健康保険の加入状況 ― 下請金額にかかわらず ― 施工体系図","発注者 ― 建設工事の作業手順 ― 下請金額にかかわらず ― 緊急連絡網"],"ans":2,"ex":"","src":"20220704_1kyuB","qid":320},{"cat":"施工管理法応用","year":"R4 問BNo.23","q":"土留め壁を構築する場合における掘削底面の破壊現象に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・ボイリングとは，遮水性の土留め壁を用いた場合に水位差により上向きの浸透流が生じ，この浸透圧が土の有効重量を超えると，沸騰したように沸き上がり掘削底面の土が（イ）を失い，急激に土留めの安定性が損なわれる現象である。・パイピングとは，地盤の弱い箇所の（ロ）が浸透流により洗い流され地中に水みちが拡大し，最終的にはボイリング状の破壊に至る現象である。・ヒービングとは，土留め背面の土の重量や土留めに接近した地表面での上載荷重等により，掘削底面（ハ）が生じ最終的には土留め崩壊に至る現象である。・盤ぶくれとは，地盤が（ニ）のとき上向きの浸透流は生じないが（ニ）下面に上向きの水圧が作用し，これが上方の土の重さ以上となる場合は，掘削底面が浮き上がり，最終的にはボイリング状の破壊に至る現象である。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["透水性 ― 粘性土 ― の隆起 ― 透水層","せん断抵抗 ― 土粒子 ― の隆起 ― 難透水層","透水性 ― 土粒子 ― に陥没 ― 難透水層","せん断抵抗 ― 粘性土 ― に陥没 ― 透水層"],"ans":1,"ex":"","src":"20220704_1kyuB","qid":321},{"cat":"施工管理法応用","year":"R4 問BNo.24","q":"施工計画における建設機械の選定に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・建設機械の組合せ選定は，従作業の施工能力を主作業の施工能力と同等，あるいは幾分（イ）にする。・建設機械の選定は，工事施工上の制約条件より最も適した建設機械を選定し，その機械が（ロ）能力を発揮できる施工法を選定することが合理的かつ経済的である。・建設機械の使用計画を立てる場合には，作業量をできるだけ（ハ）し，施工期間中の使用機械の必要量が大きく変動しないように計画するのが原則である。・機械施工における（ニ）の指標として施工単価の概念を導入して，施工単価を安くする工夫が要求される。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["高め ― 最大の ― 集中化 ― 経済性","低め ― 平均的な ― 集中化 ― 安全性","低め ― 平均的な ― 平滑化 ― 安全性","高め ― 最大の ― 平滑化 ― 経済性"],"ans":3,"ex":"","src":"20220704_1kyuB","qid":322},{"cat":"施工管理法応用","year":"R4 問BNo.25","q":"工程管理に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・施工計画では，施工順序，施工法等の施工の基本方針を決定し，（イ）では，手順と日程の計画，工程表の作成を行う。・施工計画で決定した施工順序，施工法等に基づき，（ロ）では，工事の指示，施工監督を行う。・工程管理の統制機能における（ハ）では，工程進捗の計画と実施との比較をし，進捗報告を行う。・工程管理の改善機能は，施工の途中で基本計画を再評価し，改善の余地があれば計画立案段階にフィードバックし，（ニ）では，作業の改善，工程の促進，再計画を行う。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["工程計画 ― 工事実施 ― 進度管理 ― 立会検査","段階計画 ― 工事監視 ― 安全管理 ― 是正措置","工程計画 ― 工事実施 ― 進度管理 ― 是正措置","段階計画 ― 工事監視 ― 安全管理 ― 立会検査"],"ans":2,"ex":"","src":"20220704_1kyuB","qid":323},{"cat":"施工管理法応用","year":"R4 問BNo.26","q":"工程管理に使われる各工程表の特徴に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・トンネル工事のように工事区間が線上に長く，工事の進行方向が一定方向に進捗していく工事には（イ）が用いられることが多い。・2つの作業の遅れや変化が工事全体の工程にどのように影響してくるかを早く，正確に把握できるのが（ロ）である。・各作業の予定と実績との差を直視的に比較するのに便利であり，施工中の作業の進捗状況もよくわかるのが（ハ）である。・各作業の開始日から終了日までの所要日数がわかり，各作業間の関連も把握することができるのが（ニ）である。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["バーチャート ― グラフ式工程表 ― ネットワーク式工程表 ― ガントチャート","バーチャート ― ネットワーク式工程表 ― グラフ式工程表 ― ガントチャート","斜線式工程表 ― グラフ式工程表 ― ネットワーク式工程表 ― バーチャート","斜線式工程表 ― ネットワーク式工程表 ― グラフ式工程表 ― バーチャート"],"ans":3,"ex":"","src":"20220704_1kyuB","qid":324},{"cat":"施工管理法応用","year":"R4 問BNo.27","q":"工程管理を行う上で，品質・工程・原価に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・一般的に工程と原価の関係は，施工を速めると原価は段々安くなっていき，さらに施工速度を速めて突貫作業を行うと，原価は（イ）なる。・原価と品質の関係は，悪い品質のものは安くできるが，良いものは原価が（ロ）なる。・一般的に品質と工程の関係は，品質の良いものは時間がかかり，施工を速めて突貫作業をすると，品質は（ハ）。・工程，原価，品質との間には相反する性質があり，（ニ）計画し，工期を守り，品質を保つように管理することが大切である。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["ますます安く ― さらに安く ― かわらない ― それぞれ単独に","逆に高く ― 高く ― 悪くなる ― これらの調整を図りながら","ますます安く ― さらに安く ― かわらない ― これらの調整を図りながら","逆に高く ― 高く ― 悪くなる ― それぞれ単独に"],"ans":1,"ex":"","src":"20220704_1kyuB","qid":325},{"cat":"施工管理法応用","year":"R4 問BNo.28","q":"車両系建設機械を用いる作業の安全確保のために事業者が講じるべき措置に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，労働安全衛生規則上，正しいものは次のうちどれか。・事業者は，車両系建設機械を用いて作業を行うときは，（イ）にブレーキやクラッチの機能について点検を行わなければならない。・事業者は，車両系建設機械の運転について誘導者を置くときは，（ロ）合図を定め，誘導者に当該合図を行わせなければならない。・事業者は，車両系建設機械の修理又はアタッチメントの装着若しくは取り外しの作業を行うときは，（ハ）を定め，作業手順の決定等の措置を講じさせなければならない。・事業者は，車両系建設機械を用いて作業を行うときは，（ニ）以外の箇所に労働者を乗せてはならない。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["作業の前日 ― 一定の ― 作業指揮者 ― 乗車席","作業の前日 ― 状況に応じた ― 作業主任者 ― 助手席","その日の作業を開始する前 ― 状況に応じた ― 作業主任者 ― 助手席","その日の作業を開始する前 ― 一定の ― 作業指揮者 ― 乗車席"],"ans":3,"ex":"","src":"20220704_1kyuB","qid":326},{"cat":"施工管理法応用","year":"R4 問BNo.29","q":"移動式クレーンの安全確保に関する措置のうち，下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，クレーン等安全規則上，正しいものは次のうちどれか。・移動式クレーンの運転者は，荷をつったままで運転位置を（イ）。・移動式クレーンの定格荷重とは，フックやグラブバケット等のつり具の重量を（ロ）荷重をいい，ブームの傾斜角や長さにより変化する。・事業者は，アウトリガーを有する移動式クレーンを用いて作業を行うときは，原則としてアウトリガーを（ハ）に張り出さなければならない。・事業者は，移動式クレーンを用いる作業においては，移動式クレーンの運転者が単独で作業する場合を除き，（ニ）を行う者を指名しなければならない。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["離れてはならない ― 含む ― 最大限 ― 合図","離れてはならない ― 含まない ― 最大限 ― 合図","離れて荷姿を確認する ― 含む ― 必要最小限 ― 監視","離れて荷姿を確認する ― 含まない ― 必要最小限 ― 監視"],"ans":1,"ex":"","src":"20220704_1kyuB","qid":327},{"cat":"施工管理法応用","year":"R4 問BNo.30","q":"工事中の埋設物の損傷等の防止のために行うべき措置に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，建設工事公衆災害防止対策要綱上，正しいものは次のうちどれか。・発注者又は施工者は，施工に先立ち，埋設物の管理者等が保管する台帳と設計図面を照らし合わせ，細心の注意のもとで試掘等を行い，原則として（イ）をしなければならない。・施工者は，管理者の不明な埋設物を発見した場合，必要に応じて（ロ）の立会いを求め，埋設物に関する調査を再度行い，安全を確認した後に措置しなければならない。・施工者は，埋設物の位置が掘削床付け面より（ハ）等，通常の作業位置からの点検等が困難な場合には，原則として，あらかじめ点検等のための通路を設置しなければならない。・発注者又は施工者は，埋設物の位置，名称，管理者の連絡先等を記載した標示板の取付け等を工夫するとともに，（ニ）等に確実に伝達しなければならない。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["写真記録 ― 労働基準監督署 ― 低い ― 工事関係者","目視確認 ― 労働基準監督署 ― 高い ― 近隣住民","写真記録 ― 専門家 ― 低い ― 近隣住民","目視確認 ― 専門家 ― 高い ― 工事関係者"],"ans":3,"ex":"","src":"20220704_1kyuB","qid":328},{"cat":"施工管理法応用","year":"R4 問BNo.31","q":"酸素欠乏のおそれのある工事を行う際，事業者が行うべき措置に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，酸素欠乏症等防止規則上，正しいものは次のうちどれか。・事業者は，作業の性質上換気することが著しく困難な場合，同時に就業する労働者の（イ）の空気呼吸器等を備え，労働者にこれを使用させなければならない。・事業者は，第一種酸素欠乏危険作業に係る業務に労働者を就かせるときは，（ロ）に対し，酸素欠乏症の防止等に関する特別教育を行わなければならない。・事業者は，酸素欠乏危険作業に労働者を従事させるときは，入場及び退場の際，（ハ）を点検しなければならない。・事業者は，第二種酸素欠乏危険作業に労働者を従事させるときは，（ニ）に，空気中の酸素及び硫化水素の濃度を測定しなければならない。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["人数と同数以上 ― 当該労働者 ― 人員 ― その日の作業を開始する前","人数分 ― 当該労働者 ― 保護具 ― その作業の前日","人数分 ― 作業指揮者 ― 保護具 ― その日の作業を開始する前","人数と同数以上 ― 作業指揮者 ― 人員 ― その作業の前日"],"ans":0,"ex":"","src":"20220704_1kyuB","qid":329},{"cat":"施工管理法応用","year":"R4 問BNo.32","q":"土木工事の品質管理に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・品質管理の目的は，契約約款，設計図書等に示された規格を十分満足するような構造物等を最も（イ）施工することである。・品質（ロ）は，構造物の品質に重要な影響を及ぼすもの，工程に対して処置をとりやすいようにすぐに結果がわかるもの等に留意して決定する。・品質（ハ）では，設計値を十分満たすような品質を実現するため，品質のばらつきの度合いを考慮して，余裕を持った品質を目標にしなければならない。・作業標準は，品質（ハ）を実現するための（ニ）での試験方法等に関する基準を決めるものである。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["早く ― 標準 ― 特性 ― 完了後の検査","早く ― 特性 ― 標準 ― 完了後の検査","経済的に ― 特性 ― 標準 ― 各段階の作業","経済的に ― 標準 ― 特性 ― 各段階の作業"],"ans":2,"ex":"","src":"20220704_1kyuB","qid":330},{"cat":"施工管理法応用","year":"R4 問BNo.33","q":"情報化施工におけるTS（トータルステーション）・GNSS（全球測位衛星システム）を用いた盛土の締固め管理に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せのうち，適当なものは次のうちどれか。・盛土材料をまき出す際は，盛土施工範囲の全面にわたって，試験施工で決定したまき出し厚（イ）のまき出し厚となるように管理する。・盛土材料を締め固める際は，盛土施工範囲の全面にわたって，（ロ）だけ締め固めたことを示す色がモニタに表示されるまで締め固める。・TS・GNSS を用いた盛土の締固め管理システムの適用にあたっては，地形条件や電波障害の有無等を（ハ）調査し，システムの適用可否を確認する。・TS・GNSS を用いて締固め機械の走行記録をもとに，盛土の締固め管理をする方法は，（ニ）の一つである。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["以下 ― 規定回数 ― 事前に ― 品質規定","以上 ― 規定時間 ― 施工開始後に ― 品質規定","以上 ― 規定時間 ― 施工開始後に ― 工法規定","以下 ― 規定回数 ― 事前に ― 工法規定"],"ans":3,"ex":"","src":"20220704_1kyuB","qid":331},{"cat":"施工管理法応用","year":"R4 問BNo.34","q":"鉄筋コンクリート構造物の品質管理におけるコンクリート中の鉄筋位置を推定する非破壊試験に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・かぶりの大きい橋梁下部構造の鉄筋位置を推定する場合，（イ）が，（ロ）より適する。・（イ）は，コンクリートが（ハ），測定が困難になる可能性がある。・（ロ）において，かぶりの大きさを測定する場合，鉄筋間隔が設計かぶりの（ニ）の場合は補正が必要になる。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["電磁波レーダ法 ― 電磁誘導法 ― 乾燥しすぎていると ― 1.5 倍以上","電磁誘導法 ― 電磁波レーダ法 ― 水を多く含んでいると ― 1.5 倍以上","電磁波レーダ法 ― 電磁誘導法 ― 水を多く含んでいると ― 1.5 倍以下","電磁誘導法 ― 電磁波レーダ法 ― 乾燥しすぎていると ― 1.5 倍以下"],"ans":2,"ex":"","src":"20220704_1kyuB","qid":332},{"cat":"施工管理法応用","year":"R4 問BNo.35","q":"コンクリートの施工の品質管理に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・打込み時の材料分離を防ぐためには，（イ）シュートの使用を標準とする。・棒状バイブレータにより締固めを行う際，スランプ12 cm のコンクリートでは，一箇所あたりの締固め時間は，（ロ）程度とすることを標準とする。・コンクリートを打ち重ねる場合，上層のコンクリートの締固めでは，棒状バイブレータが下層のコンクリートに（ハ）ようにして締め固める。・コンクリートの仕上げは，締固めが終わり，上面にしみ出た水が（ニ）状態で行う。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["縦 ― U〜15 秒 ― 10 cm 程度入る ― なくなった","縦 ― 50〜70 秒 ― 10 cm 程度入る ― なくなった","斜め ― U〜15 秒 ― 入らない ― 残った","斜め ― 50〜70 秒 ― 入らない ― 残った"],"ans":0,"ex":"","src":"20220704_1kyuB","qid":333},{"cat":"土木一般","year":"R8 No.2","q":"土の締固めの性質に関する文章中のイ～ニに当てはまる語句の組合せとして，適当なものはどれか。・機械的な方法で土に力を加えて，間隙中のイを追い出し，土の密度を高めることを土の締固めという。・土の締固めの際，同じ土を同じ方法で締め固めてもその程度は土の含水比により異なり，その含水比と乾燥密度の関係をグラフに描くと上に凸な曲線となり，このグラフをロという。・このロの頂点が示す密度をハといい，このときの含水比をニという。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["水分 ― 時間-圧密量曲線 ― 飽和密度 ― 自然含水比","空気 ― 締固め曲線 ― 最大乾燥密度 ― 最適含水比","水分 ― 締固め曲線 ― 飽和密度 ― 最適含水比","空気 ― 時間-圧密量曲線 ― 最大乾燥密度 ― 自然含水比"],"ans":1,"ex":"","src":"20260706_1kyu","qid":334},{"cat":"土木一般","year":"R8 No.6","q":"土質試験結果の活用に関する記述のうち，適当でないものはどれか。","opts":["土の粒度試験結果は，粒径加積曲線で示され，その結果から建設材料としての適性の判定に用いられる。","土の液性限界試験と塑性限界試験の結果は，液性限界，塑性限界及び塑性指数が示され，土の物理的性質の推定や塑性図による土の分類に用いられる。","土の圧密試験結果は，圧縮性と圧密速度が示され，圧縮ひずみと粘土層厚の積から最終沈下量の推定に用いられる。","土の含水比試験結果は，水と土粒子の質量の比で示され，乾燥密度と含水比の関係から透水係数の算定に用いられる。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":335},{"cat":"土木一般","year":"R8 No.7","q":"道路盛土等の構築にあたって，現場発生土を使用する場合の留意点に関する記述のうち，適当でないものはどれか。","opts":["透水性の良い砂質土等の材料は，排水材料に使用し，岩塊や礫質土は，排水処理と安定性向上のため，法尻に使用する。","支持力や施工性が確保できない材料は，現場内で発生する他の材料と混合したり，セメントや石灰による安定処理を行って使用する。","高含水比の材料は，なるべく薄く敷き均した後，十分な放置期間をとり，ばっ気乾燥を行うか，処理材を混合調整し使用する。","盛土の安定や沈下等が問題となる材料は，盛土の下層部になるべく厚く敷き均すか，法肩等に使用する。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":336},{"cat":"土木一般","year":"R8 No.8","q":"TS（トータルステーション）及び GNSS（全球測位衛星システム）を用いた盛土の情報化施工に関する記述のうち，適当でないものはどれか。","opts":["TS・GNSS を用いた盛土の締固め管理システムの適用にあたっては，地形条件や電波障害の有無等を事前に確認して採用するシステムを検討し，双方の適用が困難な範囲は従来の品質管理方法を用いる。","TS・GNSS を用いた盛土の締固め管理システムは，締固め機械の走行軌跡によって，締め固めたと判定される場所をブロック単位で示し，締固めの累積回数を示す機能を持つものとする。","盛土施工のまき出し厚や締固め回数は，複数の使用予定材料の中から代表的な材料を選定し事前に試験施工で決定する。","盛土材料をまき出す際には，盛土施工範囲の全面にわたって，試験施工で決定したまき出し厚以下となるよう，適切に管理する必要がある。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":337},{"cat":"土木一般","year":"R8 No.9","q":"土工における土量の変化率に関する記述のうち，適当でないものはどれか。","opts":["土量の変化率Lは，地山の土量に対するほぐした土量の体積比で示される。","土量の変化率Cは，地山の土量に対する掘削した土量の体積比で示される。","土量の変化率Lは，土の運搬計画を立てるときに用いられ，土の密度が大きい場合には積載重量によって運搬量が定まる。","土量の変化率Cは，各種の損失量を含めた変化率として，類似現場の実績を活用することが実用的である。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":338},{"cat":"土木一般","year":"R8 No.10","q":"軟弱地盤対策工法に関する記述のうち，適当でないものはどれか。","opts":["サンドドレーン工法は，透水性の高い砂を用いた砂柱を地盤中に鉛直に造成することにより，水平方向の排水距離を短くして圧密を促進し，地盤の強度増加を図る。","プレロード工法は，軟弱地盤の処理を行わない代わりに，圧密の進行に合わせ時間をかけてゆっくり盛土することで，地盤の強度増加を進行させて安定を図る。","バイブロフローテーション工法は，棒状のバイブロフロットを地盤中で振動させながら水を噴射し，水締めと振動により地盤を締め固め，同時に，生じた空隙に砂利等を補給して，砂質土地盤の支持力増大及び液状化防止を図る。","表層混合処理工法は，表層部分の軟弱なシルト・粘土と固化材（セメントや石灰等）とを攪拌混合し改良することにより，地盤の安定やトラフィカビリティーの改善等を図る。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":339},{"cat":"土木一般","year":"R8 No.11","q":"コンクリートに用いる粗骨材の品質に関する記述のうち，適当でないものはどれか。","opts":["粗骨材として用いる砕石は，吸水率が5 ％以下である。","粗骨材として用いる砂利は，一般に絶乾密度が 2.5 g/cm³以上である。","舗装コンクリートに用いる粗骨材の品質を評価する試験方法として，ロサンゼルス試験機による粗骨材のすりへり試験がある。","凍結融解の繰返しに対する骨材の抵抗性を評価する試験方法として，硫酸ナトリウムによる骨材の安定性試験がある。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":340},{"cat":"土木一般","year":"R8 No.12","q":"コンクリートに用いるセメントに関する記述のうち，適当でないものはどれか。","opts":["普通ポルトランドセメントと高炉セメントの生産量の合計は，全セメントの約9 割を占めている。","高炉セメントＢ種は，ポルトランドセメントと高炉スラグで構成されており，質量で 15 ％程度の高炉スラグを含む。","早強ポルトランドセメントは，初期強度を要するプレストレストコンクリート工事等に使用される。","中庸熱ポルトランドセメントは，水和熱を抑制することが求められるダムコンクリート工事等に使用される。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":341},{"cat":"土木一般","year":"R8 No.14","q":"コンクリートの打込みに関する記述のうち，適当でないものはどれか。","opts":["打込みの計画では，打重ね時間間隔は，コンクリートが予定の時刻に届かない場合も想定して，余裕をもった計画を立てることが重要である。","集中豪雨は，ほとんどが積乱雲の発生に起因するものであるため，現場においては，雲の種類，動き，風の変化等にも気を配る必要がある。","高さのある壁又は柱において，1 回の打上がり高さと打上がり速度は，一般には，コンクリートの打上がり速度を 30 分当たり 1.5 m 程度以下とする。","打込みを行う1 層の高さは，棒状バイブレータを下層のコンクリートまで挿入して上層と下層が一体化できる高さを超えないよう，一般に，1 m 程度以下とする。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":342},{"cat":"土木一般","year":"R8 No.15","q":"コンクリートの養生に関する記述のうち，適当でないものはどれか。","opts":["混合セメントＢ種を用いたコンクリートの養生では，普通ポルトランドセメントを用いたコンクリートより湿潤養生期間を長くする必要がある。","膨張材を用いた収縮補償用コンクリートは，乾燥収縮ひび割れが発生しにくいので，一般的に早強ポルトランドセメントを用いたものより湿潤養生期間を短縮することができる。","コンクリートの強度がある程度発現し，かつ温度が降下するまではせき板を存置し，その後，せき板を取り外して湿潤養生を実施する。","マスコンクリートでは，施工面積が広いため，仕上げ後の乾燥によるプラスティック収縮ひび割れの発生に注意する。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":343},{"cat":"土木一般","year":"R8 No.16","q":"暑中コンクリートに関する記述のうち，適当でないものはどれか。","opts":["暑中コンクリートとして施工計画を立て施工を行うのは，日平均気温が 30 ℃を超えることが予想される場合である。","暑中コンクリートで，練上がりコンクリートの温度を低くするために，なるべく低い温度の練混ぜ水を用いるのが効果的である。","暑中コンクリートでは，コールドジョイントの発生防止のため，減水剤，AE 減水剤については，遅延形のものを用いる。","暑中コンクリートでは，練混ぜ後できるだけ早い時期に打ち込まなければならないことから，練混ぜから打ち終わりまでの時間は 1.5 時間以内を原則とする。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":344},{"cat":"土木一般","year":"R8 No.17","q":"道路橋で用いられる基礎形式の種類とその特徴に関する記述のうち，適当でないものはどれか。","opts":["直接基礎の場合，鉛直荷重に対しては，基礎底面地盤の鉛直地盤反力のみで抵抗させなければならない。","ケーソン基礎の場合，鉛直荷重に対しては，基礎底面地盤の鉛直地盤反力のみで抵抗させることを原則とする。","杭基礎の場合，鉛直荷重及び水平荷重に対しては，杭のみで抵抗させることを原則とする。","鋼管矢板基礎の場合，水平荷重に対しては，基礎底面地盤のみで抵抗させなければならない。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":345},{"cat":"土木一般","year":"R8 No.18","q":"既製杭の施工に関する記述のうち，適当なものはどれか。","opts":["中掘り杭工法の先端処理方法のセメントミルク噴出攪拌方式は，所定深度まで杭を沈設後ただちに，セメントミルクを噴出して根固め部を築造する。","中掘り杭工法の先端処理方法の最終打撃方式は，中掘りから打込みへの切替は，支持層に到達した後に行うことを原則とする。","プレボーリング杭工法では，あらかじめ推定した支持層にオーガ先端が近づいたら，オーガ回転数や推進速度をできるだけ速くして施工することが必要である。","プレボーリング杭工法の掘削は，掘削液を掘削ヘッドの先端から吐出して地盤の掘削抵抗を増大させると共に孔内を泥土化し，孔壁を軟化させながら行う。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":346},{"cat":"土木一般","year":"R8 No.19","q":"場所打ち杭工法の施工に関する記述のうち，適当でないものはどれか。","opts":["リバース工法では，トレミーによる孔底処理を行うことから，鉄筋かごを吊った状態でコンクリートを打ち込むのが一般的である。","リバース工法では，安定液のように粘性のあるものを使用しないため，一次孔底処理により泥水中のスライムはほとんど処理できる。","オールケーシング工法では，コンクリート打込み完了後，ケーシングチューブ等を引き抜く際にコンクリートの天端が下がるので，あらかじめ下がり量を考慮する。","オールケーシング工法の掘削では，孔壁の崩壊防止等のために，ケーシングチューブの先端が常に掘削底面より上方にあるようにする。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":347},{"cat":"土木一般","year":"R8 No.20","q":"各種土留め工の特徴に関する記述のうち，適当なものはどれか。","opts":["自立式土留めは，掘削側の地盤の抵抗によって土留め壁を支持する工法で，土留め壁の変形が小さく，掘削面内に支保工がないために掘削は容易である。","切梁式土留めは，切梁，腹起し等の支保工と掘削側の地盤の抵抗によって土留め壁を支持する工法で，掘削面積が広い場合，支保工が増える。","アンカー式土留めは，土留めアンカーの定着のみで土留め壁を支持する工法で，掘削周辺にアンカーの打設が可能な敷地が必要である。","控え杭タイロッド式土留めは，控え杭と土留め壁をタイロッドでつなげ，これと地盤の抵抗により土留め壁を支持する工法で，軟弱で深い地盤の掘削に適する。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":348},{"cat":"専門土木","year":"R8 No.21","q":"鋼道路橋の架設作業上の留意事項に関する記述のうち，適当でないものはどれか。","opts":["架設中は，安全で正確な進行を確認するため，桁のたわみの測量を行うが，片持ち式工法の場合は，後からの修正が容易なので，途中段階の確認は省略し最終段階で確認する。","部材の玉掛けを行う場合は，その部材及び吊金具に過大な応力や変形が生じないように配慮して，適切な吊り形式により作業を行わなければならない。","Ｉ形断面部材を仮置きする場合は，転倒と横倒れ座屈に対して十分に配慮すると共に，地面に接しないこと，他部材との接触，積重ねによる損傷，汚れ，腐食に対する養生を行う。","ジャッキに用いる転倒防止用台座は，鉛直荷重のほか規定の水平荷重を安全に支持できる強度を有していなければならない。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":349},{"cat":"専門土木","year":"R8 No.22","q":"鋼道路橋の溶接施工上の留意事項に関する記述のうち，適当でないものはどれか。","opts":["部材を組み立てる場合の材片の組合せ精度は，継手部の応力伝達が円滑に行われ，かつ継手性能を満足するものでなければならない。","完全溶込み開先溶接による溶接継手は，原則として，反対側からの溶接を行う前に健全な溶接層まで裏はつりを行う。","完全溶込み開先溶接からすみ肉溶接に変化する場合等，溶接線内で開先形状が変化する場合には，開先形状の遷移区間を設けなければならない。","溶接割れの検査は，溶接線全線を対象として肉眼で行うのを原則とし，判定が困難な場合には，超音波探傷試験を行う。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":350},{"cat":"専門土木","year":"R8 No.23","q":"耐候性鋼橋に関する記述のうち，適当なものはどれか。","opts":["耐候性鋼橋に用いる耐候性鋼材は，鋼材表面に緻密な錆層を形成させ，これが鋼材表面を保護することで鋼材の腐食による板厚減少を促進させるものである。","耐候性鋼橋に用いる高力ボルトは，主要構造部材と同等以上の耐候性能を有するステンレスボルトを使用する。","耐候性鋼橋全体の腐食に対する耐久性を均一化するため，環境条件の悪い桁端部に塗装等の防食法を施す検討を行う。","耐候性鋼橋の施工管理における付着塩分量の検査は，補修作業ができる状態にある製作完了時点のみで実施する。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":351},{"cat":"専門土木","year":"R8 No.24","q":"コンクリートのアルカリシリカ反応抑制対策に関する記述のうち，適当でないものはどれか。","opts":["砕石，砕砂，砂利，砂のアルカリシリカ反応性試験は，6 か月に1 回以上の頻度で行うことが標準である。","アルカリシリカ反応性試験で有害な骨材を無害な骨材と混合すると，混合割合にかかわらず常にアルカリシリカ反応を抑制することができる。","アルカリシリカ反応抑制対策として，コンクリート中のアルカリ総量を抑制する場合は，コンクリート1 m³中に含まれるアルカリ総量を Na²O 換算で 3.0 kg 以下にする。","海洋環境や凍結防止剤の影響を受ける地域で，無害でないと判定された骨材を用いる場合は，外部からのアルカリ金属イオンや水分の侵入を抑制する対策を行うとよい。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":352},{"cat":"専門土木","year":"R8 No.25","q":"塩害を受けた鉄筋コンクリート構造物への対策や補修に関する記述のうち，適当でないものはどれか。","opts":["表面被覆を行って外部からの塩化物イオンの浸透を防ぐ場合，適用前にコンクリート中に既に浸透している塩化物イオンの再拡散に対する検討も必要である。","表面処理工法の適用後からの残存予定供用期間が長い場合には，表面処理材の再塗布を計画しておく必要がある。","劣化が顕在化した箇所に部分的に断面修復工法を適用すると，断面修復箇所と断面修復していない箇所の境界部付近においてマクロセル腐食が生じる可能性がある。","電気防食工法を適用し短期間の通電を行うだけで，その後も長期間にわたって充分な防食効果が継続できる。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":353},{"cat":"専門土木","year":"R8 No.26","q":"河川堤防の盛土施工に関する記述のうち，適当でないものはどれか。","opts":["築堤土は，粗い粒度から細かい粒度までが適当に配合されたものがよく，土質分類上は粘性土，砂質土，高有機質土が適度に含まれていれば締固めを満足する施工ができる。","嵩上げや拡幅に用いる堤体材料は，表腹付けには既設堤防より透水性の小さい材料を，裏腹付けには既設堤防より透水性の大きい材料を使用するのが原則となる。","既設の堤防に腹付け盛土を行う場合は，新旧法面をなじませるため段切りを行うと共に，段切り面の水平部分には横断勾配をつけることで施工中の排水に注意する。","築堤盛土の締固めは，堤防法線に平行に行うことが望ましく，締固めに際しては締固め幅が重複するように常に留意して施工する。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":354},{"cat":"専門土木","year":"R8 No.27","q":"河川護岸における根固工に関する記述のうち，適当でないものはどれか。","opts":["かご系の根固工は，屈撓性があり多孔質であるため，河床変動を抑制すると共に水際の多様化にも適している。","捨石工の施工は，土砂の吸出し防止のために表層に小さな石を用い，内側に栗石又は砂礫が用いられる。","ふとんかごは，上流から下流まで適用可能で，一般に施工が簡単で工費も安く，水深のあまり深くない箇所でよく用いられる。","異形コンクリートブロックの層積みの施工は，河床整正を行って積み上げるので，水深が深くなると施工は困難となる。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":355},{"cat":"専門土木","year":"R8 No.28","q":"樋門・樋管の施工に関する記述のうち，適当でないものはどれか。","opts":["樋門・樋管を施工する場合，取付け盛土等が容易に施工できるよう既設堤防の開削は大きくすることが望ましいが，河川管理の観点からは開削は極力小さくすることが望ましい。","樋門・樋管を施工する場合の床付け面は，堤防開削による荷重の除去に伴って緩むことが多いので，乱さないで施工すると共に転圧を行わないことが望ましい。","柔構造樋門では，施工途中で沈下が進行するので，構造物の高さを設計値で管理することは一般的に困難であるため，定期的に計測してその動態を記録しておく必要がある。","樋門本体の沈下形状を設計で想定した沈下形状に近づけるためには，盛土を函軸に沿って水平に盛り上げる必要がある。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":356},{"cat":"専門土木","year":"R8 No.29","q":"砂防堰堤の施工に関する記述のうち，適当なものはどれか。","opts":["砂礫の上にコンクリートを打ち込む場合は，転石等の泥を洗浄し，基礎面は十分水切りを行って泥濘によるコンクリート汚染が起こらないよう注意しなければならない。","岩盤にコンクリートを打ち込む場合は，岩盤清掃を行うと共に，湧水，漏水の処理を行い，打設前に岩盤表面を十分乾燥させる。","基礎地盤が砂礫の場合は，比較的水深が浅く，施工上の安全性に問題が無ければ，水中掘削を行ってもよい。","基礎地盤の透水性に問題がある場合は，グラウト等の止水工により改善を図り，また，パイピングに対しては，止水壁や水抜き暗渠等を設けて改善を図るのが一般的である。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":357},{"cat":"専門土木","year":"R8 No.30","q":"渓流保全工に関する記述のうち，適当でないものはどれか。","opts":["渓流保全工は，洪水流の乱流や渓床高の変動を抑制するための縦工，及び側岸侵食を防止するための横工を組み合わせて設置する。","床固工は，コンクリートを打ち込むことにより構築される場合が多いが，地すべり地等のように柔軟性が必要なところでは，枠工や蛇かごによる床固工を設置する。","帯工は，床固工間隔が大きい場合，局所的洗掘により河岸に悪影響を及ぼすことから，計画河床の維持を目的に設置する。","護岸工は，温度変化や乾燥収縮により膨張・収縮が生じ，コンクリートにひび割れが生じることがあるため，一般的に一定間隔ごとに伸縮目地を設置する。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":358},{"cat":"専門土木","year":"R8 No.31","q":"急傾斜地崩壊防止工に関する記述のうち，適当でないものはどれか。","opts":["切土工は，斜面の不安定な土層，土塊をあらかじめ切り取ったり，斜面を安定勾配まで切り取る工法であり，切土した斜面の表面には，侵食防止等のため，法面保護工を設置する。","コンクリート張工は，斜面の風化，侵食及び崩壊等の防止を目的とするもので，設計においては，一般的に土圧を考慮しないものとする。","落石対策工のうち落石予防工は，発生した落石を斜面下部や中部で止めるものであり，落石防護工は，斜面上の転石の除去等，落石の発生を防ぐものである。","擁壁工は，斜面下部の安定，小規模崩壊の抑止等を目的として設けられ，施工時にできるだけ斜面下端の切土が生じないような位置に設置する。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":359},{"cat":"専門土木","year":"R8 No.32","q":"道路のアスファルト舗装における路床の施工に関する記述のうち，適当なものはどれか。","opts":["安定処理工法は，所定量の安定材を均等に散布したのち，適切な混合機械を用いて所定の深さまで混合し，混合むらが生じた場合は再混合する。","切土路床は，路床面下1 m 以内に木根，転石等といった路床の均一性を損なうものがあれば，これらを必ず取り除いてから仕上げる。","盛土路床は，使用する盛土材の性質をよく把握した上で均一に敷き均して十分に締め固める必要があり，その1 層の敷均し厚さは仕上り厚で1 m 以下を目安とする。","置換え工法は，原地盤を所定の深さまで掘削し，置換え土と掘削面を付着させるため掘削面をよくかきほぐしながら，良質土を敷き均し，締め固めて仕上げる。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":360},{"cat":"専門土木","year":"R8 No.33","q":"道路のアスファルト舗装における路盤の施工に関する記述のうち，適当でないものはどれか。","opts":["セメント安定処理路盤の施工では，締固め直後に交通開放する場合は，含水比を一定に保つと共に，表面を保護する目的で必要に応じてアスファルト乳剤等を散布するとよい。","石灰安定処理路盤の施工では，安定処理材料を均一に敷き均した後，締め固めて仕上げるときは，最適含水比よりやや湿潤状態で締め固めるとよい。","加熱アスファルト安定処理路盤の施工では，下層の路盤面にタックコートを施す必要があり，寒冷期等においては，養生期間の短縮のため加温して散布する。","粒状路盤の施工では，降雨等により路盤材料が著しく水を含み締固めが困難な場合には，晴天を待ってばっ気乾燥を行う。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":361},{"cat":"専門土木","year":"R8 No.34","q":"道路のアスファルト舗装における基層・表層の施工に関する記述のうち，適当でないものはどれか。","opts":["ローラへのアスファルト混合物の付着防止に軽油を使用すると，アスファルト混合物をカットバックする性質を持っているため，必要に応じて非石油系の付着防止剤を使用する。","夏期や夜間作業で作業時間に制約がある場合等には，舗装冷却機械等による強制的な冷却により温度を低下させる方法や，中温化技術の適用等について検討する。","施工の終了時又はやむを得ず施工を中断する場合は，道路の横断方向に設ける継目で仕上りの良否が走行性に直接影響を与えるので，横継目は平坦に仕上げるように留意する。","加熱アスファルト混合物の締固めは，一般にアスファルトフィニッシャ側にローラの案内輪を向け，横断勾配の低い方から高い方へ向かい，順次幅寄せしながら低速かつ等速で転圧する。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":362},{"cat":"専門土木","year":"R8 No.35","q":"道路のアスファルト舗装の補修工法に関する記述のうち，適当でないものはどれか。","opts":["オーバーレイ工法は，既設舗装上にアスファルト混合物の層を重ねる工法で，ひび割れが生じている路面に適用するときは，必要に応じてシール材注入やリフレクションクラック対策を行う。","表層・基層打換え工法は，既設舗装を表層又は基層まで打ち換える工法で，コンクリート床版に不陸があって舗装厚が一定でない場合，床版も適宜切削して不陸をなくしておく。","薄層オーバーレイ工法は，既設舗装上に薄層の加熱アスファルト混合物を舗設する工法であり，予防的維持工法として用いられることがある。","切削工法は，舗装表面に連続的あるいは断続的に凹凸が発生して平坦性が極端に悪くなった場合にその部分を機械により削り取る工法で，応急的処置のため早期に凹凸が再発するおそれがある。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":363},{"cat":"専門土木","year":"R8 No.36","q":"道路の排水性舗装の施工に関する記述のうち，適当なものはどれか。","opts":["タックコートには，原則として混合用アスファルト乳剤を使用し，所定量を均一に散布し養生することで，舗設する混合物層とその下層の接着を良くするために行う。","舗設にあたっては，異種の混合物を二層同時に敷き均せるアスファルトフィニッシャや，タックコートの散布装置を備えたアスファルトフィニッシャが使用されることがある。","ポーラスアスファルト混合物の締固めは，所定の締固め度を，初転圧及び二次転圧のコンバインドローラによる締固めで確保することが望ましい。","ポーラスアスファルト混合物は，粗骨材が多いのですりつけが難しく，骨材も飛散しやすいので，すりつけ最大厚さは粗骨材の最大粒径未満とする。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":364},{"cat":"専門土木","year":"R8 No.37","q":"道路のコンクリート舗装の施工に関する記述のうち，適当でないものはどれか。","opts":["スリップフォーム工法により連続鉄筋コンクリート版を施工する場合は，コンクリートの敷均し，締固め，荒仕上げ，平坦仕上げを一台の施工機械で行う。","コンクリートの後期養生は，その期間中，養生マット等を用いてコンクリート版表面を隙間なく覆い，完全に湿潤状態になるように散水する。","暑中におけるコンクリート舗装の施工では，型枠や路盤等を冷やすために支障にならない程度に散水したり，舗設したコンクリート面にフォグスプレイ等を行うことも効果的である。","セットフォーム工法による普通コンクリート版の施工は，全体ができるだけ均等な密度になるように，適切な余盛りをつけ，コンクリートフィニッシャを用いてコンクリートを敷き均す。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":365},{"cat":"専門土木","year":"R8 No.38","q":"ダムの基礎掘削に関する記述のうち，適当でないものはどれか。","opts":["掘削計画面から3 m 付近の粗掘削は，小ベンチ発破工法等により施工し，基礎地盤への損傷を少なくするよう配慮する。","基礎掘削は，予期しない断層等が現れた場合は掘削線の変更や基礎処理を施さなければならないが，掘削計画面より上に所要強度の地盤が現れた場合でも，計画面まで掘削する。","仕上げ掘削は，一般に掘削計画面から 50 cm 程度残した部分を，火薬を使用せずに小型ブレーカや人力により仕上げる掘削で，粗掘削と切り離して施工する。","堤敷外の掘削面は，施工中や完成後の法面の安定性や経済性を考慮すると共に，景観や緑化にも配慮して定める必要がある。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":366},{"cat":"専門土木","year":"R8 No.40","q":"トンネルの山岳工法における掘削工法に関する記述のうち，適当なものはどれか。","opts":["導坑先進工法は，導坑をトンネル断面内に設ける場合には，前方の地質確認や水抜き等の効果があり，導坑位置によって，頂設導坑，中央導坑，底設導坑等がある。","全断面工法は，地質が安定した地山等で採用され，施工途中での地山条件の変化に対する順応性が高い。","中壁分割工法は，小断面掘削の場合に多く用いられ，左右どちらか片側半断面を先進掘削し，反対側半断面を遅れて掘削する。","ベンチカット工法は，一般に上部半断面と下部半断面に分割して掘削する工法であり，地山が不良な場合にベンチ長を長くする。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":367},{"cat":"専門土木","year":"R8 No.41","q":"トンネルの山岳工法における覆工コンクリートに関する記述のうち，適当でないものはどれか。","opts":["覆工コンクリートの打込みは，原則として，トンネル掘削後に地山の内空変位が収束する前に行う。","覆工コンクリートの締固めは，コンクリートのワーカビリティーが低下しないうちに，上層と下層が一体となるように行う。","覆工コンクリートの型枠の取外しは，打ち込んだコンクリートが自重等に耐えられる強度に達した後に行う。","覆工コンクリートの養生は，硬化に必要な温度及び湿度を保ち，有害な作用の影響を受けないよう適切な期間にわたり行う。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":368},{"cat":"専門土木","year":"R8 No.42","q":"海岸保全施設の養浜の施工に関する記述のうち，適当でないものはどれか。","opts":["養浜の投入土砂に養浜場所にある砂よりも粗な粒形を用いた場合，その平衡勾配が大きいため沖向きの急速な移動が起こる。","養浜の施工方法は，養浜材の採取場所，運搬距離，社会的要因等を考慮して，最も効率的で周辺環境に影響を及ぼさない工法を選定する。","養浜の陸上施工においては，工事用車両の搬入路の確保や，投入する養浜砂の背後地への飛散等，周辺への影響について十分検討し施工する。","養浜材は，あらかじめ汚濁の発生源となるシルト，有機物，ごみ等を取り除く等，汚濁の発生防止に努めると共に，周辺海域において定期的に水質観測を実施する。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":369},{"cat":"専門土木","year":"R8 No.43","q":"海岸堤防の施工に関する記述のうち，適当でないものはどれか。","opts":["海上工事となる場合は，施工による海水の濁りの問題が生じる場合もあるので，現場の施工条件に対する考慮が重要である。","強度の低い地盤に堤防を施工せざるを得ない場合には，必要に応じて押え盛土，地盤改良等を考慮する。","堤体の盛土材料には，原則として粘土を含まない粒径のそろった砂質又は砂礫質のものを使い，適当な含水量の状態で，各層，全面にわたり均等に締め固める。","堤体の裏法勾配は，堤体の安全性を考慮して定め，堤防の直高が大きい場合には，法面が長くなるため，小段の設置等の配慮が必要である。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":370},{"cat":"専門土木","year":"R8 No.44","q":"港湾の防波堤の施工に関する記述のうち，適当でないものはどれか。","opts":["ブロック式直立堤は，施工が確実で容易であり，施工設備が簡単であるが，海上作業期間は一般的に長く，ブロック数が多い場合には，広い製作用地を必要とする。","混成堤は，石材等の資材の入手の難易度や価格等を比較し，捨石部と直立部の高さの割合を調整して，経済的な断面とすることができる。","傾斜堤は，施工設備が簡単であるが，直立堤に比べて施工時の波の影響を受け易いので，施工管理に注意を要する。","ケーソン式直立堤は，本体製作をドライワークで行うことができるため，施工が確実であるが，荒天日数の多い場所では施工日数に著しい制限を受ける。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":371},{"cat":"専門土木","year":"R8 No.45","q":"水中コンクリートに関する記述のうち，適当でないものはどれか。","opts":["水中コンクリートの打込みは，打上りの表面をなるべく水平に保ちながら所定の高さ又は水面上に達するまで，連続して打ち込むものとする。","一般の水中コンクリートでは，材料分離抵抗性を高めて圧縮強度の低下を小さくするためには，細骨材率を大きくすることも効果的である。","水中不分離性コンクリートの打込みは，コンクリートポンプあるいはトレミーを用いて行うが，筒先を打ち込まれたコンクリートに挿入しないで打ち込むことが望ましい。","水中不分離性コンクリートは，一般の水中コンクリートよりも，トレミー1 本あたりで打ち込むことのできる面積を大きくすることができる。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":372},{"cat":"専門土木","year":"R8 No.46","q":"鉄道の路盤の施工に関する記述のうち，適当でないものはどれか。","opts":["コンクリート路盤相互の連結部となる伸縮目地は，列車荷重等によるせん断力の伝達を円滑に行い，目違いの生じない構造としなければならない。","コンクリート路盤の施工は，盛土自身の沈下等による路盤や軌道の変状の影響を極力少なくするために，盛土施工後に速やかに実施しなければならない。","路床面は，雨水による水たまりができて表面の排水が阻害されるような有害な不陸がないように，できる限り平坦に仕上げる。","粒度調整砕石層の締固めは，ロードローラ又は振動ローラ等にタイヤローラを併用し，所定の密度が得られるまで十分に締め固める。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":373},{"cat":"専門土木","year":"R8 No.47","q":"鉄道の軌道における維持管理に関する記述のうち，適当でないものはどれか。","opts":["スラブ軌道は，列車通過による軌道変位が生じやすいため，日常的な保守が必要であるが，地盤沈下等が生じても軌道整備で補修できるメリットがある。","軌道変位の増大は，脱線事故につながる可能性があるため，定期的な検測等により，軌道変位の状態を常に把握し，不良箇所に対し速やかに適切な補修を行う。","レールの損傷原因は，レールの製造不良，軌道の保守不良，長期間使用による疲労，腐食等があげられ，一般的には，二つ以上の原因が競合し発生する。","レールの摩耗は，直線区間ではレール頭部に，また，曲線区間では曲線の外側レールに顕著に生じる。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":374},{"cat":"専門土木","year":"R8 No.48","q":"鉄道（在来線）の営業線及びこれに近接して工事を施工する場合の保安対策に関する記述のうち，適当でないものはどれか。","opts":["線閉責任者は，工事管理者等に，列車又は車両の運転に支障がないことを確認すると共に，自らも作業区間における建築限界内支障物の確認を行う。","列車見張員は，停電時刻の 10 分前までに，電力指令に作業の申込みを行い，き電停止の要請を行う。","建設用大型機械の留置場所は，直線区間の建築限界の外方1 m 以上離れた場所で，かつ列車の運転保安及び旅客公衆等に対し，安全な場所とする。","踏切と同種の設備を備えた工事用通路には，工事用しゃ断機，列車防護装置，列車接近警報機を備えておくものとする。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":375},{"cat":"専門土木","year":"R8 No.49","q":"シールド工法の施工管理に関する記述のうち，適当でないものはどれか。","opts":["泥水式シールド工法において，切羽の安定を図るためには，泥水品質の調整及び切羽泥水圧と掘削土量管理を慎重に行わなければならない。","セグメントの組立は，所定の内空を確保するために正確かつ堅固に施工し，セグメントの目開きや目違い等の防止について，精度の高い管理を行う。","切羽土圧や水圧等の外力に対してチャンバー圧が小さい場合には地盤隆起が，大きい場合には地盤沈下が生じるため，外力に見合うチャンバー圧の管理を行わなければならない。","地盤変位の低減を図るため，掘進時にトンネル中心線上とその両側の範囲に測点を設けて水準測量を行い，測量結果を後続区間の施工管理に活用する。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":376},{"cat":"専門土木","year":"R8 No.50","q":"鋼構造物塗装の施工管理に関する記述のうち，適当でないものはどれか。","opts":["ブラスト加工された鋼材面は，錆の発生が遅くなるので，ブラスト後は一定期間，鋼材面の状態を観察したのちに塗料を塗付する。","塗料は，製造後長期間経過すると密封した缶内でも品質に変化が生じることになるので，開缶時に固化等の変状の有無を確認する必要がある。","塗料を，塗装作業時の気温，塗付方法，塗付面の状態に適した塗料粘度に調整する場合は，塗料に適したシンナーで適切に希釈する必要がある。","塗装を塗り重ねる場合の塗装間隔は，付着性を良くし良好な塗膜を得るために重要な要素であり，塗料ごとに定められている。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":377},{"cat":"専門土木","year":"R8 No.51","q":"上水道管の更新・更生工法に関する記述のうち，適当なものはどれか。","opts":["既設管内巻込工法は，縮径した巻込鋼管を引き込み，管内で拡管・溶接し，既設管と新管の間にモルタル等を注入し重層構造とする工法で，更新管路は既設管に近い管径を確保することができるが，曲がりへの対応が難しい。","被覆材管内装着工法は，接着剤を塗布した薄肉状の管を引き込み，空気圧等で管内面に圧着させてから加熱してライニング層を形成させる工法で，管の形状に対する追随性が悪く，曲線部の施工が困難である。","合成樹脂管挿入工法は，やや管径の小さい合成樹脂管を挿入して，管内面と合成樹脂管外面との間隙にセメントミルク等を圧入して重層構造とする工法で，管の補強が図られ，また，管内面は平滑であるため流速係数も小さい。","既設管内挿入工法は，既設管をさや管として使用し，新管を挿入し既設管内面と新管外面との間隙にモルタル等を注入して重層構造とする工法で，挿入する新管は既設管の管径や屈曲によって適用条件が異なるため管種や口径等の検討が必要である。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":378},{"cat":"専門土木","year":"R8 No.52","q":"下水道管渠の更生工法に関する記述のうち，適当でないものはどれか。","opts":["更生工法は，既設管渠に破損，クラック，腐食等が発生し，耐荷性能や耐久性能，流下能力等が保持できなくなった場合に，既設管渠の内面に新たに管を構築する工法である。","更生工法に用いる自立管は，更生材単独で自立できるだけの強度を発揮させ，新管と同等以上の耐荷性能及び耐久性能等を有するものである。","反転工法は，既設管渠より小さな管径で工場製作された二次製品を牽引挿入し，間隙にモルタル等の充塡材を注入することで更生管渠を構築する。","製管工法は，既設管渠内に硬質塩化ビニル樹脂材等をかん合し，その樹脂パイプと既設管渠との間隙にモルタル等の充塡材を注入することで更生管渠を構築する。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":379},{"cat":"専門土木","year":"R8 No.53","q":"小口径管推進工法の施工に関する記述のうち，適当でないものはどれか。","opts":["オーガ式は，粘性土地盤では推進中に先端抵抗力が急増する場合があるので，注水により切羽部の土を軟弱にする等の対策が必要である。","ボーリング式は，先導体前面が開放しているので，地下水位以下の砂質地盤に対しては，補助工法により地盤の安定処理を行った上で適用する。","圧入式は，排土しないで土を推進管周囲へ圧密させて推進するため，適用地盤の土質に留意すると同時に，推進路線に近接する既設建造物に対する影響にも注意する。","泥水式は，透水性の低く固い地盤では，泥水圧が有効に切羽に作用しない場合があるので，送泥水の比重，粘性を高くし，状況によっては逸泥防止材を使用する。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":380},{"cat":"専門土木","year":"R8 No.54","q":"薬液注入工事の施工管理に関する記述のうち，適当でないものはどれか。","opts":["薬液注入工事における削孔時の施工管理項目には，深度，角度及び削孔水の状態の管理があり，特に削孔中に地表に戻ってくる削孔水の状態や色等の観察を行う。","薬液注入工事における注入時の管理を適正な配合とするためには，ゲル化時間（ゲルタイム）を原則として作業中に測定する。","薬液注入工事による埋設物の損傷等の防止として，埋設管がある深度においては，ロータリーによるボーリングを避け，ジェッテングによる削孔を行う。","薬液注入工事においては，注入した薬液が地表に噴き出すこともあり，この現象が確認された場合は直ちにプラントへ連絡して，注入を中止し薬液の拡散防止の対応措置を行う。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":381},{"cat":"法規","year":"R8 No.55","q":"労働基準法令上，労働者に支払う賃金に関する記述のうち，誤っているものはどれか。","opts":["賃金とは，賃金，給料，手当，賞与その他名称の如何を問わず，労働の対償として使用者が労働者に支払うすべてのものをいう。","使用者は，労働者が出産，疾病，災害など非常の場合の費用に充てるために請求する場合においては，支払期日前であっても，既往の労働に対する賃金を支払わなければならない。","出来高払制その他の請負制で使用する労働者については，使用者は，労働時間に応じ一定額の賃金を保障しなければならない。","使用者は，前借金その他労働することを条件とする前貸の債権と労働者に支払う賃金を相殺することができる。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":382},{"cat":"法規","year":"R8 No.56","q":"労働基準法令上，労働時間，休憩及び休日に関する記述のうち，誤っているものはどれか。","opts":["使用者は，労働者に対して，労働時間が6 時間を越える場合においては少なくとも 45 分，8時間を越える場合においては少なくとも1 時間の休憩時間を労働時間の途中に，原則として一斉に与えなければならない。","使用者は，災害その他避けることのできない事由によって，臨時の必要がある場合においては，行政官庁の許可を受けて，その必要の限度において，法令で定められた労働時間を延長し，又は休日に労働させることができる。","使用者は，有給休暇の日数が 10 労働日以上である労働者に対して，有給休暇の日数のうち5 日については，原則として1 年以内の期間に，労働者ごとにその時季を定めることにより与えなければならない。","使用者は，労働者の過半数で組織する労働組合との協定で定めるところによって労働させる場合であっても，1 箇月について労働時間を延長して労働させ，及び休日において労働させた時間は 120 時間未満であることを要件とする。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":383},{"cat":"法規","year":"R8 No.57","q":"労働安全衛生法令上，作業主任者の選任を必要とする作業に関する記述のうち，正しいものはどれか。","opts":["高さが2 m の構造の足場の組立て，解体又は変更の作業","高さが2 m のコンクリート造の工作物の解体又は破壊の作業","高さが3 m の掘削面の地山の掘削（ずい道及びたて坑以外の坑の掘削を除く。）の作業","高さが3 m の橋梁の上部構造で金属製の部材で構成されるものの架設，解体又は変更の作業"],"ans":2,"ex":"","src":"20260706_1kyu","qid":384},{"cat":"法規","year":"R8 No.58","q":"労働安全衛生法令上，高さが5 m 以上のコンクリート造の工作物の解体等の作業における危険を防止するために，事業者が行わなければならない措置に関する記述のうち，誤っているものはどれか。","opts":["事業者は，作業区域内に当該作業に関係する者以外の者が立ち入ることについて，禁止する旨を見やすい箇所に表示し，禁止しなければならない。","事業者は，物体の飛来又は落下による労働者の危険を防止するため，当該作業に従事する労働者に保護帽を着用させなければならない。","事業者は，強風，大雨，大雪等の悪天候のため，作業の実施について危険が予想される時は，安全を確保したうえで当該作業を行なわなければならない。","事業者は，外壁，柱等の引倒し等の作業を行うときは，引倒し等について一定の合図を定め，関係労働者に周知させなければならない。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":385},{"cat":"法規","year":"R8 No.59","q":"建設業法令上，主任技術者及び監理技術者に関する記述のうち，誤っているものはどれか。","opts":["建設業者は，公共性のある施設等重要な建設工事で政令の定めるものについては，主任技術者又は監理技術者を工事現場ごとに専任させなければならないが，当該監理技術者の行うべき法令上の職務を補佐する者として，政令で定める者を専任で置く場合の当該監理技術者については，この限りではない。","専任の者でなければならない監理技術者は，政令の規定による監理技術者資格者証の交付を受けている者であって，政令の規定により国土交通大臣の登録を受けた講習を受講したもののうちから選任しなければならない。","主任技術者及び監理技術者は，施工計画の作成，工程管理，品質管理その他の技術上の管理及び当該建設工事に関する下請契約の締結を行わなければならない。","工事現場における建設工事の施工に従事する者は，主任技術者又は監理技術者がその職務として行う指導に従わなければならない。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":386},{"cat":"法規","year":"R8 No.60","q":"建設業法令上，建設工事の請負契約に関する記述のうち，誤っているものはどれか。","opts":["元請負人は，請負代金の出来形部分に対する支払又は工事完成後における支払を受けたときは，下請負人が施工した出来形部分に相応する下請代金のうち，材料費に相当する部分については，現金で支払うよう適切な配慮をしなければならない。","建設業者は，建設工事の請負契約を締結するに際して，工事の種別ごとの材料費，労務費その他の経費の内訳並びに工事の工程ごとの作業及びその準備に必要な日数を明らかにして，建設工事の見積りを行うよう努めなければならない。","注文者は，その注文した建設工事を施工するために通常必要と認められる期間に比して著しく短い期間を工期とする請負契約を締結してはならない。","特定専門工事の元請負人及び下請負人は，その合意により，元請負人が下請負人の主任技術者の行うべき職務を行うことができ，下請負人はその下請負に係る建設工事につき主任技術者を置くことを要しない。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":387},{"cat":"法規","year":"R8 No.61","q":"道路法令上，通行車両の最高限度を超える特殊な車両の通行に関する記述のうち，誤っているものはどれか。","opts":["道路の構造を保全し，又は交通の危険を防止するため，車両の幅，重量，高さ，長さ，及び最小回転半径の最高限度は，政令で定める。","道路管理者は車両の構造又は車両に積載する貨物が特殊であるためやむを得ないと認めるときは，必要な条件を付して通行を許可することができる。","特殊な車両の通行許可を受けた者は，当該許可に係る通行中，当該許可証を事業所に保管しなければならない。","最高限度を超える車両の通行許可を受けようとする者は，通行する道路の道路管理者が複数となる場合には，道路管理者に手数料を納めなければならない。"],"ans":2,"ex":"","src":"20260706_1kyu","qid":388},{"cat":"法規","year":"R8 No.62","q":"河川法令上，河川管理者以外の者が，河川区域内（高規格堤防特別区域を除く）で工事を行う場合の手続きに関する記述のうち，誤っているものはどれか。","opts":["河川区域内の地下に埋設されるサイホンやトンネル等を設置する場合は，河川管理者の許可を受ける必要がある。","河川区域内の野球場に設置されている老朽化したバックネットを撤去する場合は，河川管理者の許可を受ける必要がある。","河川区域内に一時的に仮設の資材置き場を設置する場合は，河川管理者の許可を受ける必要がある。","河川区域内に河川管理者の許可を受けて設置されている排水施設の機能を維持するために排水口付近の土砂等を撤去する場合は，河川管理者の許可を受ける必要がある。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":389},{"cat":"法規","year":"R8 No.63","q":"建築基準法令上，工事現場に延べ面積 45 m²の仮設の現場事務所を設置する場合に，適用されるものはどれか。","opts":["現場事務所の建築工事に着手する前に，その計画が建築基準関係規定に適合するものであることについて，建築主事等の確認を受けなければならない。","現場事務所の建築面積の敷地面積に対する割合は，工業地域内にあっては 10 分の5又は 10 分の6 のうち当該地域に関する都市計画で定められた数値を超えてはならない。","現場事務所の屋根の構造は，防火地域又は準防火地域内においては火災の発生を防止するために屋根に必要とされる性能に関して政令で定める技術的基準に適合するものでなければならない。","現場事務所は，自重，積載荷重，積雪荷重，風圧，土圧及び水圧並びに地震その他の震動及び衝撃に対して安全な構造のものでなければならない。"],"ans":3,"ex":"","src":"20260706_1kyu","qid":390},{"cat":"法規","year":"R8 No.64","q":"騒音規制法令上，指定地域内で行う次の建設作業のうち，特定建設作業に該当しないものはどれか。ただし，当該作業がその作業を開始した日に終わるもの，及び使用する機械が一定の限度を超える大きさの騒音を発生しないものとして環境大臣が指定するものを除く。","opts":["原動機の定格出力が 80 kW 以上のバックホウを使用して行う掘削積込み作業","アースオーガを併用しないディーゼルハンマを使用して行うくい打ち作業","路面切削機を使用して行う道路の切削オーバーレイ作業","原動機の定格出力が 40 kW 以上のブルドーザを使用して行う盛土の敷均し作業"],"ans":2,"ex":"","src":"20260706_1kyu","qid":391},{"cat":"法規","year":"R8 No.65","q":"振動規制法令上，特定建設作業における環境省令で定める基準に関する記述のうち，誤っているものはどれか。","opts":["特定建設作業の振動が，特定建設作業の場所の敷地の境界線において，85 dB を超える大きさのものでないこと。","良好な住居の環境を保全するため，特に静穏の保持が必要とする区域であると都道府県知事が指定した区域では，原則として午後7 時から翌日の午前7 時まで行われる特定建設作業に伴った振動が発生するものでないこと。","良好な住居の環境を保全するため，特に静穏の保持が必要とする区域であると都道府県知事が指定した区域では，原則として1 日 10 時間を超えて行われる特定建設作業に伴った振動が発生するものでないこと。","特定建設作業の全部又は一部に係る作業の期間が当該特定建設作業の場合において，原則として連続して6 日を超えて行われる特定建設作業に伴った振動が発生するものでないこと。"],"ans":0,"ex":"","src":"20260706_1kyu","qid":392},{"cat":"法規","year":"R8 No.66","q":"港則法令上，港長の許可又は届出に関する記述のうち，正しいものはどれか。","opts":["特定港内又は特定港の境界附近で工事又は作業をしようとする者は，港長に届け出なければならない。","特定港内において竹木材を船舶から水上に卸そうとする者は，港長の許可を受けなければならない。","特定港内において使用すべき私設信号を定めようとする者は，港長に届け出なければならない。","船舶は，特定港に入港したとき又は特定港を出港しようとするときは，国土交通省令の定めるところにより，港長の許可を受けなければならない。"],"ans":1,"ex":"","src":"20260706_1kyu","qid":393},{"cat":"施工管理法","year":"R8 問BNo.1","q":"TS（トータルステーション）を用いて行う測量に関する記述のうち，適当でないものはどれか。","opts":["TS では，距離測定に伴う気温及び気圧の測定は，距離測定の開始直前又は終了直後に行う。","TS では，器械高，反射鏡高及び目標高は，ミリメートル位まで測定を行う。","TS では，水平角観測において，対回内の観測方向数は，10 方向以下とする。","TS では，鉛直角観測において，1 視準1 読定，望遠鏡正及び反の観測を1 対回とする。"],"ans":2,"ex":"","src":"20260706_1kyuB","qid":394},{"cat":"施工管理法","year":"R8 問BNo.2","q":"公共工事標準請負契約約款に関する記述のうち，適当でないものはどれか。","opts":["受注者は，設計図書に定めるところにより，この契約の履行について発注者に報告しなければならない。","受注者は，設計図書において監督員の検査を受けて使用すべきものと指定された工事材料が，検査の結果不合格と決定された場合，工事現場内に保管しなければならない。","受注者は，設計図書に定めるところにより，工事の完成，設計図書の変更等によって不用となった支給材料又は貸与品を発注者に返還しなければならない。","受注者は，災害防止等のため必要があると認めるときは，臨機の措置をとり，その措置の内容を監督員に直ちに通知しなければならない。"],"ans":1,"ex":"","src":"20260706_1kyuB","qid":395},{"cat":"施工管理法","year":"R8 問BNo.4","q":"建設機械の最近の動向に関する記述のうち，適当でないものはどれか。","opts":["カーボンニュートラルに資するため GX（グリーントランスフォーメーション）建設機械は，土木建築に関する工事及び河川，道路その他の施設の維持管理作業に用いる機械のうち，稼働時の一酸化炭素（CO）が無排出と認められる建設機械である。","情報化施工の出来形管理では，ICT を活用した計測機器を活用して，計測から計測結果の取りまとめまでを実現することが可能である。","MG（マシンガイダンス）は，建設機械の位置と設計データとの差分をモニタ等に表示してオペレータに案内するシステムで，バックホウ等に導入されている。","UAV（無人飛行機）は，機材の軽量化と共に，機体制御のプロセッサ，GNSS（全球測位衛星システム），慣性センサ等の技術的進歩により，自律飛行が可能となり，通常は飛行禁止空域外の計測や点検に活用されている。"],"ans":0,"ex":"","src":"20260706_1kyuB","qid":396},{"cat":"施工管理法","year":"R8 問BNo.5","q":"建設工事における施工計画立案の事前調査に関する記述のうち，適当でないものはどれか。","opts":["契約条件の調査では，契約書類を正確に理解し工事数量，仕様（規格）の確認のために，プロジェクトの目的，設計図書の内容，設計変更の可能性，当該工事に影響する付帯工事や関連工事等の調査を行う。","現場条件の調査では，調査項目の落ちがないように選定し，複数の人で調査したり，調査回数を重ねる等により，精度を高めることが必要である。","現場条件には当初予見できない不確定要素が非常に多く，これらを正しく明確に把握することは施工計画を立案するうえで重要な要件であり，設計変更に適切に対応するための必須条件である。","資機材の輸送では，輸送ルートの道路状況や交通規制等を把握し，不明な点がある場合には，所轄警察署や所轄運輸支局に相談して解決しておく必要がある。"],"ans":3,"ex":"","src":"20260706_1kyuB","qid":397},{"cat":"施工管理法","year":"R8 問BNo.8","q":"労働安全衛生法令上，安全衛生管理体制に関する記述のうち，誤っているものはどれか。","opts":["労働者数が常時 10 人以上 50 人未満となる事業場では，安全衛生推進者を選任する。","特定元方事業者は，関係請負人の労働者を含め，常時 50 人以上となる事業場（ずい道等の建設，圧気工法による作業，一定の橋梁の建設を除く）では，統括安全衛生責任者を選任する。","統括安全衛生責任者が選任された事業場では，安全衛生推進者を選任する。","統括安全衛生責任者が選任された事業場の下請け事業場では，安全衛生責任者を選任する。"],"ans":2,"ex":"","src":"20260706_1kyuB","qid":398},{"cat":"施工管理法","year":"R8 問BNo.9","q":"労働安全衛生法令上，技能講習を修了した者を就かせる必要がある業務のうち，正しいものはどれか。","opts":["つり上げ荷重1 ｔ以上の移動式クレーンの玉掛けの業務","作業床の高さが 10 m 未満の高所作業車の運転の業務（道路上を走行させる運転を除く）","コンクリートポンプ車の作業装置の操作の業務","足場の組立て，解体又は変更の作業に係る業務（地上又は堅固な床上における補助作業の業務を除く）"],"ans":0,"ex":"","src":"20260706_1kyuB","qid":399},{"cat":"施工管理法","year":"R8 問BNo.10","q":"労働安全衛生法令上，建設工事における墜落災害の防止に関する記述のうち，誤っているものはどれか。","opts":["墜落による危険を防止するためのネットは，破損した部分が補修されたものでも使用してはならない。","墜落による危険を防止するためのネットは，人体又はこれと同等以上の重さの落下物による衝撃を受けたネットは使用してはならない。","移動式足場に労働者を乗せて移動してはならない。","移動式足場の上では，脚立等を使用してはならない。"],"ans":0,"ex":"","src":"20260706_1kyuB","qid":400},{"cat":"施工管理法","year":"R8 問BNo.11","q":"労働安全衛生法令上，土工工事における明り掘削の作業にあたり事業者が遵守しなければならない事項に関する記述のうち，誤っているものはどれか。","opts":["土止め支保工を組み立てるときは，あらかじめ，組立図を作成し，当該組立図により組み立てなければならない。","掘削機械，積込機械等の使用によるガス導管，地中電線路等の損壊により労働者に危険を及ぼすおそれのあるときは，十分に注意して使用しなければならない。","地山の崩壊又は土石の落下により危険を及ぼすおそれのあるときは，あらかじめ土止め支保工を設け，防護網を張り，作業に従事する者の立入りを禁止する等の措置を講じなければならない。","明り掘削の作業を行う場所については，当該作業を安全に行うため必要な照度を保持しなければならない。"],"ans":1,"ex":"","src":"20260706_1kyuB","qid":401},{"cat":"施工管理法","year":"R8 問BNo.12","q":"労働安全衛生法令上，足場の組立て等に関する記述のうち，正しいものはどれか。","opts":["事業者は，高さが2 m 以上の構造の足場の組立て等の作業で，足場材の緊結，取り外し，受渡し等の作業を行うときは，原則として，幅 40 cm 以上の作業床を設けなければならない。","事業者は，高さが2 m 以上の構造の足場の組立て等の作業では，足場の組立て等作業主任者技能講習を修了した者のうちから，足場の組立て等作業主任者を選任しなければならない。","事業者は，高さが 1.5 m 以上の構造の足場の組立て等の作業で，材料，器具，工具等を上げ，又は下ろすときは，原則として，つり綱，つり袋等を労働者に使用させなければならない。","事業者は，高さが 1.5 m 以上の構造の足場の組立て等の作業では，作業を行う区域内に当該作業に関係する者以外の者の立ち入りを禁止しなければならない。"],"ans":0,"ex":"","src":"20260706_1kyuB","qid":402},{"cat":"施工管理法","year":"R8 問BNo.13","q":"コンクリート構造物の解体作業に関する記述のうち，適当でないものはどれか。","opts":["圧砕機及び大型ブレーカによる取壊しでは，建設機械と作業員の接触等を防止するため，誘導員を適切な位置に配置する。","圧砕機及び大型ブレーカによる取壊しでは，解体する構造物からコンクリート片の飛散，落下する範囲及び構造物自体の倒壊範囲を予測し，作業員や建設機械は安全な作業場所に配置する。","カッタによる取壊しによる小割作業のうち落差の大きい箇所では，破壊解体片の落下に伴う破砕，飛散に対する防護を行う。","カッタによる取壊しでは，撤去側躯体ブロックへのカッタの取付けを確認したうえで，切断面付近にシートを設置して冷却水の飛散防止を図る。"],"ans":3,"ex":"","src":"20260706_1kyuB","qid":403},{"cat":"施工管理法","year":"R8 問BNo.14","q":"機械式鉄筋継手のねじ節鉄筋継手に関する記述のうち，適当でないものはどれか。","opts":["ねじ節鉄筋継手のトルク固定方式とは，鉄筋又はカプラーの両側に配置されたロックナットにトルクを与えて締め付け，継手部に軸力を導入して固定する方式である。","ねじ節鉄筋継手のグラウト固定方式とは，カプラー内の鉄筋のねじ節とカプラーのねじとの隙間にグラウトを充塡硬化させて固定する方式である。","カプラーの配置にあたっては，カプラー端又はロックナット端が，鉄筋の嵌合マークの所定位置に一致しているかの確認を，継手の半数で行わなければならない。","グラウトの充塡にあたっては，カプラーの両端からグラウトが溢出したことによる充塡完了の確認を，継手の全数で行わなければならない。"],"ans":2,"ex":"","src":"20260706_1kyuB","qid":404},{"cat":"施工管理法","year":"R8 問BNo.16","q":"JIS A 5308 に準拠したレディーミクストコンクリートの受入れ検査に関する記述のうち，適当でないものはどれか。","opts":["スランプ試験を行ったところ，スランプ 12.0 cm の指定に対して 10.0 cm であったため，合格と判定した。","空気量試験を行ったところ，空気量 4.5 ％の指定に対して 2.5 ％であったため，合格と判定した。","塩化物含有量の検査を行ったところ，塩化物イオン（Cl）量として 0.20 kg/m³であったため，合格と判定した。","呼び強度 30 のコンクリートで3 回の圧縮試験の結果が，それぞれ 32 N/mm²，28 N/mm²，33 N/mm²であったため，合格と判定した。"],"ans":1,"ex":"","src":"20260706_1kyuB","qid":405},{"cat":"施工管理法","year":"R8 問BNo.17","q":"建設工事における騒音・振動対策に関する記述のうち，適当でないものはどれか。","opts":["騒音防止対策は，内燃機関の音のように機械自体が発生する音の有無と作業の効率とはあまり関係なく，低騒音型の機械を導入する。","騒音防止対策は，音源対策が基本だが，伝搬経路対策及び受音側対策をバランスよく行うことが重要である。","地盤振動防止対策は，発生振動レベル値の小さい機械や工法を選定することが，基本原則である。","地盤振動防止対策は，発生源，伝搬経路及び受振対象における対策に分類できるが，受振対象における対策が最も有効である。"],"ans":3,"ex":"","src":"20260706_1kyuB","qid":406},{"cat":"施工管理法","year":"R8 問BNo.18","q":"建設工事における土壌汚染対策に関する記述のうち，適当でないものはどれか。","opts":["地盤汚染対策工事においては，工事車両のタイヤ等に汚染土壌が付着し，場外に出ることのないよう車両の出口にタイヤ洗浄装置等を備え，洗浄水は直ちに場外に排水する。","地盤汚染対策工事における屋外掘削の場合，飛散防止ネットを設置し散水して飛散を防止する。","汚染土壌の運搬の過程において，汚染土壌から岩，コンクリートくずその他の物を分別してはならない。","汚染土壌の保管は，汚染土壌の積替えを行う場合を除き，行ってはならない。"],"ans":0,"ex":"","src":"20260706_1kyuB","qid":407},{"cat":"施工管理法","year":"R8 問BNo.19","q":"建設発生土に関する記述のうち，「建設副産物適正処理推進要綱」の内容として，適当でないものはどれか。","opts":["発注者，元請業者及び自主施工者は，建設工事の施工に当たり，適切な工法の選択等により，建設発生土の発生の抑制に努めるとともに，その現場内利用の促進等により搬出の抑制に努めなければならない。","発注者，元請業者及び自主施工者は，建設発生土の土質確認を行うとともに，建設発生土を必要とする他の工事現場との情報交換システム等を活用した連絡調整等により，工事間の利用の促進に努めなければならない。","元請業者及び自主施工者は，建設発生土をストックヤードで保管する場合には，建設廃棄物の混入を防止するため必要な措置を講じるとともに，公衆災害の防止を含め周辺の生活環境に影響を及ぼさないよう努めなければならない。","運搬業者は，建設発生土の運搬において，運搬経路の適切な設定並びに車両及び積載量等の適切な管理により，騒音，振動，塵埃等の防止に努めるとともに，安全な運搬に必要な措置を講じなければならない。"],"ans":3,"ex":"","src":"20260706_1kyuB","qid":408},{"cat":"施工管理法","year":"R8 問BNo.20","q":"コンクリート又は鉄筋コンクリート工作物の解体工事に関する記述のうち，適当でないものはどれか。","opts":["ジャイアントブレーカは，コンクリート構造物を押し砕くため，はさみ状のアタッチメントを装着した機械であり，鉄筋コンクリート構造物の解体に使用するものである。","静的破砕剤は，水と反応して膨張する薬剤を水と練り混ぜてのり状にしたものをコンクリートに穿孔した孔に充塡し，その膨張性を利用して静的に破砕するものである。","油圧孔拡大機は，コアボーリング機等で穿孔した孔内にテーパー付きのウェッジを油圧力で押し込み，孔を拡大することによってコンクリート部材に亀裂を入れ取り壊すものである。","ワイヤーソーは，切断解体しようとする部材にダイヤモンドビーズを取り付けたワイヤーを環状に巻き付け，エンドレスで高速回転させてコンクリートを切断するものである。"],"ans":0,"ex":"","src":"20260706_1kyuB","qid":409},{"cat":"施工管理法応用","year":"R8 問BNo.21","q":"仮設工事計画立案の留意事項に関する文章中の  のイ～ニに当てはまる語句の組合せとして，適当なものはどれか。・仮設工事計画では，取扱いが容易でイを心がけると共に，ロを考慮し，省力化が図れるような計画とする。・仮設工事計画では，材料はハを使用し，可能な限りニを統一する。また，他の工事にも転用できるような計画とする。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["分散化 ― 作業員不足 ― 特注品 ― 規格","ユニット化 ― 作業員不足 ― 市販品 ― 規格","分散化 ― 資機材不足 ― 市販品 ― 納期","ユニット化 ― 資機材不足 ― 特注品 ― 納期"],"ans":1,"ex":"","src":"20260706_1kyuB","qid":410},{"cat":"施工管理法応用","year":"R8 問BNo.22","q":"施工計画における建設機械の選定に関する①～④の記述のうち，適当なものの数はどれか。①建設機械の選定においては，機械の作業能率，稼働率の決定が重要であり，作業能率は地形，気象，運転手の熟練度等多くの要素が関連するため，実績データ等に基づき選定する。②建設機械の選定においては，機械の能力・性能，作業場の面積等により，最も適したものを選定し，その機械が平均能率を発揮できる施工方法を選定する。③組合せ機械の選定においては，主要機械の能力を最大限に発揮させるため作業体系を並列化する。④組合せ機械の選定においては，従作業の施工能力を主作業の施工能力と同等，あるいは幾分高めにする。","opts":["1 つ","2 つ","3 つ","4 つ"],"ans":2,"ex":"","src":"20260706_1kyuB","qid":411},{"cat":"施工管理法応用","year":"R8 問BNo.23","q":"公共工事における施工体制台帳に関する文章中のイ～ニに当てはまる語句の組合せとして，適当なものはどれか。・発注者から直接工事を請負った建設業者は，施工するために下請契約を締結する場合には，下請金額イ，施工体制台帳を作成しなければならない。・元請負人は，施工体制台帳と合わせて施工の分担関係を表示したロを作成して，工事関係者や公衆が見やすい場所に掲示しなければならない。・施工体制台帳には，建設工事の名称，内容及び工期，許可を受けて営む建設業の種類，ハを記載しなければならない。・下請負人は，請負った工事を他の建設業を営む者に請け負わせたときは，再下請通知書をニに提出しなければならない。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["にかかわらず ― 施工体系図 ― 下請負人の施工実績 ― 発注者","が一定額以上の場合 ― 緊急連絡網 ― 下請負人の施工実績 ― 元請負人","が一定額以上の場合 ― 緊急連絡網 ― 下請負人の名称 ― 発注者","にかかわらず ― 施工体系図 ― 下請負人の名称 ― 元請負人"],"ans":3,"ex":"","src":"20260706_1kyuB","qid":412},{"cat":"施工管理法応用","year":"R8 問BNo.24","q":"公共工事における工事の原価管理に関する①～④の記述のうち，適当なもののみを全てあげている組合せはどれか。①原価管理において施工担当者は，常に工事の原価を把握し，実行予算と発生原価の対比・評価を行う必要がある。②原価管理は，天災その他不可抗力による損害について考慮する必要はないが，設計図書と工事現場の不一致，工事の変更・中止，物価・労賃の変動について考慮する必要がある。③原価管理を有効に実施するには，管理の重点をどこにおくかの方針を持ち，どの程度の細かさでの原価計算を行うかを決めておくことが必要である。④原価管理は，施工改善・計画修正・設計変更等があれば修正実行予算を作成して，これを基準として再び管理サイクルを回していくことになる。","opts":["①④","②③","①②④","①③④"],"ans":3,"ex":"","src":"20260706_1kyuB","qid":413},{"cat":"施工管理法応用","year":"R8 問BNo.25","q":"工程管理に関する①～④の記述のうち，適当なものの数はどれか。①工程管理とは，早く工事を完成させることを最優先として，そのために必要な作業員，資機材，予算等を投入するためのものである。②工程管理手法には，各種作業の施工順序，施工日数等を横線式工程表のバーチャート，出来高累計曲線，ネットワーク式工程表等で図化したものがある。③工程管理の統制機能における進度管理では，工事進捗の計画と実施との比較をし，進捗報告を行うものである。④工程管理の改善機能は，基本計画を施工の途中で再評価し，改善の余地があれば当初の基本計画立案の段階にフィードバックし，品質，原価，安全衛生等の再調整を図り，レベルアップしていくものである。","opts":["1 つ","2 つ","3 つ","4 つ"],"ans":2,"ex":"","src":"20260706_1kyuB","qid":414},{"cat":"施工管理法応用","year":"R8 問BNo.28","q":"労働安全衛生法令上，車両系建設機械又は車両系荷役運搬機械等を用いる作業の災害防止のために事業者が講じるべき措置に関する①～④の記述のうち，正しいものの数はどれか。①車両系建設機械を用いて作業を行うときは，その日の作業を開始する前に，ブレーキやクラッチの機能について点検を行わなければならない。②車両系建設機械のブームやアームを上げ，その下で修理や点検を行う場合は，労働者の危険を防止するため，労働者に安全支柱，安全ブロック等を使用させなければならない。③車両系荷役運搬機械等を用いた作業を行うときは，作業主任者を定め，作業計画に基づき作業の指揮を行わせなければならない。④車両系荷役運搬機械等を用いた作業を行う場合において，路肩や傾斜地で労働者に危険が生ずるおそれがあるときは，誘導者を配置しなければならない。","opts":["1 つ","2 つ","3 つ","4 つ"],"ans":2,"ex":"","src":"20260706_1kyuB","qid":415},{"cat":"施工管理法応用","year":"R8 問BNo.29","q":"クレーン等安全規則上，移動式クレーンの災害防止のために事業者が講じるべき安全対策に関する文章中のイ～ニに当てはまる語句の組合せとして，正しいものはどれか。・移動式クレーンの定格荷重とは，フツクやグラブバケツト等のつり具の重量を（イ）荷重をいい，ブームの傾斜角や長さにより変化する。・移動式クレーンの転倒等による労働者の危険を防止するため，あらかじめ，作業の方法，転倒を防止するための方法，作業に係る労働者の配置及びロを定めなければならない。・移動式クレーンを用いる作業においては，ハを行う者を指名して，その者にハを行わせなければならない。ただし，移動式クレーンの運転者に単独で作業を行わせるときは，この限りではない。・強風のため，移動式クレーンの作業について危険が予想されるときは，当該作業をニしなければならない。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["含まない ― 指揮の系統 ― 合図 ― 中止","含む ― 指揮の系統 ― 監視 ― 特に注意して実施","含まない ― 資格 ― 監視 ― 中止","含む ― 資格 ― 合図 ― 特に注意して実施"],"ans":0,"ex":"","src":"20260706_1kyuB","qid":416},{"cat":"施工管理法応用","year":"R8 問BNo.30","q":"埋設物ならびに架空線に近接して行う工事の安全管理に関する①～④の記述のうち，適当なもののみを全てあげている組合せはどれか。①施工に先立ち，埋設物の管理者等が保管する台帳と設計図面を照らし合わせて位置（平面・深さ）を確認した上で，細心の注意のもとで試掘等を行い，その埋設物を原則として目視により確認しなければならない。②埋設物に近接する箇所で明り掘削の作業を行う場合において，埋設物の損壊等により労働者に危険を及ぼすおそれのあるときは，これらの補強・移設等の措置を作業と並行して講じなければならない。③架空線については，施工に先立ち，現地調査を実施し，種類，位置（場所，高さ等）及び管理者を確認すること。④架空線に近接して建設機械を操作する場合においては，物件位置のマーキング等を行った上で，歯止めの設置，ブームのストッパーの使用，近接電線に対する絶縁材の装着等必要な措置を講じること。","opts":["①③","②④","①③④","②③④"],"ans":2,"ex":"","src":"20260706_1kyuB","qid":417},{"cat":"施工管理法応用","year":"R8 問BNo.31","q":"労働者の健康管理のために事業者が講じるべき措置に関する①～④の記述のうち，適当なものの数はどれか。①常時使用する労働者の雇い入れ時は，医師による健康診断から3 か月を経過しない者で診断結果を証明する書面の提出を受けた場合を除き，所定の項目についての健康診断を行う必要がある。②原則として，休憩時間を除き一週間に 40 時間を超えて労働させた場合，その超えた労働時間が1 か月当たり 80 時間を超え，かつ，疲労の蓄積が認められる労働者の申出により，医師による面接指導を行わなければならない。③労働者を高温多湿作業場所において作業に従事させる場合には，あらかじめ熱中症の症状・予防方法，緊急時の救急処置，熱中症の事例について，労働衛生教育を行う必要がある。④常時，特定粉じん作業に従事する労働者には，粉じんの発散防止及び作業場所の換気方法，呼吸用保護具の使用方法等について，技能講習を行わなければならない。","opts":["1 つ","2 つ","3 つ","4 つ"],"ans":2,"ex":"","src":"20260706_1kyuB","qid":418},{"cat":"施工管理法応用","year":"R8 問BNo.32","q":"（Ａ）～（Ｄ）の品質の測定値を管理図にプロットしたときの，統計的な品質管理手法を導入した測定値に関する①～④の点の並び方の記述のうち，適当なもののみを全てあげている組合せはどれか。図の UCL は上方管理限界，CL は中心線，LCL は下方管理限界を指す。（Ａ）（Ｂ）（Ｃ）（Ｄ）①（Ａ）は，点が管理限界線内の範囲にあり，中心線に対して，上側だけに並んでいるので，工程は安定し異常はないため，品質は安定しており改善の必要はない。②（Ｂ）は，点が管理限界線内の範囲にあり，連続して上昇又は下降するような傾向がないので，品質が安定しており改善の必要はない。③（Ｃ）は，点が管理限界線内の範囲にあり，管理限界線にしばしば接近して現れているので，工程に異常があったと考えられる。④（Ｄ）は，点が管理限界線内の範囲にあり，中心線の近くに全て集まっているので，工程に異常があったと考えられる。","opts":["①②","②③","①②③","②③④"],"ans":3,"ex":"","src":"20260706_1kyuB","qid":419},{"cat":"施工管理法応用","year":"R8 問BNo.33","q":"情報化施工における TS（トータルステーション）・GNSS（全球測位衛星システム）を用いた盛土の締固め管理に関する文章中のイ～ニに当てはまる語句の組合せとして，適当なものはどれか。・盛土施工に使用する材料は，事前の土質試験で品質を確認し，試験施工で決定したまき出し厚やイを決定したものと同じ土質材料であることを確認する。・TS・GNSS を用いて締固め機械の走行記録をもとに，盛土の締固め管理をする方法は，ロのひとつである。・盛土材料を締め固める際は，盛土施工範囲の管理ブロックの全てが，ハだけ締め固めたことを示す色が車載パソコンのモニタに表示されるまで締め固める。・試験施工と同様の盛土材料を使用し，試験施工で決定したとおりの施工仕様で施工した盛土は，ニを省略する。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["締固め回数 ― 品質規定方式 ― 規定回数 ― 現場密度試験","締固め回数 ― 工法規定方式 ― 規定回数 ― 現場密度試験","締固め度 ― 品質規定方式 ― 規定時間 ― 室内密度試験","締固め度 ― 工法規定方式 ― 規定時間 ― 室内密度試験"],"ans":1,"ex":"","src":"20260706_1kyuB","qid":420},{"cat":"施工管理法応用","year":"R8 問BNo.34","q":"鉄筋の加工及び組立の検査に関する①～④の記述のうち，適当なものの数はどれか。①鉄筋のかぶりは，鉄筋の中心から構造物表面までの距離とする。②鉄筋のかぶりを確保するため，構造物の側面については，1 m²あたり2 個以上のスペーサを設置する。③設計図書に示されていない鋼材等を配置する場合は，その鋼材等と他の鉄筋とのあきを粗骨材の最大寸法の 4/3 以上とする。④検査の結果，鉄筋の加工及び組立が適切でないと判断された場合，曲げ加工した鉄筋については，曲げ戻しを行うものとする。","opts":["1 つ","2 つ","3 つ","4 つ"],"ans":1,"ex":"","src":"20260706_1kyuB","qid":421},{"cat":"施工管理法応用","year":"R8 問BNo.35","q":"プレキャスト部材の接合に関する①～④の記述のうち，適当なもののみを全てあげている組合せはどれか。① PC 鋼材の緊張によりセグメントどうしを接合させる際は，接着剤が十分に硬化した後で，PC 鋼材の緊張によって圧着させる。②接着剤の取扱いについては，製品安全シート（SDS）に従った安全対策を講じる。③モルタルやコンクリートを接合材料として用いる場合は，これを打ち込む前に，接合面のコンクリートを乾燥状態にしておく必要がある。④機械式継手の一種であるモルタル充塡継手を用いる場合は，鉄筋の挿入長さ及び継手内部にグラウトやモルタルが計画どおりに充塡されたことを確認する必要がある。","opts":["①③","②④","①②③","②③④"],"ans":1,"ex":"","src":"20260706_1kyuB","qid":422}]};
</script>
<script>
'use strict';
(function(){
  var S = window.SRS;
  // 級ごとのデータセット。__DATASETS__ = { '1kyu': [...], '2kyu': [...] }
  var DATASETS = window.__DATASETS__ || { '2kyu': (window.__QUESTIONS__||[]) };

  // 級ごとの設定。すべて一次情報（jctc.jp / 国交省）に基づく。
  var GRADE_CONFIG = {
    '1kyu': {
      label: '1級',
      badge: '1級 · 公式過去問',
      // 1級一次の分野別解答数（本番=全101問中70問。応用能力=足切り対象）。予想得点の換算重み。
      subjectOrder: ['施工管理法応用','施工管理法','土木一般','専門土木','法規'],
      examWeights: {'施工管理法応用':15,'施工管理法':16,'土木一般':13,'専門土木':17,'法規':9},
      passLine: 60,
      // 応用能力（施工管理法応用）に独立の足切り（15問中9問=60%）
      cutoffCat: '施工管理法応用', cutoffLine: 60,
      defaultExam: '2027-07-04', // 令和9年度1級一次の推定日（例年7月第1日曜。正式日程は2026年12月公表）
      examNote: '令和9年度 1級一次（推定・正式日程は2026年12月公表）',
      intro: '1級土木一次の公式過去問（令和4〜8年度・全国建設研修センター公表）。正解番号は公式正答表と機械照合済み。図表を要する問題は除外。応用能力には本番同様の足切りがあります。'
    },
    '2kyu': {
      label: '2級',
      badge: '2級 · 公式過去問',
      subjectOrder: ['施工管理法','土木一般','専門土木','法規'],
      examWeights: {'施工管理法':19,'土木一般':11,'専門土木':6,'法規':9},
      passLine: 60,
      cutoffCat: null, cutoffLine: null,
      defaultExam: '2026-10-25', // 2級後期一次（一次情報）
      examNote: '2級後期 一次検定',
      intro: '2級土木一次の公式過去問（令和4〜8年度の前期・後期・全国建設研修センター公表）。正解番号は公式正答表と機械照合済み。図表を要する問題は除外。'
    }
  };

  var GRADE_KEY = 'sekokan-drill-grade';
  var currentGrade = loadGrade();
  var CFG = GRADE_CONFIG[currentGrade];
  var QUESTIONS = DATASETS[currentGrade] || [];
  var SUBJECT_ORDER = CFG.subjectOrder;
  var EXAM_WEIGHTS = CFG.examWeights;
  var PASS_LINE = CFG.passLine;

  function loadGrade(){
    var g = null;
    try{ g = localStorage.getItem(GRADE_KEY); }catch(e){}
    if(g && GRADE_CONFIG[g] && (DATASETS[g]||[]).length) return g;
    // データがある級を優先（1級があれば1級、なければ2級）
    if((DATASETS['1kyu']||[]).length) return '1kyu';
    return '2kyu';
  }
  function setGrade(g){
    if(!GRADE_CONFIG[g] || !(DATASETS[g]||[]).length) return;
    currentGrade = g;
    try{ localStorage.setItem(GRADE_KEY, g); }catch(e){}
    CFG = GRADE_CONFIG[g]; QUESTIONS = DATASETS[g]; SUBJECT_ORDER = CFG.subjectOrder;
    EXAM_WEIGHTS = CFG.examWeights; PASS_LINE = CFG.passLine;
    state = load();
    renderHome();
  }

  // 学習記録は級ごとに分離（キーに級を含める）
  function storeKey(){ return 'sekokan-drill-v1-' + currentGrade; }

  var state = load();

  function load(){
    try{
      var raw = localStorage.getItem(storeKey());
      if(raw){ var p = JSON.parse(raw); if(p && p.cards) return normalize(p); }
    }catch(e){}
    return normalize({cards:{}, streak:0, lastStudyDay:null, examDate:CFG.defaultExam, goalDoneDay:null, goalDoneCount:0});
  }
  function normalize(p){
    p.cards = p.cards||{}; p.streak = p.streak||0; p.examDate = p.examDate||CFG.defaultExam;
    p.lastStudyDay = (p.lastStudyDay===undefined)?null:p.lastStudyDay;
    p.goalDoneDay = (p.goalDoneDay===undefined)?null:p.goalDoneDay;
    p.goalDoneCount = p.goalDoneCount||0;
    return p;
  }
  function save(){ try{ localStorage.setItem(storeKey(), JSON.stringify(state)); }catch(e){} }
  function today(){ return S.epochDay(Date.now()); }
  function examDaysLeft(){
    if(!state.examDate) return null;
    var ex = S.epochDay(new Date(state.examDate+'T00:00:00').getTime());
    return ex - today();
  }

  // --- helpers ---
  function el(id){ return document.getElementById(id); }
  function go(name){
    document.querySelectorAll('.scr').forEach(function(s){ s.classList.remove('on'); });
    el(name).classList.add('on');
    window.scrollTo(0,0);
    if(name==='home') renderHome();
    if(name==='cats') renderCats();
  }
  function toast(msg){
    var t = el('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 1900);
  }
  function fmtDate(iso){
    if(!iso) return '';
    var d = new Date(iso+'T00:00:00');
    var w = ['日','月','火','水','木','金','土'][d.getDay()];
    return (d.getMonth()+1)+'月'+d.getDate()+'日('+w+')';
  }

  // --- streak update on study ---
  function bumpStreak(){
    var t = today();
    if(state.lastStudyDay === t) return; // 今日すでにカウント済み
    if(state.lastStudyDay === t-1) state.streak += 1;
    else state.streak = 1;
    state.lastStudyDay = t;
  }
  function goalCountToday(){
    return (state.goalDoneDay===today()) ? state.goalDoneCount : 0;
  }
  function addGoalProgress(n){
    var t = today();
    if(state.goalDoneDay!==t){ state.goalDoneDay=t; state.goalDoneCount=0; }
    state.goalDoneCount += n;
  }

  // --- queue building ---
  function reviewQueue(){
    return QUESTIONS.filter(function(q){ return S.isDue(state.cards[q.qid], today()); });
  }
  function newQueue(){
    return QUESTIONS.filter(function(q){ var c=state.cards[q.qid]; return !c || !c.seen; });
  }
  function todayGoal(){
    var remaining = QUESTIONS.filter(function(q){ var c=state.cards[q.qid]; return !c || !c.mastered; }).length;
    var dl = examDaysLeft();
    return S.dailyGoal(remaining, dl==null?null:Math.max(dl,1), 10);
  }
  function todayQueue(){
    // 復習優先→未着手→既習。buildQueueの順で、今日の目標数だけ取る
    var q = S.buildQueue(QUESTIONS, state.cards, today(), SUBJECT_ORDER);
    // masteredで期限前のものは今日やる対象から外す（無限に既習を混ぜない）
    var pri = q.filter(function(x){
      var c = state.cards[x.qid];
      if(S.isDue(c, today())) return true;
      if(!c || !c.seen) return true;
      return false;
    });
    var goal = todayGoal();
    return pri.slice(0, Math.max(goal,1));
  }

  // --- quiz session ---
  var session = null;
  function startSession(title, list, opts){
    opts = opts||{};
    if(!list.length){ toast('対象の問題がありません'); return; }
    session = { title:title, list:list, idx:0, correct:0, answered:false, mode:opts.mode||'', masteredBefore:countMastered() };
    go('quiz');
    renderQuestion();
  }
  function countMastered(){
    return QUESTIONS.filter(function(q){ var c=state.cards[q.qid]; return c && c.mastered; }).length;
  }
  function renderQuestion(){
    session.answered = false;
    var q = session.list[session.idx];
    el('qProg').style.width = (session.idx/session.list.length*100)+'%';
    el('qCount').textContent = (session.idx+1)+' / '+session.list.length;
    var meta = '<span class="chip cat">'+q.cat+'</span><span class="chip src">'+q.year+'</span>';
    if(S.isDue(state.cards[q.qid], today()) && state.cards[q.qid] && state.cards[q.qid].seen) meta += '<span class="chip rev">復習</span>';
    el('qMeta').innerHTML = meta;
    el('qText').textContent = q.q;
    var wrap = el('qOpts'); wrap.innerHTML = '';
    q.opts.forEach(function(text, i){
      var b = document.createElement('button');
      b.className = 'opt'; b.type='button';
      b.innerHTML = '<span class="num">'+(i+1)+'</span><span>'+escapeHtml(text)+'</span>';
      b.addEventListener('click', function(){ answer(i); });
      wrap.appendChild(b);
    });
    el('expl').classList.remove('show');
    el('nextBtn').classList.remove('show');
    el('nextBtn').textContent = (session.idx === session.list.length-1) ? '結果を見る →' : '次の問題 →';
  }
  function answer(pick){
    if(session.answered) return;
    session.answered = true;
    var q = session.list[session.idx];
    var correct = (pick === q.ans);
    if(correct) session.correct++;
    // 分野別集計（足切り判定用）
    if(!session.byCat) session.byCat = {};
    if(!session.byCat[q.cat]) session.byCat[q.cat] = {total:0, correct:0};
    session.byCat[q.cat].total++;
    if(correct) session.byCat[q.cat].correct++;
    // SRS更新
    state.cards[q.qid] = S.reviewCard(state.cards[q.qid], correct, today());
    bumpStreak();
    save();
    // 視覚フィードバック
    var opts = el('qOpts').children;
    for(var i=0;i<opts.length;i++){
      opts[i].classList.add('dis');
      opts[i].disabled = true;
      if(i===q.ans){ opts[i].classList.add(i===pick?'pick-ok':'reveal-ok'); }
      else if(i===pick){ opts[i].classList.add('pick-ng'); }
      else { opts[i].classList.add('faded'); }
    }
    var flash = el('flash'); flash.className='flash '+(correct?'f-ok':'f-ng');
    setTimeout(function(){ flash.className='flash'; }, 560);
    // 解説（過去問は公式解説なし→正解番号を表示し、詳しい解説は外部サイトへのリンクに委ねる）
    var v = el('verdict'); v.textContent = correct?'正解':'不正解';
    v.className = 'verdict '+(correct?'ok':'ng');
    var linkEl = el('explLink');
    if(q.ex && q.ex.trim()){
      el('explText').textContent = q.ex;
      linkEl.classList.remove('show');
    } else {
      var ansText = q.opts[q.ans];
      el('explText').textContent = '正解は ('+(q.ans+1)+') 「'+ansText+'」。 出典: '+CFG.label+' '+q.year;
      if(q.srcUrl){
        linkEl.href = q.srcUrl;
        linkEl.classList.add('show');
      } else {
        el('explText').textContent += ' この問題は解説ページが見つかっていないため、選択肢の正誤は各自でご確認ください。';
        linkEl.classList.remove('show');
      }
    }
    el('expl').classList.add('show');
    el('nextBtn').classList.add('show');
    el('qProg').style.width = ((session.idx+1)/session.list.length*100)+'%';
  }
  function next(){
    if(!session.answered) return;
    if(session.idx < session.list.length-1){ session.idx++; renderQuestion(); }
    else finish();
  }
  function finish(){
    // 今日の目標に反映（今日やる／復習／新規のときだけ）
    if(session.mode==='today' || session.mode==='review' || session.mode==='new'){
      addGoalProgress(session.list.length);
      save();
    }
    var total = session.list.length, correct = session.correct;
    var pct = Math.round(correct/total*100);
    var overallPass = pct >= PASS_LINE;
    // 足切り判定（1級の模試のみ）: 応用能力分野が60%未満なら、総合が合格でも不合格
    var cutoffFail = false, cutoffPct = null;
    if(CFG.cutoffCat && session.mode==='exam' && session.byCat && session.byCat[CFG.cutoffCat]){
      var cc = session.byCat[CFG.cutoffCat];
      cutoffPct = cc.total>0 ? Math.round(cc.correct/cc.total*100) : null;
      if(cutoffPct!==null && cutoffPct < CFG.cutoffLine) cutoffFail = true;
    }
    var pass = overallPass && !cutoffFail;
    go('results');
    el('resTitle').textContent = pass ? 'よくできました' : (cutoffFail ? '足切りに注意' : 'あと少し');
    el('resSub').textContent = session.title;
    el('resPct').textContent = pct+'%';
    el('resFrac').textContent = correct+' / '+total;
    el('resCorrect').textContent = correct;
    el('resStreak').textContent = state.streak;
    el('resMastered').textContent = countMastered();
    var newlyMastered = countMastered() - session.masteredBefore;
    var msg;
    if(cutoffFail) msg = '総合は'+pct+'%ですが、'+CFG.cutoffCat+'が'+cutoffPct+'%で足切りライン'+CFG.cutoffLine+'%に届いていません。1級一次は総合60%かつ応用能力60%の両方が必要です。応用能力を重点的に。';
    else if(pass && newlyMastered>0) msg = '合格ライン'+PASS_LINE+'%を超えました。今回'+newlyMastered+'問が「習得済み」に。間違えた問題は間隔をあけて再出題されます。';
    else if(pass) msg = '合格ライン'+PASS_LINE+'%を超えました。この調子で続けましょう。2回連続で正解した問題は「習得済み」になります。';
    else msg = '合格ラインは'+PASS_LINE+'%（本番も60%）。間違えた問題は明日また出題されます。解説を読み直して次に備えましょう。';
    el('resMsg').textContent = msg;
    var ring = el('resRing');
    ring.classList.toggle('pass', pass);
    setTimeout(function(){ ring.style.strokeDashoffset = String(427 - 427*pct/100); }, 80);
  }

  function escapeHtml(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // --- home render ---
  function renderHome(){
    var dl = examDaysLeft();
    el('cdDays').innerHTML = (dl==null?'—':Math.max(dl,0))+' <span class="u">日</span>';
    el('cdDate').textContent = state.examDate ? fmtDate(state.examDate)+' 実施' : '';
    el('streakN').textContent = state.streak;
    var goal = todayGoal();
    var done = goalCountToday();
    el('goalTotal').textContent = goal;
    el('goalDone').textContent = Math.min(done,goal);
    el('goalBar').style.width = (goal>0?Math.min(done/goal*100,100):0)+'%';
    var startBtn = el('startToday');
    if(goal>0 && done>=goal){ startBtn.textContent='今日のノルマ達成 ✓'; startBtn.classList.add('done'); }
    else { startBtn.textContent='今日の学習を始める'; startBtn.classList.remove('done'); }
    el('reviewCount').textContent = reviewQueue().length+' 問';
    el('newCount').textContent = newQueue().length+' 問';
    el('examCount').textContent = QUESTIONS.length+' 問';
    var catCount = SUBJECT_ORDER.filter(function(c){ return QUESTIONS.some(function(q){ return q.cat===c; }); }).length;
    el('catAll').textContent = '全'+catCount+'分野';
    el('qTotal2').textContent = QUESTIONS.length;
    // 予想得点
    var proj = S.projectedScore(QUESTIONS, state.cards, EXAM_WEIGHTS);
    var pct = proj.totalExam>0 ? Math.round(proj.totalProjected/proj.totalExam*100) : 0;
    el('projPct').textContent = pct;
    var answeredAny = QUESTIONS.some(function(q){ var c=state.cards[q.qid]; return c&&c.seen; });
    el('boardNote').textContent = answeredAny
      ? '解いた問題の正答率を本番の配点に換算した推定値です（合格ライン60%）。'
      : 'まだ学習記録がありません。問題を解くと、本番の配点に換算した推定得点がここに表示されます。';
    var bars = el('catBars'); bars.innerHTML='';
    SUBJECT_ORDER.forEach(function(cat){
      var c = proj.byCat[cat]; if(!c) return;
      var rate = Math.round(c.rate*100);
      var color = c.answered===0 ? 'var(--el)' : (rate>=60?'var(--ok)':(rate>=40?'var(--acc)':'var(--ng)'));
      var row = document.createElement('div');
      row.className='catbar'; row.style.marginBottom='10px';
      row.innerHTML = '<div class="cr"><span class="cn">'+cat+'</span>'+
        '<span class="cv">'+(c.answered===0?'未着手':rate+'% · '+c.answered+'問')+'</span></div>'+
        '<div class="track"><i style="width:'+(c.answered===0?4:Math.max(rate,3))+'%;background:'+color+'"></i></div>';
      bars.appendChild(row);
    });
    el('gradeBadge').textContent = CFG.badge;
    el('examDate').value = state.examDate||'';
    el('introText').textContent = CFG.intro;
    el('examSetNote').textContent = CFG.examNote;
    // 級切替タブの状態
    var has1 = (DATASETS['1kyu']||[]).length>0, has2 = (DATASETS['2kyu']||[]).length>0;
    var sw = el('gradeSwitch');
    if(has1 && has2){
      sw.style.display='flex';
      el('grade1').classList.toggle('on', currentGrade==='1kyu');
      el('grade2').classList.toggle('on', currentGrade==='2kyu');
    } else { sw.style.display='none'; }
  }

  function renderCats(){
    var list = el('catList'); list.innerHTML='';
    SUBJECT_ORDER.forEach(function(cat){
      var qs = QUESTIONS.filter(function(q){ return q.cat===cat; });
      if(!qs.length) return;
      var done = qs.filter(function(q){ var c=state.cards[q.qid]; return c&&c.seen; }).length;
      var mastered = qs.filter(function(q){ var c=state.cards[q.qid]; return c&&c.mastered; }).length;
      var card = document.createElement('button');
      card.className='mode'; card.style.gridColumn='1 / -1'; card.style.marginBottom='0';
      card.innerHTML = '<div class="m-t">'+cat+'</div>'+
        '<div class="m-s">'+qs.length+'問中 '+done+'問学習・'+mastered+'問習得</div>'+
        '<div class="m-b">解く →</div>';
      card.addEventListener('click', function(){
        startSession(cat, shuffle(qs.slice()), {mode:'cat'});
      });
      list.appendChild(card);
    });
  }

  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  // --- theme ---
  function applyTheme(t){
    if(t==='auto'){ document.documentElement.removeAttribute('data-theme'); }
    else document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('sekokan-theme', t); }catch(e){}
  }
  function initTheme(){
    var t = 'auto';
    try{ t = localStorage.getItem('sekokan-theme')||'auto'; }catch(e){}
    applyTheme(t);
  }
  function cycleTheme(){
    var cur = document.documentElement.getAttribute('data-theme')||'auto';
    var order = ['auto','light','dark'];
    var nextT = order[(order.indexOf(cur)+1)%3];
    applyTheme(nextT);
    toast(nextT==='auto'?'テーマ: 端末に合わせる':(nextT==='light'?'テーマ: ライト':'テーマ: ダーク'));
  }

  // --- wire up ---
  el('startToday').addEventListener('click', function(){
    var goal = todayGoal(), done = goalCountToday();
    if(goal>0 && done>=goal){ toast('今日のノルマは達成済みです'); return; }
    startSession('今日やる', todayQueue(), {mode:'today'});
  });
  el('modeReview').addEventListener('click', function(){
    var q = reviewQueue();
    if(!q.length){ toast('今日復習する問題はありません'); return; }
    startSession('復習', S.buildQueue(q, state.cards, today(), SUBJECT_ORDER), {mode:'review'});
  });
  el('modeNew').addEventListener('click', function(){
    var q = newQueue();
    if(!q.length){ toast('未着手の問題はありません（全問学習済み）'); return; }
    startSession('新しい問題', S.buildQueue(q, state.cards, today(), SUBJECT_ORDER).slice(0,10), {mode:'new'});
  });
  el('modeCat').addEventListener('click', function(){ go('cats'); });
  el('modeExam').addEventListener('click', function(){
    startSession('模試（全'+QUESTIONS.length+'問）', shuffle(QUESTIONS.slice()), {mode:'exam'});
  });
  el('nextBtn').addEventListener('click', next);
  el('qClose').addEventListener('click', function(){
    if(confirm('学習を中断してホームに戻りますか？（ここまでの記録は保存されます）')) go('home');
  });
  el('resAgain').addEventListener('click', function(){ startSession('今日やる', todayQueue(), {mode:'today'}); });
  el('themeBtn').addEventListener('click', cycleTheme);
  el('examDate').addEventListener('change', function(e){
    state.examDate = e.target.value||null; save(); renderHome();
    toast(state.examDate?'試験日を設定しました':'試験日をクリアしました');
  });
  el('resetBtn').addEventListener('click', function(){
    if(confirm('学習記録（正誤・習得状況・連続日数）をすべて消去します。よろしいですか？')){
      state = normalize({cards:{}, streak:0, lastStudyDay:null, examDate:state.examDate, goalDoneDay:null, goalDoneCount:0});
      save(); renderHome(); toast('学習記録をリセットしました');
    }
  });
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(){ go(b.getAttribute('data-go')); });
  });
  el('grade1').addEventListener('click', function(){ if(currentGrade!=='1kyu'){ setGrade('1kyu'); toast('1級に切り替えました'); } });
  el('grade2').addEventListener('click', function(){ if(currentGrade!=='2kyu'){ setGrade('2kyu'); toast('2級に切り替えました'); } });

  el('verLabel').textContent = 'v2 · '+QUESTIONS.length+'問';
  initTheme();
  renderHome();
})();
</script>
