当なものはどれか。","opts":["減水剤","収縮低減剤","AE 剤","流動化剤"],"ans":2,"ex":"","src":"20260608_2kyu","qid":153,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93870"},{"cat":"土木一般","year":"R8前期 No.11","q":"コンクリートの打込みに関する記述のうち、適当なものはどれか。","opts":["打ち込んだコンクリートは型枠内で横移動させる。","打込み前には、鉄筋や型枠の配置、清掃状態等を確認する。","圧送管等の吐出口とコンクリートの打込み面までの高さは 2.0 m 以下とする。","2 層以上に分けて打ち込む場合、1 層あたりの打込み高さは 1.0 m 以下とする。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":154,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93871"},{"cat":"土木一般","year":"R8前期 No.12","q":"各種のコンクリートに関する記述のうち、適当でないものはどれか。","opts":["マスコンクリートでは、セメントの水和熱による圧縮応力に伴うひび割れに対する注意が必要である。","膨張コンクリートは、膨張の効果によって体積変化によるひび割れの発生や拡大を防ぐものである。","寒中コンクリートとしての施工は、日平均気温が 4 ℃ 以下になると想定されるときに行う。","流動化コンクリートは、あらかじめ練り混ぜられたフレッシュコンクリートに流動化剤を添加し、流動性を増大させたものであり、そのスランプは原則として 18 cm 以下とする。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":155,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93872"},{"cat":"土木一般","year":"R8前期 No.13","q":"コンクリートの養生に関する記述のうち、適当でないものはどれか。","opts":["養生期間中は、有害な応力や変形を加えないようコンクリートを保護する。","湿潤養生の標準日数は、混合セメントに比べて普通ポルトランドセメントの方が長い。","コンクリートの水和反応を十分に進行させるよう、湿潤状態に保つ。","コンクリートを湿潤状態に保つためには、散水や養生マット等を使用する。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":156,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93873"},{"cat":"土木一般","year":"R8前期 No.14","q":"既製杭の中掘り杭工法に関する記述のうち、適当でないものはどれか。","opts":["既製杭の中をアースオーガで掘削しながら杭を貫入する。","先端処理工法には、最終打撃方式とセメントミルク噴出攪拌方式がある。","打撃・振動による方法に比べると、大きな支持力が得られる。","打撃・振動による方法に比べると、施工時の騒音や振動が小さい。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":157,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93874"},{"cat":"土木一般","year":"R8前期 No.15","q":"場所打ち杭の「工法名」と「孔壁保護の主な資機材」に関する組合せとして、適当なものはどれか。","opts":["アースドリル工法 － スタンドパイプ","深礎工法 － 土留め材（ライナープレート）","オールケーシング工法 － 安定液（ベントナイト水）","リバースサーキュレーション工法 － ケーシングチューブ"],"ans":1,"ex":"","src":"20260608_2kyu","qid":158,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93875"},{"cat":"土木一般","year":"R8前期 No.16","q":"土留め壁の「種類」と「特徴」に関する組合せとして、適当なものはどれか。","opts":["柱列杭 － 剛性が大きく、深い掘削に適する。","連続地中壁 － あらゆる地盤に適用でき、他に比べ経済的である。","鋼矢板 － 掘削時のたわみ性が小さく、施工が容易である。","親杭・横矢板 － 遮水性が高く、地下水位の高い地盤に適する。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":159,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93876"},{"cat":"専門土木","year":"R8前期 No.17","q":"鋼材に関する記述のうち、適当でないものはどれか。","opts":["応力度が弾性限度に達するまでは塑性を示し、それを超えると弾性を示す。","塑性領域で応力度をゼロに戻しても、ひずみはゼロとはならない永久ひずみが残る。","強さや靭性等を長期間にわたり維持するための耐久性が求められる。","疲労の激しい鋼材では、急激な破壊が生じることがある。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":160,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93877"},{"cat":"専門土木","year":"R8前期 No.18","q":"鋼道路橋に用いる高力ボルトに関する記述のうち、適当でないものはどれか。","opts":["高力ボルトの長さは、部材を十分に締め付けられるものとしなければならない。","高力ボルトの締付けは、設計ボルト軸力が得られるように締め付けなければならない。","トルク法による高力ボルトの締付け検査は、トルク係数値が安定する数日後に行う。","回転法による締付け検査は、マーキングの回転角が規定の範囲内であることを確認する。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":161,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93878"},{"cat":"専門土木","year":"R8前期 No.19","q":"コンクリート構造物の耐久性に関する記述のうち、適当でないものはどれか。","opts":["コンクリートの凍害対策として、AE 剤若しくは AE 減水剤を使用する。","アルカリシリカ反応対策として、通常の早強ポルトランドセメントを使用する。","コンクリートの中性化が進行すると、鉄筋が腐食しやすくなる。","化学的侵食は、温泉地域や下水道管等で起こりやすい。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":162,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93879"},{"cat":"専門土木","year":"R8前期 No.20","q":"河川堤防に用いる土質材料に関する記述のうち、適当でないものはどれか。","opts":["水で飽和したとき、法面のすべりが起きにくい材料がよい。","締固めを満足する施工のためには単一な粒径の材料がよい。","堤体の安定に支障を及ぼすような圧縮変形や膨張性がない材料がよい。","浸水、乾燥等の環境変化に対して、法すべりやクラック等が生じにくい材料がよい。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":163,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93880"},{"cat":"専門土木","year":"R8前期 No.21","q":"河川護岸の法覆工に関する記述のうち、適当でないものはどれか。","opts":["間地ブロック積工は、一般に、法勾配が緩く、流速が小さい場所で施工する工法である。","コンクリート法枠工は、法勾配の急な場所では施工が難しい工法である。","横帯工は、河川の流水方向の一定区間ごとに設け、護岸の変位や破損が他に波及しないように絶縁するものである。","縦帯工は、護岸の法肩部に設けられるもので、法肩の施工を容易にすると共に、護岸の法肩部の破壊を防ぐものである。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":164,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93881"},{"cat":"専門土木","year":"R8前期 No.22","q":"砂防堰堤の構造に関する記述のうち、適当なものはどれか。","opts":["砂防堰堤は、渓流から流出する砂礫を速やかに流下させるための構造物である。","堤体基礎の根入れは、基礎地盤が岩盤の場合、砂礫の場合よりも深くするのが一般的である。","副堰堤は、本堰堤への土石流の直撃を防止するために設ける。","水叩きは、本堰堤からの落下水の衝撃を緩和し、洗掘を防止するために設ける。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":165,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93882"},{"cat":"専門土木","year":"R8前期 No.23","q":"地すべり防止工に関する記述のうち、適当でないものはどれか。","opts":["地すべり防止工には、大別して抑制工と抑止工があり、抑制工としては水路工、排土工等が、抑止工としては杭工、シャフト工等がある。","横ボーリング工は、地下水調査等の結果をもとに、帯水層に向けてボーリングを行い、地下水を排除する工法である。","杭工は、鋼管等の杭によって斜面の安定を高める工法で、杭を建て込む位置は、地すべり部分の下部のすべり面の勾配が急な場所とする。","排水トンネル工は、トンネルから帯水層へボーリングを行い、トンネルを使って排水する工法で、地すべり規模が大きい場合等に用いられる。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":166,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93883"},{"cat":"専門土木","year":"R8前期 No.24","q":"道路のアスファルト舗装における路床の施工に関する記述のうち、適当でないものはどれか。","opts":["構築路床は、交通荷重を支持する層として、適切な支持力と変形抵抗性が求められる。","構築路床の施工終了後から舗装施工までに相当の期間がある場合は、仕上げ面の保護を行う。","置換え工法は、軟弱な現状路床土の一部又は全部を良質土で置き換える工法である。","安定処理工法は、現状路床土と砕石やぐり石等の粒状材料を混合する工法である。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":167,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93884"},{"cat":"専門土木","year":"R8前期 No.25","q":"道路のアスファルト舗装の施工に関する記述のうち、適当でないものはどれか。","opts":["タックコートの散布量は、一般に 0.3 ～ 0.6 ℓ/m2 が標準である。","敷均し時の混合物の温度は、一般に 110 ℃ を下回らないようにする。","転圧温度が高すぎると、ヘアクラックや変形を起こすことがある。","締固め作業は、初転圧、二次転圧、継目転圧、仕上げ転圧の順で行う。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":168,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93885"},{"cat":"専門土木","year":"R8前期 No.26","q":"道路のアスファルト舗装の維持修繕に関する記述のうち、適当でないものはどれか。","opts":["表面処理工法は、既設舗装の上に厚さ 3 cm 未満の封かん層を設ける。","薄層オーバーレイ工法は、既設舗装の上に厚さ 3 cm 未満の加熱アスファルト混合物を舗設する。","切削工法は、路面に生じている段差や凹凸を解消するため、路面の凸部等を切削除去する。","パッチング工法は、局部的なくぼみや段差等に、シール材で応急的に充塡する。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":169,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93886"},{"cat":"専門土木","year":"R8前期 No.27","q":"道路の普通コンクリート舗装の施工に関する記述のうち、適当でないものはどれか。","opts":["コンクリートの敷均しは、全体ができるだけ均等な密度になるように適切な余盛をつけて行う。","表面仕上げ後のコンクリート版は、所定の強度になるまで乾燥状態を保つ。","温度変化によりコンクリート版が膨張・収縮できるよう、路盤上に路盤紙を敷いたりする。","カッタによる目地溝は、所定の位置に所要の幅及び深さまで垂直に切り込んで設置する。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":170,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93887"},{"cat":"専門土木","year":"R8前期 No.28","q":"フィルダムの施工に関する記述のうち、適当でないものはどれか。","opts":["フィルダムは、中央コア型ロックフィルダムの場合、一般的に堤体の中央部に遮水用の土質材料を用いる。","フィルダムは、ダム近傍でも盛立材料を得やすいため、運搬距離が短く経済的に材料調達を行うことができる。","フィルダムは、重機による土工が中心であるため、コンクリートダムに比べてコンクリートプラント等の仮設備費を少なくできる。","フィルダムは、一般的にコンクリートダムに比べて堤体積が大きく、また大きな基礎岩盤強度を必要とする。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":171,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93888"},{"cat":"専門土木","year":"R8前期 No.29","q":"トンネルの山岳工法における掘削に関する記述のうち、適当でないものはどれか。","opts":["発破掘削は、地質が硬岩質等の場合に用いられる。","機械掘削は、余掘りが少ない等の利点がある。","導坑先進工法は、トンネルの全断面を一度に掘削する工法である。","ベンチカット工法は、一般にトンネル断面を上半分と下半分に分けて掘削する工法である。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":172,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93889"},{"cat":"専門土木","year":"R8前期 No.30","q":"海岸における異形コンクリートブロック（消波ブロック）による消波工に関する記述のうち、適当でないものはどれか。","opts":["乱積みは、層積みに比べて据付けが容易であり、据付け時は安定性がよい。","乱積みは、高波を受けるたびに沈下し、徐々にブロックのかみ合わせがよくなり安定する。","層積みは、乱積みに比べて据付けに手間がかかり、海岸線の曲線部等では施工が難しい。","層積みは、規則正しく配列する積み方で、整然と並び外観が美しく安定性がよい。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":173,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93890"},{"cat":"専門土木","year":"R8前期 No.31","q":"グラブ浚渫船の施工に関する記述のうち、適当でないものはどれか。","opts":["余掘は、計画水深より浅い箇所を残さないために行う。","出来形確認測量は、音響測深機等により、グラブ浚渫船が工事現場にいる間に行う。","グラブ浚渫船の標準的な船団は、グラブ浚渫船、引船、土運船、揚びょう船である。","グラブ浚渫船は、岸壁等の構造物前面の浚渫や狭い場所での浚渫には使用できない。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":174,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93891"},{"cat":"専門土木","year":"R8前期 No.32","q":"鉄道工事における軌道の施工に関する記述のうち、適当でないものはどれか。","opts":["マクラギは、列車荷重を支持するのに十分な強度を有し、耐用年数が長いものを選定する。","道床内の水を速やかに排除するために、路盤面を水平に仕上げる。","道床に用いる砕石は、強固で耐摩耗性に優れたものを選び、念入りな締固めを行う。","レール継目部の遊間の整正は、レール伸縮が著しい夏期及び冬期に先立ち実施する。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":175,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93892"},{"cat":"専門土木","year":"R8前期 No.33","q":"鉄道（在来線）の営業線内及び営業線近接工事の保安対策に関する記述のうち、適当でないものはどれか。","opts":["重機械を使用する場合、列車の近接から通過の完了まで、慎重に作業する。","工事管理者は、工事現場ごとに専任の者を常時配置し、必要により複数配置する。","見通し距離を確保できない場合は、見通し距離を確保できる位置に中継見張員を配置する。","事故発生等により列車運行に支障するおそれのある場合、直ちに列車防護手配を行う。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":176,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93893"},{"cat":"専門土木","year":"R8前期 No.34","q":"シールド工法に関する記述のうち、適当でないものはどれか。","opts":["土圧式や泥水式等の密閉型シールドは、フード部とガーダー部が隔壁で仕切られている。","泥水式シールド工法は、ずりが流体輸送となるため、泥水処理設備が必要になる。","シールド掘進時は、土質や土被り等の変化に留意し、掘削土砂を取り込み過ぎないように切羽の安定を図る。","シールド掘進後は、セグメント外周に空隙が生じるため、地盤の安定後にモルタルを注入する。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":177,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93894"},{"cat":"専門土木","year":"R8前期 No.35","q":"上水道の管布設工に関する記述のうち、適当でないものはどれか。","opts":["管の布設にあたっては、原則として低所から高所に向けて行う。","鋼管の据付けは、管体保護のため基礎に良質な砕石を敷き均して行う。","埋戻しは片埋めに注意しながら、現地盤と同程度以上の密度になるように締め固める。","塩化ビニル管を横積みで保管する場合は、平地に積み上げ崩れないように注意する。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":178,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93895"},{"cat":"専門土木","year":"R8前期 No.36","q":"下水道管渠の更生工法に関するイ、ロの説明とその工法名の組合せとして、適当なものはどれか。イ 既設管渠より小さな管径で工場製作された二次製品をけん引挿入し、間隙にモルタル等の充塡材を注入することで更生管渠を構築する。ロ 硬化性樹脂を含浸させた材料や熱可塑性樹脂で成形した材料をマンホールから引き込み、加圧し、拡張・圧着後、硬化や冷却固化することで更生管渠を構築する。","opts":["イ さや管工法 ／ ロ 製管工法","イ 形成工法 ／ ロ 製管工法","イ 製管工法 ／ ロ 形成工法","イ さや管工法 ／ ロ 形成工法"],"ans":3,"ex":"","src":"20260608_2kyu","qid":179,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93896"},{"cat":"法規","year":"R8前期 No.37","q":"労働基準法上、労働時間、休憩及び休暇に関する記述のうち、誤っているものはどれか。","opts":["使用者は、原則として、休憩時間を労働時間の途中に労働者ごとに開始時刻を変えて与えることができる。","雇入れの日から 6 箇月間継続勤務し全労働日の 8 割以上出勤した労働者に対して、使用者は、10 労働日の有給休暇を与えなければならない。","災害その他避けることのできない事由によって、臨時の必要がある場合、使用者は、行政官庁の許可を受けて、法令で定められた労働時間を延長することができる。","使用者は、原則として、労働者に休憩時間を除き 1 週間について 40 時間を超えて、労働させてはならない。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":180,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93897"},{"cat":"法規","year":"R8前期 No.38","q":"労働基準法上、災害補償に関する記述のうち、正しいものはどれか。","opts":["療養補償を受ける労働者が、療養開始後、所定年数を経過しても疾病がなおらない場合には、使用者は、その後の一切の補償を行わなくてもよい。","労働者が業務上負傷し治った場合に、その身体に障害が存するときは、使用者は、その障害が重度な場合に限り、障害補償を行わなければならない。","労働者が業務上負傷し、又は疾病にかかった場合の補償を受ける権利は、これを譲渡し、又は差し押えてはならない。","労働者が重大な過失によって業務上負傷し、かつ使用者がその過失について行政官庁に届出た場合には、使用者は障害補償を行わなくてもよい。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":181,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93898"},{"cat":"法規","year":"R8前期 No.39","q":"労働安全衛生法上、作業主任者の選任を必要とする作業に関する記述のうち、正しいものはどれか。","opts":["掘削面の高さが 1 m 以上の地山の掘削の作業","土止め支保工の切りばり又は腹起しの取付け又は取り外しの作業","橋梁の下部構造であって、金属製の部材で構成されるものの架設、解体又は変更の作業","既製コンクリート杭の杭打ちの作業"],"ans":1,"ex":"","src":"20260608_2kyu","qid":182,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93899"},{"cat":"法規","year":"R8前期 No.40","q":"建設業法上、元請負人の義務及び施工技術の確保に関する記述のうち、誤っているものはどれか。","opts":["元請負人は、作業方法を定めるときは、あらかじめ下請負人の意見を聞かなければならない。","元請負人は、公共性のある施設に関する重要な工事である場合、請負代金の額にかかわらず、工事現場ごとに専任の主任技術者又は監理技術者を置かなければならない。","建設工事の施工に従事する者は、主任技術者又は監理技術者がその職務として行う指導に従わなければならない。","建設業者は、建設工事の担い手の育成及び確保その他の施工技術の確保に努めなければならない。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":183,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93900"},{"cat":"法規","year":"R8前期 No.41","q":"建設業法上、工事現場における主任技術者及び監理技術者の職務に関する記述のうち、誤っているものはどれか。","opts":["当該建設工事の施工に従事する者の技術上の指導監督を行わなければならない。","当該建設工事の工程管理を行わなければならない。","当該建設工事の下請契約書の作成を行わなければならない。","当該建設工事の品質管理を行わなければならない。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":184,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93901"},{"cat":"法規","year":"R8前期 No.42","q":"河川法上、河川区域内において、河川管理者の許可を必要としないものはどれか。","opts":["河川区域内の農業施設において、機能維持のために取水口付近の堆積土砂を排除する場合","河川区域内の民有地において、堆積した土砂を採取する場合","河川区域内の地下において、河川を横断する下水道管を推進工法にて新設する場合","河川区域内の上空において、河川を横断する送電線を架設する場合"],"ans":0,"ex":"","src":"20260608_2kyu","qid":185,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93902"},{"cat":"法規","year":"R8前期 No.43","q":"建築基準法の用語に関する記述のうち、誤っているものはどれか。","opts":["容積率とは、敷地面積の建築物の延べ面積に対する割合をいう。","建築物とは、土地に定着する工作物のうち、屋根及び柱若しくは壁を有するもの、これに附属する門若しくは塀等をいう。","建築設備とは、建築物に設ける電気、ガス、給水、排水、換気、暖房、冷房、消火、排煙若しくは汚物処理の設備又は煙突、昇降機若しくは避雷針をいう。","建築とは、建築物を新築し、増築し、改築し、又は移転することをいう。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":186,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93903"},{"cat":"法規","year":"R8前期 No.44","q":"道路法上、道路の占用の許可に関し、道路管理者に提出すべき申請書に記載する事項に該当しないものはどれか。","opts":["道路の占用の目的","道路の占用の場所","工事実施の方法","建設業の許可番号"],"ans":3,"ex":"","src":"20260608_2kyu","qid":187,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93904"},{"cat":"法規","year":"R8前期 No.45","q":"騒音規制法上、指定地域内における特定建設作業の規制基準に関する記述のうち、誤っているものはどれか。","opts":["特定建設作業の敷地の境界線において騒音の大きさは、75 dB を超えてはならない。","夜間・深夜作業の禁止時間帯は、原則として午後 7 時から翌日の午前 7 時までである。","1 日の作業時間は、原則として 10 時間を超えてはならない。","特定建設作業は、原則として同一場所においては連続 6 日間を超えてはならない。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":188,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93905"},{"cat":"法規","year":"R8前期 No.46","q":"振動規制法上、特定建設作業の対象となる建設機械はどれか。ただし、当該作業がその作業を開始した日に終わるものを除き、1 日における当該作業に係る 2 地点間の最大移動距離が 50 m を超えない作業とする。","opts":["ブルドーザ","振動ローラ","バックホウ","ジャイアントブレーカ"],"ans":3,"ex":"","src":"20260608_2kyu","qid":189,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93906"},{"cat":"法規","year":"R8前期 No.47","q":"港則法上、許可申請に関する記述のうち、誤っているものはどれか。","opts":["特定港内又は特定港の境界附近で工事又は作業をしようとする者は、港長に届け出なければならない。","船舶は、特定港において危険物の積込、積替又は荷卸をするには、港長の許可を受けなければならない。","特定港内において竹木材を船舶から水上に卸そうとする者は、港長の許可を受けなければならない。","船舶は、特定港に入港したとき又は特定港を出港しようとするときは、港長に届け出なければならない。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":190,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93907"},{"cat":"施工管理法","year":"R8前期 No.48","q":"新点Bの標高を求めるため、新点Bから TS（トータルステーション）で既知点Aに設置した反射鏡中心の鉛直角観測と距離測定を行って、次の観測結果を得た。新点Bの標高として、正しいものはどれか。ただし、既知点Aの標高は 50.00 m とし、AB 両点ともに偏心はなく、球差と気差を合わせた両差は考慮しないものとする。なお、sin（-30°）＝ -0.5。観測結果：高低角 αB ＝ -30°00′00″、斜距離 LB ＝ 200.00 m、既知点Aの測標高 fA ＝ 1.30 m、新点Bの器械高 iB ＝ 1.50 m。","opts":["147.20 m","149.80 m","150.20 m","152.80 m"],"ans":1,"ex":"","src":"20260608_2kyu","qid":191,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93908"},{"cat":"施工管理法","year":"R8前期 No.49","q":"公共工事標準請負契約約款に関する記述のうち、誤っているものはどれか。","opts":["受注者は約款及び設計図書に特別の定めがない場合には仮設、施工方法その他工事目的物を完成させるために必要な一切の手段を、自らの責任において定める。","受注者は、工事の施工に当たり、設計図書の表示が明確でない事実を発見したときは、その旨を直ちに監督員に通知し、その確認を請求しなければならない。","受注者は、必要があるときは、設計図書の変更内容を発注者に通知して、設計図書を変更することができる。","受注者は、工事の施工部分が設計図書に適合しない場合において、監督員がその改造を請求したときは、請求に従わなければならない。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":192,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93909"},{"cat":"施工管理法","year":"R8前期 No.51","q":"建設工事における建設機械の「機械名」と「性能表示」に関する組合せとして、適当なものはどれか。","opts":["コンクリートブレーカ － 質量［kg］","コンクリートポンプ車 － 打込み能力［m3/h］","アスファルトフィニッシャ － 施工幅［m］","クレーン － ブーム長［m］"],"ans":3,"ex":"","src":"20260608_2kyu","qid":193,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93911"},{"cat":"施工管理法","year":"R8前期 No.52","q":"建設工事のための施工計画作成に関する記述のうち、適当でないものはどれか。","opts":["事前調査は、契約条件、設計図面及び仕様書の内容を検討し、工事数量の確認を行う。","施工技術計画のうち工程計画は、使用する機械、設備、人などの 1 日当たりの作業量を算出し、各工種の開始と終了時期を決める。","仮設備計画は、仮設備の使用目的や期間に応じて構造計算を行い、品質管理計画に合致するものとする。","管理計画は、現場周辺の環境に影響しないよう、公害問題、交通問題等への対策を立てる。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":194,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93912"},{"cat":"施工管理法","year":"R8前期 No.53","q":"労働安全衛生法上、高さ 2 m 以上の足場（つり足場を除く）に設ける作業床に関する記述のうち、事業者が講じなければならない措置として、誤っているものはどれか。","opts":["床材と建地との隙間は、原則として 12 cm 未満とする。","作業床の幅は、30 cm 以上とする。","床材間の隙間は、3 cm 以下とする。","作業床より物体の落下を防ぐ幅木の高さは、原則として 10 cm 以上とする。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":195,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93913"},{"cat":"施工管理法","year":"R8前期 No.54","q":"労働安全衛生法上、高さ 5 m 以上のコンクリート造の工作物の解体作業に伴う危険を防止するために、事業者が行うべき事項に関する記述のうち、誤っているものはどれか。","opts":["外壁、柱等の引倒し等の作業を行う場合において、引倒し等について一定の合図を定め、関係労働者に周知させなければならない。","解体用機械を用いて作業を行うときは、物体の飛来等により危険が生じるおそれのある箇所に、作業主任者以外の者を立ち入らせてはならない。","強風、大雨、大雪等の悪天候のため、作業の実施について危険が予想されるときは、当該作業を中止しなければならない。","工作物の倒壊、物体の飛来又は落下等による労働者の危険を防止するため、あらかじめ、当該工作物の形状等を調査し、作業計画を定め、これにより作業を行わなければならない。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":196,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93914"},{"cat":"施工管理法","year":"R8前期 No.55","q":"アスファルト舗装の品質特性と試験方法に関する記述のうち、適当なものはどれか。","opts":["アスファルトの伸度を確認するためには、マーシャル安定度試験を行う。","アスファルトの硬さを調べるためには、すり減り試験を行う。","アスファルト舗装の平坦性を確認するためには、プルーフローリング試験を行う。","アスファルト舗装の路床の強さを判定するためには、CBR 試験を行う。"],"ans":3,"ex":"","src":"20260608_2kyu","qid":197,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93915"},{"cat":"施工管理法","year":"R8前期 No.56","q":"レディーミクストコンクリート（JIS A 5308）の受入検査に関する記述のうち、適当でないものはどれか。","opts":["スランプ 12 cm のコンクリートで許容されるスランプの上限値は 15.0 cm である。","塩化物含有量は、塩化物イオン量として原則 0.30 kg/m3 以下であること。","空気量 4.5 ％ のコンクリートで許容される空気量の上限値は 6.0 ％ である。","1 回の圧縮強度試験結果は、購入者の指定した呼び強度の値の 85 ％ 以上であること。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":198,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93916"},{"cat":"施工管理法","year":"R8前期 No.57","q":"建設工事における騒音や振動に関する記述のうち、適当でないものはどれか。","opts":["大きな騒音や振動を発生する作業は、できるだけ人家への影響を小さくするように季節、時間帯、場所を選定できるよう作業段取りを計画する等の配慮が必要である。","履帯式（クローラ式）の建設機械は、車輪式（ホイール式）の建設機械に比べて、一般に騒音や振動のレベルが小さい。","建設機械の運転を行わない作業待ち時は、建設機械等のエンジンをできる限り止める等、騒音や振動を発生させない。","ブルドーザを用いて掘削押し土を行う場合、無理な負荷をかけないようにし、後進時の高速走行を避けて、ていねいに運転する。"],"ans":1,"ex":"","src":"20260608_2kyu","qid":199,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93917"},{"cat":"施工管理法","year":"R8前期 No.58","q":"「建設工事に係る資材の再資源化等に関する法律」（建設リサイクル法）に定められている特定建設資材に該当するものはどれか。","opts":["廃プラスチック","廃油","木材","ゴムくず"],"ans":2,"ex":"","src":"20260608_2kyu","qid":200,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93918"},{"cat":"施工管理法応用","year":"R8前期 No.59","q":"施工計画における建設機械の作業効率に関する①～④の記述のうち、適当なものの数はどれか。① 建設機械の作業能力は、単独又は組み合わされた機械の時間当たりの平均作業量で表す。② ワーカビリティーとは建設機械の走行性をいい、一般にコーン指数で判断される。③ リッパビリティーとは、大型ブルドーザに装着されたリッパで作業できる程度をいう。④ ダンプトラックの作業効率は、運搬路の沿道条件、路面状態、昼夜の別等で変わる。","opts":["1つ","2つ","3つ","4つ"],"ans":2,"ex":"","src":"20260608_2kyu","qid":201,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93919"},{"cat":"施工管理法応用","year":"R8前期 No.60","q":"公共工事における施工体制台帳及び施工体系図に関する文章中の(イ)～(ニ)に当てはまる語句の組合せとして、適当なものはどれか。・施工体制台帳は、原則としてその写しを(イ)に提出しなければならない。・施工体制台帳は、(ロ)を記載しなければならない。・施工体系図は、(ハ)の要約版ともいえ、必ず作成しなければならない。・施工体系図は、変更があった場合は、(ニ)に変更を行わなければならない。","opts":["(イ)元請負人 (ロ)下請負人の名称 (ハ)設計図 (ニ)工事完成検査まで","(イ)発注者 (ロ)下請負人の施工実績 (ハ)設計図 (ニ)工事完成検査まで","(イ)発注者 (ロ)下請負人の名称 (ハ)施工体制台帳 (ニ)速やか","(イ)元請負人 (ロ)下請負人の施工実績 (ハ)施工体制台帳 (ニ)速やか"],"ans":2,"ex":"","src":"20260608_2kyu","qid":202,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93920"},{"cat":"施工管理法応用","year":"R8前期 No.61","q":"工程表の種類と特徴に関する記述のうち、適当なもののみを全てあげている組合せはどれか。① バーチャートは、各工事の必要日数を棒線で表した図表である。② ガントチャートは、工事内容を系統だてて作業相互の関連、順序や日数を表した図表である。③ グラフ式工程表は、工種ごとの工程を斜線で表した図表である。④ 出来高累計曲線は、工事全体の出来高比率の累計を曲線で表した図表である。","opts":["①②","②③","①③④","②③④"],"ans":2,"ex":"","src":"20260608_2kyu","qid":203,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93921"},{"cat":"施工管理法応用","year":"R8前期 No.63","q":"労働安全衛生法上、複数の事業者が混在している事業場の安全衛生管理体制に関する文章中の(イ)～(ニ)に当てはまる語句の組合せとして、正しいものはどれか。・事業者のうち、一の場所で行う事業でその一部を請負人に請け負わせているものを(イ)という。・(イ)のうち、建設業等の事業を行う者を(ロ)という。・(ロ)は、労働災害を防止するため、(ハ)の運営を行わなくてはならない。・(ロ)は、作業場所の巡視を(ニ)少なくとも 1 回行わなくてはならない。","opts":["(イ)元方事業者 (ロ)特定元方事業者 (ハ)協議組織 (ニ)毎作業日に","(イ)特定元方事業者 (ロ)元方事業者 (ハ)技能講習 (ニ)毎作業日に","(イ)元方事業者 (ロ)特定元方事業者 (ハ)技能講習 (ニ)毎週","(イ)特定元方事業者 (ロ)元方事業者 (ハ)協議組織 (ニ)毎週"],"ans":0,"ex":"","src":"20260608_2kyu","qid":204,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93923"},{"cat":"施工管理法応用","year":"R8前期 No.64","q":"労働安全衛生法上、車両系建設機械を用いた作業において、事業者が行うべき事項に関する文章中の(イ)～(ニ)に当てはまる語句の組合せとして、正しいものはどれか。・作業を行うときに定める作業計画には、使用する機械の種類及び能力、(イ)、作業の方法が示されていなければならない。・車両系建設機械の転倒又は転落により運転者に危険が生ずるおそれのある場所においては、転倒時保護構造を有し、かつ、(ロ)を備えたもの以外の車両系建設機械を使用しないように努めなければならない。・運転について誘導者を置くときは、一定の合図を定め、(ハ)に当該合図を行わせなければならない。・作業を行うときは、(ニ)に、ブレーキ及びクラッチの機能について点検を行わなければならない。","opts":["(イ)運行経路 (ロ)安全ブロック (ハ)運転者 (ニ)その日の作業開始前","(イ)機械の所有者 (ロ)シートベルト (ハ)運転者 (ニ)作業の前日","(イ)機械の所有者 (ロ)安全ブロック (ハ)誘導者 (ニ)作業の前日","(イ)運行経路 (ロ)シートベルト (ハ)誘導者 (ニ)その日の作業開始前"],"ans":3,"ex":"","src":"20260608_2kyu","qid":205,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93924"},{"cat":"施工管理法応用","year":"R8前期 No.65","q":"品質管理に用いられるヒストグラムに関する記述のうち、適当なもののみを全てあげている組合せはどれか。① ヒストグラムは、測定値のばらつきを知るのに最も簡単で効率的な統計手法である。② ヒストグラムは、データがどんな分布をしているのかを表した柱状図である。③ 平均値が規格値の中央で左右対称なヒストグラムは、品質管理が良好である。④ ヒストグラムでは、縦軸に平均値、横軸に測定値を示している。","opts":["①④","②③","①②③","②③④"],"ans":2,"ex":"","src":"20260608_2kyu","qid":206,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93925"},{"cat":"施工管理法応用","year":"R8前期 No.66","q":"盛土の締固めにおける品質管理に関する①～④の記述のうち、適当なもののみを全てあげている組合せはどれか。① 工法規定方式は、盛土の品質を仕様書に明示し、締固めの工法を施工者に任せる方法である。② 品質規定方式は、締固め機械の機種や締固め回数、盛土材料の敷均し厚さ等を規定する方法である。③ 盛土の締固めは、法面の安定や土の支持力の増加等を目的とし、必要な強度特性が得られるように行う。④ ICT 土工とは、土木工事で、電子情報を活用して効率的で高精度な施工を行うものである。","opts":["①②","③④","①②③","②③④"],"ans":1,"ex":"","src":"20260608_2kyu","qid":207,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93926"},{"cat":"土木一般","year":"R4前期 No.1","q":"土の締固めに使用する機械に関する次の記述のうち，適当でないものはどれか。","opts":["タイヤローラは，細粒分を適度に含んだ山砂利の締固めに適している。","振動ローラは，路床の締固めに適している。","タンピングローラは，低含水比の関東ロームの締固めに適している。","ランマやタンパは，大規模な締固めに適している。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":208},{"cat":"土木一般","year":"R4前期 No.2","q":"土質試験における\u0002試験名\u0003とその\u0002試験結果の利用\u0003に関する次の組合せのうち，適当でないものはどれか。［試験名］［試験結果の利用］","opts":["標準貫入試験 ― 地盤の透水性の判定","砂置換法による土の密度試験 ― 土の締固め管理","ポータブルコーン貫入試験 ― 建設機械の走行性の判定","ボーリング孔を利用した透水試験 ― 地盤改良工法の設計"],"ans":0,"ex":"","src":"20220606_2kyu","qid":209},{"cat":"土木一般","year":"R4前期 No.3","q":"道路土工の盛土材料として望ましい条件に関する次の記述のうち，適当でないものはどれか。","opts":["盛土完成後の圧縮性が小さいこと。","水の吸着による体積増加が小さいこと。","盛土完成後のせん断強度が低いこと。","敷均しや締固めが容易であること。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":210},{"cat":"土木一般","year":"R4前期 No.4","q":"地盤改良に用いられる固結工法に関する次の記述のうち，適当でないものはどれか。","opts":["深層混合処理工法は，大きな強度が短期間で得られ沈下防止に効果が大きい工法である。","薬液注入工法は，薬液の注入により地盤の透水性を高め，排水を促す工法である。","深層混合処理工法には，安定材と軟弱土を混合する機械攪拌方式がある。","薬液注入工法では，周辺地盤等の沈下や隆起の監視が必要である。"],"ans":1,"ex":"","src":"20220606_2kyu","qid":211},{"cat":"土木一般","year":"R4前期 No.5","q":"コンクリートの耐凍害性の向上を図る混和剤として適当なものは，次のうちどれか。","opts":["流動化剤","収縮低減剤","AE 剤","鉄筋コンクリート用防錆剤"],"ans":2,"ex":"","src":"20220606_2kyu","qid":212},{"cat":"土木一般","year":"R4前期 No.6","q":"レディーミクストコンクリートの配合に関する次の記述のうち，適当でないものはどれか。","opts":["単位水量は，所要のワーカビリティーが得られる範囲内で，できるだけ少なくする。","水セメント比は，強度や耐久性等を満足する値の中から最も小さい値を選定する。","スランプは，施工ができる範囲内で，できるだけ小さくなるようにする。","空気量は，凍結融解作用を受けるような場合には，できるだけ少なくするのがよい。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":213},{"cat":"土木一般","year":"R4前期 No.7","q":"フレッシュコンクリートの性質に関する次の記述のうち，適当でないものはどれか。","opts":["材料分離抵抗性とは，フレッシュコンクリート中の材料が分離することに対する抵抗性である。","ブリーディングとは，練混ぜ水の一部が遊離してコンクリート表面に上昇する現象である。","ワーカビリティーとは，変形又は流動に対する抵抗性である。","レイタンスとは，コンクリート表面に水とともに浮かび上がって沈殿する物質である。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":214},{"cat":"土木一般","year":"R4前期 No.8","q":"コンクリートの現場内での運搬と打込みに関する次の記述のうち，適当でないものはどれか。","opts":["コンクリートの現場内での運搬に使用するバケットは，材料分離を起こしにくい。","コンクリートポンプで圧送する前に送る先送りモルタルの水セメント比は，使用するコンクリートの水セメント比よりも大きくする。","型枠内にたまった水は，コンクリートを打ち込む前に取り除く。","B層以上に分けて打ち込む場合は，上層と下層が一体となるように下層コンクリート中にも棒状バイブレータを挿入する。"],"ans":1,"ex":"","src":"20220606_2kyu","qid":215},{"cat":"土木一般","year":"R4前期 No.9","q":"既製杭の中掘り杭工法に関する次の記述のうち，適当でないものはどれか。","opts":["地盤の掘削は，一般に既製杭の内部をアースオーガで掘削する。","先端処理方法は，セメントミルク噴出攪拌方式とハンマで打ち込む最終打撃方式等がある。","杭の支持力は，一般に打込み工法に比べて，大きな支持力が得られる。","掘削中は，先端地盤の緩みを最小限に抑えるため，過大な先掘りを行わない。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":216},{"cat":"土木一般","year":"R4前期 No.10","q":"場所打ち杭の\u0002工法名\u0003と\u0002孔壁保護の主な資機材\u0003に関する次の組合せのうち，適当なものはどれか。［工法名］［孔壁保護の主な資機材］","opts":["深礎工法 ― 安定液（ベントナイト）","オールケーシング工法 ― ケーシングチューブ","リバースサーキュレーション工法 ― 山留め材（ライナープレート）","アースドリル工法 ― スタンドパイプ"],"ans":1,"ex":"","src":"20220606_2kyu","qid":217},{"cat":"土木一般","year":"R4前期 No.11","q":"土留め工に関する次の記述のうち，適当でないものはどれか。","opts":["自立式土留め工法は，切梁や腹起しを用いる工法である。","アンカー式土留め工法は，引張材を用いる工法である。","ヒービングとは，軟弱な粘土質地盤を掘削した時に，掘削底面が盛り上がる現象である。","ボイリングとは，砂質地盤で地下水位以下を掘削した時に，砂が吹き上がる現象である。"],"ans":0,"ex":"","src":"20220606_2kyu","qid":218},{"cat":"専門土木","year":"R4前期 No.12","q":"鋼材の溶接継手に関する次の記述のうち，適当でないものはどれか。","opts":["溶接を行う部分は，溶接に有害な黒皮，さび，塗料，油等があってはならない。","溶接を行う場合には，溶接線近傍を十分に乾燥させる。","応力を伝える溶接継手には，完全溶込み開先溶接を用いてはならない。","開先溶接では，溶接欠陥が生じやすいのでエンドタブを取り付けて溶接する。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":219},{"cat":"専門土木","year":"R4前期 No.13","q":"鋼道路橋に用いる高力ボルトに関する次の記述のうち，適当でないものはどれか。","opts":["高力ボルトの軸力の導入は，ナットを回して行うことを原則とする。","高力ボルトの締付けは，連結板の端部のボルトから順次中央のボルトに向かって行う。","高力ボルトの長さは，部材を十分に締め付けられるものとしなければならない。","高力ボルトの摩擦接合は，ボルトの締付けで生じる部材相互の摩擦力で応力を伝達する。"],"ans":1,"ex":"","src":"20220606_2kyu","qid":220},{"cat":"専門土木","year":"R4前期 No.14","q":"コンクリートに関する次の用語のうち，劣化機構に該当しないものはどれか。","opts":["塩害","ブリーディング","アルカリシリカ反応","凍害"],"ans":1,"ex":"","src":"20220606_2kyu","qid":221},{"cat":"専門土木","year":"R4前期 No.15","q":"河川堤防に用いる土質材料に関する次の記述のうち，適当でないものはどれか。","opts":["堤体の安定に支障を及ぼすような圧縮変形や膨張性がない材料がよい。","浸水，乾燥等の環境変化に対して，法すべりやクラック等が生じにくい材料がよい。","締固めが十分行われるために単一な粒径の材料がよい。","河川水の浸透に対して，できるだけ不透水性の材料がよい。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":222},{"cat":"専門土木","year":"R4前期 No.16","q":"河川護岸に関する次の記述のうち，適当なものはどれか。","opts":["高水護岸は，高水時に表法面，天端，裏法面の堤防全体を保護するものである。","法覆工は，堤防の法面をコンクリートブロック等で被覆し保護するものである。","基礎工は，根固工を支える基礎であり，洗掘に対して保護するものである。","小口止工は，河川の流水方向の一定区間ごとに設けられ，護岸を保護するものである。"],"ans":1,"ex":"","src":"20220606_2kyu","qid":223},{"cat":"専門土木","year":"R4前期 No.17","q":"砂防えん堤に関する次の記述のうち，適当でないものはどれか。","opts":["水抜きは，一般に本えん堤施工中の流水の切替えや堆砂後の浸透水を抜いて水圧を軽減するために設けられる。","袖は，洪水を越流させないために設けられ，両岸に向かって上り勾配で設けられる。","水通しの断面は，一般に逆台形で，越流する流量に対して十分な大きさとする。","水叩きは，本えん堤からの落下水による洗掘の防止を目的に，本えん堤上流に設けられるコンクリート構造物である。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":224},{"cat":"専門土木","year":"R4前期 No.18","q":"地すべり防止工に関する次の記述のうち，適当なものはどれか。","opts":["排土工は，地すべり頭部の不安定な土塊を排除し，土塊の滑動力を減少させる工法である。","横ボーリング工は，地下水の排除を目的とし，抑止工に区分される工法である。","排水トンネル工は，地すべり規模が小さい場合に用いられる工法である。","杭工は，杭の挿入による斜面の安定度の向上を目的とし，抑制工に区分される工法である。"],"ans":0,"ex":"","src":"20220606_2kyu","qid":225},{"cat":"専門土木","year":"R4前期 No.19","q":"道路のアスファルト舗装における下層・上層路盤の施工に関する次の記述のうち，適当でないものはどれか。","opts":["上層路盤に用いる粒度調整路盤材料は，最大含水比付近の状態で締め固める。","下層路盤に用いるセメント安定処理路盤材料は，一般に路上混合方式により製造する。","下層路盤材料は，一般に施工現場近くで経済的に入手でき品質規格を満足するものを用いる。","上層路盤の瀝青安定処理工法は，平坦性がよく，たわみ性や耐久性に富む特長がある。"],"ans":0,"ex":"","src":"20220606_2kyu","qid":226},{"cat":"専門土木","year":"R4前期 No.20","q":"道路のアスファルト舗装の施工に関する次の記述のうち，適当でないものはどれか。","opts":["加熱アスファルト混合物を舗設する前は，路盤又は基層表面のごみ，泥，浮き石等を取り除く。","現場に到着したアスファルト混合物は，ただちにアスファルトフィニッシャ又は人力により均一に敷き均す。","敷均し終了後は，継目転圧，初転圧，二次転圧及び仕上げ転圧の順に締め固める。","継目の施工は，継目又は構造物との接触面にプライムコートを施工後，舗設し密着させる。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":227},{"cat":"専門土木","year":"R4前期 No.21","q":"道路のアスファルト舗装の破損に関する次の記述のうち，適当なものはどれか。","opts":["道路縦断方向の凹凸は，不定形に生じる比較的短いひび割れで主に表層に生じる。","ヘアクラックは，長く生じるひび割れで路盤の支持力が不均一な場合や舗装の継目に生じる。","わだち掘れは，道路横断方向の凹凸で車両の通過位置が同じところに生じる。","線状ひび割れは，道路の延長方向に比較的長い波長でどこにでも生じる。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":228},{"cat":"専門土木","year":"R4前期 No.22","q":"道路のコンクリート舗装における施工に関する次の記述のうち，適当でないものはどれか。","opts":["極めて軟弱な路床は，置換工法や安定処理工法等で改良する。","路盤厚が30 cm 以上のときは，上層路盤と下層路盤に分けて施工する。","コンクリート版に鉄網を用いる場合は，表面から版の厚さのI/J程度のところに配置する。","最終仕上げは，舗装版表面の水光りが消えてから，滑り防止のため膜養生を行う。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":229},{"cat":"専門土木","year":"R4前期 No.24","q":"トンネルの山岳工法における覆工コンクリートの施工の留意点に関する次の記述のうち，適当でないものはどれか。","opts":["覆工コンクリートのつま型枠は，打込み時のコンクリートの圧力に耐えられる構造とする。","覆工コンクリートの打込みは，一般に地山の変位が収束する前に行う。","覆工コンクリートの型枠の取外しは，コンクリートが必要な強度に達した後に行う。","覆工コンクリートの養生は，打込み後，硬化に必要な温度及び湿度を保ち，適切な期間行う。"],"ans":1,"ex":"","src":"20220606_2kyu","qid":230},{"cat":"専門土木","year":"R4前期 No.25","q":"海岸における異形コンクリートブロック（消波ブロック）による消波工に関する次の記述のうち，適当なものはどれか。","opts":["乱積みは，層積みに比べて据付けが容易であり，据付け時は安定性がよい。","層積みは，規則正しく配列する積み方で外観が美しいが，安定性が劣っている。","乱積みは，高波を受けるたびに沈下し，徐々にブロックのかみ合わせがよくなり安定する。","層積みは，乱積みに比べて据付けに手間がかかるが，海岸線の曲線部等の施工性がよい。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":231},{"cat":"専門土木","year":"R4前期 No.26","q":"グラブ浚渫船による施工に関する次の記述のうち，適当なものはどれか。","opts":["グラブ浚渫船は，ポンプ浚渫船に比べ，底面を平坦に仕上げるのが容易である。","グラブ浚渫船は，岸壁等の構造物前面の浚渫や狭い場所での浚渫には使用できない。","非航式グラブ浚渫船の標準的な船団は，グラブ浚渫船と土運船のみで構成される。","出来形確認測量は，音響測深機等により，グラブ浚渫船が工事現場にいる間に行う。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":232},{"cat":"専門土木","year":"R4前期 No.27","q":"鉄道工事における砕石路盤に関する次の記述のうち，適当でないものはどれか。","opts":["砕石路盤は軌道を安全に支持し，路床へ荷重を分散伝達し，有害な沈下や変形を生じない等の機能を有するものとする。","砕石路盤では，締固めの施工がしやすく，外力に対して安定を保ち，かつ，有害な変形が生じないよう，圧縮性が大きい材料を用いるものとする。","砕石路盤の施工は，材料の均質性や気象条件等を考慮して，所定の仕上り厚さ，締固めの程度が得られるように入念に行うものとする。","砕石路盤の施工管理においては，路盤の層厚，平坦性，締固めの程度等が確保できるよう留意するものとする。"],"ans":1,"ex":"","src":"20220606_2kyu","qid":233},{"cat":"専門土木","year":"R4前期 No.28","q":"鉄道の営業線近接工事における工事従事者の任務に関する下記の説明文に該当する工事従事者の名称は，次のうちどれか。\u0004工事又は作業終了時における列車又は車両の運転に対する支障の有無の工事管理者等への確認を行う。\u0003","opts":["線閉責任者","停電作業者","列車見張員","踏切警備員"],"ans":0,"ex":"","src":"20220606_2kyu","qid":234},{"cat":"専門土木","year":"R4前期 No.29","q":"シールド工法の施工に関する次の記述のうち，適当でないものはどれか。","opts":["セグメントの外径は，シールドの掘削外径よりも小さくなる。","覆工に用いるセグメントの種類は，コンクリート製や鋼製のものがある。","シールドのテール部には，シールドを推進させるジャッキを備えている。","シールド推進後に，セグメント外周に生じる空隙にはモルタル等を注入する。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":235},{"cat":"専門土木","year":"R4前期 No.30","q":"上水道の管布設工に関する次の記述のうち，適当でないものはどれか。","opts":["塩化ビニル管の保管場所は，なるべく風通しのよい直射日光の当たらない場所を選ぶ。","管のつり下ろしで，土留め用切梁を一時取り外す場合は，必ず適切な補強を施す。","鋼管の据付けは，管体保護のため基礎に砕石を敷き均して行う。","埋戻しは片埋めにならないように注意し，現地盤と同程度以上の密度になるよう締め固める。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":236},{"cat":"専門土木","year":"R4前期 No.31","q":"下水道管渠の剛性管の施工における\u0002地盤区分（代表的な土質）\u0003と\u0002基礎工の種類\u0003に関する次の組合せのうち，適当でないものはどれか。［地盤区分（代表的な土質）］［基礎工の種類］","opts":["硬質土（硬質粘土，礫混じり土及び礫混じり砂） ― 砂基礎","普通土（砂，ローム及び砂質粘土） ― 鳥居基礎","軟弱土（シルト及び有機質土） ― はしご胴木基礎","極軟弱土（非常に緩いシルト及び有機質土） ― 鉄筋コンクリート基礎"],"ans":1,"ex":"","src":"20220606_2kyu","qid":237},{"cat":"法規","year":"R4前期 No.32","q":"就業規則に関する記述のうち，労働基準法上，誤っているものはどれか。","opts":["使用者は，常時使用する労働者の人数にかかわらず，就業規則を作成しなければならない。","就業規則は，法令又は当該事業場について適用される労働協約に反してはならない。","使用者は，就業規則の作成又は変更について，労働者の過半数で組織する労働組合がある場合にはその労働組合の意見を聴かなければならない。","就業規則には，賃金（臨時の賃金等を除く）の決定，計算及び支払の方法等に関する事項について，必ず記載しなければならない。"],"ans":0,"ex":"","src":"20220606_2kyu","qid":238},{"cat":"法規","year":"R4前期 No.33","q":"年少者の就業に関する次の記述のうち，労働基準法上，正しいものはどれか。","opts":["使用者は，児童が満15 歳に達する日まで，児童を使用することはできない。","親権者は，労働契約が未成年者に不利であると認められる場合においても，労働契約を解除することはできない。","後見人は，未成年者の賃金を未成年者に代って請求し受け取らなければならない。","使用者は，満18 才に満たない者に，運転中の機械や動力伝導装置の危険な部分の掃除，注油をさせてはならない。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":239},{"cat":"法規","year":"R4前期 No.35","q":"建設業法に定められている主任技術者及び監理技術者の職務に関する次の記述のうち，誤っているものはどれか。","opts":["当該建設工事の施工計画の作成を行わなければならない。","当該建設工事の施工に従事する者の技術上の指導監督を行わなければならない。","当該建設工事の工程管理を行わなければならない。","当該建設工事の下請代金の見積書の作成を行わなければならない。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":240},{"cat":"法規","year":"R4前期 No.36","q":"道路に工作物又は施設を設け，継続して道路を使用する行為に関する次の記述のうち，道路法令上，占用の許可を必要としないものはどれか。","opts":["道路の維持又は修繕に用いる機械，器具又は材料の常置場を道路に接して設置する場合","水管，下水道管，ガス管を設置する場合","電柱，電線，広告塔を設置する場合","高架の道路の路面下に事務所，店舗，倉庫，広場，公園，運動場を設置する場合"],"ans":0,"ex":"","src":"20220606_2kyu","qid":241},{"cat":"法規","year":"R4前期 No.37","q":"河川法に関する河川管理者の許可について，次の記述のうち誤っているものはどれか。","opts":["河川区域内の土地において民有地に堆積した土砂などを採取する時は，許可が必要である。","河川区域内の土地において農業用水の取水機能維持のため，取水口付近に堆積した土砂を排除する時は，許可は必要ない。","河川区域内の土地において推進工法で地中に水道管を設置する時は，許可は必要ない。","河川区域内の土地において道路橋工事のための現場事務所や工事資材置場等を設置する時は，許可が必要である。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":242},{"cat":"法規","year":"R4前期 No.38","q":"建築基準法の用語に関して，次の記述のうち誤っているものはどれか。","opts":["特殊建築物とは，学校，体育館，病院，劇場，集会場，百貨店などをいう。","建築物の主要構造部とは，壁，柱，床，はり，屋根又は階段をいい，局部的な小階段，屋外階段は含まない。","建築とは，建築物を新築し，増築し，改築し，又は移転することをいう。","建築主とは，建築物に関する工事の請負契約の注文者であり，請負契約によらないで自らその工事をする者は含まない。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":243},{"cat":"法規","year":"R4前期 No.39","q":"火薬類の取扱いに関する次の記述のうち，火薬類取締法上，誤っているものはどれか。","opts":["火薬庫の境界内には，必要がある者のほかは立ち入らない。","火薬庫の境界内には，爆発，発火，又は燃焼しやすい物をたい積しない。","火工所に火薬類を保存する場合には，必要に応じて見張人を配置する。","消費場所において火薬類を取り扱う場合，固化したダイナマイト等は，もみほぐす。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":244},{"cat":"法規","year":"R4前期 No.40","q":"騒音規制法上，建設機械の規格などにかかわらず特定建設作業の対象とならない作業は，次のうちどれか。ただし，当該作業がその作業を開始した日に終わるものを除く。","opts":["ブルドーザを使用する作業","バックホゥを使用する作業","空気圧縮機を使用する作業","舗装版破砕機を使用する作業"],"ans":3,"ex":"","src":"20220606_2kyu","qid":245},{"cat":"法規","year":"R4前期 No.41","q":"振動規制法上，特定建設作業の規制基準に関する\u0002測定位置\u0003と\u0002振動の大きさ\u0003との組合せとして，次のうち正しいものはどれか。［測定位置］［振動の大きさ］","opts":["特定建設作業の場所の敷地の境界線 ― 85 dB を超えないこと","特定建設作業の場所の敷地の中心部 ― 75 dB を超えないこと","特定建設作業の場所の敷地の中心部 ― 85 dB を超えないこと","特定建設作業の場所の敷地の境界線 ― 75 dB を超えないこと"],"ans":3,"ex":"","src":"20220606_2kyu","qid":246},{"cat":"法規","year":"R4前期 No.42","q":"特定港における港長の許可又は届け出に関する次の記述のうち，港則法上，正しいものはどれか。","opts":["特定港内又は特定港の境界付近で工事又は作業をしようとする者は，港長の許可を受けなければならない。","船舶は，特定港内において危険物を運搬しようとするときは，港長に届け出なければならない。","船舶は，特定港を入港したとき又は出港したときは，港長の許可を受けなければならない。","特定港内で，汽艇等を含めた船舶を修繕し，又は係船しようとする者は，港長の許可を受けなければならない。"],"ans":0,"ex":"","src":"20220606_2kyu","qid":247},{"cat":"施工管理法","year":"R4前期 No.44","q":"公共工事標準請負契約約款に関する次の記述のうち，誤っているものはどれか。","opts":["設計図書とは，図面，仕様書，現場説明書及び現場説明に対する質問回答書をいう。","工事材料の品質については，設計図書にその品質が明示されていない場合は，上等の品質を有するものでなければならない。","発注者は，工事完成検査において，必要があると認められるときは，その理由を受注者に通知して，工事目的物を最小限度破壊して検査することができる。","現場代理人と主任技術者及び専門技術者は，これを兼ねることができる。"],"ans":1,"ex":"","src":"20220606_2kyu","qid":248},{"cat":"施工管理法","year":"R4前期 No.46","q":"建設機械に関する次の記述のうち，適当でないものはどれか。","opts":["トラクターショベルは，土の積込み，運搬に使用される。","ドラグラインは，機械の位置より低い場所の掘削に適し，砂利の採取等に使用される。","クラムシェルは，水中掘削など広い場所での浅い掘削に使用される。","バックホゥは，固い地盤の掘削ができ，機械の位置よりも低い場所の掘削に使用される。"],"ans":2,"ex":"","src":"20220606_2kyu","qid":249},{"cat":"施工管理法","year":"R4前期 No.47","q":"仮設工事に関する次の記述のうち，適当でないものはどれか。","opts":["材料は，一般の市販品を使用し，可能な限り規格を統一し，他工事にも転用できるような計画にする。","直接仮設工事と間接仮設工事のうち，安全施設や材料置場等の設備は，間接仮設工事である。","仮設は，使用目的や期間に応じて構造計算を行い，労働安全衛生規則の基準に合致するかそれ以上の計画とする。","指定仮設と任意仮設のうち，任意仮設では施工者独自の技術と工夫や改善の余地が多いので，より合理的な計画を立てることが重要である。"],"ans":1,"ex":"","src":"20220606_2kyu","qid":250},{"cat":"施工管理法","year":"R4前期 No.48","q":"地山の掘削作業の安全確保に関する次の記述のうち，労働安全衛生法上，事業者が行うべき事項として誤っているものはどれか。","opts":["地山の崩壊，埋設物等の損壊等により労働者に危険を及ぼすおそれのあるときは，あらかじめ，作業箇所及びその周辺の地山について調査を行う。","地山の崩壊又は土石の落下による労働者の危険を防止するため，点検者を指名し，作業箇所等について，前日までに点検させる。","掘削面の高さが規定の高さ以上の場合は，地山の掘削作業主任者に地山の作業方法を決定させ，作業を直接指揮させる。","明り掘削作業では，あらかじめ運搬機械等の運行の経路や土石の積卸し場所への出入りの方法を定めて，関係労働者に周知させる。"],"ans":1,"ex":"","src":"20220606_2kyu","qid":251},{"cat":"施工管理法","year":"R4前期 No.50","q":"アスファルト舗装の品質特性と試験方法に関する次の記述のうち，適当でないものはどれか。","opts":["路床の強さを判定するためには，CBR 試験を行う。","加熱アスファルト混合物の安定度を確認するためには，マーシャル安定度試験を行う。","アスファルト舗装の厚さを確認するためには，コア採取による測定を行う。","アスファルト舗装の平坦性を確認するためには，プルーフローリング試験を行う。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":252},{"cat":"施工管理法","year":"R4前期 No.52","q":"建設工事における環境保全対策に関する次の記述のうち，適当なものはどれか。","opts":["建設工事の騒音では，土砂，残土等を多量に運搬する場合，運搬経路は問題とならない。","騒音振動の防止対策として，騒音振動の絶対値を下げるとともに，発生期間の延伸を検討する。","広い土地の掘削や整地での粉塵対策では，散水やシートで覆うことは効果が低い。","土運搬による土砂の飛散を防止するには，過積載の防止，荷台のシート掛けを行う。"],"ans":3,"ex":"","src":"20220606_2kyu","qid":253},{"cat":"施工管理法","year":"R4前期 No.53","q":"\u0002建設工事に係る資材の再資源化等に関する法律\u0003（建設リサイクル法）に定められている特定建設資材に該当するものは，次のうちどれか。","opts":["土砂","廃プラスチック","木材","建設汚泥"],"ans":2,"ex":"","src":"20220606_2kyu","qid":254},{"cat":"施工管理法応用","year":"R4前期 No.54","q":"仮設備工事の直接仮設工事と間接仮設工事に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・（イ）は直接仮設工事である。・労務宿舎は（ロ）である。・（ハ）は間接仮設工事である。・安全施設は（ニ）である。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["支保工足場 ― 間接仮設工事 ― 現場事務所 ― 直接仮設工事","監督員詰所 ― 直接仮設工事 ― 現場事務所 ― 間接仮設工事","支保工足場 ― 直接仮設工事 ― 工事用道路 ― 直接仮設工事","監督員詰所 ― 間接仮設工事 ― 工事用道路 ― 間接仮設工事"],"ans":0,"ex":"","src":"20220606_2kyu","qid":255},{"cat":"施工管理法応用","year":"R4前期 No.56","q":"工程管理に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・工程表は，工事の施工順序と（イ）をわかりやすく図表化したものである。・工程計画と実施工程の間に差が生じた場合は，その（ロ）して改善する。・工程管理では，（ハ）を高めるため，常に工程の進行状況を全作業員に周知徹底する。・工程管理では，実施工程が工程計画よりも（ニ）程度に管理する。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["所要日数 ― 原因を追及 ― 経済効果 ― やや下回る","所要日数 ― 原因を追及 ― 作業能率 ― やや上回る","実行予算 ― 材料を変更 ― 経済効果 ― やや下回る","実行予算 ― 材料を変更 ― 作業能率 ― やや上回る"],"ans":1,"ex":"","src":"20220606_2kyu","qid":256},{"cat":"施工管理法応用","year":"R4前期 No.59","q":"移動式クレーンを用いた作業に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，クレーン等安全規則上，正しいものは次のうちどれか。・クレーンの定格荷重とは，フック等のつり具の重量を（イ）最大つり上げ荷重である。・事業者は，クレーンの運転者及び（ロ）者が定格荷重を常時知ることができるよう，表示等の措置を講じなければならない。・事業者は，原則として（ハ）を行う者を指名しなければならない。・クレーンの運転者は，荷をつったままで，運転位置を（ニ）。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["含まない ― 玉掛け ― 合図 ― 離れてはならない","含む ― 合図 ― 監視 ― 離れて荷姿や人払いを確認するのがよい","含まない ― 玉掛け ― 合図 ― 離れて荷姿や人払いを確認するのがよい","含む ― 合図 ― 監視 ― 離れてはならない"],"ans":0,"ex":"","src":"20220606_2kyu","qid":257},{"cat":"施工管理法応用","year":"R4前期 No.60","q":"品質管理に用いられるヒストグラムに関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・ヒストグラムは，測定値の（イ）を知るのに最も簡単で効率的な統計手法である。・ヒストグラムは，データがどのような分布をしているかを見やすく表した（ロ）である。・ヒストグラムでは，横軸に測定値，縦軸に（ハ）を示している。・平均値が規格値の中央に見られ，左右対称なヒストグラムは（ニ）いる。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["ばらつき ― 折れ線グラフ ― 平均値 ― 作業に異常が起こって","異常値 ― 柱状図 ― 平均値 ― 良好な品質管理が行われて","ばらつき ― 柱状図 ― 度数 ― 良好な品質管理が行われて","異常値 ― 折れ線グラフ ― 度数 ― 作業に異常が起こって"],"ans":2,"ex":"","src":"20220606_2kyu","qid":258},{"cat":"施工管理法応用","year":"R4前期 No.61","q":"盛土の締固めにおける品質管理に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・盛土の締固めの品質管理の方式のうち（イ）規定方式は，使用する締固め機械の機種や締固め回数等を規定するもので，（ロ）規定方式は，盛土の締固め度等を規定する方法である。・盛土の締固めの効果や性質は，土の種類や含水比，施工方法によって（ハ）。・盛土が最もよく締まる含水比は，（ニ）乾燥密度が得られる含水比で最適含水比である。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["工法 ― 品質 ― 変化しない ― 最適","工法 ― 品質 ― 変化する ― 最大","品質 ― 工法 ― 変化しない ― 最大","品質 ― 工法 ― 変化する ― 最適"],"ans":1,"ex":"","src":"20220606_2kyu","qid":259},{"cat":"土木一般","year":"R4後期 No.1","q":"土工の作業に使用する建設機械に関する次の記述のうち，適当なものはどれか。","opts":["バックホゥは，主に機械の位置よりも高い場所の掘削に用いられる。","トラクタショベルは，主に狭い場所での深い掘削に用いられる。","ブルドーザは，掘削・押土及び短距離の運搬作業に用いられる。","スクレーパは，敷均し・締固め作業に用いられる。"],"ans":2,"ex":"","src":"20221024_2kyu","qid":260},{"cat":"土木一般","year":"R4後期 No.2","q":"土質試験における\u0002試験名\u0003とその\u0002試験結果の利用\u0003に関する次の組合せのうち，適当でないものはどれか。［試験名］［試験結果の利用］","opts":["砂置換法による土の密度試験 ― 地盤改良工法の設計","ポータブルコーン貫入試験 ― 建設機械の走行性の判定","土の一軸圧縮試験 ― 原地盤の支持力の推定","コンシステンシー試験 ― 盛土材料の適否の判断"],"ans":0,"ex":"","src":"20221024_2kyu","qid":261},{"cat":"土木一般","year":"R4後期 No.3","q":"盛土の施工に関する次の記述のうち，適当でないものはどれか。","opts":["盛土の基礎地盤は，あらかじめ盛土完成後に不同沈下等を生じるおそれがないか検討する。","敷均し厚さは，盛土材料，施工法及び要求される締固め度等の条件に左右される。","土の締固めでは，同じ土を同じ方法で締め固めても得られる土の密度は含水比により異なる。","盛土工における構造物縁部の締固めは，大型の締固め機械により入念に締め固める。"],"ans":3,"ex":"","src":"20221024_2kyu","qid":262},{"cat":"土木一般","year":"R4後期 No.4","q":"軟弱地盤における次の改良工法のうち，載荷工法に該当するものはどれか。","opts":["プレローディング工法","ディープウェル工法","サンドコンパクションパイル工法","深層混合処理工法"],"ans":0,"ex":"","src":"20221024_2kyu","qid":263},{"cat":"土木一般","year":"R4後期 No.5","q":"コンクリートに使用するセメントに関する次の記述のうち，適当でないものはどれか。","opts":["セメントは，高い酸性を持っている。","セメントは，風化すると密度が小さくなる。","早強ポルトランドセメントは，プレストレストコンクリート工事に適している。","中庸熱ポルトランドセメントは，ダム工事等のマスコンクリートに適している。"],"ans":0,"ex":"","src":"20221024_2kyu","qid":264},{"cat":"土木一般","year":"R4後期 No.6","q":"コンクリートを棒状バイブレータで締め固める場合の留意点に関する次の記述のうち，適当でないものはどれか。","opts":["棒状バイブレータの挿入時間の目安は，一般には=〜15 秒程度である。","棒状バイブレータの挿入間隔は，一般に50 cm 以下にする。","棒状バイブレータは，コンクリートに穴が残らないようにすばやく引き抜く。","棒状バイブレータは，コンクリートを横移動させる目的では用いない。"],"ans":2,"ex":"","src":"20221024_2kyu","qid":265},{"cat":"土木一般","year":"R4後期 No.7","q":"フレッシュコンクリートに関する次の記述のうち，適当でないものはどれか。","opts":["ブリーディングとは，練混ぜ水の一部が遊離してコンクリート表面に上昇する現象である。","ワーカビリティーとは，運搬から仕上げまでの一連の作業のしやすさのことである。","レイタンスとは，コンクリートの柔らかさの程度を示す指標である。","コンシステンシーとは，変形又は流動に対する抵抗性である。"],"ans":2,"ex":"","src":"20221024_2kyu","qid":266},{"cat":"土木一般","year":"R4後期 No.8","q":"コンクリートの仕上げと養生に関する次の記述のうち，適当でないものはどれか。","opts":["密実な表面を必要とする場合は，作業が可能な範囲でできるだけ遅い時期に金ごてで仕上げる。","仕上げ後，コンクリートが固まり始める前に発生したひび割れは，タンピング等で修復する。","養生では，コンクリートを湿潤状態に保つことが重要である。","混合セメントの湿潤養生期間は，早強ポルトランドセメントよりも短くする。"],"ans":3,"ex":"","src":"20221024_2kyu","qid":267},{"cat":"土木一般","year":"R4後期 No.9","q":"既製杭工法の杭打ち機の特徴に関する次の記述のうち，適当でないものはどれか。","opts":["ドロップハンマは，杭の重量以下のハンマを落下させて打ち込む。","ディーゼルハンマは，打撃力が大きく，騒音・振動と油の飛散をともなう。","バイブロハンマは，振動と振動機・杭の重量によって，杭を地盤に押し込む。","油圧ハンマは，ラムの落下高さを任意に調整でき，杭打ち時の騒音を小さくできる。"],"ans":0,"ex":"","src":"20221024_2kyu","qid":268},{"cat":"土木一般","year":"R4後期 No.10","q":"場所打ち杭工法の特徴に関する次の記述のうち，適当でないものはどれか。","opts":["施工時における騒音と振動は，打撃工法に比べて大きい。","大口径の杭を施工することにより，大きな支持力が得られる。","杭材料の運搬等の取扱いが容易である。","掘削土により，基礎地盤の確認ができる。"],"ans":0,"ex":"","src":"20221024_2kyu","qid":269},{"cat":"土木一般","year":"R4後期 No.11","q":"土留め工に関する次の記述のうち，適当でないものはどれか。","opts":["アンカー式土留め工法は，引張材を用いる工法である。","切梁式土留め工法には，中間杭や火打ち梁を用いるものがある。","ボイリングとは，砂質地盤で地下水位以下を掘削した時に，砂が吹き上がる現象である。","パイピングとは，砂質土の弱いところを通ってヒービングがパイプ状に生じる現象である。"],"ans":3,"ex":"","src":"20221024_2kyu","qid":270},{"cat":"専門土木","year":"R4後期 No.12","q":"鋼材の特性，用途に関する次の記述のうち，適当でないものはどれか。","opts":["低炭素鋼は，延性，展性に富み，橋梁等に広く用いられている。","鋼材の疲労が心配される場合には，耐候性鋼材等の防食性の高い鋼材を用いる。","鋼材は，応力度が弾性限度に達するまでは弾性を示すが，それを超えると塑性を示す。","継続的な荷重の作用による摩耗は，鋼材の耐久性を劣化させる原因になる。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":271},{"cat":"専門土木","year":"R4後期 No.13","q":"鋼道路橋の架設工法に関する次の記述のうち，市街地や平坦地で桁下空間が使用できる現場において一般に用いられる工法として適当なものはどれか。","opts":["ケーブルクレーンによる直吊り工法","全面支柱式支保工架設工法","手延べ桁による押出し工法","クレーン車によるベント式架設工法"],"ans":3,"ex":"","src":"20221024_2kyu","qid":272},{"cat":"専門土木","year":"R4後期 No.14","q":"コンクリートの劣化機構について説明した次の記述のうち，適当でないものはどれか。","opts":["中性化は，コンクリートのアルカリ性が空気中の炭酸ガスの浸入等で失われていく現象である。","塩害は，硫酸や硫酸塩等の接触により，コンクリート硬化体が分解したり溶解する現象である。","疲労は，荷重が繰り返し作用することでコンクリート中にひび割れが発生し，やがて大きな損傷となる現象である。","凍害は，コンクリート中に含まれる水分が凍結し，氷の生成による膨張圧でコンクリートが破壊される現象である。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":273},{"cat":"専門土木","year":"R4後期 No.15","q":"河川に関する次の記述のうち，適当なものはどれか。","opts":["河川において，下流から上流を見て右側を右岸，左側を左岸という。","河川には，浅くて流れの速い淵と，深くて流れの緩やかな瀬と呼ばれる部分がある。","河川の流水がある側を堤外地，堤防で守られている側を堤内地という。","河川堤防の天端の高さは，計画高水位（H.W.L.）と同じ高さにすることを基本とする。"],"ans":2,"ex":"","src":"20221024_2kyu","qid":274},{"cat":"専門土木","year":"R4後期 No.16","q":"河川護岸に関する次の記述のうち，適当でないものはどれか。","opts":["基礎工は，洗掘に対する保護や裏込め土砂の流出を防ぐために施工する。","法覆工は，堤防の法勾配が緩く流速が小さな場所では，間知ブロックで施工する。","根固工は，河床の洗掘を防ぎ，基礎工・法覆工を保護するものである。","低水護岸の天端保護工は，流水によって護岸の裏側から破壊しないように保護するものである。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":275},{"cat":"専門土木","year":"R4後期 No.17","q":"砂防えん堤に関する次の記述のうち，適当でないものはどれか。","opts":["前庭保護工は，堤体への土石流の直撃を防ぐために設けられる構造物である。","袖は，洪水を越流させないようにし，水通し側から両岸に向かって上り勾配とする。","側壁護岸は，越流部からの落下水が左右の法面を侵食することを防止するための構造物である。","水通しは，越流する流量に対して十分な大きさとし，一般にその断面は逆台形である。"],"ans":0,"ex":"","src":"20221024_2kyu","qid":276},{"cat":"専門土木","year":"R4後期 No.18","q":"地すべり防止工に関する次の記述のうち，適当なものはどれか。","opts":["抑制工は，杭等の構造物により，地すべり運動の一部又は全部を停止させる工法である。","地すべり防止工では，一般的に抑止工，抑制工の順序で施工を行う。","抑止工は，地形等の自然条件を変化させ，地すべり運動を停止又は緩和させる工法である。","集水井工の排水は，原則として，排水ボーリングによって自然排水を行う。"],"ans":3,"ex":"","src":"20221024_2kyu","qid":277},{"cat":"専門土木","year":"R4後期 No.19","q":"道路のアスファルト舗装における路床の施工に関する次の記述のうち，適当でないものはどれか。","opts":["盛土路床では，J層の敷均し厚さは仕上り厚で40 cm 以下を目安とする。","安定処理工法は，現状路床土とセメントや石灰等の安定材を混合する工法である。","切土路床では，表面から30 cm 程度以内にある木根や転石等を取り除いて仕上げる。","置き換え工法は，軟弱な現状路床土の一部又は全部を良質土で置き換える工法である。"],"ans":0,"ex":"","src":"20221024_2kyu","qid":278},{"cat":"専門土木","year":"R4後期 No.20","q":"道路のアスファルト舗装における締固めの施工に関する次の記述のうち，適当でないものはどれか。","opts":["転圧温度が高過ぎると，ヘアクラックや変形等を起こすことがある。","二次転圧は，一般にロードローラで行うが，振動ローラを用いることもある。","仕上げ転圧は，不陸整正やローラマークの消去のために行う。","締固め作業は，継目転圧，初転圧，二次転圧及び仕上げ転圧の順序で行う。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":279},{"cat":"専門土木","year":"R4後期 No.21","q":"道路のアスファルト舗装の補修工法に関する下記の説明文に該当するものは，次のうちどれか。\u0002局部的なくぼみ，ポットホール，段差等に舗装材料で応急的に充填する工法\u0003","opts":["オーバーレイ工法","打換え工法","切削工法","パッチング工法"],"ans":3,"ex":"","src":"20221024_2kyu","qid":280},{"cat":"専門土木","year":"R4後期 No.22","q":"道路の普通コンクリート舗装における施工に関する次の記述のうち，適当なものはどれか。","opts":["コンクリート版が温度変化に対応するように，車線に直交する横目地を設ける。","コンクリートの打込みにあたって，フィニッシャーを用いて敷き均す。","敷き広げたコンクリートは，フロートで一様かつ十分に締め固める。","表面仕上げの終わった舗装版が所定の強度になるまで乾燥状態を保つ。"],"ans":0,"ex":"","src":"20221024_2kyu","qid":281},{"cat":"専門土木","year":"R4後期 No.23","q":"ダムの施工に関する次の記述のうち，適当でないものはどれか。","opts":["転流工は，ダム本体工事を確実に，また容易に施工するため，工事期間中の河川の流れを迂回させるものである。","コンクリートダムのコンクリート打設に用いるRCD 工法は，単位水量が少なく，超硬練りに配合されたコンクリートをタイヤローラで締め固める工法である。","グラウチングは，ダムの基礎岩盤の弱部の補強を目的とした最も一般的な基礎処理工法である。","ベンチカット工法は，ダム本体の基礎掘削に用いられ，せん孔機械で穴をあけて爆破し順次上方から下方に切り下げていく掘削工法である。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":282},{"cat":"専門土木","year":"R4後期 No.24","q":"トンネルの山岳工法における掘削に関する次の記述のうち，適当でないものはどれか。","opts":["吹付けコンクリートは，吹付けノズルを吹付け面に対して直角に向けて行う。","ロックボルトは，特別な場合を除き，トンネル横断方向に掘削面に対して斜めに設ける。","発破掘削は，地質が硬岩質の場合等に用いられる。","機械掘削は，全断面掘削方式と自由断面掘削方式に大別できる。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":283},{"cat":"専門土木","year":"R4後期 No.26","q":"ケーソン式混成堤の施工に関する次の記述のうち，適当でないものはどれか。","opts":["ケーソンは，えい航直後の据付けが困難な場合には，波浪のない安定した時期まで沈設して仮置きする。","ケーソンは，海面がつねにおだやかで，大型起重機船が使用できるなら，進水したケーソンを据付け場所までえい航して据え付けることができる。","ケーソンは，注水開始後，着底するまで中断することなく注水を連続して行い，速やかに据え付ける。","ケーソンの中詰め後は，波により中詰め材が洗い流されないように，ケーソンのふたとなるコンクリートを打設する。"],"ans":2,"ex":"","src":"20221024_2kyu","qid":284},{"cat":"専門土木","year":"R4後期 No.27","q":"\u0002鉄道の用語\u0003と\u0002説明\u0003に関する次の組合せのうち，適当でないものはどれか。［鉄道の用語］［説明］","opts":["線路閉鎖工事 ― 線路内で，列車や車両の進入を中断して行う工事のこと","軌間 ― レールの車輪走行面より下方の所定距離以内における左右レール頭部間の最短距離のこと","緩和曲線 ― 鉄道車両の走行を円滑にするために直線と円曲線，又は二つの曲線の間に設けられる特殊な線形のこと","路盤 ― 自然地盤や盛土で構築され，路床を支持する部分のこと"],"ans":3,"ex":"","src":"20221024_2kyu","qid":285},{"cat":"専門土木","year":"R4後期 No.28","q":"鉄道の営業線近接工事に関する次の記述のうち，適当でないものはどれか。","opts":["保安管理者は，工事指揮者と相談し，事故防止責任者を指導し，列車の安全運行を確保する。","重機械の運転者は，重機械安全運転の講習会修了証の写しを添えて，監督員等の承認を得る。","複線以上の路線での積みおろしの場合は，列車見張員を配置し，車両限界をおかさないように材料を置かなければならない。","列車見張員は，信号炎管・合図灯・呼笛・時計・時刻表・緊急連絡表を携帯しなければならない。"],"ans":2,"ex":"","src":"20221024_2kyu","qid":286},{"cat":"専門土木","year":"R4後期 No.29","q":"シールド工法に関する次の記述のうち，適当でないものはどれか。","opts":["シールド工法は，開削工法が困難な都市の下水道工事や地下鉄工事をはじめ，海底道路トンネルや地下河川の工事等で用いられる。","シールド工法に使用される機械は，フード部，ガーダー部，テール部からなる。","泥水式シールド工法では，ずりがベルトコンベアによる輸送となるため，坑内の作業環境は悪くなる。","土圧式シールド工法は，一般に粘性土地盤に適している。"],"ans":2,"ex":"","src":"20221024_2kyu","qid":287},{"cat":"専門土木","year":"R4後期 No.30","q":"上水道の管布設工に関する次の記述のうち，適当でないものはどれか。","opts":["管の布設は，原則として低所から高所に向けて行う。","ダクタイル鋳鉄管の据付けでは，管体の管径，年号の記号を上に向けて据え付ける。","一日の布設作業完了後は，管内に土砂，汚水等が流入しないよう木蓋等で管端部をふさぐ。","鋳鉄管の切断は，直管及び異形管ともに切断機で行うことを標準とする。"],"ans":3,"ex":"","src":"20221024_2kyu","qid":288},{"cat":"専門土木","year":"R4後期 No.31","q":"下水道管渠の接合方式に関する次の記述のうち，適当でないものはどれか。","opts":["水面接合は，管渠の中心を接合部で一致させる方式である。","管頂接合は，流水は円滑であるが，下流ほど深い掘削が必要となる。","管底接合は，接合部の上流側の水位が高くなり，圧力管となるおそれがある。","段差接合は，マンホールの間隔等を考慮しながら，階段状に接続する方式である。"],"ans":0,"ex":"","src":"20221024_2kyu","qid":289},{"cat":"法規","year":"R4後期 No.33","q":"災害補償に関する次の記述のうち，労働基準法上，誤っているものはどれか。","opts":["労働者が業務上負傷し，又は疾病にかかった場合においては，使用者は，その費用で必要な療養を行い，又は必要な療養の費用を負担しなければならない。","労働者が重大な過失によって業務上負傷し，かつ使用者がその過失について行政官庁へ届出た場合には，使用者は障害補償を行わなくてもよい。","労働者が業務上負傷した場合，その補償を受ける権利は，労働者の退職によって変更されることはない。","業務上の負傷，疾病又は死亡の認定等に関して異議のある者は，行政官庁に対して，審査又は事件の仲裁を申し立てることができる。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":290},{"cat":"法規","year":"R4後期 No.35","q":"建設業法に関する次の記述のうち，誤っているものはどれか。","opts":["建設業とは，元請，下請その他いかなる名義をもってするかを問わず，建設工事の完成を請け負う営業をいう。","建設業者は，当該工事現場の施工の技術上の管理をつかさどる主任技術者を置かなければならない。","建設工事の施工に従事する者は，主任技術者がその職務として行う指導に従わなければならない。","公共性のある施設に関する重要な工事である場合，請負代金の額にかかわらず，工事現場ごとに専任の主任技術者を置かなければならない。"],"ans":3,"ex":"","src":"20221024_2kyu","qid":291},{"cat":"法規","year":"R4後期 No.36","q":"車両の最高限度に関する次の記述のうち，車両制限令上，誤っているものはどれか。ただし，高速自動車国道を通行するセミトレーラ連結車又はフルトレーラ連結車，及び道路管理者が国際海上コンテナの運搬用のセミトレーラ連結車の通行に支障がないと認めて指定した道路を通行する車両を除くものとする。","opts":["車両の最小回転半径の最高限度は，車両の最外側のわだちについて12 m である。","車両の長さの最高限度は，15 m である。","車両の軸重の最高限度は，10 t である。","車両の幅の最高限度は，2.5 m である。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":292},{"cat":"法規","year":"R4後期 No.37","q":"河川法に関する次の記述のうち，誤っているものはどれか。","opts":["J 級及びS 級河川以外の準用河川の管理は，市町村長が行う。","河川法上の河川に含まれない施設は，ダム，堰，水門等である。","河川区域内の民有地での工事材料置場の設置は河川管理者の許可を必要とする。","河川管理施設保全のため指定した，河川区域に接する一定区域を河川保全区域という。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":293},{"cat":"法規","year":"R4後期 No.39","q":"火薬類の取扱いに関する次の記述のうち，火薬類取締法上，誤っているものはどれか。","opts":["火工所以外の場所において，薬包に雷管を取り付ける作業を行わない。","消費場所において火薬類を取り扱う場合，固化したダイナマイト等はもみほぐしてはならない。","火工所に火薬類を存置する場合には，見張人を常時配置する。","火薬類の取扱いには，盗難予防に留意する。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":294},{"cat":"法規","year":"R4後期 No.40","q":"騒音規制法上，建設機械の規格等にかかわらず，特定建設作業の対象とならない作業は，次のうちどれか。ただし，当該作業がその作業を開始した日に終わるものを除く。","opts":["ロードローラを使用する作業","さく岩機を使用する作業","バックホゥを使用する作業","ブルドーザを使用する作業"],"ans":0,"ex":"","src":"20221024_2kyu","qid":295},{"cat":"法規","year":"R4後期 No.41","q":"振動規制法に定められている特定建設作業の対象となる建設機械は，次のうちどれか。ただし，当該作業がその作業を開始した日に終わるものを除き，J日における当該作業に係るS地点間の最大移動距離が50 m を超えない作業とする。","opts":["ジャイアントブレーカ","ブルドーザ","振動ローラ","路面切削機"],"ans":0,"ex":"","src":"20221024_2kyu","qid":296},{"cat":"法規","year":"R4後期 No.42","q":"船舶の航路及び航法に関する次の記述のうち，港則法上，誤っているものはどれか。","opts":["船舶は，航路内においては，他の船舶を追い越してはならない。","汽艇等以外の船舶は，特定港を通過するときには港長の定める航路を通らなければならない。","船舶は，航路内においては，原則としてえい航している船舶を放してはならない。","船舶は，航路内においては，並列して航行してはならない。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":297},{"cat":"施工管理法","year":"R4後期 No.44","q":"公共工事で発注者が示す設計図書に該当しないものは，次のうちどれか。","opts":["現場説明書","特記仕様書","設計図面","見積書"],"ans":3,"ex":"","src":"20221024_2kyu","qid":298},{"cat":"施工管理法","year":"R4後期 No.46","q":"建設機械に関する次の記述のうち，適当でないものはどれか。","opts":["ランマは，振動や打撃を与えて，路肩や狭い場所等の締固めに使用される。","タイヤローラは，接地圧の調節や自重を加減することができ，路盤等の締固めに使用される。","ドラグラインは，機械の位置より高い場所の掘削に適し，水路の掘削等に使用される。","クラムシェルは，水中掘削等，狭い場所での深い掘削に使用される。"],"ans":2,"ex":"","src":"20221024_2kyu","qid":299},{"cat":"施工管理法","year":"R4後期 No.47","q":"仮設工事に関する次の記述のうち，適当でないものはどれか。","opts":["直接仮設工事と間接仮設工事のうち，現場事務所や労務宿舎等の設備は，直接仮設工事である。","仮設備は，使用目的や期間に応じて構造計算を行い，労働安全衛生規則の基準に合致するかそれ以上の計画とする。","指定仮設と任意仮設のうち，任意仮設では施工者独自の技術と工夫や改善の余地が多いので，より合理的な計画を立てることが重要である。","材料は，一般の市販品を使用し，可能な限り規格を統一し，他工事にも転用できるような計画にする。"],"ans":0,"ex":"","src":"20221024_2kyu","qid":300},{"cat":"施工管理法","year":"R4後期 No.48","q":"地山の掘削作業の安全確保に関する次の記述のうち，労働安全衛生法上，事業者が行うべき事項として誤っているものはどれか。","opts":["掘削面の高さが規定の高さ以上の場合は，地山の掘削及び土止め支保工作業主任者技能講習を修了した者のうちから，地山の掘削作業主任者を選任する。","地山の崩壊等により労働者に危険を及ぼすおそれのあるときは，あらかじめ，土止め支保工を設け，防護網を張り，労働者の立入りを禁止する等の措置を講じる。","運搬機械等が労働者の作業箇所に後進して接近するときは，点検者を配置し，その者にこれらの機械を誘導させる。","明り掘削の作業を行う場所は，当該作業を安全に行うため必要な照度を保持しなければならない。"],"ans":2,"ex":"","src":"20221024_2kyu","qid":301},{"cat":"施工管理法","year":"R4後期 No.49","q":"高さ=m 以上のコンクリート造の工作物の解体作業にともなう危険を防止するために事業者が行うべき事項に関する次の記述のうち，労働安全衛生法上，誤っているものはどれか。","opts":["外壁，柱等の引倒し等の作業を行うときは，引倒し等について一定の合図を定め，関係労働者に周知させなければならない。","物体の飛来等により労働者に危険が生ずるおそれのある箇所で解体用機械を用いて作業を行うときは，作業主任者以外の労働者を立ち入らせてはならない。","強風，大雨，大雪等の悪天候のため，作業の実施について危険が予想されるときは，当該作業を中止しなければならない。","作業計画には，作業の方法及び順序，使用する機械等の種類及び能力等が示されていなければならない。"],"ans":1,"ex":"","src":"20221024_2kyu","qid":302},{"cat":"施工管理法","year":"R4後期 No.50","q":"品質管理に関する次の記述のうち，適当でないものはどれか。","opts":["ロットとは，様々な条件下で生産された品物の集まりである。","サンプルをある特性について測定した値をデータ値（測定値）という。","ばらつきの状態が安定の状態にあるとき，測定値の分布は正規分布になる。","対象の母集団からその特性を調べるため一部取り出したものをサンプル（試料）という。"],"ans":0,"ex":"","src":"20221024_2kyu","qid":303},{"cat":"施工管理法","year":"R4後期 No.52","q":"建設工事における，騒音・振動対策に関する次の記述のうち，適当なものはどれか。","opts":["舗装版の取壊し作業では，大型ブレーカの使用を原則とする。","掘削土をバックホゥ等でダンプトラックに積み込む場合，落下高を高くして掘削土の放出をスムーズに行う。","車輪式（ホイール式）の建設機械は，履帯式（クローラ式）の建設機械に比べて，一般に騒音振動レベルが小さい。","作業待ち時は，建設機械等のエンジンをアイドリング状態にしておく。"],"ans":2,"ex":"","src":"20221024_2kyu","qid":304},{"cat":"施工管理法","year":"R4後期 No.53","q":"\u0002建設工事に係る資材の再資源化等に関する法律\u0003（建設リサイクル法）に定められている特定建設資材に該当するものは，次のうちどれか。","opts":["建設発生土","建設汚泥","廃プラスチック","コンクリート及び鉄からなる建設資材"],"ans":3,"ex":"","src":"20221024_2kyu","qid":305},{"cat":"施工管理法応用","year":"R4後期 No.54","q":"建設機械の走行に必要なコーン指数の値に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・ダンプトラックより普通ブルドーザ（15 t 級）の方がコーン指数は（イ）。・スクレープドーザより（ロ）の方がコーン指数は小さい。・超湿地ブルドーザより自走式スクレーパ（小型）の方がコーン指数は（ハ）。・普通ブルドーザ（21 t 級）より（ニ）の方がコーン指数は大きい。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["大きい ― 自走式スクレーパ（小型） ― 小さい ― ダンプトラック","小さい ― 超湿地ブルドーザ ― 大きい ― ダンプトラック","大きい ― 超湿地ブルドーザ ― 小さい ― 湿地ブルドーザ","小さい ― 自走式スクレーパ（小型） ― 大きい ― 湿地ブルドーザ"],"ans":1,"ex":"","src":"20221024_2kyu","qid":306},{"cat":"施工管理法応用","year":"R4後期 No.55","q":"建設機械の作業内容に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・（イ）とは，建設機械の走行性をいい，一般にコーン指数で判断される。・リッパビリティーとは，（ロ）に装着されたリッパによって作業できる程度をいう。・建設機械の作業効率は，現場の地形，（ハ），工事規模等の各種条件によって変化する。・建設機械の作業能力は，単独の機械又は組み合わされた機械の（ニ）の平均作業量で表される。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["ワーカビリティー ― 大型ブルドーザ ― 作業員の人数 ― 日当たり","トラフィカビリティー ― 大型バックホゥ ― 土質 ― 日当たり","ワーカビリティー ― 大型バックホゥ ― 作業員の人数 ― 時間当たり","トラフィカビリティー ― 大型ブルドーザ ― 土質 ― 時間当たり"],"ans":3,"ex":"","src":"20221024_2kyu","qid":307},{"cat":"施工管理法応用","year":"R4後期 No.56","q":"工程表の種類と特徴に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・（イ）は，各工事の必要日数を棒線で表した図表である。・（ロ）は，工事全体の出来高比率の累計を曲線で表した図表である。・（ハ）は，各工事の工程を斜線で表した図表である。・（ニ）は，工事内容を系統だてて作業相互の関連，順序や日数を表した図表である。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["バーチャート ― グラフ式工程表 ― 出来高累計曲線 ― ネットワーク式工程表","ネットワーク式工程表 ― 出来高累計曲線 ― バーチャート ― グラフ式工程表","ネットワーク式工程表 ― グラフ式工程表 ― バーチャート ― 出来高累計曲線","バーチャート ― 出来高累計曲線 ― グラフ式工程表 ― ネットワーク式工程表"],"ans":3,"ex":"","src":"20221024_2kyu","qid":308},{"cat":"施工管理法応用","year":"R4後期 No.58","q":"作業床の端，開口部における，墜落・落下防止に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・作業床の端，開口部には，必要な強度の囲い，（イ），（ロ）を設置する。・囲い等の設置が困難な場合は，安全確保のため（ハ）を設置し，（ニ）を使用させる等の措置を講ずる。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["手すり ― 覆い ― 安全ネット ― 要求性能墜落制止用器具","足場板 ― 筋かい ― 作業台 ― 昇降施設","手すり ― 覆い ― 安全ネット ― 昇降施設","足場板 ― 筋かい ― 作業台 ― 要求性能墜落制止用器具"],"ans":0,"ex":"","src":"20221024_2kyu","qid":309},{"cat":"施工管理法応用","year":"R4後期 No.59","q":"車両系建設機械の災害防止に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，労働安全衛生規則上，正しいものは次のうちどれか。・運転者は，運転位置を離れるときは，原動機を止め，（イ）走行ブレーキをかける。・転倒や転落のおそれがある場所では，転倒時保護構造を有し，かつ，（ロ）を備えた機種の使用に努める。・（ハ）以外の箇所に労働者を乗せてはならない。・（ニ）にブレーキやクラッチの機能について点検する。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["または ― 安全ブロック ― 助手席 ― 作業の前日","または ― シートベルト ― 乗車席 ― 作業の前日","かつ ― シートベルト ― 乗車席 ― その日の作業開始前","かつ ― 安全ブロック ― 助手席 ― その日の作業開始前"],"ans":2,"ex":"","src":"20221024_2kyu","qid":310},{"cat":"施工管理法応用","year":"R4後期 No.60","q":"品質管理に用いられるx 挨R 管理図に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・データには，連続量として測定される（イ）がある。・x 管理図は，工程平均を各組ごとのデータの（ロ）によって管理する。・R 管理図は，工程のばらつきを各組ごとのデータの（ハ）によって管理する。・x 挨R 管理図の管理線として，（ニ）及び上方・下方管理限界がある。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["計数値 ― 平均値 ― 最大・最小の差 ― バナナカーブ","計量値 ― 平均値 ― 最大・最小の差 ― 中心線","計数値 ― 最大・最小の差 ― 平均値 ― 中心線","計量値 ― 最大・最小の差 ― 平均値 ― バナナカーブ"],"ans":1,"ex":"","src":"20221024_2kyu","qid":311},{"cat":"施工管理法応用","year":"R4後期 No.61","q":"盛土の締固めにおける品質管理に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・盛土の締固めの品質管理の方式のうち（イ）規定方式は，盛土の締固め度等を規定するもので，（ロ）規定方式は，使用する締固め機械の機種や締固め回数等を規定する方法である。・盛土の締固めの効果や性質は，土の種類や含水比，（ハ）方法によって変化する。・盛土が最もよく締まる含水比は，最大乾燥密度が得られる含水比で（ニ）含水比である。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["品質 ― 工法 ― 施工 ― 最適","品質 ― 工法 ― 管理 ― 最大","工法 ― 品質 ― 施工 ― 最適","工法 ― 品質 ― 管理 ― 最大"],"ans":0,"ex":"","src":"20221024_2kyu","qid":312},{"cat":"土木一般","year":"R5後期 No.1","q":"\u0002土工作業の種類\u0003と\u0002使用機械\u0003に関する次の組合せのうち，適当でないものはどれか。［土工作業の種類］［使用機械］","opts":["掘削・積込み ― クラムシェル","さく岩 ― モータグレーダ","法面仕上げ ― バックホゥ","締固め ― タイヤローラ"],"ans":1,"ex":"","src":"20231023_2kyu","qid":313},{"cat":"土木一般","year":"R5後期 No.2","q":"法面保護工の\u0002工種\u0003とその\u0002目的\u0003の組合せとして，次のうち適当でないものはどれか。［工種］［目的］","opts":["種子吹付け工 ― 凍上崩落の抑制","ブロック積擁壁工 ― 土圧に対抗して崩壊防止","モルタル吹付け工 ― 表流水の浸透防止","筋芝工 ― 切土面の浸食防止"],"ans":3,"ex":"","src":"20231023_2kyu","qid":314},{"cat":"土木一般","year":"R5後期 No.3","q":"道路土工の盛土材料として望ましい条件に関する次の記述のうち，適当でないものはどれか。","opts":["建設機械のトラフィカビリティーが確保しやすいこと。","締固め後の圧縮性が大きく，盛土の安定性が保てること。","敷均しが容易で締固め後のせん断強度が高いこと。","雨水等の浸食に強く，吸水による膨潤性が低いこと。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":315},{"cat":"土木一般","year":"R5後期 No.4","q":"軟弱地盤における次の改良工法のうち，締固め工法に該当するものはどれか。","opts":["ウェルポイント工法","石灰パイル工法","バイブロフローテーション工法","プレローディング工法"],"ans":2,"ex":"","src":"20231023_2kyu","qid":316},{"cat":"土木一般","year":"R5後期 No.5","q":"コンクリートで使用される骨材の性質に関する次の記述のうち，適当でないものはどれか。","opts":["すりへり減量が大きい骨材を用いると，コンクリートのすりへり抵抗性が低下する。","骨材の粗粒率が大きいほど，粒度が細かい。","骨材の粒形は，扁平や細長よりも球形がよい。","骨材に有機不純物が多く混入していると，コンクリートの凝結や強度等に悪影響を及ぼす。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":317},{"cat":"土木一般","year":"R5後期 No.6","q":"コンクリートの配合設計に関する次の記述のうち，適当でないものはどれか。","opts":["打込みの最小スランプの目安は，鋼材の最小あきが小さいほど，大きくなるように定める。","打込みの最小スランプの目安は，締固め作業高さが大きいほど，小さくなるように定める。","単位水量は，施工が可能な範囲内で，できるだけ少なくなるように定める。","細骨材率は，施工が可能な範囲内で，単位水量ができるだけ少なくなるように定める。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":318},{"cat":"土木一般","year":"R5後期 No.7","q":"フレッシュコンクリートに関する次の記述のうち，適当でないものはどれか。","opts":["コンシステンシーとは，変形又は流動に対する抵抗性である。","レイタンスとは，コンクリート表面に水とともに浮かび上がって沈殿する物質である。","材料分離抵抗性とは，コンクリート中の材料が分離することに対する抵抗性である。","ブリーディングとは，運搬から仕上げまでの一連の作業のしやすさである。"],"ans":3,"ex":"","src":"20231023_2kyu","qid":319},{"cat":"土木一般","year":"R5後期 No.8","q":"型枠に関する次の記述のうち，適当でないものはどれか。","opts":["型枠内面には，剥離剤を塗布することを原則とする。","コンクリートの側圧は，コンクリート条件や施工条件により変化する。","型枠は，取り外しやすい場所から外していくことを原則とする。","コンクリートのかどには，特に指定がなくても面取りができる構造とする。"],"ans":2,"ex":"","src":"20231023_2kyu","qid":320},{"cat":"土木一般","year":"R5後期 No.9","q":"既製杭の施工に関する次の記述のうち，適当なものはどれか。","opts":["打撃による方法は，杭打ちハンマとしてバイブロハンマが用いられている。","中掘り杭工法は，あらかじめ地盤に穴をあけておき既製杭を挿入する。","プレボーリング工法は，既製杭の中をアースオーガで掘削しながら杭を貫入する。","圧入による方法は，オイルジャッキ等を使用して杭を地中に圧入する。"],"ans":3,"ex":"","src":"20231023_2kyu","qid":321},{"cat":"土木一般","year":"R5後期 No.10","q":"場所打ち杭の施工に関する次の記述のうち，適当なものはどれか。","opts":["オールケーシング工法は，ケーシングチューブを土中に挿入して，ケーシングチューブ内の土を掘削する。","アースドリル工法は，掘削孔に水を満たし，掘削土とともに地上に吸い上げる。","リバースサーキュレーション工法は，支持地盤を直接確認でき，孔底の障害物の除去が容易である。","深礎工法は，ケーシング下部の孔壁の崩壊防止のため，ベントナイト水を注入する。"],"ans":0,"ex":"","src":"20231023_2kyu","qid":322},{"cat":"土木一般","year":"R5後期 No.11","q":"土留めの施工に関する次の記述のうち，適当でないものはどれか。","opts":["自立式土留め工法は，支保工を必要としない工法である。","アンカー式土留め工法は，引張材を用いる工法である。","ボイリングとは，軟弱な粘土質地盤を掘削した時に，掘削底面が盛り上がる現象である。","パイピングとは，砂質土の弱いところを通ってボイリングがパイプ状に生じる現象である。"],"ans":2,"ex":"","src":"20231023_2kyu","qid":323},{"cat":"専門土木","year":"R5後期 No.13","q":"鋼道路橋における次の架設工法のうち，クレーンを組み込んだ起重機船を架設地点まで進入させ，橋梁を所定の位置に吊り上げて架設する工法として，適当なものはどれか。","opts":["フローティングクレーンによる一括架設工法","クレーン車によるベント式架設工法","ケーブルクレーンによる直吊り工法","トラベラークレーンによる片持ち式架設工法"],"ans":0,"ex":"","src":"20231023_2kyu","qid":324},{"cat":"専門土木","year":"R5後期 No.14","q":"コンクリートの\u0002劣化機構\u0003と\u0002劣化要因\u0003に関する次の組合せのうち，適当でないものはどれか。［劣化機構］［劣化要因］","opts":["アルカリシリカ反応 ― 反応性骨材","疲労 ― 繰返し荷重","塩害 ― 凍結融解作用","化学的侵食 ― 硫酸"],"ans":2,"ex":"","src":"20231023_2kyu","qid":325},{"cat":"専門土木","year":"R5後期 No.15","q":"河川に関する次の記述のうち，適当でないものはどれか。","opts":["河川の流水がある側を堤内地，堤防で守られている側を堤外地という。","河川堤防断面で一番高い平らな部分を天端という。","河川において，上流から下流を見て右側を右岸，左側を左岸という。","堤防の法面は，河川の流水がある側を表法面，その反対側を裏法面という。"],"ans":0,"ex":"","src":"20231023_2kyu","qid":326},{"cat":"専門土木","year":"R5後期 No.16","q":"河川護岸に関する次の記述のうち，適当でないものはどれか。","opts":["低水護岸は，低水路を維持し，高水敷の洗掘等を防止するものである。","法覆工は，堤防及び河岸の法面を被覆して保護するものである。","低水護岸の天端保護工は，流水によって護岸の表側から破壊しないように保護するものである。","横帯工は，流水方向の一定区間毎に設け，護岸の破壊が他に波及しないようにするものである。"],"ans":2,"ex":"","src":"20231023_2kyu","qid":327},{"cat":"専門土木","year":"R5後期 No.17","q":"砂防えん堤に関する次の記述のうち，適当なものはどれか。","opts":["水通しは，施工中の流水の切換えや堆砂後の本えん堤にかかる水圧を軽減させるために設ける。","前庭保護工は，本えん堤の洗掘防止のために，本えん堤の上流側に設ける。","袖は，洪水が越流した場合でも袖部等の破壊防止のため，両岸に向かって水平な構造とする。","砂防えん堤は，安全性の面から強固な岩盤に施工することが望ましい。"],"ans":3,"ex":"","src":"20231023_2kyu","qid":328},{"cat":"専門土木","year":"R5後期 No.18","q":"地すべり防止工に関する次の記述のうち，適当でないものはどれか。","opts":["排水トンネル工は，原則として安定した地盤にトンネルを設け，ここから帯水層に向けてボーリングを行い，トンネルを使って排水する工法であり，抑制工に分類される。","排土工は，地すべり頭部の不安定な土塊を排除し，土塊の滑動力を減少させる工法であり，抑止工に分類される。","水路工は，地表の水を水路に集め，速やかに地すべりの地域外に排除する工法であり，抑制工に分類される。","シャフト工は，井筒を山留めとして掘り下げ，鉄筋コンクリートを充塡して，シャフト（杭）とする工法であり，抑止工に分類される。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":329},{"cat":"専門土木","year":"R5後期 No.21","q":"道路のアスファルト舗装の補修工法に関する次の記述のうち，適当でないものはどれか。","opts":["オーバーレイ工法は，既設舗装の上に，加熱アスファルト混合物以外の材料を使用して，薄い封かん層を設ける工法である。","打換え工法は，不良な舗装の一部分，又は全部を取り除き，新しい舗装を行う工法である。","切削工法は，路面の凹凸を削り除去し，不陸や段差を解消する工法である。","パッチング工法は，局部的なひび割れやくぼみ，段差等を応急的に舗装材料で充塡する工法である。"],"ans":0,"ex":"","src":"20231023_2kyu","qid":330},{"cat":"専門土木","year":"R5後期 No.22","q":"道路のコンクリート舗装の施工に関する次の記述のうち，適当でないものはどれか。","opts":["普通コンクリート舗装の路盤は，厚さ30 cm 以上の場合は上層と下層に分けて施工する。","普通コンクリート舗装の路盤は，コンクリート版が膨張・収縮できるよう，路盤上に厚さLcm 程度の砂利を敷設する。","普通コンクリート版の縦目地は，版の温度変化に対応するよう，車線に直交する方向に設ける。","普通コンクリート版の縦目地は，ひび割れが生じても亀裂が大きくならないためと，版に段差が生じないためにダミー目地が設けられる。"],"ans":2,"ex":"","src":"20231023_2kyu","qid":331},{"cat":"専門土木","year":"R5後期 No.23","q":"コンクリートダムの施工に関する次の記述のうち，適当でないものはどれか。","opts":["転流工は，ダム本体工事にとりかかるまでに必要な工事で，工事用道路や土捨場等の工事を行うものである。","基礎掘削工は，基礎岩盤に損傷を与えることが少なく，大量掘削に対応できるベンチカット工法が一般的である。","基礎処理工は，セメントミルク等を用いて，ダムの基礎岩盤の状態が均一ではない弱部の補強，改良を行うものである。","RCD 工法は，単位水量が少なく，超硬練りに配合されたコンクリートを振動ローラで締め固める工法である。"],"ans":0,"ex":"","src":"20231023_2kyu","qid":332},{"cat":"専門土木","year":"R5後期 No.24","q":"トンネルの山岳工法における掘削に関する次の記述のうち，適当でないものはどれか。","opts":["機械掘削は，発破掘削に比べて騒音や振動が比較的少ない。","発破掘削は，主に地質が軟岩の地山に用いられる。","全断面工法は，トンネルの全断面を一度に掘削する工法である。","ベンチカット工法は，一般的にトンネル断面を上下に分割して掘削する工法である。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":333},{"cat":"専門土木","year":"R5後期 No.25","q":"海岸堤防の形式の特徴に関する次の記述のうち，適当でないものはどれか。","opts":["直立型は，比較的良好な地盤で，堤防用地が容易に得られない場合に適している。","傾斜型は，比較的軟弱な地盤で，堤体土砂が容易に得られる場合に適している。","緩傾斜型は，堤防用地が広く得られる場合や，海水浴場等に利用する場合に適している。","混成型は，水深が割合に深く，比較的良好な地盤に適している。"],"ans":3,"ex":"","src":"20231023_2kyu","qid":334},{"cat":"専門土木","year":"R5後期 No.26","q":"ケーソン式混成堤の施工に関する次の記述のうち，適当でないものはどれか。","opts":["ケーソンの底面が据付け面に近づいたら，注水を一時止め，潜水士によって正確な位置を決めたのち，ふたたび注水して正しく据え付ける。","据え付けたケーソンは，できるだけゆっくりケーソン内部に中詰めを行って，ケーソンの質量を増し，安定性を高める。","ケーソンは，波が静かなときを選び，一般にケーソンにワイヤをかけて引き船により据付け，現場までえい航する。","中詰め後は，波によって中詰め材が洗い出されないように，ケーソンの蓋となるコンクリートを打設する。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":335},{"cat":"専門土木","year":"R5後期 No.27","q":"鉄道の\u0002軌道の用語\u0003と\u0002説明\u0003に関する次の組合せのうち，適当でないものはどれか。［軌道の用語］［説明］","opts":["スラック ― 曲線部において列車の通過を円滑にするために軌間を縮小する量のこと","カント ― 曲線部において列車の転倒を防止するために曲線外側レールを高くすること","軌間 ― 両側のレール頭部間の最短距離のこと","スラブ軌道 ― プレキャストのコンクリート版を用いた軌道のこと"],"ans":0,"ex":"","src":"20231023_2kyu","qid":336},{"cat":"専門土木","year":"R5後期 No.28","q":"鉄道（在来線）の営業線内及びこれに近接した工事に関する次の記述のうち，適当でないものはどれか。","opts":["重機械による作業は，列車の近接から通過の完了まで建築限界をおかさないよう注意して行う。","工事場所が信号区間では，バール・スパナ・スチールテープ等の金属による短絡を防止する。","営業線での安全確保のため，所要の防護策を設け定期的に点検する。","重機械の運転者は，重機械安全運転の講習会修了証の写しを添え，監督員等の承認を得る。"],"ans":0,"ex":"","src":"20231023_2kyu","qid":337},{"cat":"専門土木","year":"R5後期 No.29","q":"シールド工法に関する次の記述のうち，適当でないものはどれか。","opts":["泥水式シールド工法は，泥水を循環させ，泥水によって切羽の安定を図る工法である。","泥水式シールド工法は，掘削した土砂に添加材を注入して強制的に攪拌し，流体輸送方式によって地上に搬出する工法である。","土圧式シールド工法は，カッターチャンバー内に掘削した土砂を充満させ，切羽の土圧と平衡を保つ工法である。","土圧式シールド工法は，掘削した土砂をスクリューコンベヤで排土する工法である。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":338},{"cat":"専門土木","year":"R5後期 No.30","q":"上水道に用いる配水管と継手の特徴に関する次の記述のうち，適当でないものはどれか。","opts":["鋼管の継手の溶接は，時間がかかり，雨天時には溶接に注意しなければならない。","ポリエチレン管の融着継手は，雨天時や湧水地盤での施工が困難である。","ダクタイル鋳鉄管のメカニカル継手は，地震の変動への適応が困難である。","硬質塩化ビニル管の接着した継手は，強度や水密性に注意しなければならない。"],"ans":2,"ex":"","src":"20231023_2kyu","qid":339},{"cat":"専門土木","year":"R5後期 No.31","q":"下水道の剛性管渠を施工する際の下記の\u0002基礎地盤の土質区分\u0003と\u0002基礎の種類\u0003の組合せとして，適当なものは次のうちどれか。［基礎地盤の土質区分］N 軟弱土（シルト及び有機質土）O 硬質土（硬質粘土，礫混じり土及び礫混じり砂）P 極軟弱土（非常に緩いシルト及び有機質土）［基礎の種類］N O P","opts":["砂基礎 ― コンクリート基礎 ― 鉄筋コンクリート基礎","コンクリート基礎 ― 砂基礎 ― 鉄筋コンクリート基礎","鉄筋コンクリート基礎 ― 砂基礎 ― コンクリート基礎","砂基礎 ― 鉄筋コンクリート基礎 ― コンクリート基礎"],"ans":1,"ex":"","src":"20231023_2kyu","qid":340},{"cat":"法規","year":"R5後期 No.33","q":"満18 才に満たない者の就労に関する次の記述のうち，労働基準法上，誤っているものはどれか。","opts":["使用者は，毒劇薬，又は爆発性の原料を取り扱う業務に就かせてはならない。","使用者は，その年齢を証明する後見人の証明書を事業場に備え付けなければならない。","使用者は，動力によるクレーンの運転をさせてはならない。","使用者は，坑内で労働させてはならない。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":341},{"cat":"法規","year":"R5後期 No.35","q":"主任技術者及び監理技術者の職務に関する次の記述のうち，建設業法上，正しいものはどれか。","opts":["当該建設工事の下請契約書の作成を行わなければならない。","当該建設工事の下請代金の支払いを行わなければならない。","当該建設工事の資機材の調達を行わなければならない。","当該建設工事の品質管理を行わなければならない。"],"ans":3,"ex":"","src":"20231023_2kyu","qid":342},{"cat":"法規","year":"R5後期 No.36","q":"車両の最高限度に関する次の記述のうち，車両制限令上，正しいものはどれか。ただし，道路管理者が道路の構造の保全及び交通の危険の防止上支障がないと認めて指定した道路を通行する車両を除く。","opts":["車両の幅は，2.5 m である。","車両の輪荷重は，10 t である。","車両の高さは，4.5 m である。","車両の長さは，14 m である。"],"ans":0,"ex":"","src":"20231023_2kyu","qid":343},{"cat":"法規","year":"R5後期 No.37","q":"河川法上，河川区域内において，河川管理者の許可を必要としないものは次のうちどれか。","opts":["河川区域内に設置されているトイレの撤去","河川区域内の上空を横断する送電線の改築","河川区域内の土地を利用した鉄道橋工事の資材置場の設置","取水施設の機能維持のために行う取水口付近に堆積した土砂の排除"],"ans":3,"ex":"","src":"20231023_2kyu","qid":344},{"cat":"法規","year":"R5後期 No.38","q":"敷地面積1000 m²の土地に，建築面積500 m²のL階建ての倉庫を建築しようとする場合，建築基準法上，建ぺい率（％）として正しいものは次のうちどれか。","opts":["50","100","150","200"],"ans":0,"ex":"","src":"20231023_2kyu","qid":345},{"cat":"法規","year":"R5後期 No.39","q":"火薬類の取扱いに関する次の記述のうち，火薬類取締法上，誤っているものはどれか。","opts":["火工所に火薬類を存置する場合には，見張人を原則として常時配置すること。","火工所として建物を設ける場合には，適当な換気の措置を講じ，床面は鉄類で覆い，安全に作業ができるような措置を講ずること。","火工所の周囲には，適当な柵を設け，\u0002火気厳禁\u0003等と書いた警戒札を掲示すること。","火工所は，通路，通路となる坑道，動力線，火薬類取扱所，他の火工所，火薬庫，火気を取り扱う場所，人の出入りする建物等に対し安全で，かつ，湿気の少ない場所に設けること。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":346},{"cat":"法規","year":"R5後期 No.40","q":"騒音規制法上，建設機械の規格等にかかわらず特定建設作業の対象とならない作業は，次のうちどれか。ただし，当該作業がその作業を開始した日に終わるものを除く。","opts":["さく岩機を使用する作業","圧入式杭打杭抜機を使用する作業","バックホゥを使用する作業","ブルドーザを使用する作業"],"ans":1,"ex":"","src":"20231023_2kyu","qid":347},{"cat":"法規","year":"R5後期 No.41","q":"振動規制法上，特定建設作業の規制基準に関する測定位置として，次の記述のうち正しいものはどれか。","opts":["特定建設作業の敷地内の振動発生源","特定建設作業の敷地の中心地点","特定建設作業の敷地の境界線","特定建設作業の敷地に最も近接した家屋内"],"ans":2,"ex":"","src":"20231023_2kyu","qid":348},{"cat":"法規","year":"R5後期 No.42","q":"港則法上，特定港内の船舶の航路及び航法に関する次の記述のうち，誤っているものはどれか。","opts":["汽艇等以外の船舶は，特定港に出入し，又は特定港を通過するには，国土交通省令で定める航路によらなければならない。","船舶は，航路内においては，原則として投びょうし，又はえい航している船舶を放してはならない。","船舶は，航路内において，他の船舶と行き会うときは，左側を航行しなければならない。","航路から航路外に出ようとする船舶は，航路を航行する他の船舶の進路を避けなければならない。"],"ans":2,"ex":"","src":"20231023_2kyu","qid":349},{"cat":"施工管理法","year":"R5後期 No.44","q":"公共工事で発注者が示す設計図書に該当しないものは，次のうちどれか。","opts":["現場説明書","現場説明に対する質問回答書","設計図面","施工計画書"],"ans":3,"ex":"","src":"20231023_2kyu","qid":350},{"cat":"施工管理法","year":"R5後期 No.46","q":"建設機械の用途に関する次の記述のうち，適当でないものはどれか。","opts":["ブルドーザは，土工板を取り付けた機械で，土砂の掘削・運搬（押土），積込み等に用いられる。","ランマは，振動や打撃を与えて，路肩や狭い場所等の締固めに使用される。","モーターグレーダは，路面の精密な仕上げに適しており，砂利道の補修，土の敷均し等に用いられる。","タイヤローラは，接地圧の調整や自重を加減することができ，路盤等の締固めに使用される。"],"ans":0,"ex":"","src":"20231023_2kyu","qid":351},{"cat":"施工管理法","year":"R5後期 No.47","q":"施工計画作成に関する次の記述のうち，適当でないものはどれか。","opts":["環境保全計画は，公害問題，交通問題，近隣環境への影響等に対し，十分な対策を立てることが主な内容である。","調達計画は，労務計画，資材計画，機械計画を立てることが主な内容である。","品質管理計画は，要求する品質を満足させるために設計図書に基づく規格値内に収まるよう計画することが主な内容である。","仮設備計画は，仮設備の設計や配置計画，安全衛生計画を立てることが主な内容である。"],"ans":3,"ex":"","src":"20231023_2kyu","qid":352},{"cat":"施工管理法","year":"R5後期 No.48","q":"労働安全衛生法上，事業者が労働者に保護帽の着用をさせなければならない作業に該当しないものは，次のうちどれか。","opts":["物体の飛来又は落下の危険のある採石作業","最大積載量がQt の貨物自動車の荷の積み卸しの作業","ジャッキ式つり上げ機械を用いた荷のつり上げ，つり下げの作業","橋梁支間20 m のコンクリート橋の架設作業"],"ans":3,"ex":"","src":"20231023_2kyu","qid":353},{"cat":"施工管理法","year":"R5後期 No.50","q":"工事の品質管理活動における品質管理のPDCA（Plan，Do，Check，Action）に関する次の記述のうち，適当でないものはどれか。","opts":["第K段階（計画Plan）では，品質特性の選定と品質規格を決定する。","第L段階（実施Do）では，作業日報に基づき，作業を実施する。","第T段階（検討Check）では，統計的手法により，解析・検討を行う。","第S段階（処理Action）では，異常原因を追究し，除去する処置をとる。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":354},{"cat":"施工管理法","year":"R5後期 No.52","q":"建設工事における騒音や振動に関する次の記述のうち，適当でないものはどれか。","opts":["掘削，積込み作業にあたっては，低騒音型建設機械の使用を原則とする。","アスファルトフィニッシャでの舗装工事で，特に静かな工事施工が要求される場合，バイブレータ式よりタンパ式の採用が望ましい。","建設機械の土工板やバケット等は，できるだけ土のふるい落としの操作を避ける。","履帯式の土工機械では，走行速度が速くなると騒音振動も大きくなるので，不必要な高速走行は避ける。"],"ans":1,"ex":"","src":"20231023_2kyu","qid":355},{"cat":"施工管理法","year":"R5後期 No.53","q":"\u0002建設工事に係る資材の再資源化等に関する法律\u0003（建設リサイクル法）に定められている特定建設資材に該当するものは，次のうちどれか。","opts":["ガラス類","廃プラスチック","アスファルト・コンクリート","土砂"],"ans":2,"ex":"","src":"20231023_2kyu","qid":356},{"cat":"施工管理法応用","year":"R5後期 No.54","q":"建設機械の走行に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして，適当なものは次のうちどれか。・建設機械の走行に必要なコーン指数は，（イ）より（ロ）の方が大きく，（イ）より（ハ）の方が小さい。・（ニ）では，建設機械の走行に伴うこね返しにより土の強度が低下し，走行不可能になることもある。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["普通ブルドーザ ― ダンプトラック ― 湿地ブルドーザ ― 粘性土","ダンプトラック ― 普通ブルドーザ ― 湿地ブルドーザ ― 砂質土","ダンプトラック ― 湿地ブルドーザ ― 普通ブルドーザ ― 粘性土","湿地ブルドーザ ― ダンプトラック ― 普通ブルドーザ ― 砂質土"],"ans":0,"ex":"","src":"20231023_2kyu","qid":357},{"cat":"施工管理法応用","year":"R5後期 No.55","q":"建設機械の作業に関する下記の①〜④の4つの記述のうち，適当なものの数は次のうちどれか。①リッパビリティとは，バックホゥに装着されたリッパによって作業できる程度をいう。②トラフィカビリティとは，建設機械の走行性をいい，一般にN 値で判断される。③ブルドーザの作業効率は，砂の方が岩塊・玉石より小さい。④ダンプトラックの作業効率は，運搬路の沿道条件，路面状態，昼夜の別で変わる。","opts":["1つ","2つ","3つ","4つ"],"ans":0,"ex":"","src":"20231023_2kyu","qid":358},{"cat":"施工管理法応用","year":"R5後期 No.56","q":"工程管理に関する下記の①〜④の S つの記述のうち，適当なもののみを全てあげている組合せは次のうちどれか。①計画工程と実施工程に差が生じた場合には，その原因を追及して改善する。②工程管理では，計画工程が実施工程よりも，やや上回る程度に進行管理を実施する。③常に工程の進捗状況を全作業員に周知徹底させ，作業能率を高めるように努力する。④工程表は，工事の施工順序と所要の日数等をわかりやすく図表化したものである。","opts":["①②","②③","①②③","①③④"],"ans":3,"ex":"","src":"20231023_2kyu","qid":359},{"cat":"施工管理法応用","year":"R5後期 No.59","q":"移動式クレーンを用いた作業において，事業者が行うべき事項に関する下記の①〜④の4つの記述のうち，クレーン等安全規則上，正しいものの数は次のうちどれか。①移動式クレーンにその定格荷重をこえる荷重をかけて使用してはならない。②軟弱地盤のような移動式クレーンが転倒するおそれのある場所では，原則として作業を行ってはならない。③アウトリガーを有する移動式クレーンを用いて作業を行うときは，原則としてアウトリガーを最大限に張り出さなければならない。④移動式クレーンの運転者を，荷をつったままで旋回範囲から離れさせてはならない。","opts":["1つ","2つ","3つ","4つ"],"ans":2,"ex":"","src":"20231023_2kyu","qid":360},{"cat":"施工管理法応用","year":"R5後期 No.60","q":"管理図に関する下記の文章中の（イ）〜（ニ）に当てはまる語句又は数値の組合せとして，適当なものは次のうちどれか。・管理図は，いくつかある品質管理の手法の中で，応用範囲が（イ）便利で，最も多く活用されている。・一般に，上下の管理限界の線は，統計量の標準偏差の（ロ）倍の幅に記入している。・不良品の個数や事故の回数など個数で数えられるデータは，（ハ）と呼ばれている。・管理限界内にあっても，測定値が（ニ）上下するときは工程に異常があると考える。［（イ） ― （ロ） ― （ハ） ― （ニ）］","opts":["広く ― 10 ― 計数値 ― K度でも","狭く ― 3 ― 計量値 ― K度でも","狭く ― 10 ― 計量値 ― 周期的に","広く ― 3 ― 計数値 ― 周期的に"],"ans":3,"ex":"","src":"20231023_2kyu","qid":361},{"cat":"施工管理法応用","year":"R5後期 No.61","q":"盛土の締固めにおける品質管理に関する下記の①〜④の4つの記述のうち，適当なものの数は次のうちどれか。①工法規定方式は，盛土の締固め度を規定する方法である。②盛土の締固めの効果や特性は，土の種類や含水比，施工方法によって大きく変化する。③盛土が最もよく締まる含水比は，最大乾燥密度が得られる含水比で最適含水比である。④現場での土の乾燥密度の測定方法には，砂置換法やRI 計器による方法がある。","opts":["1つ","2つ","3つ","4つ"],"ans":2,"ex":"","src":"20231023_2kyu","qid":362},{"cat":"土木一般","year":"R6後期 No.6","q":"土工作業の\u0002種類\u0003と\u0002使用機械\u0003に関する次の組合せのうち，適当でないものはどれか。［種類］［使用機械］","opts":["敷均し・整地 ― モーターグレーダ","掘削・積込み ― クラムシェル","締固め ― ドラグライン","伐開・除根 ― レーキドーザ"],"ans":2,"ex":"","src":"20241028_2kyu","qid":363},{"cat":"土木一般","year":"R6後期 No.7","q":"法面保護工の\u0002工種\u0003と\u0002目的\u0003に関する次の組合せのうち，適当でないものはどれか。［工種］［目的］","opts":["種子吹付工 ― 雨水による浸食防止","張芝工 ― すべり土塊の崩壊防止","モルタル吹付工 ― 表流水の浸透防止","ブロック積擁壁工 ― 土圧に対抗して崩壊防止"],"ans":1,"ex":"","src":"20241028_2kyu","qid":364},{"cat":"土木一般","year":"R6後期 No.8","q":"盛土材料として望ましい条件に関する次の記述のうち，適当でないものはどれか。","opts":["粒度配合が良く，有害な変形を生じさせないこと。","敷均しが容易で，締固め後のせん断強度が高いこと。","締固め後の圧縮性が大きく，盛土の安定性が保てること。","雨水等の浸食に強く，吸水による膨潤性が低いこと。"],"ans":2,"ex":"","src":"20241028_2kyu","qid":365},{"cat":"土木一般","year":"R6後期 No.9","q":"軟弱地盤における次の対策工法のうち，締固め工法に該当するものはどれか。","opts":["バイブロフローテーション工法","石灰パイル工法","サンドドレーン工法","押え盛土工法"],"ans":0,"ex":"","src":"20241028_2kyu","qid":366},{"cat":"土木一般","year":"R6後期 No.10","q":"コンクリートに用いられる混和材料に関する次の記述のうち，適当でないものはどれか。","opts":["減水剤は，単位水量を増やさずにコンクリートの流動性を高める。","高炉スラグ微粉末は，コンクリートの収縮によるひび割れの発生を抑制できる。","フライアッシュを使用したコンクリートは，コンクリートの発熱や耐久性を改善できる。","AE 剤を使用したコンクリートは，コンクリートの耐凍害性が向上する。"],"ans":1,"ex":"","src":"20241028_2kyu","qid":367},{"cat":"土木一般","year":"R6後期 No.11","q":"コンクリートのスランプ試験に関する次の記述のうち，適当なものはどれか。","opts":["スランプ試験は，高さ50 cm のスランプコーンを使用して測定する。","スランプは，0.5 cm 単位で表示する。","スランプ試験では，コンクリート中央部の平板からの高さを測定する。","スランプは，コンクリートのブリーディング量を示す指標の一つである。"],"ans":1,"ex":"","src":"20241028_2kyu","qid":368},{"cat":"土木一般","year":"R6後期 No.12","q":"各種のコンクリートに関する次の記述のうち，適当なものはどれか。","opts":["膨張コンクリートは，減水剤を練り混ぜたコンクリートによりひび割れの発生や拡大を防ぐ。","寒中コンクリートとしての施工は，日最低気温がK℃以下になると想定されるときに行う。","マスコンクリートでは，セメントのアルカリ骨材反応による構造物の温度変化に伴うひび割れに対する注意が必要である。","水中コンクリートの打込みには，静水中で材料が分離しないよう，原則としてトレミー管若しくはコンクリートポンプを用いる。"],"ans":3,"ex":"","src":"20241028_2kyu","qid":369},{"cat":"土木一般","year":"R6後期 No.13","q":"コンクリートの養生に関する次の記述のうち，適当でないものはどれか。","opts":["養生期間中は，予想される振動等の有害な作用からコンクリートを保護する。","混合セメントの湿潤養生期間は，普通ポルトランドセメントよりも短くする。","外気温が低いほど，湿潤養生期間を長くする。","コンクリートを湿潤状態に保つためには，散水，養生マット等を使用する。"],"ans":1,"ex":"","src":"20241028_2kyu","qid":370},{"cat":"土木一般","year":"R6後期 No.14","q":"既製杭工法の杭打ち機の特徴に関する次の記述のうち，適当でないものはどれか。","opts":["バイブロハンマは，振動と振動機及び杭の重量により杭を地盤に押し込む。","ドロップハンマは，適切な重量のハンマを使用して，ハンマを落下させて打ち込む。","油圧ハンマは，低騒音で油の飛散はなく，打込み時の打撃力を調整できる。","ディーゼルハンマは，騒音・振動と油の飛散はなく，打撃力は大きい。"],"ans":3,"ex":"","src":"20241028_2kyu","qid":371},{"cat":"土木一般","year":"R6後期 No.15","q":"場所打ちコンクリート杭の\u0002工法名\u0003と使用する\u0002主な資機材\u0003に関する次の組合せのうち，適当でないものはどれか。［工法名］［主な資機材］","opts":["リバースサーキュレーション工法 ― スタンドパイプ","アースドリル工法 ― ケーシング","深礎工法 ― 土留め材（ライナープレート）","オールケーシング工法 ― 安定液（ベントナイト泥水）"],"ans":3,"ex":"","src":"20241028_2kyu","qid":372},{"cat":"土木一般","year":"R6後期 No.16","q":"土留めの施工に関する次の記述のうち，適当でないものはどれか。","opts":["自立式土留め工法は，支保工を用いる工法である。","アンカー式土留め工法は，引張材を用いる工法である。","ヒービングとは，軟弱な粘土質地盤を掘削した時に，掘削底面が盛り上がる現象である。","ボイリングとは，砂質地盤で地下水位以下を掘削した時に，砂が吹き上がる現象である。"],"ans":0,"ex":"","src":"20241028_2kyu","qid":373},{"cat":"専門土木","year":"R6後期 No.17","q":"鋼材に関する次の記述のうち，適当でないものはどれか。","opts":["鋳鋼や鍛鋼は，橋梁の伸縮継手等に用いられる。","溶接鋼管は，基礎杭や支柱等に用いられる。","PC 鋼棒は，プレストレストコンクリートの緊張材に用いられる。","硬鋼線材を束ねたワイヤーケーブルは，鉄筋の組立や蛇かごに用いられる。"],"ans":3,"ex":"","src":"20241028_2kyu","qid":374},{"cat":"専門土木","year":"R6後期 No.18","q":"鋼道路橋の架設工法に関する次の記述のうち，適当なものはどれか。","opts":["ケーブルクレーンによる直吊り工法は，鉄塔で支えられたケーブルクレーンで橋桁を吊り込んで架設する工法で，市街地での架設に適している。","クレーン車によるベント式架設工法では，架設時にベントと呼ばれる鋼管や形鋼で組まれた架設構造物を，仮の橋脚として設置する工法で，深い谷間での架設に適している。","フローティングクレーンによる一括架設式工法は，船にクレーンを組み込んだ起重機船を用いる工法で，水深が深く，流れの強い場所の架設に適している。","トラベラークレーンによる片持ち式架設工法は，クレーンで部材を吊りながら片持ち式で架設していく工法で，桁下空間が使用できない場合のトラス橋の架設に適している。"],"ans":3,"ex":"","src":"20241028_2kyu","qid":375},{"cat":"専門土木","year":"R6後期 No.19","q":"コンクリートに関する次の用語のうち，劣化機構に該当しないものはどれか。","opts":["アルカリシリカ反応","凍害","コールドジョイント","疲労"],"ans":2,"ex":"","src":"20241028_2kyu","qid":376},{"cat":"専門土木","year":"R6後期 No.20","q":"河川に関する次の記述のうち，適当なものはどれか。","opts":["河川において，上流から下流を見て右側を右岸，左側を左岸という。","背割堤は下流側の先端が開放され，洪水時には流水が逆流するので氾濫しないよう地形に合わせて堤防を重複させるものをいう。","河川の流水がある側を堤内地，堤防で守られている側を堤外地という。","河川堤防の法面は，河川の流水がある側を裏法面といい，堤防で守られている側を表法面という。"],"ans":0,"ex":"","src":"20241028_2kyu","qid":377},{"cat":"専門土木","year":"R6後期 No.21","q":"河川護岸に関する次の記述のうち，適当でないものはどれか。","opts":["根固工は，河床洗掘を防ぎ，基礎工等を保護するために施工する。","法覆工は，法勾配が緩く流速が小さな場所では，平板ブロックで施工する。","高水護岸は，単断面の河川において高水時に法面を保護するために施工する。","低水護岸は，低水路を維持し，高水敷の洗掘等を防止するために施工する。"],"ans":2,"ex":"","src":"20241028_2kyu","qid":378},{"cat":"専門土木","year":"R6後期 No.23","q":"地すべり防止工に関する次の記述のうち，適当でないものはどれか。","opts":["地すべり防止工では，抑制工，抑止工の順に施工するのが一般的である。","抑制工としては，水路工や排土工等が，抑止工としては，杭工，シャフト工等がある。","横ボーリング工は，地下水の排除を目的とし，抑制工に区分される。","集水井工は，井筒（ケーソン）を設け，地下水を排除するもので，抑止工に区分される。"],"ans":3,"ex":"","src":"20241028_2kyu","qid":379},{"cat":"専門土木","year":"R6後期 No.24","q":"道路のアスファルト舗装の路盤の施工に関する次の記述のうち，適当なものはどれか。","opts":["石灰安定処理路盤の締固めは，最適含水比よりやや乾燥状態で行うと良い。","下層路盤には，クラッシャーラン，スラグ等の材料が用いられる。","セメント安定処理路盤の締固めは，材料が十分硬化した後に行うことが重要である。","粒度調整路盤は，材料の分離に留意し，瀝青材料を均一に敷き均し，締め固めて仕上げる。"],"ans":1,"ex":"","src":"20241028_2kyu","qid":380},{"cat":"専門土木","year":"R6後期 No.25","q":"道路のアスファルト舗装における締固めに関する次の記述のうち，適当なものはどれか。","opts":["初転圧の転圧温度は，一般に70〜90 ℃とする。","二次転圧の終了温度は，一般に110〜140 ℃とする。","転圧温度が高過ぎると，ヘアクラックや変形を起こすことがある。","締固め作業は，初転圧，二次転圧，継目転圧，仕上げ転圧の順で行う。"],"ans":2,"ex":"","src":"20241028_2kyu","qid":381},{"cat":"専門土木","year":"R6後期 No.26","q":"道路のアスファルト舗装における各種補修工法に関する次の記述のうち，適当なものはどれか。","opts":["切削工法は，路面に生じた段差や凹凸を解消するため，凸部等を除去する工法である。","パッチング工法は，路面に生じたひび割れにシール材を充塡する工法である。","オーバーレイ工法は，舗装の不良な一部分や全てを取り除き，新しい舗装を行う工法である。","打換え工法は，既設舗装上にアスファルト混合物等の層を重ねる工法である。"],"ans":0,"ex":"","src":"20241028_2kyu","qid":382},{"cat":"専門土木","year":"R6後期 No.27","q":"道路のコンクリート舗装における施工上の留意点に関する次の記述のうち，適当でないものはどれか。","opts":["コンクリートの打込みでは，均一に隅々まで敷き広げ，フィニッシャあるいは平板振動機等で締め固める。","打ち込んだコンクリートの最終仕上げでは，表面の水光りが消える前に，ほうきやブラシ等で粗面仕上げをする。","コンクリート舗装の横目地には，膨張目地と収縮に対応するダミー目地を設ける。","表面仕上げの終わった舗装版は，乾燥から保護し，所定の強度に達してから交通開放する。"],"ans":1,"ex":"","src":"20241028_2kyu","qid":383},{"cat":"専門土木","year":"R6後期 No.28","q":"ダムに関する次の記述のうち，適当なものはどれか。","opts":["RCD コンクリートを打設するRCD 工法では，水和発熱が大きく，パイプクーリングによる養生が一般的である。","ダムの転流工は，比較的川幅が狭く流量が少ない日本の河川では，仮排水トンネル方式が多く用いられる。","重力式コンクリートダムは，水圧の大部分を両岸の岩盤に伝えることにより水圧を支える構造のダムである。","中央コア型ロックフィルダムは，一般的に堤体中央部のコア材に，砂礫や岩石など半透水性の土質材料を用いる。"],"ans":1,"ex":"","src":"20241028_2kyu","qid":384},{"cat":"専門土木","year":"R6後期 No.29","q":"山岳工法によるトンネルの掘削に関する次の記述のうち，適当でないものはどれか。","opts":["全断面工法は，トンネルの全断面を一度に掘削する工法である。","ベンチカット工法は，一般にトンネル断面を上半分と下半分に分けて掘削する工法である。","機械掘削は，余掘りが多いという短所がある。","発破掘削は，騒音や振動が大きいという短所がある。"],"ans":2,"ex":"","src":"20241028_2kyu","qid":385},{"cat":"専門土木","year":"R6後期 No.31","q":"ケーソン式混成堤の施工に関する次の記述のうち，適当でないものはどれか。","opts":["ケーソンは，海面が常におだやかで，大型起重機船が使用できるなら，進水したケーソンを据付け場所までえい航して据え付けることができる。","ケーソンの底面が据付け面に近づいたら，注水を一時止め，潜水士によって正確な位置を決めたのち，再び注水して正しく据え付ける。","据え付けたケーソンは，一般的に起重機船を使用して，内部に中詰め材を投入し，ケーソンの質量を増し，安定性を高める。","ケーソンの中詰め後は，波により中詰め材が洗い流されないように，ケーソンの蓋となるコンクリートを打設する。"],"ans":2,"ex":"","src":"20241028_2kyu","qid":386},{"cat":"専門土木","year":"R6後期 No.32","q":"鉄道の\u0002軌道の用語\u0003と\u0002説明\u0003に関する次の組合せのうち，適当でないものはどれか。［軌道の用語］［説明］","opts":["緩和曲線 ― 車両の走行を円滑にするため直線と円曲線，又は二つの曲線間をゆるやかにつなぐ特殊な線形のこと","カント ― 車両が曲線を通過するときに遠心力により車両が外方に転倒することを防ぐために外側のレールを低くすること","バラスト軌道 ― 路盤の上にバラストを敷き，その上にマクラギに固定したレールを敷設した軌道のこと","スラック ― 曲線区間において車両が円滑に走行するために，曲線の軌間を内側に広げた拡大量のこと"],"ans":1,"ex":"","src":"20241028_2kyu","qid":387},{"cat":"専門土木","year":"R6後期 No.33","q":"鉄道の営業線及びこれに近接した工事に関する次の記述のうち，適当でないものはどれか。","opts":["保安管理者は，工事指揮者と相談し，事故防止責任者を指導し，列車の安全運行を確保する。","重機械による作業は，列車の近接から通過の完了まで接触を避けて作業を行わなければならない。","信号区間のときは，バール・スパナ・スチールテープ等の金属によるショートを防止する。","列車見張員は，信号炎管・合図灯・呼笛・時計・時刻表・緊急連絡表を携帯しなければならない。"],"ans":1,"ex":"","src":"20241028_2kyu","qid":388},{"cat":"専門土木","year":"R6後期 No.34","q":"シールド工法に関する次の記述のうち，適当でないものはどれか。","opts":["土圧式シールド工法は，切羽の土圧と掘削土砂が平衡を保ちながら掘進する工法である。","土圧式シールド工法は，スクリューコンベアで排土を行う工法である。","泥水式シールド工法は，切羽に設けた隔壁内に泥水を循環させ，切羽の安定を保つ工法である。","泥水式シールド工法は，切削された土砂をベルトコンベアにより坑外に輸送する工法である。"],"ans":3,"ex":"","src":"20241028_2kyu","qid":389},{"cat":"専門土木","year":"R6後期 No.35","q":"上水道に用いる配水管と継手の特徴に関する次の記述のうち，適当でないものはどれか。","opts":["ダクタイル鋳鉄管は，継手の種類に関わらず異形管防護を必要としない。","鋼管は，溶接継手によって管を一体化するため，地盤の変動に対応できる。","硬質塩化ビニル管は，接着した継手の強度や水密性に注意する。","ポリエチレン管は，雨天時や湧水地盤における融着継手の施工が難しい。"],"ans":0,"ex":"","src":"20241028_2kyu","qid":390},{"cat":"専門土木","year":"R6後期 No.36","q":"下水道管渠の剛性管の施工における\u0002地盤区分（代表的な土質）\u0003と\u0002基礎工の種類\u0003に関する次の組合せのうち，適当でないものはどれか。［地盤区分（代表的な土質）］［基礎工の種類］","opts":["硬質土（硬質粘土，礫混じり土及び礫混じり砂） ― 砕石基礎","普通土（砂，ローム及び砂質粘土） ― まくら木基礎","軟弱土（シルト及び有機質土） ― コンクリート基礎","極軟弱土（非常に緩いシルト及び有機質土） ― 砂基礎"],"ans":3,"ex":"","src":"20241028_2kyu","qid":391},{"cat":"法規","year":"R6後期 No.38","q":"年少者の就業に関する次の記述のうち，労働基準法上，誤っているものはどれか。","opts":["使用者は，満18 歳に満たない者について，その年齢を証明する戸籍証明書を事業場に備え付けなければならない。","使用者は，原則として，児童が満15 歳に達する日まで，児童を使用してはならない。","使用者は，満18 歳に満たない者を，所定の重量物を取り扱う業務に就かせてはならない。","使用者は，原則として，満18 歳に満たない者を午後10 時から午前V時までの間において使用してはならない。"],"ans":1,"ex":"","src":"20241028_2kyu","qid":392},{"cat":"法規","year":"R6後期 No.40","q":"建設業法に関する次の記述のうち，誤っているものはどれか。","opts":["軽微な建設工事のみを請け負うことを営業とする者を除き，建設業を営もうとする者は，全て国土交通大臣の許可を受けなければならない。","建設業とは，元請，下請その他いかなる名義をもってするかを問わず，建設工事の完成を請け負う営業をいう。","元請負人は，その請け負った工事を施工するために，必要な作業方法等を定めるときには，あらかじめ，下請負人の意見を聞かなければならない。","施工体系図は，各下請負人の施工の分担関係を表示したものであり，作成後は当該工事現場の見やすい場所に掲げなければならない。"],"ans":0,"ex":"","src":"20241028_2kyu","qid":393},{"cat":"法規","year":"R6後期 No.41","q":"建設業法に定められている，工事現場における主任技術者及び監理技術者の職務に関する次の記述のうち，誤っているものはどれか。","opts":["施工計画の作成を行わなければならない。","工程管理や品質管理を行わなければならない。","下請契約書の作成を行わなければならない。","施工に従事する者の技術上の指導監督を行わなければならない。"],"ans":2,"ex":"","src":"20241028_2kyu","qid":394},{"cat":"法規","year":"R6後期 No.42","q":"河川法に関する次の記述のうち，河川管理者の許可を必要としないものはどれか。","opts":["河川区域内の地下を横断するトンネルの設置","河川区域内の民有地における竹木の伐採","河川区域内での道路橋新設工事に伴う掘削土砂の仮置場の設置","河川区域内に設置されている下水処理施設の排水口付近の堆積土砂の排除"],"ans":3,"ex":"","src":"20241028_2kyu","qid":395},{"cat":"法規","year":"R6後期 No.44","q":"道路占用者が道路を掘削する場合に，道路法上，用いてはならない方法は，次のうちどれか。","opts":["つぼ掘","溝掘","えぐり掘","推進工法"],"ans":2,"ex":"","src":"20241028_2kyu","qid":396},{"cat":"法規","year":"R6後期 No.45","q":"騒音規制法上，特定建設作業の対象とならない建設機械は，次のうちどれか。ただし，当該作業がその作業を開始した日に終わるものを除く。","opts":["舗装版破砕機","ディーゼルハンマ","バックホゥ","さく岩機"],"ans":0,"ex":"","src":"20241028_2kyu","qid":397},{"cat":"法規","year":"R6後期 No.46","q":"振動規制法上，指定地域内において行う特定建設作業に該当するものは，次のうちどれか。ただし，当該作業がその作業を開始した日に終わるものを除き，T日のW地点間の最大移動距離が50 m を超えない作業とする。","opts":["油圧式杭抜機を使用する作業","ジャイアントブレーカを使用する作業","ブルドーザを使用する作業","路面切削機を使用する作業"],"ans":1,"ex":"","src":"20241028_2kyu","qid":398},{"cat":"法規","year":"R6後期 No.47","q":"航路及び航法に関する次の記述のうち，港則法上，誤っているものはどれか。","opts":["船舶は，航路内において，他の船舶と行き会うときは，右側を航行しなければならない。","船舶は，航路外から航路に入り，又は航路から航路外に出ようとするときは，航路を航行する他の船舶の進路を避けなければならない。","船舶は，原則として，航路内において，投びょうし，又はえい航している船舶を放してはならない。","船舶は，港内においては，防波堤，ふとうその他の工作物の突端又は停泊船舶を右げんに見て航行するときは，できるだけこれに遠ざかって航行しなければならない。"],"ans":3,"ex":"","src":"20241028_2kyu","qid":399},{"cat":"施工管理法","year":"R6後期 No.49","q":"公共工事で発注者が示す設計図書に該当しないものは，次のうちどれか。","opts":["設計図面","数量計算書","実行予算書","現場説明書"],"ans":2,"ex":"","src":"20241028_2kyu","qid":400},{"cat":"施工管理法","year":"R6後期 No.51","q":"建設機械に関する次の記述のうち，適当でないものはどれか。","opts":["タイヤローラは，タイヤの空気圧を調整して接地圧を変化させることができ，砕石等の締固めには空気圧を減少させて締め固める。","スクレーパは，土砂の掘削・積込み，中距離運搬，敷均しの一連の作業ができる。","ドリルジャンボは，削岩機を移動式台車に搭載したもので，せん孔作業に用いられる。","スクレープドーザは，ブルドーザとスクレーパの両方の機能を備え，狭い場所や軟弱地盤での施工に用いられる。"],"ans":0,"ex":"","src":"20241028_2kyu","qid":401},{"cat":"施工管理法","year":"R6後期 No.52","q":"施工計画作成に関する次の記述のうち，適当でないものはどれか。","opts":["環境保全計画は，公害問題，交通問題への影響等に対し，十分な対策を立てることが主な内容である。","調達計画は，労務計画，資材計画，機械計画を行い，それらに基づき実行予算を立てることが主な内容である。","品質管理計画は，要求する品質を満足させるために設計図書に基づき，規格値内に収まるよう計画することが主な内容である。","仮設備計画は，使用目的や期間に応じて構造計算を行い，仮設備の設置，維持管理，撤去，後片付け工事まで計画することが主な内容である。"],"ans":1,"ex":"","src":"20241028_2kyu","qid":402},{"cat":"施工管理法","year":"R6後期 No.53","q":"保護帽の使用に関する次の記述のうち，適当でないものはどれか。","opts":["保護帽は，ヘッドバンドを正しく調整して使用すると共に，あごひもはきちんと締める。","保護帽は，見やすい箇所に製造者名，製造年月等が表示されているものを使用する。","保護帽は，勝手に改造あるいは加工したり，部品を取り除いてはならない。","保護帽は，大きな衝撃を受けた場合でも，外観に異常がなければ使用できる。"],"ans":3,"ex":"","src":"20241028_2kyu","qid":403},{"cat":"施工管理法","year":"R6後期 No.55","q":"アスファルト舗装の品質特性と試験方法に関する次の記述のうち，適当でないものはどれか。","opts":["アスファルトの硬さを調べるためには，針入度試験を行う。","平坦性を確認するためには，平坦性試験を行う。","アスファルトの延性を調べるためには，伸度試験を行う。","路床の強さを判定するためには，標準貫入試験を行う。"],"ans":3,"ex":"","src":"20241028_2kyu","qid":404},{"cat":"施工管理法","year":"R6後期 No.57","q":"建設工事における，騒音，振動対策に関する次の記述のうち，適当でないものはどれか。","opts":["騒音，振動の防止対策として，騒音，振動の大きさを下げるほか発生期間の短縮を検討する。","掘削土をバックホゥ等でダンプトラックに積み込む場合，落下高を高くして掘削土の放出をスムーズに行う。",
