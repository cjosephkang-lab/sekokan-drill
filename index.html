<title>施工管理ドリル ― 土木施工管理技士 一次検定</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<style>
:root{
  --bg:#f2efe8; --sf:#ffffff; --el:#eae5da; --hair:#dcd6c9;
  --ink:#1f1c17; --ink2:#5f5850; --ink3:#938b7d;
  --acc:#b5622f; --acc-soft:rgba(181,98,47,.10); --acc-line:rgba(181,98,47,.32);
  --ok:#2f7d54; --ok-soft:rgba(47,125,84,.12);
  --ng:#bb3b2e; --ng-soft:rgba(187,59,46,.10);
  --blue:#33507a;
  --r:14px; --rs:9px;
  --shadow:0 1px 2px rgba(31,28,23,.05), 0 6px 20px rgba(31,28,23,.05);
  --ease:cubic-bezier(.2,.9,.3,1);
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic Medium","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15171c; --sf:#1d2027; --el:#242832; --hair:#333844;
    --ink:#eceae4; --ink2:#a7a397; --ink3:#6f6d66;
    --acc:#e08a4f; --acc-soft:rgba(224,138,79,.13); --acc-line:rgba(224,138,79,.34);
    --ok:#4bb27c; --ok-soft:rgba(75,178,124,.15);
    --ng:#e06a5c; --ng-soft:rgba(224,106,92,.14);
    --blue:#7ea0d4;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="light"]{
  --bg:#f2efe8; --sf:#ffffff; --el:#eae5da; --hair:#dcd6c9;
  --ink:#1f1c17; --ink2:#5f5850; --ink3:#938b7d;
  --acc:#b5622f; --acc-soft:rgba(181,98,47,.10); --acc-line:rgba(181,98,47,.32);
  --ok:#2f7d54; --ok-soft:rgba(47,125,84,.12);
  --ng:#bb3b2e; --ng-soft:rgba(187,59,46,.10); --blue:#33507a;
  --shadow:0 1px 2px rgba(31,28,23,.05), 0 6px 20px rgba(31,28,23,.05);
}
:root[data-theme="dark"]{
  --bg:#15171c; --sf:#1d2027; --el:#242832; --hair:#333844;
  --ink:#eceae4; --ink2:#a7a397; --ink3:#6f6d66;
  --acc:#e08a4f; --acc-soft:rgba(224,138,79,.13); --acc-line:rgba(224,138,79,.34);
  --ok:#4bb27c; --ok-soft:rgba(75,178,124,.15);
  --ng:#e06a5c; --ng-soft:rgba(224,106,92,.14); --blue:#7ea0d4;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  min-height:100dvh;line-height:1.7;-webkit-font-smoothing:antialiased;
  font-feature-settings:"palt";
}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.scr{display:none;flex-direction:column;min-height:100dvh}
.scr.on{display:flex}

/* --- top bar --- */
.bar{display:flex;align-items:center;gap:12px;padding:16px 20px 4px}
.bar .back{width:38px;height:38px;flex:none;border:1px solid var(--hair);background:var(--sf);
  border-radius:var(--rs);color:var(--ink);font-size:17px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:background .2s}
.bar .back:hover{background:var(--el)}
.bar .ttl{font-size:16px;font-weight:700;flex:1}
.theme-btn{width:38px;height:38px;flex:none;border:1px solid var(--hair);background:var(--sf);
  border-radius:var(--rs);color:var(--ink2);cursor:pointer;font-size:15px;display:flex;
  align-items:center;justify-content:center}

/* --- home --- */
.home-pad{padding:18px 20px 40px;display:flex;flex-direction:column;gap:20px}
.masthead{display:flex;justify-content:space-between;align-items:flex-start}
.masthead .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.masthead h1{font-size:23px;font-weight:800;letter-spacing:-.01em;margin-top:3px;text-wrap:balance}
.masthead .grade{font-size:11px;color:var(--acc);font-weight:700;border:1px solid var(--acc-line);
  border-radius:100px;padding:5px 12px;white-space:nowrap;margin-top:4px}
.grade-switch{display:flex;gap:0;background:var(--el);border-radius:var(--rs);padding:3px;border:1px solid var(--hair)}
.grade-switch .gs{flex:1;border:none;background:transparent;color:var(--ink2);font-family:inherit;
  font-size:13px;font-weight:700;padding:9px;border-radius:7px;cursor:pointer;transition:background .2s,color .2s}
.grade-switch .gs.on{background:var(--sf);color:var(--acc);box-shadow:var(--shadow)}

/* countdown / today card */
.today{background:var(--sf);border:1px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.today-top{padding:18px 20px;border-bottom:1px solid var(--hair);
  display:flex;justify-content:space-between;align-items:center;gap:14px}
.cd-label{font-size:12px;color:var(--ink2);font-weight:600}
.cd-days{font-size:34px;font-weight:800;line-height:1;color:var(--acc)}
.cd-days .u{font-size:14px;color:var(--ink2);font-weight:600;margin-left:3px}
.cd-date{font-size:11px;color:var(--ink3);margin-top:4px}
.streak{text-align:right}
.streak .n{font-size:28px;font-weight:800;line-height:1}
.streak .l{font-size:10px;color:var(--ink3);letter-spacing:.04em}
.today-goal{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.goal-row{display:flex;align-items:baseline;justify-content:space-between}
.goal-row .lbl{font-size:13px;color:var(--ink2);font-weight:600}
.goal-row .val{font-size:15px;font-weight:700}
.goal-row .val b{font-size:22px;color:var(--acc)}
.pbar{height:8px;background:var(--el);border-radius:5px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .8s var(--ease)}
.start-btn{width:100%;padding:15px;border:none;border-radius:var(--rs);cursor:pointer;
  background:var(--acc);color:#fff;font-family:inherit;font-size:15px;font-weight:700;
  transition:transform .12s var(--ease),filter .2s;letter-spacing:.02em}
.start-btn:hover{filter:brightness(1.05)}
.start-btn:active{transform:scale(.985)}
.start-btn.done{background:var(--ok-soft);color:var(--ok);border:1px solid transparent;cursor:default}

/* section label */
.slab{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:-6px;padding-left:2px}

/* mode grid */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--sf);border:1px solid var(--hair);border-radius:var(--rs);
  padding:15px;cursor:pointer;transition:border-color .2s,transform .12s var(--ease);text-align:left}
.mode:hover{border-color:var(--acc-line)}
.mode:active{transform:scale(.98)}
.mode .m-t{font-size:14px;font-weight:700;margin-bottom:2px}
.mode .m-s{font-size:11px;color:var(--ink3)}
.mode .m-b{font-size:11px;color:var(--acc);font-weight:700;margin-top:6px;font-family:var(--mono)}

/* score board */
.board{background:var(--sf);border:1px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.board-head{display:flex;justify-content:space-between;align-items:baseline}
.board-head .t{font-size:13px;font-weight:700}
.board-head .sc{font-family:var(--mono);font-weight:800;font-size:15px}
.board-head .sc b{font-size:22px;color:var(--acc)}
.board-note{font-size:11px;color:var(--ink3);line-height:1.6}
.catbar{display:flex;flex-direction:column;gap:3px}
.catbar .cr{display:flex;justify-content:space-between;font-size:12px}
.catbar .cr .cn{color:var(--ink2);font-weight:600}
.catbar .cr .cv{font-family:var(--mono);color:var(--ink3)}
.catbar .track{height:6px;background:var(--el);border-radius:4px;overflow:hidden}
.catbar .track>i{display:block;height:100%;border-radius:4px;transition:width .8s var(--ease)}

/* --- quiz --- */
.q-top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--hair);background:var(--sf)}
.q-top .prog{flex:1}
.q-top .ptrack{height:5px;background:var(--el);border-radius:3px;overflow:hidden}
.q-top .ptrack>i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .35s var(--ease)}
.q-top .pc{font-size:11px;color:var(--ink3);margin-top:5px;font-family:var(--mono)}
.q-close{width:34px;height:34px;flex:none;border:1px solid var(--hair);background:var(--bg);
  border-radius:8px;color:var(--ink2);font-size:15px;cursor:pointer}
.q-body{flex:1;padding:22px 20px 20px;overflow-y:auto}
.q-meta{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px}
.chip.cat{color:var(--acc);background:var(--acc-soft)}
.chip.src{color:var(--ink3);background:var(--el);font-family:var(--mono);font-weight:600}
.chip.rev{color:var(--blue);background:rgba(51,80,122,.10)}
.q-text{font-size:16px;font-weight:600;line-height:1.85;margin-bottom:22px;color:var(--ink);text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:13px;align-items:flex-start;background:var(--sf);border:1.5px solid var(--hair);
  border-radius:var(--rs);padding:14px 15px;cursor:pointer;font-size:14px;line-height:1.7;
  transition:border-color .18s,background .18s;text-align:left;width:100%;font-family:inherit;color:var(--ink)}
.opt:not(.dis):hover{border-color:var(--acc-line);background:var(--acc-soft)}
.opt:not(.dis):active{transform:scale(.995)}
.opt .num{width:26px;height:26px;flex:none;border-radius:7px;background:var(--el);color:var(--ink2);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono);margin-top:1px}
.opt.dis{cursor:default}
.opt.pick-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.pick-ok .num{background:var(--ok);color:#fff}
.opt.pick-ng{border-color:var(--ng);background:var(--ng-soft)}
.opt.pick-ng .num{background:var(--ng);color:#fff}
.opt.reveal-ok{border-color:var(--ok)}
.opt.reveal-ok .num{background:var(--ok);color:#fff}
.opt.faded{opacity:.5}
.expl{margin-top:20px;border:1px solid var(--hair);border-left:3px solid var(--acc);
  border-radius:var(--rs);padding:16px 17px;background:var(--sf);display:none}
.expl.show{display:block;animation:slideUp .4s var(--ease)}
.expl .eh{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.05em;margin-bottom:8px;
  text-transform:uppercase;display:flex;align-items:center;gap:7px}
.expl .verdict{font-family:var(--sans);font-size:12px;padding:2px 9px;border-radius:100px;font-weight:700}
.expl .verdict.ok{color:var(--ok);background:var(--ok-soft)}
.expl .verdict.ng{color:var(--ng);background:var(--ng-soft)}
.expl .et{font-size:13.5px;line-height:1.85;color:var(--ink2)}
.expl-link{display:none;margin-top:12px;font-size:13px;font-weight:700;color:var(--acc);text-decoration:none}
.expl-link.show{display:inline-flex;align-items:center;gap:5px}
.expl-link:hover{text-decoration:underline}
.q-foot{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);background:var(--sf)}
.next-btn{width:100%;padding:15px;border:none;border-radius:var(--rs);cursor:pointer;
  background:var(--acc);color:#fff;font-family:inherit;font-size:15px;font-weight:700;
  display:none;transition:transform .12s var(--ease)}
.next-btn.show{display:block}
.next-btn:active{transform:scale(.985)}

/* --- results --- */
.res{align-items:center;justify-content:center;text-align:center;padding:40px 28px;gap:0}
.res .rt{font-size:24px;font-weight:800;margin-bottom:6px;text-wrap:balance}
.res .rs{font-size:13px;color:var(--ink2);margin-bottom:26px}
.ring{width:150px;height:150px;position:relative;margin:0 auto 26px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--el);stroke-width:11}
.ring .fg{fill:none;stroke:var(--acc);stroke-width:11;stroke-linecap:round;
  stroke-dasharray:427;stroke-dashoffset:427;transition:stroke-dashoffset 1.3s var(--ease)}
.ring .fg.pass{stroke:var(--ok)}
.ring .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-size:38px;font-weight:800;font-family:var(--mono)}
.ring .frac{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-bottom:14px}
.res-stat{background:var(--sf);border:1px solid var(--hair);border-radius:var(--rs);padding:13px 8px}
.res-stat .v{font-size:19px;font-weight:800;font-family:var(--mono);display:block}
.res-stat .l{font-size:10px;color:var(--ink3);margin-top:3px}
.res-msg{font-size:12.5px;color:var(--ink2);line-height:1.7;background:var(--acc-soft);
  border-radius:var(--rs);padding:13px 15px;margin-bottom:22px;width:100%}
.res-acts{width:100%;display:flex;flex-direction:column;gap:10px}
.btn-ghost{width:100%;padding:14px;border:1px solid var(--hair);border-radius:var(--rs);
  background:var(--sf);color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}

/* flash */
.flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0}
.flash.f-ok{background:radial-gradient(circle at 50% 60%,var(--ok-soft),transparent 65%);animation:flash .55s forwards}
.flash.f-ng{background:radial-gradient(circle at 50% 60%,var(--ng-soft),transparent 65%);animation:flash .55s forwards}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:100px;
  z-index:60;opacity:0;transition:opacity .3s,transform .3s var(--ease);pointer-events:none;max-width:88%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* settings inline */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--sf);border:1px solid var(--hair);border-radius:var(--rs);padding:14px 16px}
.setrow .k{font-size:13px;font-weight:600}
.setrow .kk{font-size:11px;color:var(--ink3);margin-top:2px}
.setrow input[type=date]{font-family:var(--mono);font-size:13px;border:1px solid var(--hair);
  border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
.link{color:var(--acc);font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;background:none;border:none;font-family:inherit}

@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>
<div class="wrap">

<!-- ===== HOME ===== -->
<section class="scr on" id="home">
  <div class="bar">
    <div class="ttl"></div>
    <button class="theme-btn" id="themeBtn" aria-label="表示テーマ切替">◐</button>
  </div>
  <div class="home-pad">
    <div class="masthead">
      <div>
        <div class="eyebrow">土木施工管理技士 一次検定</div>
        <h1>施工管理ドリル</h1>
      </div>
      <div class="grade" id="gradeBadge">2級 · 前提</div>
    </div>

    <div class="grade-switch" id="gradeSwitch" style="display:none">
      <button class="gs" id="grade1">1級</button>
      <button class="gs" id="grade2">2級</button>
    </div>

    <div class="today">
      <div class="today-top">
        <div>
          <div class="cd-label">試験日まで</div>
          <div class="cd-days" id="cdDays">— <span class="u">日</span></div>
          <div class="cd-date" id="cdDate"></div>
        </div>
        <div class="streak">
          <div class="n" id="streakN">0</div>
          <div class="l">日連続 🔥</div>
        </div>
      </div>
      <div class="today-goal">
        <div class="goal-row">
          <span class="lbl">今日やる</span>
          <span class="val"><b id="goalDone">0</b> / <span id="goalTotal">0</span> 問</span>
        </div>
        <div class="pbar"><i id="goalBar" style="width:0%"></i></div>
        <button class="start-btn" id="startToday">今日の学習を始める</button>
      </div>
    </div>

    <div class="slab">学習モード</div>
    <div class="modes">
      <button class="mode" id="modeReview">
        <div class="m-t">復習</div>
        <div class="m-s">忘れかけを再出題</div>
        <div class="m-b" id="reviewCount">0 問</div>
      </button>
      <button class="mode" id="modeNew">
        <div class="m-t">新しい問題</div>
        <div class="m-s">まだ解いていない</div>
        <div class="m-b" id="newCount">0 問</div>
      </button>
      <button class="mode" id="modeCat">
        <div class="m-t">分野別</div>
        <div class="m-s">科目を選んで演習</div>
        <div class="m-b" id="catAll">全4分野</div>
      </button>
      <button class="mode" id="modeExam">
        <div class="m-t">模試</div>
        <div class="m-s">本番形式で通す</div>
        <div class="m-b" id="examCount">全問</div>
      </button>
    </div>

    <div class="slab">予想得点</div>
    <div class="board">
      <div class="board-head">
        <span class="t">本番換算スコア</span>
        <span class="sc"><b id="projPct">0</b>%</span>
      </div>
      <div class="board-note" id="boardNote"></div>
      <div id="catBars"></div>
    </div>

    <div class="slab">試験日の設定</div>
    <div class="setrow">
      <div>
        <div class="k">試験日</div>
        <div class="kk" id="examSetNote">逆算して今日の問題数を決めます</div>
      </div>
      <input type="date" id="examDate">
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0 2px">
      <button class="link" id="resetBtn">学習記録をリセット</button>
      <span style="font-size:11px;color:var(--ink3)" id="verLabel"></span>
    </div>
    <p style="font-size:11px;color:var(--ink3);line-height:1.7;padding:0 2px">
      <span id="introText">収録問題</span>（全<span id="qTotal2">48</span>問）。
      各問の学習状況はこの端末のブラウザにのみ保存されます。試験制度の一次情報と1級の合格戦略は別途「合格ロードマップ」を参照。
    </p>
  </div>
</section>

<!-- ===== CATEGORY ===== -->
<section class="scr" id="cats">
  <div class="bar">
    <button class="back" data-go="home">←</button>
    <div class="ttl">分野を選択</div>
  </div>
  <div class="home-pad" id="catList"></div>
</section>

<!-- ===== QUIZ ===== -->
<section class="scr" id="quiz">
  <div class="q-top">
    <div class="prog">
      <div class="ptrack"><i id="qProg" style="width:0%"></i></div>
      <div class="pc" id="qCount">1 / 10</div>
    </div>
    <button class="q-close" id="qClose" aria-label="中断">✕</button>
  </div>
  <div class="q-body" id="qBody">
    <div class="q-meta" id="qMeta"></div>
    <div class="q-text" id="qText"></div>
    <div class="opts" id="qOpts"></div>
    <div class="expl" id="expl">
      <div class="eh">解説 <span class="verdict" id="verdict"></span></div>
      <div class="et" id="explText"></div>
      <a class="expl-link" id="explLink" href="#" target="_blank" rel="noopener">解答解説を見る →</a>
    </div>
  </div>
  <div class="q-foot">
    <button class="next-btn" id="nextBtn">次の問題 →</button>
  </div>
</section>

<!-- ===== RESULTS ===== -->
<section class="scr res" id="results">
  <div class="rt" id="resTitle"></div>
  <div class="rs" id="resSub"></div>
  <div class="ring">
    <svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="68"/><circle class="fg" id="resRing" cx="75" cy="75" r="68"/></svg>

<script>
/*
 * SRS学習エンジン ― 施工管理技士ドリル
 * 間隔反復（Spaced Repetition）と想起練習の中核ロジックを純粋関数で提供する。
 * ブラウザ（単一HTML）とNode（テスト）の両方で動くよう、module.exportsは末尾で条件付きにする。
 *
 * 設計方針（takken-drillの学習導線を踏襲）:
 *  - 間違えた問題は翌日、正解を重ねるほど間隔を広げて再出題する（1回→1日, 2回→3日, 3回→7日, 4回→14日, 以降30日）
 *  - 2回連続正解で「身についた（mastered）」扱い
 *  - 「次にやる」優先度: 復習期限が来た問題 → 未着手の問題 → 合格者推奨の科目順
 *  - 試験日から逆算し、1日にこなすべき問題数を出す
 */

"use strict";

// 正解回数 → 次回までの日数。indexは「連続正解回数(streak)」に対応（0は初回/リセット直後）。
const INTERVALS = [1, 1, 3, 7, 14, 30];

/**
 * 1問の学習状態を、解答結果に応じて更新する。
 * @param {object|undefined} prev 既存の状態（未着手ならundefined）
 * @param {boolean} correct 今回正解したか
 * @param {number} today 経過日数の基準（エポック日: Math.floor(timestamp/86400000)）。テスト容易性のため外部注入
 * @returns {object} { seen, correctStreak, totalCorrect, totalWrong, mastered, dueDay, lastDay }
 */
function reviewCard(prev, correct, today) {
  const s = prev || {
    seen: 0,
    correctStreak: 0,
    totalCorrect: 0,
    totalWrong: 0,
    mastered: false,
    dueDay: today,
    lastDay: null,
  };
  const seen = s.seen + 1;
  let correctStreak, totalCorrect, totalWrong;
  if (correct) {
    correctStreak = s.correctStreak + 1;
    totalCorrect = s.totalCorrect + 1;
    totalWrong = s.totalWrong;
  } else {
    correctStreak = 0; // 誤答で連続正解はリセット（想起に失敗＝忘れかけ）
    totalCorrect = s.totalCorrect;
    totalWrong = s.totalWrong + 1;
  }
  // 間隔は連続正解回数で決める。誤答時はstreak=0→翌日再出題。
  const intervalIdx = Math.min(correctStreak, INTERVALS.length - 1);
  const interval = INTERVALS[intervalIdx];
  const dueDay = today + interval;
  // 2回連続正解で習得扱い。ただし誤答でmasteredは剥がれる（再び忘れうるため）。
  const mastered = correctStreak >= 2;
  return {
    seen,
    correctStreak,
    totalCorrect,
    totalWrong,
    mastered,
    dueDay,
    lastDay: today,
  };
}

/**
 * 復習が必要か（期限が来ているか）。未着手はdueではない（未着手は別枠で扱う）。
 */
function isDue(state, today) {
  if (!state || state.seen === 0) return false;
  if (state.mastered) return state.dueDay <= today; // 習得済みでも期限が来れば復習に回す
  return state.dueDay <= today;
}

/**
 * 「次にやる」問題順を決める。
 * 優先度: (1)復習期限切れ → (2)未着手 → (3)それ以外（既習だが期限前）
 * 各グループ内は subjectOrder（科目の推奨順）→ 期限の早い順 → id順で安定ソート。
 * @param {Array} questions 問題配列（{id, cat, ...}）
 * @param {object} states id→state のマップ
 * @param {number} today エポック日
 * @param {Array<string>} subjectOrder 科目の推奨学習順（先頭ほど優先）
 * @returns {Array} 並べ替えた問題配列
 */
// 問題オブジェクトから状態マップのキーを取り出す。既存テストとの互換のため id を優先し、
// アプリ側の qid にもフォールバックする（両方あれば id）。null/undefinedは0扱いにしない。
function keyOf(q) {
  return q.id != null ? q.id : q.qid;
}

function buildQueue(questions, states, today, subjectOrder) {
  const order = subjectOrder || [];
  const rank = (cat) => {
    const i = order.indexOf(cat);
    return i === -1 ? order.length : i;
  };
  const group = (q) => {
    const st = states[keyOf(q)];
    if (isDue(st, today)) return 0; // 復習期限切れ
    if (!st || st.seen === 0) return 1; // 未着手
    return 2; // 既習・期限前
  };
  const dueDayOf = (q) => {
    const st = states[keyOf(q)];
    return st && st.dueDay != null ? st.dueDay : Infinity;
  };
  return questions.slice().sort((a, b) => {
    const ga = group(a),
      gb = group(b);
    if (ga !== gb) return ga - gb;
    const ra = rank(a.cat),
      rb = rank(b.cat);
    if (ra !== rb) return ra - rb;
    const da = dueDayOf(a),
      db = dueDayOf(b);
    if (da !== db) return da - db;
    return keyOf(a) - keyOf(b);
  });
}

/**
 * 今日やるべき問題数を試験日から逆算する。
 * 未習得の問題を残り日数で割り、最低ラインを保証する。
 * @param {number} remainingCount まだ習得していない問題数
 * @param {number} daysLeft 試験日までの残り日数（1以上）
 * @param {number} minPerDay 1日の最低問題数（デフォルト10）
 * @returns {number} 今日の目標問題数
 */
function dailyGoal(remainingCount, daysLeft, minPerDay) {
  const min = minPerDay == null ? 10 : minPerDay;
  if (remainingCount <= 0) return 0;
  if (daysLeft == null || daysLeft <= 1) return remainingCount; // 前日・当日は全部
  const perDay = Math.ceil(remainingCount / daysLeft);
  return Math.max(perDay, min);
}

/**
 * 科目別の「予想得点」を、本番の問題数に換算して出す。
 * 例: ある科目を10問中7問正解（70%）→ 本番でその科目が20問なら14点相当。
 * @param {Array} questions 全問題
 * @param {object} states id→state
 * @param {object} examWeights cat→本番での問題数
 * @returns {object} { byCat: {cat:{answered,correct,rate,projected}}, totalProjected, totalExam }
 */
function projectedScore(questions, states, examWeights) {
  const byCat = {};
  const catStats = {};
  for (const q of questions) {
    const st = states[keyOf(q)];
    const c = q.cat;
    if (!catStats[c]) catStats[c] = { answered: 0, correct: 0 };
    if (st && st.seen > 0) {
      catStats[c].answered += 1;
      // 直近の正誤は correctStreak>0 で近似せず、通算正答率で見る（安定）
      if (st.totalCorrect > st.totalWrong) catStats[c].correct += 1;
    }
  }
  let totalProjected = 0,
    totalExam = 0;
  for (const cat of Object.keys(examWeights)) {
    const w = examWeights[cat];
    totalExam += w;
    const s = catStats[cat] || { answered: 0, correct: 0 };
    const rate = s.answered > 0 ? s.correct / s.answered : 0;
    const projected = Math.round(rate * w);
    totalProjected += projected;
    byCat[cat] = {
      answered: s.answered,
      correct: s.correct,
      rate,
      projected,
      weight: w,
    };
  }
  return { byCat, totalProjected, totalExam };
}

/**
 * エポック日（timestamp→日単位の整数）。UTCベースで安定。
 */
function epochDay(ts) {
  return Math.floor(ts / 86400000);
}

const SRS = {
  INTERVALS,
  reviewCard,
  isDue,
  buildQueue,
  dailyGoal,
  projectedScore,
  epochDay,
};

if (typeof module !== "undefined" && module.exports) {
  module.exports = SRS;
}
if (typeof window !== "undefined") {
  window.SRS = SRS;
}

</script>

に上昇する現象である。","材料分離抵抗性とは、コンクリート中の材料が分離することに対する抵抗性である。","ワーカビリティーとは、運搬から仕上げまでの一連の作業のしやすさである。","レイタンスとは、コンクリート表面に水とともに浮かび上がって沈殿する物質である。"],"ans":0,"ex":"","src":"20230605_2kyu","qid":6,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71524"},{"cat":"土木一般","year":"R5前期 No.8","q":"鉄筋の加工及び組立に関する次の記述のうち、適当でないものはどれか。","opts":["鉄筋は、常温で加工することを原則とする。","曲げ加工した鉄筋の曲げ戻しは行わないことを原則とする。","鉄筋どうしの交点の要所は、スペーサで緊結する。","組立後に鉄筋を長期間大気にさらす場合は、鉄筋表面に防錆処理を施す。"],"ans":2,"ex":"","src":"20230605_2kyu","qid":7,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71525"},{"cat":"土木一般","year":"R5前期 No.9","q":"打撃工法による既製杭の施工に関する次の記述のうち、適当でないものはどれか。","opts":["群杭の場合、杭群の周辺から中央部へと打ち進むのがよい。","中掘り杭工法に比べて、施工時の騒音や振動が大きい。","ドロップハンマや油圧ハンマ等を用いて地盤に貫入させる。","打込みに際しては、試し打ちを行い、杭心位置や角度を確認した後に本打ちに移るのがよい。"],"ans":0,"ex":"","src":"20230605_2kyu","qid":8,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71526"},{"cat":"土木一般","year":"R5前期 No.10","q":"場所打ち杭の「工法名」と「主な資機材」に関する次の組合せのうち、適当でないものはどれか。","opts":["リバースサーキュレーション工法 － ベントナイト水、ケーシング","アースドリル工法 － ケーシング、ドリリングバケット","深礎工法 － 削岩機、土留材","オールケーシング工法 － ケーシングチューブ、ハンマーグラブ"],"ans":0,"ex":"","src":"20230605_2kyu","qid":9,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71527"},{"cat":"土木一般","year":"R5前期 No.11","q":"土留めの施工に関する次の記述のうち、適当でないものはどれか。","opts":["自立式土留め工法は、支保工を必要としない工法である。","切梁り式土留め工法には、中間杭や火打ち梁を用いるものがある。","ヒービングとは、砂質地盤で地下水位以下を掘削した時に、砂が吹き上がる現象である。","パイピングとは、砂質土の弱いところを通ってボイリングがパイプ状に生じる現象である。"],"ans":2,"ex":"","src":"20230605_2kyu","qid":10,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71528"},{"cat":"専門土木","year":"R5前期 No.13","q":"鋼材の溶接接合に関する次の記述のうち、適当なものはどれか。","opts":["開先溶接の始端と終端は、溶接欠陥が生じやすいので、スカラップという部材を設ける。","溶接の施工にあたっては、溶接線近傍を湿潤状態にする。","すみ肉溶接においては、原則として裏はつりを行う。","エンドタブは、溶接終了後、ガス切断法により除去してその跡をグラインダ仕上げする。"],"ans":3,"ex":"","src":"20230605_2kyu","qid":11,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71530"},{"cat":"土木一般","year":"R5前期 No.14","q":"コンクリート構造物の耐久性を向上させる対策に関する次の記述のうち、適当なものはどれか。","opts":["塩害対策として、水セメント比をできるだけ大きくする。","塩害対策として、膨張材を用いる。","凍害対策として、吸水率の大きい骨材を使用する。","凍害対策として、AE減水剤を用いる。"],"ans":3,"ex":"","src":"20230605_2kyu","qid":12,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71531"},{"cat":"専門土木","year":"R5前期 No.15","q":"河川堤防の施工に関する次の記述のうち、適当でないものはどれか。","opts":["堤防の腹付け工事では、旧堤防との接合を高めるため階段状に段切りを行う。","引堤工事を行った場合の旧堤防は、新堤防の完成後、ただちに撤去する。","堤防の腹付け工事では、旧堤防の裏法面に腹付けを行うのが一般的である。","盛土の施工中は、堤体への雨水の滞水や浸透が生じないよう堤体横断方向に勾配を設ける。"],"ans":1,"ex":"","src":"20230605_2kyu","qid":13,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71532"},{"cat":"専門土木","year":"R5前期 No.16","q":"河川護岸の施工に関する次の記述のうち、適当なものはどれか。","opts":["根固工は、水衝部等で河床洗掘を防ぎ、基礎工等を保護するために施工する。","高水護岸は、単断面の河川において高水時に表法面を保護するために施工する。","護岸基礎工の天端の高さは、洗掘に対する保護のため計画河床高より高く施工する。","法覆工は、堤防の法勾配が緩く流速が小さな場所では、間知ブロックで施工する。"],"ans":0,"ex":"","src":"20230605_2kyu","qid":14,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71533"},{"cat":"専門土木","year":"R5前期 No.17","q":"砂防えん堤に関する次の記述のうち、適当でないものはどれか。","opts":["袖は、洪水を越流させないようにし、土石等の流下による衝撃に対して強固な構造とする。","堤体基礎の根入れは、基礎地盤が岩盤の場合は0.5m以上行うのが通常である。","前庭保護工は、本えん堤を越流した落下水による前庭部の洗掘を防止するための構造物である。","本えん堤の堤体下流の法勾配は、一般に1：0.2程度としている。"],"ans":1,"ex":"","src":"20230605_2kyu","qid":15,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71534"},{"cat":"専門土木","year":"R5前期 No.18","q":"地すべり防止工に関する次の記述のうち、適当なものはどれか。","opts":["杭工は、原則として地すべり運動ブロックの頭部斜面に杭をそう入し、斜面の安定を高める工法である。","集水井工は、井筒を設けて集水ボーリング等で地下水を集水し、原則としてポンプにより排水を行う工法である。","横ボーリング工は、地下水調査等の結果をもとに、帯水層に向けてボーリングを行い、地下水を排除する工法である。","排土工は、土塊の滑動力を減少させることを目的に、地すべり脚部の不安定な土塊を排除する工法である。"],"ans":2,"ex":"","src":"20230605_2kyu","qid":16,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71535"},{"cat":"専門土木","year":"R5前期 No.19","q":"道路のアスファルト舗装における上層路盤の施工に関する次の記述のうち、適当でないものはどれか。","opts":["粒度調整路盤は、1層の仕上り厚が15cm以下を標準とする。","加熱アスファルト安定処理路盤材料の敷均しは、一般にモータグレーダで行う。","セメント安定処理路盤は、1層の仕上り厚が10〜20cmを標準とする。","石灰安定処理路盤材料の締固めは、最適含水比よりやや湿潤状態で行う。"],"ans":1,"ex":"","src":"20230605_2kyu","qid":17,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71536"},{"cat":"専門土木","year":"R5前期 No.20","q":"道路のアスファルト舗装におけるアスファルト混合物の施工に関する次の記述のうち、適当でないものはどれか。","opts":["気温が5℃以下の施工では、所定の締固め度が得られることを確認したうえで施工する。","敷均し時の混合物の温度は、一般に110℃を下回らないようにする。","初転圧温度は、一般に90〜100℃である。","転圧終了後の交通開放は、舗装表面温度が一般に50℃以下になってから行う。"],"ans":2,"ex":"","src":"20230605_2kyu","qid":18,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71537"},{"cat":"専門土木","year":"R5前期 No.21","q":"道路のアスファルト舗装における破損に関する次の記述のうち、適当でないものはどれか。","opts":["沈下わだち掘れは、路床・路盤の沈下により発生する。","線状ひび割れは、縦・横に長く生じるひび割れで、舗装の継目に発生する。","亀甲状ひび割れは、路床・路盤の支持力低下により発生する。","流動わだち掘れは、道路の延長方向の凹凸で、比較的長い波長で発生する。"],"ans":3,"ex":"","src":"20230605_2kyu","qid":19,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71538"},{"cat":"専門土木","year":"R5前期 No.22","q":"道路のコンクリート舗装に関する次の記述のうち、適当でないものはどれか。","opts":["普通コンクリート舗装は、温度変化によって膨張・収縮するので目地が必要である。","コンクリート舗装は、主としてコンクリートの引張抵抗で交通荷重を支える。","普通コンクリート舗装は、養生期間が長く部分的な補修が困難である。","コンクリート舗装は、アスファルト舗装に比べて耐久性に富む。"],"ans":1,"ex":"","src":"20230605_2kyu","qid":20,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71539"},{"cat":"専門土木","year":"R5前期 No.23","q":"ダムの施工に関する次の記述のうち、適当でないものはどれか。","opts":["転流工は、ダム本体工事を確実にまた容易に施工するため、工事期間中の河川の流れを迂回させるものである。","ダム本体の基礎の掘削は、大量掘削に対応できる爆破掘削によるブレーカ工法が一般的に用いられる。","重力式コンクリートダムの基礎処理は、コンソリデーショングラウチングとカーテングラウチングの施工が一般的である。","RCD工法は、一般にコンクリートをダンプトラックで運搬し、ブルドーザで敷き均し、振動ローラ等で締め固める。"],"ans":1,"ex":"","src":"20230605_2kyu","qid":21,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71540"},{"cat":"専門土木","year":"R5前期 No.24","q":"トンネルの山岳工法における支保工に関する次の記述のうち、適当でないものはどれか。","opts":["ロックボルトは、緩んだ岩盤を緩んでいない地山に固定し落下を防止する等の効果がある。","吹付けコンクリートは、地山の凹凸をなくすように吹き付ける。","支保工は、岩石や土砂の崩壊を防止し、作業の安全を確保するために設ける。","鋼アーチ式支保工は、一次吹付けコンクリート施工前に建て込む。"],"ans":3,"ex":"","src":"20230605_2kyu","qid":22,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71541"},{"cat":"専門土木","year":"R5前期 No.25","q":"海岸堤防の異形コンクリートブロックによる消波工に関する次の記述のうち、適当でないものはどれか。","opts":["異形コンクリートブロックは、ブロックとブロックの間を波が通過することにより、波のエネルギーを減少させる。","異形コンクリートブロックは、海岸堤防の消波工のほかに、海岸の侵食対策としても多く用いられる。","層積みは、規則正しく配列する積み方で整然と並び、外観が美しく、安定性が良く、捨石均し面に凹凸があっても支障なく据え付けられる。","乱積みは、荒天時の高波を受けるたびに沈下し、徐々にブロックどうしのかみ合わせが良くなり安定してくる。"],"ans":2,"ex":"","src":"20230605_2kyu","qid":23,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71542"},{"cat":"専門土木","year":"R5前期 No.26","q":"グラブ浚渫の施工に関する次の記述のうち、適当なものはどれか。","opts":["グラブ浚渫船は、岸壁等の構造物前面の浚渫や狭い場所での浚渫には使用できない。","非航式グラブ浚渫船の標準的な船団は、グラブ浚渫船と土運船の2隻で構成される。","余掘りは、計画した浚渫の範囲を一定した水深に仕上げるために必要である。","浚渫後の出来形確認測量には、音響測深機は使用できない。"],"ans":2,"ex":"","src":"20230605_2kyu","qid":24,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71543"},{"cat":"専門土木","year":"R5前期 No.27","q":"鉄道工事における道床及び路盤の施工上の留意事項に関する次の記述のうち、適当でないものはどれか。","opts":["バラスト道床は、安価で施工・保守が容易であるが定期的な軌道の修正・修復が必要である。","バラスト道床は、耐摩耗性に優れ、単位容積質量やせん断抵抗角が小さい砕石を選定する。","路盤は、軌道を支持するもので、十分強固で適当な弾性を有し、排水を考慮する必要がある。","路盤は、使用材料により、粒度調整砕石を用いた強化路盤、良質土を用いた土路盤等がある。"],"ans":1,"ex":"","src":"20230605_2kyu","qid":25,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71544"},{"cat":"専門土木","year":"R5前期 No.28","q":"鉄道（在来線）の営業線内工事における工事保安体制に関する次の記述のうち、適当でないものはどれか。","opts":["列車見張員は、工事現場ごとに専任の者を配置しなければならない。","工事管理者は、工事現場ごとに専任の者を常時配置しなければならない。","軌道作業責任者は、工事現場ごとに専任の者を配置しなければならない。","軌道工事管理者は、工事現場ごとに専任の者を常時配置しなければならない。"],"ans":2,"ex":"","src":"20230605_2kyu","qid":26,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71545"},{"cat":"専門土木","year":"R5前期 No.29","q":"シールド工法に関する次の記述のうち、適当でないものはどれか。","opts":["シールド工法は、開削工法が困難な都市の下水道工事や地下鉄工事等で用いられる。","シールド掘進後は、セグメント外周にモルタル等を注入し、地盤の緩みと沈下を防止する。","シールドのフード部は、トンネルを掘削する切削機械を備えている。","密閉型シールドは、ガーダー部とテール部が隔壁で仕切られている。"],"ans":3,"ex":"","src":"20230605_2kyu","qid":27,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71546"},{"cat":"専門土木","year":"R5前期 No.30","q":"上水道の管布設工に関する次の記述のうち、適当なものはどれか。","opts":["鋼管の運搬にあたっては、管端の非塗装部分に当て材を介して支持する。","管の布設にあたっては、原則として高所から低所に向けて行う。","ダクタイル鋳鉄管は、表示記号の管径、年号の記号を下に向けて据え付ける。","鋳鉄管の切断は、直管及び異形管ともに切断機で行うことを標準とする。"],"ans":0,"ex":"","src":"20230605_2kyu","qid":28,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71547"},{"cat":"法規","year":"R5前期 No.32","q":"賃金に関する次の記述のうち、労働基準法上、誤っているものはどれか。","opts":["賃金とは、労働の対償として使用者が労働者に支払うすべてのものをいう。","未成年者の親権者又は後見人は、未成年者の賃金を代って受け取ることができる。","賃金の最低基準に関しては、最低賃金法の定めるところによる。","賃金は、原則として、通貨で、直接労働者に、その全額を支払わなければならない。"],"ans":1,"ex":"","src":"20230605_2kyu","qid":29,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71549"},{"cat":"法規","year":"R5前期 No.33","q":"災害補償に関する次の記述のうち、労働基準法上、誤っているものはどれか。","opts":["労働者が業務上疾病にかかった場合においては、使用者は、必要な療養費用の一部を補助しなければならない。","労働者が業務上負傷し、又は疾病にかかった場合の補償を受ける権利は、差し押さえてはならない。","労働者が業務上負傷し治った場合に、その身体に障害が存するときは、使用者は、その障害の程度に応じて障害補償を行わなければならない。","労働者が業務上死亡した場合においては、使用者は、遺族に対して、遺族補償を行わなければならない。"],"ans":0,"ex":"","src":"20230605_2kyu","qid":30,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71550"},{"cat":"法規","year":"R5前期 No.34","q":"労働安全衛生法上、事業者が、技能講習を修了した作業主任者を選任しなければならない作業として、該当しないものは次のうちどれか。","opts":["高さが3mのコンクリート橋梁上部構造の架設の作業","型枠支保工の組立て又は解体の作業","掘削面の高さが2m以上となる地山の掘削の作業","土止め支保工の切りばり又は腹起こしの取付け又は取り外しの作業"],"ans":0,"ex":"","src":"20230605_2kyu","qid":31,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71551"},{"cat":"法規","year":"R5前期 No.35","q":"建設業法に関する次の記述のうち、誤っているものはどれか。","opts":["建設業者は、建設工事の担い手の育成及び確保、その他の施工技術の確保に努めなければならない。","建設業者は、請負契約を締結する場合、工事の種別ごとの材料費、労務費等の内訳により見積りを行うようにする。","建設業とは、元請、下請その他いかなる名義をもってするのかを問わず、建設工事の完成を請け負う営業をいう。","建設業者は、請負った工事を施工するときは、建設工事の経理上の管理をつかさどる主任技術者を置かなければならない。"],"ans":3,"ex":"","src":"20230605_2kyu","qid":32,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71552"},{"cat":"法規","year":"R5前期 No.36","q":"道路に工作物、物件又は施設を設け、継続して道路を使用しようとする場合において、道路管理者の許可を受けるために提出する申請書に記載すべき事項に該当するものは、次のうちどれか。","opts":["施工体系図","建設業の許可番号","主任技術者名","工事実施の方法"],"ans":3,"ex":"","src":"20230605_2kyu","qid":33,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71553"},{"cat":"法規","year":"R5前期 No.37","q":"河川法に関する次の記述のうち、誤っているものはどれか。","opts":["都道府県知事が管理する河川は、原則として、二級河川に加えて準用河川が含まれる。","河川区域は、堤防に挟まれた区域と、河川管理施設の敷地である土地の区域が含まれる。","河川法上の河川には、ダム、堰、水門、床止め、堤防、護岸等の河川管理施設が含まれる。","河川法の目的には、洪水防御と水利用に加えて河川環境の整備と保全が含まれる。"],"ans":0,"ex":"","src":"20230605_2kyu","qid":34,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71554"},{"cat":"法規","year":"R5前期 No.38","q":"建築基準法上、建築設備に該当しないものは、次のうちどれか。","opts":["煙突","排水設備","階段","冷暖房設備"],"ans":2,"ex":"","src":"20230605_2kyu","qid":35,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71555"},{"cat":"法規","year":"R5前期 No.39","q":"火薬類の取扱いに関する次の記述のうち、火薬類取締法上、誤っているものはどれか。","opts":["火薬類を取り扱う者は、所有又は、占有する火薬類、譲渡許可証、譲受許可証又は運搬証明書を紛失又は盗取されたときは、遅滞なくその旨を都道府県知事に届け出なければならない。","火薬庫を設置し移転又は設備を変更しようとする者は、原則として都道府県知事の許可を受けなければならない。","火薬類を譲り渡し、又は譲り受けようとする者は、原則として都道府県知事の許可を受けなければならない。","火薬類を廃棄しようとする者は、経済産業省令で定めるところにより、原則として、都道府県知事の許可を受けなければならない。"],"ans":0,"ex":"","src":"20230605_2kyu","qid":36,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71556"},{"cat":"法規","year":"R5前期 No.40","q":"騒音規制法上、住民の生活環境を保全する必要があると認める地域の指定を行う者として、正しいものは次のうちどれか。","opts":["環境大臣","国土交通大臣","町村長","都道府県知事又は市長"],"ans":3,"ex":"","src":"20230605_2kyu","qid":37,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71557"},{"cat":"法規","year":"R5前期 No.41","q":"振動規制法上、指定地域内において特定建設作業を施工しようとする者が、届け出なければならない事項として、該当しないものは次のうちどれか。","opts":["特定建設作業の現場付近の見取り図","特定建設作業の実施期間","特定建設作業の振動防止対策の方法","特定建設作業の現場の施工体制表"],"ans":3,"ex":"","src":"20230605_2kyu","qid":38,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71558"},{"cat":"法規","year":"R5前期 No.42","q":"港則法上、許可申請に関する次の記述のうち、誤っているものはどれか。","opts":["船舶は、特定港内又は特定港の境界附近において危険物を運搬しようとするときは、港長の許可を受けなければならない。","船舶は、特定港において危険物の積込、積替又は荷卸をするには、その旨を港長に届け出なければならない。","特定港内において、汽艇等以外の船舶を修繕しようとする者は、その旨を港長に届け出なければならない。","特定港内又は特定港の境界附近で工事又は作業をしようとする者は、港長の許可を受けなければならない。"],"ans":1,"ex":"","src":"20230605_2kyu","qid":39,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71559"},{"cat":"施工管理法","year":"R5前期 No.43","q":"閉合トラバース測量による下表の観測結果において、測線ABの方位角が182°50′39″のとき、測線BCの方位角として、適当なものは次のうちどれか。[測点/観測角] A:115°54′38″、B:100°6′34″、C:112°33′39″、D:108°45′25″、E:102°39′44″","opts":["102°51′5″","102°53′7″","102°55′10″","102°57′13″"],"ans":3,"ex":"","src":"20230605_2kyu","qid":40,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71560"},{"cat":"施工管理法","year":"R5前期 No.44","q":"公共工事標準請負契約約款に関する次の記述のうち、誤っているものはどれか。","opts":["設計図書とは、図面、仕様書、契約書、現場説明書及び現場説明に対する質問回答書をいう。","現場代理人とは、契約を取り交わした会社の代理として、任務を代行する責任者をいう。","現場代理人、監理技術者等及び専門技術者は、これを兼ねることができる。","発注者は、工事完成検査において、工事目的物を最小限度破壊して検査することができる。"],"ans":0,"ex":"","src":"20230605_2kyu","qid":41,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71561"},{"cat":"施工管理法","year":"R5前期 No.46","q":"建設工事における建設機械の[機械名]と[性能表示]に関する次の組合せのうち、適当なものはどれか。","opts":["バックホゥ － バケット質量（kg）","ダンプトラック － 車両重量（t）","クレーン － ブーム長（m）","ブルドーザ － 質量（t）"],"ans":3,"ex":"","src":"20230605_2kyu","qid":42,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71563"},{"cat":"施工管理法","year":"R5前期 No.47","q":"施工計画作成のための事前調査に関する次の記述のうち、適当でないものはどれか。","opts":["近隣環境の把握のため、現場周辺の状況、近隣施設、交通量等の調査を行う。","工事内容の把握のため、現場事務所用地、設計図書及び仕様書の内容等の調査を行う。","現場の自然条件の把握のため、地質、地下水、湧水等の調査を行う。","労務、資機材の把握のため、労務の供給、資機材の調達先等の調査を行う。"],"ans":1,"ex":"","src":"20230605_2kyu","qid":43,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71564"},{"cat":"法規","year":"R5前期 No.48","q":"労働者の危険を防止するための措置に関する次の記述のうち、労働安全衛生法上、誤っているものはどれか。","opts":["橋梁支間20m以上の鋼橋の架設作業を行うときは、物体の飛来又は落下による危険を防止するため、保護帽を着用する。","明り掘削の作業を行うときは、物体の飛来又は落下による危険を防止するため、保護帽を着用する。","高さ2m以上の箇所で墜落の危険がある作業で作業床を設けることが困難なときは、防網を張り、要求性能墜落制止用器具を使用する。","つり足場、張出し足場の組立て、解体等の作業では、原則として要求性能墜落制止用器具を安全に取り付けるための設備等を設け、かつ、要求性能墜落制止用器具を使用する。"],"ans":0,"ex":"","src":"20230605_2kyu","qid":44,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71565"},{"cat":"法規","year":"R5前期 No.49","q":"高さ5m以上のコンクリート造の工作物の解体作業にともなう危険を防止するために事業者が行うべき事項に関する次の記述のうち、労働安全衛生法上、誤っているものはどれか。","opts":["強風、大雨、大雪等の悪天候のため、作業の実施について危険が予想されるときは、当該作業を中止しなければならない。","外壁、柱等の引倒し等の作業を行うときは、引倒し等について一定の合図を定め、関係労働者に周知させなければならない。","器具、工具等を上げ、又は下ろすときは、つり綱、つり袋等を労働者に使用させなければならない。","作業を行う区域内には、関係労働者以外の労働者の立入り許可区域を明示しなければならない。"],"ans":3,"ex":"","src":"20230605_2kyu","qid":45,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71566"},{"cat":"施工管理法","year":"R5前期 No.50","q":"建設工事の品質管理における[工種・品質特性]とその[試験方法]との組合せとして、適当でないものは次のうちどれか。","opts":["土工・盛土の締固め度 － RI計器による乾燥密度測定","アスファルト舗装工・安定度 － 平坦性試験","コンクリート工・コンクリート用骨材の粒度 － ふるい分け試験","土工・最適含水比 － 突固めによる土の締固め試験"],"ans":1,"ex":"","src":"20230605_2kyu","qid":46,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71567"},{"cat":"施工管理法","year":"R5前期 No.51","q":"レディーミクストコンクリート（JIS A 5308）の品質管理に関する次の記述のうち、適当でないものはどれか。","opts":["スランプ12cmのコンクリートの試験結果で許容されるスランプの上限値は、14.5cmである。","空気量5.0％のコンクリートの試験結果で許容される空気量の下限値は、3.5％である。","品質管理項目は、質量、スランプ、空気量、塩化物含有量である。","レディーミクストコンクリートの品質検査は、荷卸し地点で行う。"],"ans":2,"ex":"","src":"20230605_2kyu","qid":47,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71568"},{"cat":"施工管理法","year":"R5前期 No.52","q":"建設工事における環境保全対策に関する次の記述のうち、適当なものはどれか。","opts":["騒音や振動の防止対策では、騒音や振動の絶対値を下げること及び発生期間の延伸を検討する。","造成工事等の土工事にともなう土ぼこりの防止対策には、アスファルトによる被覆養生が一般的である。","騒音の防止方法には、発生源での対策、伝搬経路での対策、受音点での対策があるが、建設工事では受音点での対策が広く行われる。","運搬車両の騒音や振動の防止のためには、道路及び付近の状況によって、必要に応じ走行速度に制限を加える。"],"ans":3,"ex":"","src":"20230605_2kyu","qid":48,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71569"},{"cat":"法規","year":"R5前期 No.53","q":"建設工事に係る資材の再資源化等に関する法律（建設リサイクル法）に定められている特定建設資材に該当するものは、次のうちどれか。","opts":["建設発生土","廃プラスチック","コンクリート","ガラス類"],"ans":2,"ex":"","src":"20230605_2kyu","qid":49,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71570"},{"cat":"法規","year":"R5前期 No.54","q":"公共工事における施工体制台帳及び施工体系図に関する下記の①〜④の4つの記述のうち、建設業法上、正しいものの数は次のうちどれか。 ①公共工事を受注した建設業者が、下請契約を締結するときは、その金額にかかわらず、施工体制台帳を作成し、その写しを下請負人に提出するものとする。 ②施工体系図は、当該建設工事の目的物の引渡しをした時から20年間は保存しなければならない。 ③作成された施工体系図は、工事関係者及び公衆が見やすい場所に掲げなければならない。 ④下請負人は、請け負った工事を再下請に出すときは、発注者に施工体制台帳に記載する再下請負人の名称等を通知しなければならない。","opts":["1つ","2つ","3つ","4つ"],"ans":0,"ex":"","src":"20230605_2kyu","qid":50,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71571"},{"cat":"法規","year":"R5前期 No.58","q":"型枠支保工に関する下記の①〜④の4つの記述のうち、適当なものの数は次のうちどれか。 ①型枠支保工を組み立てるときは、組立図を作成し、かつ、この組立図により組み立てなければならない。 ②型枠支保工に使用する材料は、著しい損傷、変形又は腐食があるものは、補修して使用しなければならない。 ③型枠支保工は、型枠の形状、コンクリートの打設の方法等に応じた堅固な構造のものでなければならない。 ④型枠支保工作業は、型枠支保工の組立等作業主任者が、作業を直接指揮しなければならない。","opts":["1つ","2つ","3つ","4つ"],"ans":2,"ex":"","src":"20230605_2kyu","qid":51,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71575"},{"cat":"法規","year":"R5前期 No.59","q":"車両系建設機械を用いた作業において、事業者が行うべき事項に関する下記の①〜④の4つの記述のうち、労働安全衛生法上、正しいものの数は次のうちどれか。 ①岩石の落下等により労働者に危険が生ずるおそれのある場所で作業を行う場合は、堅固なヘッドガードを装備した機械を使用させなければならない。 ②転倒や転落により運転者に危険が生ずるおそれのある場所では、転倒時保護構造を有し、かつ、シートベルトを備えたもの以外の車両系建設機械を使用しないように努めなければならない。 ③機械の修理やアタッチメントの装着や取り外しを行う場合は、作業指揮者を定め、作業手順を決めさせるとともに、作業の指揮等を行わせなければならない。 ④ブームやアームを上げ、その下で修理等の作業を行う場合は、不意に降下することによる危険を防止するため、作業指揮者に安全支柱や安全ブロック等を使用させなければならない。","opts":["1つ","2つ","3つ","4つ"],"ans":2,"ex":"","src":"20230605_2kyu","qid":52,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71576"},{"cat":"施工管理法","year":"R5前期 No.60","q":"x-R管理図に関する下記の①〜④の4つの記述のうち、適当なものの数は次のうちどれか。 ①x-R管理図は、統計的事実に基づき、ばらつきの範囲の目安となる限界の線を決めてつくった図表である。 ②x-R管理図上に記入したデータが管理限界線の外に出た場合は、その工程に異常があることが疑われる。 ③x-R管理図は、通常連続した棒グラフで示される。 ④建設工事では、x-R管理図を用いて、連続量として測定される計数値を扱うことが多い。","opts":["1つ","2つ","3つ","4つ"],"ans":1,"ex":"","src":"20230605_2kyu","qid":53,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/71577"},{"cat":"土木一般","year":"R6前期 No.6","q":"土の締固めに使用する機械に関する次の記述のうち、適当でないものはどれか。","opts":["タイヤローラは、タイヤの接地圧を変化させることができる。","振動ローラは、自重以上の転圧力を得ることができる。","タンピングローラは、狭い場所の締固めに用いられる。","タンデムローラは、主に仕上げ転圧に用いられる。"],"ans":2,"ex":"","src":"20240603_2kyu","qid":54,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77618"},{"cat":"土木一般","year":"R6前期 No.8","q":"盛土の施工に関する次の記述のうち、適当でないものはどれか。","opts":["盛土は不安定な要素をもつ土構造物であるが、丁寧な施工を行うことにより均質で安定性の優れた構造物として構築することもできる。","盛土の基礎地盤の表土が腐植土等で盛土の施工に悪影響を及ぼすことが懸念される場合には、あらかじめ必要な深さまではぎ取り、良質な材料で置き換える必要がある。","盛土材料の自然含水比が施工含水比の範囲内のときには、敷均し時に含水量調節を行う必要がある。","敷均し厚さは、盛土の目的、盛土材料、締固め機械と施工方法及び要求される締固め度等の条件によって左右される。"],"ans":2,"ex":"","src":"20240603_2kyu","qid":55,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77620"},{"cat":"土木一般","year":"R6前期 No.9","q":"地盤改良に用いられる固結工法に関する次の記述のうち、適当でないものはどれか。","opts":["薬液注入工法は、注入材による地下水汚染防止のために水質監視が必要である。","薬液注入工法は、地盤の透水性を減少させるために薬液を注入する方式である。","深層混合処理工法には、安定材と軟弱土を地中で混合する機械攪拌方式がある。","深層混合処理工法は、沈下量が大きく、大きな強度が短期間で得られる。"],"ans":3,"ex":"","src":"20240603_2kyu","qid":56,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77621"},{"cat":"土木一般","year":"R6前期 No.10","q":"コンクリートに使用するセメントに関する次の記述のうち、適当でないものはどれか。","opts":["セメントは、比表面積が大きいほど水和反応が緩やかに進む。","セメントの強さは、コンクリートの強度に関係する。","早強ポルトランドセメントは、プレストレストコンクリート工事に適している。","低熱ポルトランドセメントは、マスコンクリートの工事に適している。"],"ans":0,"ex":"","src":"20240603_2kyu","qid":57,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77622"},{"cat":"土木一般","year":"R6前期 No.12","q":"各種のコンクリートに関する次の記述のうち、適当でないものはどれか。","opts":["暑中コンクリートとしての施工は、日平均気温が25℃を超えると想定されるときに行うものとする。","膨張コンクリートは、膨張の効果によって、体積変化によるひび割れの発生や拡大を防ぐものである。","流動化コンクリートは、あらかじめ練り混ぜられたフレッシュコンクリートに減水剤を添加し、流動性を増大させたものである。","マスコンクリートでは、セメントの水和熱による温度応力に伴うひび割れに対する注意が必要である。"],"ans":2,"ex":"","src":"20240603_2kyu","qid":58,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77624"},{"cat":"土木一般","year":"R6前期 No.13","q":"コンクリートの打込みに関する次の記述のうち、適当でないものはどれか。","opts":["打ち込んだコンクリートは、型枠内で横移動させてはならない。","計画した打継目以外では、コンクリートの打込みが完了するまで連続して打ち込まなければならない。","コンクリート打込み前には、降雨や強風等への対応策を準備しておかなければならない。","コンクリートと接した型枠が吸水すると水セメント比が大きくなるので、型枠を湿らせてはならない。"],"ans":3,"ex":"","src":"20240603_2kyu","qid":59,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77625"},{"cat":"土木一般","year":"R6前期 No.14","q":"既製杭の中掘り杭工法に関する次の記述のうち、適当でないものはどれか。","opts":["先端処理方法には、最終打撃方式とセメントミルク噴出攪拌方式等がある。","打込み工法と比べた場合、一般に施工中の騒音及び振動は小さい。","掘削中は、先端地盤の緩みが最大限になるように先掘りを行う。","地盤の掘削は、一般に既製杭の中をアースオーガで掘削する。"],"ans":2,"ex":"","src":"20240603_2kyu","qid":60,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77626"},{"cat":"土木一般","year":"R6前期 No.15","q":"場所打ち杭の各種工法に関する次の記述のうち、適当なものはどれか。","opts":["リバース工法は、ライナープレート等で土留めを行い、人力又は機械で掘削する。","深礎工法は、掘削孔全長にわたってケーシングチューブを用いて掘削する。","オールケーシング工法は、スタンドパイプ以深の地下水位を高く保ち孔壁を保護する。","アースドリル工法は、表層部のケーシングと安定液により孔壁を保護する。"],"ans":3,"ex":"","src":"20240603_2kyu","qid":61,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77627"},{"cat":"専門土木","year":"R6前期 No.17","q":"鋼材に関する次の記述のうち、適当でないものはどれか。","opts":["鋼材は、応力度が弾性限界に達するまでは塑性を示すが、それを超えると弾性を示す。","鋼材は、炭素の含有量が少ないものほど延性や展性は向上するが、硬さや強さは低下する。","鋼材は、応力度が上降伏点に達すると、応力度は増えないのにひずみが急激に増加し始める。","鋼材は、強さや伸びに優れ、加工性もよく、土木構造物に欠くことのできない材料である。"],"ans":0,"ex":"","src":"20240603_2kyu","qid":62,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77629"},{"cat":"専門土木","year":"R6前期 No.18","q":"鋼道路橋に用いる高力ボルトに関する次の記述のうち、適当なものはどれか。","opts":["高力ボルトの軸力の導入は、ボルトの頭部を回して行うことを原則とする。","トルシア形高力ボルトの締付けは、本締めにインパクトレンチを使用する。","高力ボルトの摩擦接合は、ボルトの締付けで生じる部材相互の摩擦力で応力を伝達する。","トルク法による高力ボルトの締付け検査は、トルク係数値が安定する数日後に行う。"],"ans":2,"ex":"","src":"20240603_2kyu","qid":63,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77630"},{"cat":"専門土木","year":"R6前期 No.19","q":"コンクリートの劣化機構に関する次の記述のうち、適当でないものはどれか。","opts":["中性化は、コンクリートのアルカリ性が空気中の炭酸ガスの侵入等により失われていく現象である。","塩害は、コンクリート中の鋼材の腐食が塩化物イオンにより促進され、コンクリートのひび割れや剥離等を引き起こす現象である。","疲労は、荷重が繰返し作用することで、コンクリート中に微細なひび割れが発生し、やがて大きな損傷になる現象である。","化学的侵食は、骨材中のシリカ分がセメント中のアルカリ分と化学反応を生じ、コンクリートのひび割れや崩壊を引き起こす現象である。"],"ans":3,"ex":"","src":"20240603_2kyu","qid":64,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77631"},{"cat":"専門土木","year":"R6前期 No.21","q":"河川護岸に関する次の記述のうち、適当でないものはどれか。","opts":["横帯工は、流水方向の一定区間ごとに設け、護岸の破壊が他に波及しないようにするものである。","縦帯工は、護岸の法尻部に設けられるもので、護岸の法尻部の破損を防ぐものである。","小口止め工は、法覆工の上下流端に施工して護岸を保護するものである。","根固工は、河床洗掘を防ぎ、基礎工や法覆工を保護するものである。"],"ans":1,"ex":"","src":"20240603_2kyu","qid":65,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77633"},{"cat":"専門土木","year":"R6前期 No.22","q":"砂防堰堤に関する次の記述のうち、適当でないものはどれか。","opts":["水通しは、本堰堤を越流する流量に対して十分な大きさとし、その断面は原則として矩形とする。","水叩きは、本堰堤を越流した落下水の衝撃を緩和し、洗掘を防止するために設けられる。","本堰堤の袖は、洪水を越流させないために設けられ、両岸に向かって上り勾配とする。","水抜きは、本堰堤施工中の流水の切替えや堆砂後の浸透水を抜いて、本堰堤にかかる水圧を軽減するために設けられる。"],"ans":0,"ex":"","src":"20240603_2kyu","qid":66,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77634"},{"cat":"専門土木","year":"R6前期 No.23","q":"地すべり防止工に関する次の記述のうち、適当でないものはどれか。","opts":["杭工は、鋼管等の杭を地すべり斜面に挿入して、斜面の安定を高める工法である。","水路工は、地表面の水を水路に集め、速やかに地すべり地内に浸透させる工法である。","集水井工は、井筒（ケーソン）を設置し、集水管により地下水を集水し排除する工法である。","横ボーリング工は、帯水層に向けてボーリングを行い、地下水を排除する工法である。"],"ans":1,"ex":"","src":"20240603_2kyu","qid":67,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77635"},{"cat":"専門土木","year":"R6前期 No.24","q":"道路のアスファルト舗装の路床に関する次の記述のうち、適当でないものはどれか。","opts":["置換え工法は、軟弱な現状路床土の一部又は全部を良質土で置き換える工法である。","構築路床における安定処理は、原則として中央プラントで行う。","構築路床は、交通荷重を支持する層として適切な支持力と変形抵抗性が求められる。","路床の最終工程では、トラック等を低速走行させ、プルーフローリング試験を実施する。"],"ans":1,"ex":"","src":"20240603_2kyu","qid":68,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77636"},{"cat":"専門土木","year":"R6前期 No.25","q":"道路のアスファルト舗装の施工に関する次の記述のうち、適当でないものはどれか。","opts":["タックコートの散布量は、一般に0.3〜0.6ℓ/m2が標準である。","敷均し時の混合物の温度は、一般に110℃を下回らないようにする。","初転圧は、一般に10〜12tのロードローラで行う。","交通開放の舗装表面温度は、一般に70℃以下とする。"],"ans":3,"ex":"","src":"20240603_2kyu","qid":69,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77637"},{"cat":"専門土木","year":"R6前期 No.27","q":"道路のコンクリート舗装の特徴に関する次の記述のうち、適当でないものはどれか。","opts":["普通コンクリート舗装のコンクリート版は、温度変化に対応できる目地を設ける。","普通コンクリート舗装のコンクリート版は、地盤の支持力が弱い場合は鉄網を入れる。","コンクリート舗装は、コンクリートのたわみ性で交通荷重を支える。","コンクリート舗装は、一般に養生期間が長く部分的な補修が困難である。"],"ans":2,"ex":"","src":"20240603_2kyu","qid":70,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77639"},{"cat":"専門土木","year":"R6前期 No.29","q":"トンネルの山岳工法における覆工コンクリートの施工の留意点に関する次の記述のうち、適当でないものはどれか。","opts":["覆工コンクリートの運搬は、練り混ぜ後、所定の時間内に打ち込めるように運搬する。","覆工コンクリートの打込みは、地山の変位が収束した後に行う。","覆工コンクリートの養生は、打込み後、できるだけ低温、低湿度を保ち、適切な期間行う。","覆工コンクリートの型枠の取外しは、打ち込んだコンクリートが必要な強度に達した後に行う。"],"ans":2,"ex":"","src":"20240603_2kyu","qid":71,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77641"},{"cat":"専門土木","year":"R6前期 No.30","q":"海岸における異形コンクリートブロック（消波ブロック）による消波工に関する次の記述のうち、適当でないものはどれか。","opts":["層積みは、規則正しく配列する積み方で、整然と並び外観が美しく、安定性が良い。","層積みは、設計どおりの据付けができて、海岸線の曲線部等の施工は容易である。","乱積みは、不整形に積む方法で据付けが容易であるが、据え付け時は安定性に劣る。","乱積みは、高波を受けるたびに沈下し、徐々にブロックのかみ合わせが良くなり安定する。"],"ans":1,"ex":"","src":"20240603_2kyu","qid":72,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77642"},{"cat":"専門土木","year":"R6前期 No.31","q":"グラブ浚渫船による施工に関する次の記述のうち、適当でないものはどれか。","opts":["グラブ浚渫船は、岸壁など構造物前面の浚渫や狭い場所での浚渫もできる。","グラブ浚渫船は、ポンプ浚渫船に比べ、底面を平坦に仕上げるのが容易である。","出来形の確認測量は、音響測深機等により、グラブ浚渫船が工事現場にいる間に行う。","グラブ浚渫船の標準的な船団は、グラブ浚渫船、引船、土運船、揚びょう船である。"],"ans":1,"ex":"","src":"20240603_2kyu","qid":73,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77643"},{"cat":"専門土木","year":"R6前期 No.32","q":"鉄道工事における軌道の施工に関する次の記述のうち、適当でないものはどれか。","opts":["バラスト道床の砕石は、吸水率が大きく、強固で靭性に富み、耐摩耗性に優れたものを選ぶ。","路盤は、十分強固で適当な弾性を有し、道床内の水を速やかに排除するよう考慮する。","マクラギは、レールを強固に締結し十分な強度を有するほか、耐用年数が長いものを選択する。","バラスト軌道は、列車荷重の繰返しにより変位が生じやすく、日常点検と保守作業が必要である。"],"ans":0,"ex":"","src":"20240603_2kyu","qid":74,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77644"},{"cat":"専門土木","year":"R6前期 No.34","q":"シールド工法の施工に関する次の記述のうち、適当でないものはどれか。","opts":["シールド推進後にセグメント外周に生じる空隙には、モルタル等を注入する。","シールドのフード部には、シールドを推進させるジャッキを備えている。","シールドのテール部には、覆工作業ができる機構を備えている。","覆工に用いるセグメントの種類は、コンクリート製や鋼製のものがある。"],"ans":1,"ex":"","src":"20240603_2kyu","qid":75,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77646"},{"cat":"専門土木","year":"R6前期 No.35","q":"上水道の管布設工に関する次の記述のうち、適当でないものはどれか。","opts":["管の布設にあたっての新設管と既設埋設管との離れは、原則として30cm以上とする。","土留工における切梁位置の水平間隔は、5m以内を標準とする。","管の布設は、原則として高所から低所に向けて行う。","鋼管の据付けは、管体保護のため基礎に良質な砂を敷き均して行う。"],"ans":2,"ex":"","src":"20240603_2kyu","qid":76,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77647"},{"cat":"専門土木","year":"R6前期 No.36","q":"下水道管渠の更生工法に関する下記のア、イの説明とその工法名の次の組合せのうち、適当なものはどれか。 ア 硬化性樹脂を含浸させた材料や熱可塑性樹脂で成形した材料をマンホールから引込み、加圧し、拡張・圧着後、硬化や冷却固化することで更生管渠を構築する。 イ 既設管渠より小さな管径で工場製作された二次製品をけん引挿入し、間隙にモルタル等の充塡材を注入することで更生管渠を構築する。","opts":["ア 形成工法　イ さや管工法","ア 製管工法　イ さや管工法","ア 形成工法　イ 製管工法","ア 製管工法　イ 形成工法"],"ans":0,"ex":"","src":"20240603_2kyu","qid":77,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77648"},{"cat":"法規","year":"R6前期 No.37","q":"賃金の支払いに関する次の記述のうち、労働基準法上、誤っているものはどれか。","opts":["使用者は、労働者が出産、疾病、災害など非常の場合の費用に充てるために請求する場合には、支払期日前であっても、既往の労働に対する賃金を支払わなければならない。","賃金は、原則として、通貨で、直接労働者に、毎月1回以上、一定の期日を定めて支払わなければならない。","使用者の責に帰すべき事由による休業の場合には、使用者は、休業期間中当該労働者に、その最低賃金の100分の60以上の手当を支払わなければならない。","使用者が、労働時間を延長して労働させた場合には、その時間の労働については、割増賃金を支払わなければならない。"],"ans":2,"ex":"","src":"20240603_2kyu","qid":78,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77649"},{"cat":"法規","year":"R6前期 No.38","q":"常時10人以上の労働者を使用する使用者が、就業規則に必ず記載しなければならない次の事項のうち、労働基準法上、正しいものはどれか。","opts":["賃金（臨時の賃金等を除く。）の決定に関する事項","安全及び衛生に関する事項","職業訓練に関する事項","災害補償に関する事項"],"ans":0,"ex":"","src":"20240603_2kyu","qid":79,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77650"},{"cat":"法規","year":"R6前期 No.39","q":"事業者が労働者に対して特別の教育を行わなければならない業務に関する次の記述のうち、労働安全衛生法上、該当しないものはどれか。","opts":["つり上げ荷重が5t未満のクレーンの運転の業務","アーク溶接作業の業務","つり上げ荷重が1t未満の移動式クレーンの運転の業務","ボーリングマシンの組立作業の業務"],"ans":3,"ex":"","src":"20240603_2kyu","qid":80,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77651"},{"cat":"法規","year":"R6前期 No.42","q":"河川法に関する次の記述のうち、正しいものはどれか。","opts":["河川法は、河川環境の整備と保全は含まず、洪水防御と水利用に関することを目的とした法律である。","河川の管理は、原則として、一級河川を国土交通大臣、二級河川を都道府県知事が行う。","河川区域は、堤防に挟まれ流水が継続して存在する土地の区域に、堤内地側の河川保全区域を含めた区域である。","堤防又はダム貯水池に沿って設置された樹林帯は、全て河川管理施設である。"],"ans":1,"ex":"","src":"20240603_2kyu","qid":81,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77654"},{"cat":"法規","year":"R6前期 No.43","q":"建築基準法上、主要構造部に該当しないものは、次のうちどれか。","opts":["壁","間柱","はり","屋根"],"ans":1,"ex":"","src":"20240603_2kyu","qid":82,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77655"},{"cat":"法規","year":"R6前期 No.44","q":"道路に工作物又は施設を設け、継続して道路を使用する行為に関する次の記述のうち、道路法令上、占用の許可を必要としないものはどれか。","opts":["道路標識、道路元標、里程標その他の道路の附属物を設置する場合","水管、下水道管、ガス管、電柱、電線及び広告塔を設置する場合","看板、旗ざお、パーキング・メーター、幕及びアーチを設置する場合","工事用板囲、足場、詰所その他の工事用施設を設置する場合"],"ans":0,"ex":"","src":"20240603_2kyu","qid":83,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77656"},{"cat":"法規","year":"R6前期 No.45","q":"騒音規制法上、指定地域内における特定建設作業の規制基準に関する次の記述のうち、正しいものはどれか。","opts":["特定建設作業の敷地の境界線において騒音の大きさは、75デシベルを超えてはならない。","夜間・深夜作業の禁止時間帯は、原則として午後10時から翌日の午前6時である。","1日の作業時間は、原則として6時間を超えてはならない。","特定建設作業は、原則として同一場所においては連続6日を超えてはならない。"],"ans":3,"ex":"","src":"20240603_2kyu","qid":84,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77657"},{"cat":"法規","year":"R6前期 No.46","q":"振動規制法に定められている特定建設作業の対象となる建設機械は、次のうちどれか。ただし、当該作業がその作業を開始した日に終わるものを除き、1日における当該作業に係る2地点間の最大移動距離が50mを超えない作業とする。","opts":["手持ち式ブレーカ","振動ローラ","ブルドーザ","舗装版破砕機"],"ans":3,"ex":"","src":"20240603_2kyu","qid":85,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77658"},{"cat":"法規","year":"R6前期 No.47","q":"特定港における港長の許可又は届け出に関する次の記述のうち、港則法上、正しいものはどれか。","opts":["船舶は、特定港において危険物の積込、積替又は荷卸をするには、港長の許可を受けなければならない。","特定港内又は特定港の境界附近で工事又は作業をしようとする者は、港長に届け出なければならない。","特定港内において使用すべき私設信号を定めようとする者は、港長に届け出なければならない。","船舶は、特定港に入港したとき又は特定港を出港しようとするときは、港長の許可を受けなければならない。"],"ans":0,"ex":"","src":"20240603_2kyu","qid":86,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77659"},{"cat":"施工管理法","year":"R6前期 No.48","q":"閉合トラバース測量による下表の観測結果において、測線ABの方位角が182°49′30″のとき、測線BCの方位角として、適当なものは次のうちどれか。 【観測角】測点A 115°55′38″、測点B 100°5′34″、測点C 112°34′39″、測点D 108°44′25″、測点E 102°39′44″","opts":["102°53′5″","102°53′7″","102°55′4″","102°55′13″"],"ans":2,"ex":"","src":"20240603_2kyu","qid":87,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77660"},{"cat":"施工管理法","year":"R6前期 No.49","q":"公共工事標準請負契約約款に関する次の記述のうち、正しいものはどれか。","opts":["発注者は、工事の完成を確認するため、工事目的物を最小限度破壊して検査を行う場合、検査又は復旧に直接要する費用は、発注者が負担する。","発注者は、現場代理人の工事現場における運営等に支障がなく、かつ、発注者との連絡体制が確保される場合には、現場代理人について工事現場に常駐を要しないこととすることができる。","受注者は、工事の完成、設計図書の変更等によって不用となった支給材料は、発注者に返還を要しない。","受注者は、工事の全部若しくはその主たる部分を一括して第三者に請け負わせることができる。"],"ans":1,"ex":"","src":"20240603_2kyu","qid":88,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77661"},{"cat":"施工管理法","year":"R6前期 No.51","q":"建設機械に関する次の記述のうち、適当でないものはどれか。","opts":["ローディングショベルは、掘削力が強く、機械の位置よりも低い場所の掘削に適する。","トンネルボーリングマシンは、回転カッターでトンネルの全断面を同時に切り崩すものである。","クラムシェルは、シールド工事の立坑掘削等、狭い場所での深い掘削に適する。","トラックアジテータは、レディーミクストコンクリートの工場から現場までの運搬に使う。"],"ans":0,"ex":"","src":"20240603_2kyu","qid":89,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77663"},{"cat":"施工管理法","year":"R6前期 No.54","q":"労働安全衛生法上、高さ5m以上のコンクリート造の工作物の解体作業に伴う危険を防止するために事業者が行うべき事項に関する次の記述のうち、誤っているものはどれか。","opts":["器具、工具等を上げ、又は下ろすときは、つり綱、つり袋等を労働者に使用させる。","解体作業を行う区域内には、関係労働者以外の労働者の立入りを禁止する。","強風、大雨等悪天候のため、作業の実施について危険が予想されるときは、当該作業を中止する。","作業の方法及び労働者の配置を決定し、作業を直接指揮する。"],"ans":3,"ex":"","src":"20240603_2kyu","qid":90,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77666"},{"cat":"施工管理法","year":"R6前期 No.55","q":"x-R管理図の作成にあたり、下記のデータシートA〜D組のxとRの値について、両方とも正しい組は、次のうちどれか。 【測定値】A組 20,17,17,18（R=4）／B組 18,21,24,24（R=3）／C組 18,20,19,18（R=1）／D組 22,22,25,23（R=3）","opts":["A","B","C","D"],"ans":3,"ex":"","src":"20240603_2kyu","qid":91,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77667"},{"cat":"施工管理法","year":"R6前期 No.57","q":"建設工事における環境保全対策に関する次の記述のうち、適当でないものはどれか。","opts":["工事現場周辺の家屋、施設等の有無や、騒音又は振動源との距離等を事前に調査する。","施工にあたっては、井戸がれ、自然生物の保護等、近隣環境への影響を考慮する。","盛土箇所の風による塵埃の防止にあたっては、仮囲いの設置を原則とする。","掘削、積込み作業にあたっては、低騒音型建設機械の使用を原則とする。"],"ans":2,"ex":"","src":"20240603_2kyu","qid":92,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77669"},{"cat":"施工管理法応用","year":"R6前期 No.59","q":"仮設備・仮設工事に関する下記の①〜④の4つの記述のうち、適当なものの数は次のうちどれか。 ① 仮設工事には直接仮設工事と間接仮設工事があり、快適な職場環境をつくるための事務所や宿舎設備等の工事は直接仮設工事である。 ② 仮設備は使用目的や期間に応じて構造計算を行い、労働安全衛生規則の基準に合致するか、それ以上の計画としなければならない。 ③ 仮設備は目的とする構造物を建設するために必要な工事用施設で、原則として工事完成時に取り除かれるものである。 ④ 仮設工事には指定仮設と任意仮設があり、一般に、指定仮設は変更契約の対象になるが、任意仮設は変更契約の対象にならない。","opts":["1つ","2つ","3つ","4つ"],"ans":2,"ex":"","src":"20240603_2kyu","qid":93,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77671"},{"cat":"施工管理法応用","year":"R6前期 No.60","q":"公共工事における施工体制台帳に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。 ・施工体制台帳は、下請負人に関する事項を含め工事内容、（イ）等について記載する。 ・施工体制台帳は、その写しを（ロ）に提出しなければならない。 ・施工体制台帳は、（ハ）及び公衆が見やすい場所に掲示しなければならない。 ・施工体制台帳には要約版ともいえるものとして（ニ）がある。","opts":["（イ）工法　（ロ）発注者　（ハ）所轄警察署　（ニ）緊急連絡表","（イ）工法　（ロ）労働基準監督署　（ハ）工事関係者　（ニ）緊急連絡表","（イ）工期　（ロ）労働基準監督署　（ハ）所轄警察署　（ニ）施工体系図","（イ）工期　（ロ）発注者　（ハ）工事関係者　（ニ）施工体系図"],"ans":3,"ex":"","src":"20240603_2kyu","qid":94,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77672"},{"cat":"施工管理法応用","year":"R6前期 No.61","q":"工程管理曲線（バナナ曲線）に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。 ① 出来高累計曲線は、一般的にS字型となり、工程管理曲線によって管理する。 ② 工程管理曲線の縦軸は出来高比率で、横軸は時間経過比率である。 ③ 実施工程曲線が上方限界を下回り、下方限界以上であれば許容範囲内である。 ④ 実施工程曲線が下方限界を下回るときは、工程が進み過ぎている。","opts":["①②","③④","①②③","①③④"],"ans":2,"ex":"","src":"20240603_2kyu","qid":95,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77673"},{"cat":"施工管理法応用","year":"R6前期 No.63","q":"型枠支保工の安全管理に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、労働安全衛生法上、適当なものは次のうちどれか。 ・事業者は、型枠支保工を組み立てるときは、（イ）を作成し、かつ、この（イ）により組み立てなければならない。 ・事業者は、コンクリートの打設作業を実施するときは、（ロ）に、型枠支保工を点検しなければならない。 ・型枠支保工の組立て等（ハ）は、作業中、要求性能墜落制止用器具や保護帽の使用状況について監視しなければならない。 ・型枠支保工の組立て等（ハ）は、材料の欠点の有無を確認するとともに、器具・工具を点検し（ニ）を取り除かなければならない。","opts":["（イ）組立図　（ロ）その日の作業を開始する前　（ハ）監視員　（ニ）不良品","（イ）仕様書　（ロ）作業の前日まで　（ハ）作業主任者　（ニ）浮き錆","（イ）組立図　（ロ）その日の作業を開始する前　（ハ）作業主任者　（ニ）不良品","（イ）仕様書　（ロ）作業の前日まで　（ハ）監視員　（ニ）浮き錆"],"ans":2,"ex":"","src":"20240603_2kyu","qid":96,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77675"},{"cat":"施工管理法応用","year":"R6前期 No.64","q":"移動式クレーンを用いた作業において、事業者が行うべき事項に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、クレーン等安全規則上、正しいものは次のうちどれか。 ・運転者や玉掛け者が、（イ）を常時知ることができるよう、表示その他の措置を講じなければならない。 ・強風のため、作業の実施について危険が予想されるときは、作業を（ロ）しなければならない。 ・移動式クレーンの作業を行うときは、一定の合図を定め、原則、（ハ）を指名しなければならない。 ・作業の方法、転倒を防止するための方法、作業に係る労働者の配置及び指揮系統を定め、作業の開始前に、（ニ）なければならない。","opts":["（イ）定格荷重　（ロ）注意して実施　（ハ）合図者　（ニ）発注者に届け","（イ）定格荷重　（ロ）中止　（ハ）合図者　（ニ）関係労働者に周知させ","（イ）つり荷の重心　（ロ）中止　（ハ）監視員　（ニ）発注者に届け","（イ）つり荷の重心　（ロ）注意して実施　（ハ）監視員　（ニ）関係労働者に周知させ"],"ans":1,"ex":"","src":"20240603_2kyu","qid":97,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77676"},{"cat":"施工管理法応用","year":"R6前期 No.66","q":"盛土の締固めの品質管理に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。 ① 品質規定方式では、盛土に必要な品質を仕様書に明示し、締固めの工法は施工者に任せる。 ② 工法規定方式では、締固め機械の機種や締固め回数、盛土材料の敷均し厚さ等を規定する。 ③ 盛土の締固めは、土の空気間隙を少なくすることにより透水性を上昇させるように行う。 ④ ICT建設機械での施工は、生産性の向上や働き方改革への対応と品質管理への活用等が期待されている。","opts":["①②","①③","①②④","②③④"],"ans":2,"ex":"","src":"20240603_2kyu","qid":98,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/77678"},{"cat":"土木一般","year":"R7前期 No.2","q":"下図の各サウンディングの測定方法に関する下記の文章中の（イ）〜（ハ）の次の組合せのうち，適当なものはどれか。\n① 標準貫入試験は，ハンマを落下させ，サンプラーを30cm貫入させるのに要する（イ）を計る。\n② オランダ式二重管コーン貫入試験は，貫入コーンを押込み速さ1cm/s程度で挿入し，深さ25cmごとの（ロ）を計る。\n③ スクリューウェイト貫入試験（旧名称：スウェーデン式サウンディング試験）は，質量が5，15，25，50，75，100kgとなるようにおもりを段階的に載荷し，各荷重ごとの（ハ）を記録する。","opts":["（イ）貫入抵抗 （ロ）打撃回数 （ハ）沈下量","（イ）打撃回数 （ロ）沈下量 （ハ）貫入抵抗","（イ）沈下量 （ロ）貫入抵抗 （ハ）打撃回数","（イ）打撃回数 （ロ）貫入抵抗 （ハ）沈下量"],"ans":3,"ex":"","src":"20250602_2kyu","qid":99,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85578"},{"cat":"土木一般","year":"R7前期 No.6","q":"土工作業に使用する建設機械に関する次の記述のうち，適当なものはどれか。","opts":["バックホウは，主に機械位置よりも高い場所の掘削に用いられる。","ブルドーザは，主に掘削・押土及び溝掘りの作業に用いられる。","クラムシェルは，狭い場所での深い掘削に用いられる。","トラクタショベルは，積込み・運搬及び法面仕上げの作業に用いられる。"],"ans":2,"ex":"","src":"20250602_2kyu","qid":100,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85582"},{"cat":"土木一般","year":"R7前期 No.7","q":"法面保護工の「工種」とその「主な目的」の組合せとして，次のうち，適当でないものはどれか。","opts":["コンクリート張工 － 法面表層部の崩落防止","種子吹付工 － 雨水による浸食防止","ブロック積擁壁工 － 土圧に対抗して崩壊防止","張芝工 － すべり土塊の崩落防止"],"ans":3,"ex":"","src":"20250602_2kyu","qid":101,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85583"},{"cat":"土木一般","year":"R7前期 No.8","q":"道路における盛土の施工に関する次の記述のうち，適当なものはどれか。","opts":["盛土の締固めの目的は，土の間隙に含まれる水分量を少なくすることにより，透水性を低下させ，土を安定した状態にすることである。","盛土における構造物縁部の締固めは，ブルドーザ等できるだけ大型な締固め機械により入念に締め固めるものとする。","浸水により強度が低下するおそれがあることから，道路土工盛土工指針では施工含水比として最適含水比と乾燥側の含水比の範囲で締め固めるように規定されている。","構造物裏込め部の施工は，雨水の流入をできるだけ防止すると共に，浸透水に対しては地下排水溝を設けて処理することが望ましい。"],"ans":3,"ex":"","src":"20250602_2kyu","qid":102,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85584"},{"cat":"土木一般","year":"R7前期 No.9","q":"軟弱地盤における改良工法に関する次の記述のうち，適当でないものはどれか。","opts":["薬液注入工法は，地盤に薬液を注入して，地盤の強度を増加させる工法である。","ウェルポイント工法は，地下水位を低下させ，地盤の強度の増加を図る工法である。","深層混合処理工法は，軟弱地盤の全部又は一部を掘削して，良質な土と入れ替える工法である。","サンドマット工法は，表面に砂を敷設し，軟弱層圧密のための上部排水を促進する工法である。"],"ans":2,"ex":"","src":"20250602_2kyu","qid":103,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85585"},{"cat":"土木一般","year":"R7前期 No.10","q":"コンクリートに使用するセメントに関する次の記述のうち，適当でないものはどれか。","opts":["セメントは，風化すると密度が小さくなる。","セメントは，水と接すると気化熱を発しながら徐々に硬化していく。","セメント粒子の細かさを粉末度といい，一般に比表面積で表す。","早期材令強度は，高炉セメントＢ種よりも普通ポルトランドセメントの方が大きい。"],"ans":1,"ex":"","src":"20250602_2kyu","qid":104,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85586"},{"cat":"土木一般","year":"R7前期 No.11","q":"コンクリートを棒状バイブレータで締め固める場合の留意点に関する次の記述のうち，適当でないものはどれか。","opts":["型枠内にコンクリートの未充塡部が生じないように，コンクリート内を横移動させる。","上下層が一体となるように，下層コンクリート中に10cm程度挿入する。","挿入位置一箇所当たりの振動時間は，5秒から15秒程度とする。","コンクリートに穴を残さないように，ゆっくりと引き抜く。"],"ans":0,"ex":"","src":"20250602_2kyu","qid":105,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85587"},{"cat":"土木一般","year":"R7前期 No.12","q":"各種のコンクリートに関する次の記述のうち，適当なものはどれか。","opts":["寒中コンクリートとしての施工は，日平均気温が5℃以下になると想定されるときに行うものとする。","マスコンクリートでは，セメントの水和熱による圧縮応力にともなうひび割れに対する注意が必要である。","流動化コンクリートは，あらかじめ練り混ぜられたフレッシュコンクリートに遅延剤を添加し，流動性を増大させたものであり，そのスランプは原則として18cm以下とする。","膨張コンクリートは，膨張の効果によって体積変化によるひび割れの発生や拡大を防ぐものである。"],"ans":3,"ex":"","src":"20250602_2kyu","qid":106,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85588"},{"cat":"土木一般","year":"R7前期 No.13","q":"鉄筋の加工及び組立に関する次の記述のうち，適当でないものはどれか。","opts":["鉄筋の加工は，加熱して行うものとする。","鉄筋どうしの交点の要所は，焼なまし鉄線で緊結する。","曲げ加工した鉄筋の曲げ戻しは行わないものとする。","型枠に接するスペーサは，モルタル製あるいはコンクリート製を使用する。"],"ans":0,"ex":"","src":"20250602_2kyu","qid":107,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85589"},{"cat":"土木一般","year":"R7前期 No.14","q":"既製杭の施工に関する次の記述のうち，適当でないものはどれか。","opts":["中掘り杭工法の掘削は，先端地盤の緩みを最小限に留めるように行う。","中掘り杭工法は，打撃工法に比べて，支持力が低下する。","打撃工法による群杭の施工は，杭群の中央から周辺へと打ち進む。","打撃工法で油圧ハンマを用いる施工は，騒音が大きく油の飛散をともなう。"],"ans":3,"ex":"","src":"20250602_2kyu","qid":108,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85590"},{"cat":"土木一般","year":"R7前期 No.15","q":"場所打ち杭の「工法名」と「主な資機材」に関する次の組合せのうち，適当なものはどれか。","opts":["リバースサーキュレーション工法 － スタンドパイプ","オールケーシング工法 － 安定液（ベントナイト泥水）","深礎工法 － ケーシングチューブ","アースドリル工法 － 土留材（ライナープレート）"],"ans":0,"ex":"","src":"20250602_2kyu","qid":109,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85591"},{"cat":"専門土木","year":"R7前期 No.17","q":"土木材料として用いられる鋼材の力学的性質に関する次の記述のうち，適当でないものはどれか。","opts":["鋼材は，応力度が弾性限度に達するまでは弾性を示す。","鋼材は，応力度が弾性限度を超えると塑性を示す。","鋼材は，塑性領域では，応力度をゼロに戻してもひずみが残る。","鋼材は，永久ひずみが生じない塑性領域内で使用される。"],"ans":3,"ex":"","src":"20250602_2kyu","qid":110,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85593"},{"cat":"専門土木","year":"R7前期 No.18","q":"鋼道路橋における高力ボルトに関する次の記述のうち，適当なものはどれか。","opts":["高力ボルトの締付けは，原則としてボルト頭部を回して行う。","高力ボルトの締付けは，連結板の端部ボルトから順次中央のボルトに向かって行う。","トルシア形高力ボルトの締付けは，本締めに専用締付け機を使用して行う。","トルシア形高力ボルトの締付け完了後の検査は，半数についてピンテールの切断確認を行う。"],"ans":2,"ex":"","src":"20250602_2kyu","qid":111,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85594"},{"cat":"専門土木","year":"R7前期 No.19","q":"コンクリート構造物の耐久性を向上させる対策に関する次の記述のうち，適当なものはどれか。","opts":["凍害対策として，膨張材を使用する。","中性化対策として，鉄筋のかぶりをできるだけ大きくする。","塩害対策として，水セメント比をできるだけ大きくする。","アルカリシリカ反応対策として，流動化剤を使用する。"],"ans":1,"ex":"","src":"20250602_2kyu","qid":112,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85595"},{"cat":"専門土木","year":"R7前期 No.20","q":"河川堤防の施工に関する次の記述のうち，適当でないものはどれか。","opts":["旧堤防を撤去する際は，新堤防の地盤が十分に安定した後に実施する。","堤防の拡幅工事を行う場合の腹付けは，できるだけ旧堤防の裏法面に行う。","堤防の工事において基礎地盤が軟弱な場合は，緩速載荷工法や地盤改良工法等を行う。","堤防の施工中は，堤体への雨水の滞水や浸透が生じないよう堤体縦断方向に勾配を設ける。"],"ans":3,"ex":"","src":"20250602_2kyu","qid":113,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85596"},{"cat":"専門土木","year":"R7前期 No.21","q":"河川護岸の施工に関する次の記述のうち，適当でないものはどれか。","opts":["法覆工は，安全性の確保の観点から，同一材料同一工法による一体構造とすることが望ましい。","コンクリート法枠工は，法勾配の緩やかな場所では，施工が難しい。","基礎工は，法覆工を支える基礎であり，洗掘に対する保護や裏込め土砂の流出を防ぐために施工する。","根固工は，河床の洗掘を防ぎ，基礎工及び法覆工を保護するために施工する。"],"ans":1,"ex":"","src":"20250602_2kyu","qid":114,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85597"},{"cat":"専門土木","year":"R7前期 No.22","q":"砂防堰堤に関する次の記述のうち，適当なものはどれか。","opts":["砂防堰堤は，安全性等の面から強固な岩盤に施工することが望ましい。","水抜きは，本堰堤からの落下水の衝撃を緩和し，洗掘を防止するための構造物である。","水通しは，施工中の流水の切換えや堆砂後の本堰堤にかかる水圧を軽減させるために設ける。","前庭保護工は，堤体への土石流の直撃を防ぐために設ける。"],"ans":0,"ex":"","src":"20250602_2kyu","qid":115,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85598"},{"cat":"専門土木","year":"R7前期 No.23","q":"地すべり防止工に関する次の記述のうち，適当でないものはどれか。","opts":["排土工は，地すべり頭部の不安定な土塊を排除し，土塊の滑動力を減少させる工法であり，抑制工に分類される。","水路工は，地表の水を水路に集め，速やかに地すべりの地域外に排除する工法であり，抑制工に分類される。","排水トンネル工は，原則として安定した地盤にトンネルを設け，ここから帯水層に向けてボーリングを行い，トンネルを使って排水する工法であり，抑止工に分類される。","アンカー工は，すべり面の下にある安定した岩盤に鋼材を定着させて引っ張り，地表と固定して地すべりを抑える工法であり，抑止工に分類される。"],"ans":2,"ex":"","src":"20250602_2kyu","qid":116,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85599"},{"cat":"専門土木","year":"R7前期 No.24","q":"道路のアスファルト舗装における路床の施工上の留意点に関する次の記述のうち，適当でないものはどれか。","opts":["盛土路床では，1層の敷均し厚さは，仕上り厚さで40cm以下を目安とする。","切土路床では，表面から30cm程度以内の木根，転石等を取り除いて仕上げる。","安定処理による路床では，所定量の安定材を散布機械，又は人力により均等に散布する。","安定処理による路床では，安定材の混合終了後，タイヤローラ等で仮転圧を行う。"],"ans":0,"ex":"","src":"20250602_2kyu","qid":117,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85600"},{"cat":"専門土木","year":"R7前期 No.25","q":"道路のアスファルト舗装の施工に関する次の記述のうち，適当でないものはどれか。","opts":["路盤又は基層表面のごみ，泥，浮石等を取り除き，加熱アスファルト混合物を舗設する。","初転圧時のローラへの混合物の付着防止には，少量の水又は軽油等を薄く塗布する。","初転圧温度が高すぎたり過転圧等の場合，ヘアクラックが多くみられることがある。","継目や構造物との接触面には，プライムコートを塗布後，舗設し密着させる。"],"ans":3,"ex":"","src":"20250602_2kyu","qid":118,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85601"},{"cat":"専門土木","year":"R7前期 No.26","q":"道路のアスファルト舗装の破損に関する次の記述のうち，適当でないものはどれか。","opts":["わだち掘れは，車輪が通過する位置に，走行方向に生じる連続的なへこみをいう。","亀甲状ひび割れは，路床や路盤の支持力低下等により，主に車線中央部から発生する。","縦断方向の凹凸は，道路の縦断方向に発生する比較的波長の長い不陸である。","線状ひび割れは，舗装表面に，縦方向あるいは横方向に入るひび割れである。"],"ans":1,"ex":"","src":"20250602_2kyu","qid":119,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85602"},{"cat":"専門土木","year":"R7前期 No.27","q":"道路のコンクリート舗装の特徴に関する次の記述のうち，適当でないものはどれか。","opts":["コンクリート版には，普通コンクリート版，連続鉄筋コンクリート版，転圧コンクリート版がある。","コンクリート舗装は，施工方法で大別すると，セットフォーム工法，スリップフォーム工法，転圧工法がある。","コンクリート舗装では，路盤の最上部にアスファルト中間層を設けることがある。","コンクリート版が膨張，収縮しないように，路盤上に路盤紙や砂利を敷くことがある。"],"ans":3,"ex":"","src":"20250602_2kyu","qid":120,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85603"},{"cat":"専門土木","year":"R7前期 No.28","q":"ダムの施工に関する次の記述のうち，適当でないものはどれか。","opts":["ダム本体の基礎掘削工は，基礎岩盤に損傷を与えることが少なく，大量掘削に対応できるベンチカット工法が一般的である。","重力式コンクリートダムの基礎処理は，コンソリデーショングラウチングとカーテングラウチングの施工が一般的である。","RCD用コンクリートの敷均し後，堤体内に不規則な温度ひび割れの発生を防ぐため，横継目をダム軸と平行に設ける。","中央コア型ロックフィルダムは，堤体の中央部に遮水性の材料を用い，堤体の上流側及び下流側に半透水性の材料を用いる。"],"ans":2,"ex":"","src":"20250602_2kyu","qid":121,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85604"},{"cat":"専門土木","year":"R7前期 No.29","q":"トンネルの山岳工法の施工に関する次の記述のうち，適当なものはどれか。","opts":["吹付けコンクリートは，地山の凹凸を残すように吹き付ける。","鋼アーチ式支保工は，一次吹付けコンクリート施工前に建て込む。","ロックボルトは，原則として，トンネル掘削面に対して斜めに設ける。","支保工は，岩石や土砂の崩壊を防止し，作業の安全を確保するために設ける。"],"ans":3,"ex":"","src":"20250602_2kyu","qid":122,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85605"},{"cat":"専門土木","year":"R7前期 No.30","q":"海岸堤防の異形コンクリートブロック（消波ブロック）による消波工に関する次の記述のうち，適当でないものはどれか。","opts":["乱積みは，荒天時の高波を受けるたびに沈下し，徐々にブロックどうしのかみ合わせが悪くなり不安定になってくる。","消波工は，波の打上げ高さを小さくすることや，波による圧力を減らすために堤防の前面に設けられる。","層積みは，規則正しく配列する積み方で安定性が良いが，据付けに手間がかかり，海岸線の曲線部等の施工が難しい。","異形コンクリートブロックは，ブロックとブロックの間を波が通過することにより，波のエネルギーを減少させる。"],"ans":0,"ex":"","src":"20250602_2kyu","qid":123,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85606"},{"cat":"専門土木","year":"R7前期 No.31","q":"グラブ浚渫の施工に関する次の記述のうち，適当なものはどれか。","opts":["グラブ浚渫船は，岸壁等の構造物前面や狭い場所での浚渫には使用できない。","グラブ浚渫船は，ポンプ浚渫船に比べて底面を平坦に仕上げるのが難しい。","出来形確認測量は音響測深機によるが，グラブ浚渫船が現場にいる間に行ってはならない。","グラブ浚渫では，計画した面積を一定の水深に仕上げるために余掘を行ってはならない。"],"ans":1,"ex":"","src":"20250602_2kyu","qid":124,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85607"},{"cat":"専門土木","year":"R7前期 No.32","q":"鉄道工事における軌道の施工に関する次の記述のうち，適当でないものはどれか。","opts":["バラスト道床は，強固で耐摩耗性に優れ，単位容積質量が大きい砕石を選定する。","バラスト道床は，安価で施工・保守が容易であり，定期的な軌道の修正・修復は不要である。","路床表面には，横断排水勾配を設け，表面付近の玉石・木根等を除去し平滑に仕上げる。","マクラギは，列車荷重を支持するのに十分な強度を有し，耐用年数が長いものを選択する。"],"ans":1,"ex":"","src":"20250602_2kyu","qid":125,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85608"},{"cat":"専門土木","year":"R7前期 No.33","q":"鉄道（在来線）の営業線内工事における工事保安体制に関する次の記述のうち，適当でないものはどれか。","opts":["軌道作業責任者は，作業集団ごとに専任の者を常時配置しなければならない。","列車見張員が見通し距離を確保できない場合は，中継見張員を配置しなければならない。","工事管理者は，工事現場ごとに専任の者を常時配置しなければならない。","き電停止工事を行わない場合でも，停電責任者を配置しなければならない。"],"ans":3,"ex":"","src":"20250602_2kyu","qid":126,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85609"},{"cat":"専門土木","year":"R7前期 No.36","q":"下水道管渠の更生工法に関する下記の（イ）、（ロ）の説明とその工法名の次の組合せのうち、適当なものはどれか。（イ）既設管渠より小さな管径で工場製作された二次製品を牽引挿入し、間隙にモルタル等の充填材を注入することで更生管渠を構築する。（ロ）既設管渠内に表面部材となる硬質塩化ビニル樹脂材等をかん合し、その樹脂パイプと既設管渠との間隙にモルタル等の充填材を注入することで更生管渠を構築する。","opts":["（イ）さや管工法　（ロ）製管工法","（イ）形成工法　（ロ）製管工法","（イ）製管工法　（ロ）形成工法","（イ）さや管工法　（ロ）形成工法"],"ans":0,"ex":"","src":"20250602_2kyu","qid":127,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85612"},{"cat":"法規","year":"R7前期 No.37","q":"労働時間、休憩に関する次の記述のうち、労働基準法上、誤っているものはどれか。","opts":["使用者は、労働時間が8時間を超える場合においては少なくとも1時間の休憩時間を労働時間の途中に与えなければならない。","使用者が、労働時間を延長し労働させた場合は、その時間の労働について割増賃金を支払わなければならない。","使用者が、通常予見される時間外労働の範囲内において労働させることができる時間は、原則として1年については360時間を限度とする。","使用者は、災害その他避けることのできない事由によって、臨時の必要がある場合においては、限度なく労働時間を延長し、労働させることができる。"],"ans":3,"ex":"","src":"20250602_2kyu","qid":128,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85613"},{"cat":"法規","year":"R7前期 No.38","q":"年少者、女性の就業に関する次の記述のうち、労働基準法上、誤っているものはどれか。","opts":["親権者又は後見人は、未成年者に代って労働契約を締結しなければならない。","親権者又は後見人は、未成年者の賃金を代って受け取ってはならない。","使用者は、満18歳に満たない者に、運転中の機械の危険な部分の掃除、注油、検査若しくは修繕をさせる業務に就かせてはならない。","使用者は、満18歳以上の女性であっても、坑内で行われる業務のうち人力により行われる掘削の業務に就かせてはならない。"],"ans":0,"ex":"","src":"20250602_2kyu","qid":129,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85614"},{"cat":"法規","year":"R7前期 No.41","q":"建設業法上、主任技術者及び監理技術者の職務に関する次の記述のうち、正しいものはどれか。","opts":["当該建設工事の下請代金の見積書の作成","当該建設工事の施工計画の作成","当該建設工事の下請契約書の作成","当該建設工事の資金計画の作成"],"ans":1,"ex":"","src":"20250602_2kyu","qid":130,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85617"},{"cat":"法規","year":"R7前期 No.42","q":"河川法に関する次の記述のうち、河川管理者の許可を必要としないものはどれか。","opts":["河川区域内の土地を利用した鉄道橋工事の資材置場の設置","河川区域内の民有地に堆積した土石の採取","河川区域内に設置されている水道用水取水口付近に積もった土砂の排除","河川区域内の上空に設けられる送電線の架設"],"ans":2,"ex":"","src":"20250602_2kyu","qid":131,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85618"},{"cat":"法規","year":"R7前期 No.43","q":"建築基準法に関する次の記述のうち、誤っているものはどれか。","opts":["建築物の延べ面積の敷地面積に対する割合を建ぺい率という。","建築物とは、土地に定着する工作物のうち、屋根及び柱若しくは壁を有するもの、これに附属する門若しくは塀等をいう。","建築物の敷地は、原則として、道路に2m以上接していなければならない。","道路とは、道路法、都市計画法、土地区画整理法等による道路で、原則として、幅員4m以上でなければならない。"],"ans":0,"ex":"","src":"20250602_2kyu","qid":132,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85619"},{"cat":"法規","year":"R7前期 No.44","q":"道路の占用許可に関し、道路法上、道路管理者に提出すべき申請書に記載する事項に該当しないものは、次のうちどれか。","opts":["道路の占用の目的","道路の占用の期間","工事実施の費用","工事実施の方法"],"ans":2,"ex":"","src":"20250602_2kyu","qid":133,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85620"},{"cat":"法規","year":"R7前期 No.45","q":"騒音規制法上、住民の生活環境を保全する必要があると認める地域の指定を行う者として、次の記述のうち、正しいものはどれか。","opts":["都道府県知事又は市長","町村長","厚生労働大臣","環境大臣"],"ans":0,"ex":"","src":"20250602_2kyu","qid":134,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85621"},{"cat":"法規","year":"R7前期 No.46","q":"振動規制法上、指定地域内において特定建設作業を施工しようとする者が、市町村長に届け出なければならない事項として、該当しないものは次のうちどれか。","opts":["特定建設作業の施工体制表","特定建設作業の振動の防止の方法","特定建設作業の種類、場所、実施期間及び作業時間","特定建設作業の場所の付近の見取図"],"ans":0,"ex":"","src":"20250602_2kyu","qid":135,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85622"},{"cat":"法規","year":"R7前期 No.47","q":"港則法上、許可申請に関する次の記述のうち、正しいものはどれか。","opts":["船舶は、特定港に入港したとき又は出港しようとするときは、港長の許可を受けなければならない。","特定港内において竹木材を船舶から水上に卸そうとする者は、港長に届け出なければならない。","特定港内又は特定港の境界附近で工事又は作業をしようとする者は、港長の許可を受けなければならない。","船舶は、特定港において危険物の積込、積替又は荷卸をするには、港長に届け出なければならない。"],"ans":2,"ex":"","src":"20250602_2kyu","qid":136,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85623"},{"cat":"施工管理法","year":"R7前期 No.51","q":"建設工事における建設機械の機械名と性能表示に関する次の組合せのうち、適当なものはどれか。","opts":["コンクリートブレーカ　動力［kW］","コンクリートポンプ車　打込み能力［m3/h］","クレーン　ブーム長［m］","アスファルトフィニッシャ　質量［t］"],"ans":1,"ex":"","src":"20250602_2kyu","qid":137,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85627"},{"cat":"施工管理法","year":"R7前期 No.54","q":"高さ5m以上のコンクリート造の工作物の解体作業に伴う危険を防止するため事業者が行うべき事項に関する次の記述のうち、労働安全衛生法上、誤っているものはどれか。","opts":["解体作業を行う区域内には、当該作業に関係する者以外の立入りを禁止する。","器具、工具等を上げ、又は下すときは、つり綱、つり袋等を労働者に使用させる。","作業の方法及び労働者の配置を決定し、作業を直接指揮する。","強風、大雨等悪天候のため、作業の実施について危険が予想されるときは、当該作業を中止する。"],"ans":2,"ex":"","src":"20250602_2kyu","qid":138,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85630"},{"cat":"施工管理法","year":"R7前期 No.55","q":"アスファルト舗装の品質特性と試験方法に関する次の記述のうち、適当でないものはどれか。","opts":["アスファルト舗装の材料の粒度を確認するためには、ふるい分け試験を行う。","アスファルト舗装を行う路床の強さを確認するためには、締固め試験を行う。","アスファルト量と合成粒度を確認するためには、アスファルト抽出試験を行う。","加熱アスファルト混合物の安定度を確認するためには、マーシャル安定度試験を行う。"],"ans":1,"ex":"","src":"20250602_2kyu","qid":139,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85631"},{"cat":"施工管理法","year":"R7前期 No.56","q":"呼び強度21、スランプ12cmと指定したレディーミクストコンクリート（JIS A 5308）の試験結果について、各項目の判定基準を満足しないものは次のうちどれか。","opts":["塩化物イオン量の試験結果は、0.1kg/m3であった。","スランプ試験の結果は、15.0cmであった。","3回の圧縮強度試験結果の平均値は、21.5N/mm2であった。","1回の圧縮強度試験結果は、20.5N/mm2であった。"],"ans":1,"ex":"","src":"20250602_2kyu","qid":140,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85632"},{"cat":"施工管理法","year":"R7前期 No.57","q":"建設工事現場周辺の環境保全対策に関する次の記述のうち、適当でないものはどれか。","opts":["運搬車両の走行速度は、道路及び付近の状況によって必要に応じ制限を加える計画を行い、騒音や振動を防止する。","ブルドーザで掘削押土を行う場合の、騒音や振動の防止対策として、無理な負荷をかけないようにし、後進時の高速走行を避けて、ていねいに運転しなければならない。","騒音の防止方法には、発生源での対策、伝搬経路での対策、受音点での対策があるが、建設工事では受音点での対策が広く行われる。","騒音や振動の防止対策では、騒音や振動の絶対値を下げること及び発生期間の短縮を検討する。"],"ans":2,"ex":"","src":"20250602_2kyu","qid":141,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85633"},{"cat":"施工管理法応用","year":"R7前期 No.59","q":"建設機械の作業に関する①〜④の4つの記述のうち、適当なものの数は次のうちどれか。①ワーカビリティーとは、建設機械の走行性をいい、一般にはコーン指数で判断される。②リッパビリティーとは、大型ブルドーザに装着されたリッパによって作業できる程度をいう。③土工機械の作業能力は、単独又は組み合わされた機械の時間当たりの平均作業量で表す。④ダンプトラックの作業効率は、運搬路の沿道条件、路面状態、昼夜の別等で変わる。","opts":["1つ","2つ","3つ","4つ"],"ans":2,"ex":"","src":"20250602_2kyu","qid":142,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85635"},{"cat":"施工管理法応用","year":"R7前期 No.60","q":"施工計画の作成に関する下記の文章中の（イ）〜（ニ）に当てはまる語句の組合せとして、適当なものは次のうちどれか。・施工技術計画は、作業計画、（イ）が主な内容である。・仮設備計画は、（ロ）、工事事務所が主な内容である。・調達計画は、（ハ）、資材計画が主な内容である。・管理計画は、品質管理計画、（ニ）が主な内容である。","opts":["（イ）労務計画　（ロ）工事用道路　（ハ）安全衛生計画　（ニ）直接仮設工事計画","（イ）工程計画　（ロ）資金計画　（ハ）機械計画　（ニ）直接仮設工事計画","（イ）労務計画　（ロ）資金計画　（ハ）安全衛生計画　（ニ）環境保全計画","（イ）工程計画　（ロ）工事用道路　（ハ）機械計画　（ニ）環境保全計画"],"ans":3,"ex":"","src":"20250602_2kyu","qid":143,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85636"},{"cat":"施工管理法応用","year":"R7前期 No.61","q":"工程表の名称と特徴に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。①ネットワーク式工程表は、工事内容を系統立てて作業相互の関連、順序、日数等を表した図表である。②出来高累計曲線は、工事全体の出来高比率の累計を曲線で表した図表である。③バーチャートは、出来高を縦軸にとり、工種ごとの工程を斜線で表した図表である。④グラフ式工程表は、縦軸に部分工事をとり、横軸に工事に必要な日数を棒線で表した図表である。","opts":["①②","①④","①②③","②③④"],"ans":0,"ex":"","src":"20250602_2kyu","qid":144,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85637"},{"cat":"施工管理法応用","year":"R7前期 No.63","q":"高さ2m以上の足場（一側足場及びつり足場を除く）の安全に関する下記の文章中の（イ）〜（ニ）に当てはまる数値の組合せとして、労働安全衛生法上、正しいものは次のうちどれか。・足場の床材が転位し脱落しないように取り付ける支持物の数は、（イ）以上とする。・足場の作業床の幅は、（ロ）cm以上とする。・足場の床材間の隙間は、（ハ）cm以下とする。・足場の作業床より物体の落下のおそれがあるときに設ける幅木の高さは、（ニ）cm以上とする。","opts":["（イ）2　（ロ）40　（ハ）3　（ニ）10","（イ）3　（ロ）30　（ハ）5　（ニ）10","（イ）3　（ロ）40　（ハ）3　（ニ）5","（イ）2　（ロ）30　（ハ）5　（ニ）5"],"ans":0,"ex":"","src":"20250602_2kyu","qid":145,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85639"},{"cat":"施工管理法応用","year":"R7前期 No.65","q":"品質管理に用いられるx-R管理図に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。①x管理図は、組ごとの分布の幅によって工程のばらつきの変化を管理する管理図である。②R管理図は、組ごとの平均値によって平均値の変動を管理する管理図である。③x-R管理図は、x管理図とR管理図を併用した折れ線グラフの管理図である。④x-R管理図は、各組の平均値の変動とばらつきの変化を同時に管理する管理図である。","opts":["①②","③④","①②③","②③④"],"ans":1,"ex":"","src":"20250602_2kyu","qid":146,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85641"},{"cat":"施工管理法応用","year":"R7前期 No.66","q":"盛土の締固めにおける品質管理に関する下記の①〜④の4つの記述のうち、適当なもののみを全てあげている組合せは次のうちどれか。①工法規定方式は、締固め機械の機種や締固め回数、盛土材料の敷均し厚さ等を規定する方法である。②品質規定方式は、盛土の品質を仕様書に明示し、締固めの工法を施工者に任せる方法である。③ICT建設機械での施工は、生産性の向上や働き方改革への対応及び品質の向上等が期待されている。④盛土の締固めは、法面の安定や土の含水比の増加等を目的とし、必要な強度特性が得られるように行う。","opts":["①②","③④","①②③","②③④"],"ans":2,"ex":"","src":"20250602_2kyu","qid":147,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/85642"},{"cat":"土木一般","year":"R8前期 No.2","q":"土の粒径加積曲線に関する文章中の(イ)～(ニ)に当てはまる語句の組合せとして、適当なものはどれか。・曲線①のような土は、曲線の傾きが緩やかであれば、広範囲の粒径の土粒子を含む土で、土粒子がつくる間隙をより小さな土粒子が埋めていき、大きな密度を得ることができるので、粒度分布が(イ)土である。・曲線②のような土は、狭い粒径の中で、曲線が立っているような土で、粒径がそろっていて、間隙が詰まりにくいので、粒度分布が(ロ)土である。・均等係数 Uc は曲線の傾きを示し、Uc ＝ D60/D10 で求める。この値が(ハ)ほど広範囲の粒径の粒子を含み、(ニ)ほど粒径がそろっていることを示す。","opts":["(イ)よい (ロ)悪い (ハ)大きい (ニ)小さい","(イ)悪い (ロ)よい (ハ)小さい (ニ)大きい","(イ)悪い (ロ)よい (ハ)大きい (ニ)小さい","(イ)よい (ロ)悪い (ハ)小さい (ニ)大きい"],"ans":0,"ex":"","src":"20260608_2kyu","qid":148,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93862"},{"cat":"土木一般","year":"R8前期 No.6","q":"土工の作業に使用する建設機械に関する記述のうち、適当でないものはどれか。","opts":["バックホウは、機械の位置より低い場所の掘削に適している。","ローディングショベルは、機械の位置より高い場所の掘削に適している。","ロードローラは、タイヤの接地圧を変化させることができる。","振動ローラは、振動機構で発生する起振力によって自重以上の転圧ができる。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":149,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93866"},{"cat":"土木一般","year":"R8前期 No.7","q":"土質試験における「試験名」とその「試験結果の利用」の組合せとして、適当でないものはどれか。","opts":["CBR 試験 － アスファルト舗装の設計","土の透水試験 － 地盤の液状化の判定","土の圧密試験 － 粘性土地盤の沈下量の推定","突固めによる土の締固め試験 － 盛土の締固め管理"],"ans":1,"ex":"","src":"20260608_2kyu","qid":150,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93867"},{"cat":"土木一般","year":"R8前期 No.8","q":"道路における盛土の施工に関する記述のうち、適当なものはどれか。","opts":["路床では、一般的に 1 層の締固め後の仕上り厚さを 30 cm 以下とする。","路体では、一般的に 1 層の締固め後の仕上り厚さを 50 cm 以下とする。","盛土の施工は、盛土材料を水平に敷き均し、均等に締め固める。","盛土材料の自然含水比が施工含水比の範囲内にないときには、粒度調整が必要である。"],"ans":2,"ex":"","src":"20260608_2kyu","qid":151,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93868"},{"cat":"土木一般","year":"R8前期 No.9","q":"軟弱地盤における改良工法に関する記述のうち、適当でないものはどれか。","opts":["表層処理工法には、表層に石灰やセメントを混合するサンドマット工法がある。","置換工法には、軟弱地盤を掘削して良質な材料と置き換える掘削置換工法がある。","脱水工法には、水中ポンプ等で排水するディープウェル工法がある。","固結工法には、安定材と軟弱土を地中で混合する深層混合処理工法がある。"],"ans":0,"ex":"","src":"20260608_2kyu","qid":152,"srcUrl":"https://2dobokusekou.kakomonn.com/questions/93869"},{"cat":"土木一般","year":"R8前期 No.10","q":"コンクリートに用いられる混和剤のうち、コンクリート中に多数の微細な独立気泡を均等に生じさせる混和剤として、適当なものはどれか。","opts":["減水剤","
