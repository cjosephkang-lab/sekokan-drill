<title>施工管理ドリル ― 土木施工管理技士 一次検定</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<style>
:root{
  --bg:#f2efe8; --sf:#ffffff; --el:#eae5da; --hair:#dcd6c9;
  --ink:#1f1c17; --ink2:#5f5850; --ink3:#938b7d;
  --acc:#b5622f; --acc-soft:rgba(181,98,47,.10); --acc-line:rgba(181,98,47,.32);
  --ok:#2f7d54; --ok-soft:rgba(47,125,84,.12);
  --ng:#bb3b2e; --ng-soft:rgba(187,59,46,.10);
  --blue:#33507a;
  --r:14px; --rs:9px;
  --shadow:0 1px 2px rgba(31,28,23,.05), 0 6px 20px rgba(31,28,23,.05);
  --ease:cubic-bezier(.2,.9,.3,1);
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic Medium","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15171c; --sf:#1d2027; --el:#242832; --hair:#333844;
    --ink:#eceae4; --ink2:#a7a397; --ink3:#6f6d66;
    --acc:#e08a4f; --acc-soft:rgba(224,138,79,.13); --acc-line:rgba(224,138,79,.34);
    --ok:#4bb27c; --ok-soft:rgba(75,178,124,.15);
    --ng:#e06a5c; --ng-soft:rgba(224,106,92,.14);
    --blue:#7ea0d4;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="light"]{
  --bg:#f2efe8; --sf:#ffffff; --el:#eae5da; --hair:#dcd6c9;
  --ink:#1f1c17; --ink2:#5f5850; --ink3:#938b7d;
  --acc:#b5622f; --acc-soft:rgba(181,98,47,.10); --acc-line:rgba(181,98,47,.32);
  --ok:#2f7d54; --ok-soft:rgba(47,125,84,.12);
  --ng:#bb3b2e; --ng-soft:rgba(187,59,46,.10); --blue:#33507a;
  --shadow:0 1px 2px rgba(31,28,23,.05), 0 6px 20px rgba(31,28,23,.05);
}
:root[data-theme="dark"]{
  --bg:#15171c; --sf:#1d2027; --el:#242832; --hair:#333844;
  --ink:#eceae4; --ink2:#a7a397; --ink3:#6f6d66;
  --acc:#e08a4f; --acc-soft:rgba(224,138,79,.13); --acc-line:rgba(224,138,79,.34);
  --ok:#4bb27c; --ok-soft:rgba(75,178,124,.15);
  --ng:#e06a5c; --ng-soft:rgba(224,106,92,.14); --blue:#7ea0d4;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  min-height:100dvh;line-height:1.7;-webkit-font-smoothing:antialiased;
  font-feature-settings:"palt";
}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.scr{display:none;flex-direction:column;min-height:100dvh}
.scr.on{display:flex}

/* --- top bar --- */
.bar{display:flex;align-items:center;gap:12px;padding:16px 20px 4px}
.bar .back{width:38px;height:38px;flex:none;border:1px solid var(--hair);background:var(--sf);
  border-radius:var(--rs);color:var(--ink);font-size:17px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:background .2s}
.bar .back:hover{background:var(--el)}
.bar .ttl{font-size:16px;font-weight:700;flex:1}
.theme-btn{width:38px;height:38px;flex:none;border:1px solid var(--hair);background:var(--sf);
  border-radius:var(--rs);color:var(--ink2);cursor:pointer;font-size:15px;display:flex;
  align-items:center;justify-content:center}

/* --- home --- */
.home-pad{padding:18px 20px 40px;display:flex;flex-direction:column;gap:20px}
.masthead{display:flex;justify-content:space-between;align-items:flex-start}
.masthead .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.masthead h1{font-size:23px;font-weight:800;letter-spacing:-.01em;margin-top:3px;text-wrap:balance}
.masthead .grade{font-size:11px;color:var(--acc);font-weight:700;border:1px solid var(--acc-line);
  border-radius:100px;padding:5px 12px;white-space:nowrap;margin-top:4px}
.grade-switch{display:flex;gap:0;background:var(--el);border-radius:var(--rs);padding:3px;border:1px solid var(--hair)}
.grade-switch .gs{flex:1;border:none;background:transparent;color:var(--ink2);font-family:inherit;
  font-size:13px;font-weight:700;padding:9px;border-radius:7px;cursor:pointer;transition:background .2s,color .2s}
.grade-switch .gs.on{background:var(--sf);color:var(--acc);box-shadow:var(--shadow)}

/* countdown / today card */
.today{background:var(--sf);border:1px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.today-top{padding:18px 20px;border-bottom:1px solid var(--hair);
  display:flex;justify-content:space-between;align-items:center;gap:14px}
.cd-label{font-size:12px;color:var(--ink2);font-weight:600}
.cd-days{font-size:34px;font-weight:800;line-height:1;color:var(--acc)}
.cd-days .u{font-size:14px;color:var(--ink2);font-weight:600;margin-left:3px}
.cd-date{font-size:11px;color:var(--ink3);margin-top:4px}
.streak{text-align:right}
.streak .n{font-size:28px;font-weight:800;line-height:1}
.streak .l{font-size:10px;color:var(--ink3);letter-spacing:.04em}
.today-goal{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.goal-row{display:flex;align-items:baseline;justify-content:space-between}
.goal-row .lbl{font-size:13px;color:var(--ink2);font-weight:600}
.goal-row .val{font-size:15px;font-weight:700}
.goal-row .val b{font-size:22px;color:var(--acc)}
.pbar{height:8px;background:var(--el);border-radius:5px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .8s var(--ease)}
.start-btn{width:100%;padding:15px;border:none;border-radius:var(--rs);cursor:pointer;
  background:var(--acc);color:#fff;font-family:inherit;font-size:15px;font-weight:700;
  transition:transform .12s var(--ease),filter .2s;letter-spacing:.02em}
.start-btn:hover{filter:brightness(1.05)}
.start-btn:active{transform:scale(.985)}
.start-btn.done{background:var(--ok-soft);color:var(--ok);border:1px solid transparent;cursor:default}

/* section label */
.slab{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:-6px;padding-left:2px}

/* mode grid */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--sf);border:1px solid var(--hair);border-radius:var(--rs);
  padding:15px;cursor:pointer;transition:border-color .2s,transform .12s var(--ease);text-align:left}
.mode:hover{border-color:var(--acc-line)}
.mode:active{transform:scale(.98)}
.mode .m-t{font-size:14px;font-weight:700;margin-bottom:2px}
.mode .m-s{font-size:11px;color:var(--ink3)}
.mode .m-b{font-size:11px;color:var(--acc);font-weight:700;margin-top:6px;font-family:var(--mono)}

/* score board */
.board{background:var(--sf);border:1px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.board-head{display:flex;justify-content:space-between;align-items:baseline}
.board-head .t{font-size:13px;font-weight:700}
.board-head .sc{font-family:var(--mono);font-weight:800;font-size:15px}
.board-head .sc b{font-size:22px;color:var(--acc)}
.board-note{font-size:11px;color:var(--ink3);line-height:1.6}
.catbar{display:flex;flex-direction:column;gap:3px}
.catbar .cr{display:flex;justify-content:space-between;font-size:12px}
.catbar .cr .cn{color:var(--ink2);font-weight:600}
.catbar .cr .cv{font-family:var(--mono);color:var(--ink3)}
.catbar .track{height:6px;background:var(--el);border-radius:4px;overflow:hidden}
.catbar .track>i{display:block;height:100%;border-radius:4px;transition:width .8s var(--ease)}

/* --- quiz --- */
.q-top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--hair);background:var(--sf)}
.q-top .prog{flex:1}
.q-top .ptrack{height:5px;background:var(--el);border-radius:3px;overflow:hidden}
.q-top .ptrack>i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .35s var(--ease)}
.q-top .pc{font-size:11px;color:var(--ink3);margin-top:5px;font-family:var(--mono)}
.q-close{width:34px;height:34px;flex:none;border:1px solid var(--hair);background:var(--bg);
  border-radius:8px;color:var(--ink2);font-size:15px;cursor:pointer}
.q-body{flex:1;padding:22px 20px 20px;overflow-y:auto}
.q-meta{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px}
.chip.cat{color:var(--acc);background:var(--acc-soft)}
.chip.src{color:var(--ink3);background:var(--el);font-family:var(--mono);font-weight:600}
.chip.rev{color:var(--blue);background:rgba(51,80,122,.10)}
.q-text{font-size:16px;font-weight:600;line-height:1.85;margin-bottom:22px;color:var(--ink);text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:13px;align-items:flex-start;background:var(--sf);border:1.5px solid var(--hair);
  border-radius:var(--rs);padding:14px 15px;cursor:pointer;font-size:14px;line-height:1.7;
  transition:border-color .18s,background .18s;text-align:left;width:100%;font-family:inherit;color:var(--ink)}
.opt:not(.dis):hover{border-color:var(--acc-line);background:var(--acc-soft)}
.opt:not(.dis):active{transform:scale(.995)}
.opt .num{width:26px;height:26px;flex:none;border-radius:7px;background:var(--el);color:var(--ink2);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono);margin-top:1px}
.opt.dis{cursor:default}
.opt.pick-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.pick-ok .num{background:var(--ok);color:#fff}
.opt.pick-ng{border-color:var(--ng);background:var(--ng-soft)}
.opt.pick-ng .num{background:var(--ng);color:#fff}
.opt.reveal-ok{border-color:var(--ok)}
.opt.reveal-ok .num{background:var(--ok);color:#fff}
.opt.faded{opacity:.5}
.expl{margin-top:20px;border:1px solid var(--hair);border-left:3px solid var(--acc);
  border-radius:var(--rs);padding:16px 17px;background:var(--sf);display:none}
.expl.show{display:block;animation:slideUp .4s var(--ease)}
.expl .eh{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.05em;margin-bottom:8px;
  text-transform:uppercase;display:flex;align-items:center;gap:7px}
.expl .verdict{font-family:var(--sans);font-size:12px;padding:2px 9px;border-radius:100px;font-weight:700}
.expl .verdict.ok{color:var(--ok);background:var(--ok-soft)}
.expl .verdict.ng{color:var(--ng);background:var(--ng-soft)}
.expl .et{font-size:13.5px;line-height:1.85;color:var(--ink2)}
.expl-link{display:none;margin-top:12px;font-size:13px;font-weight:700;color:var(--acc);text-decoration:none}
.expl-link.show{display:inline-flex;align-items:center;gap:5px}
.expl-link:hover{text-decoration:underline}
.q-foot{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);background:var(--sf)}
.next-btn{width:100%;padding:15px;border:none;border-radius:var(--rs);cursor:pointer;
  background:var(--acc);color:#fff;font-family:inherit;font-size:15px;font-weight:700;
  display:none;transition:transform .12s var(--ease)}
.next-btn.show{display:block}
.next-btn:active{transform:scale(.985)}

/* --- results --- */
.res{align-items:center;justify-content:center;text-align:center;padding:40px 28px;gap:0}
.res .rt{font-size:24px;font-weight:800;margin-bottom:6px;text-wrap:balance}
.res .rs{font-size:13px;color:var(--ink2);margin-bottom:26px}
.ring{width:150px;height:150px;position:relative;margin:0 auto 26px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--el);stroke-width:11}
.ring .fg{fill:none;stroke:var(--acc);stroke-width:11;stroke-linecap:round;
  stroke-dasharray:427;stroke-dashoffset:427;transition:stroke-dashoffset 1.3s var(--ease)}
.ring .fg.pass{stroke:var(--ok)}
.ring .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-size:38px;font-weight:800;font-family:var(--mono)}
.ring .frac{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-bottom:14px}
.res-stat{background:var(--sf);border:1px solid var(--hair);border-radius:var(--rs);padding:13px 8px}
.res-stat .v{font-size:19px;font-weight:800;font-family:var(--mono);display:block}
.res-stat .l{font-size:10px;color:var(--ink3);margin-top:3px}
.res-msg{font-size:12.5px;color:var(--ink2);line-height:1.7;background:var(--acc-soft);
  border-radius:var(--rs);padding:13px 15px;margin-bottom:22px;width:100%}
.res-acts{width:100%;display:flex;flex-direction:column;gap:10px}
.btn-ghost{width:100%;padding:14px;border:1px solid var(--hair);border-radius:var(--rs);
  background:var(--sf);color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}

/* flash */
.flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0}
.flash.f-ok{background:radial-gradient(circle at 50% 60%,var(--ok-soft),transparent 65%);animation:flash .55s forwards}
.flash.f-ng{background:radial-gradient(circle at 50% 60%,var(--ng-soft),transparent 65%);animation:flash .55s forwards}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:100px;
  z-index:60;opacity:0;transition:opacity .3s,transform .3s var(--ease);pointer-events:none;max-width:88%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* settings inline */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--sf);border:1px solid var(--hair);border-radius:var(--rs);padding:14px 16px}
.setrow .k{font-size:13px;font-weight:600}
.setrow .kk{font-size:11px;color:var(--ink3);margin-top:2px}
.setrow input[type=date]{font-family:var(--mono);font-size:13px;border:1px solid var(--hair);
  border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
.link{color:var(--acc);font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;background:none;border:none;font-family:inherit}

@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>
<div class="wrap">

<!-- ===== HOME ===== -->
<section class="scr on" id="home">
  <div class="bar">
    <div class="ttl"></div>
    <button class="theme-btn" id="themeBtn" aria-label="表示テーマ切替">◐</button>
  </div>
  <div class="home-pad">
    <div class="masthead">
      <div>
        <div class="eyebrow">土木施工管理技士 一次検定</div>
        <h1>施工管理ドリル</h1>
      </div>
      <div class="grade" id="gradeBadge">2級 · 前提</div>
    </div>

    <div class="grade-switch" id="gradeSwitch" style="display:none">
      <button class="gs" id="grade1">1級</button>
      <button class="gs" id="grade2">2級</button>
    </div>

    <div class="today">
      <div class="today-top">
        <div>
          <div class="cd-label">試験日まで</div>
          <div class="cd-days" id="cdDays">— <span class="u">日</span></div>
          <div class="cd-date" id="cdDate"></div>
        </div>
        <div class="streak">
          <div class="n" id="streakN">0</div>
          <div class="l">日連続 🔥</div>
        </div>
      </div>
      <div class="today-goal">
        <div class="goal-row">
          <span class="lbl">今日やる</span>
          <span class="val"><b id="goalDone">0</b> / <span id="goalTotal">0</span> 問</span>
        </div>
        <div class="pbar"><i id="goalBar" style="width:0%"></i></div>
        <button class="start-btn" id="startToday">今日の学習を始める</button>
      </div>
    </div>

    <div class="slab">学習モード</div>
    <div class="modes">
      <button class="mode" id="modeReview">
        <div class="m-t">復習</div>
        <div class="m-s">忘れかけを再出題</div>
        <div class="m-b" id="reviewCount">0 問</div>
      </button>
      <button class="mode" id="modeNew">
        <div class="m-t">新しい問題</div>
        <div class="m-s">まだ解いていない</div>
        <div class="m-b" id="newCount">0 問</div>
      </button>
      <button class="mode" id="modeCat">
        <div class="m-t">分野別</div>
        <div class="m-s">科目を選んで演習</div>
        <div class="m-b" id="catAll">全4分野</div>
      </button>
      <button class="mode" id="modeExam">
        <div class="m-t">模試</div>
        <div class="m-s">本番形式で通す</div>
        <div class="m-b" id="examCount">全問</div>
      </button>
    </div>

    <div class="slab">予想得点</div>
    <div class="board">
      <div class="board-head">
        <span class="t">本番換算スコア</span>
        <span class="sc"><b id="projPct">0</b>%</span>
      </div>
      <div class="board-note" id="boardNote"></div>
      <div id="catBars"></div>
    </div>

    <div class="slab">試験日の設定</div>
    <div class="setrow">
      <div>
        <div class="k">試験日</div>
        <div class="kk" id="examSetNote">逆算して今日の問題数を決めます</div>
      </div>
      <input type="date" id="examDate">
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0 2px">
      <button class="link" id="resetBtn">学習記録をリセット</button>
      <span style="font-size:11px;color:var(--ink3)" id="verLabel"></span>
    </div>
    <p style="font-size:11px;color:var(--ink3);line-height:1.7;padding:0 2px">
      <span id="introText">収録問題</span>（全<span id="qTotal2">48</span>問）。
      各問の学習状況はこの端末のブラウザにのみ保存されます。試験制度の一次情報と1級の合格戦略は別途「合格ロードマップ」を参照。
    </p>
  </div>
</section>

<!-- ===== CATEGORY ===== -->
<section class="scr" id="cats">
  <div class="bar">
    <button class="back" data-go="home">←</button>
    <div class="ttl">分野を選択</div>
  </div>
  <div class="home-pad" id="catList"></div>
</section>

<!-- ===== QUIZ ===== -->
<section class="scr" id="quiz">
  <div class="q-top">
    <div class="prog">
      <div class="ptrack"><i id="qProg" style="width:0%"></i></div>
      <div class="pc" id="qCount">1 / 10</div>
    </div>
    <button class="q-close" id="qClose" aria-label="中断">✕</button>
  </div>
  <div class="q-body" id="qBody">
    <div class="q-meta" id="qMeta"></div>
    <div class="q-text" id="qText"></div>
    <div class="opts" id="qOpts"></div>
    <div class="expl" id="expl">
      <div class="eh">解説 <span class="verdict" id="verdict"></span></div>
      <div class="et" id="explText"></div>
      <a class="expl-link" id="explLink" href="#" target="_blank" rel="noopener">解答解説を見る →</a>
    </div>
  </div>
  <div class="q-foot">
    <button class="next-btn" id="nextBtn">次の問題 →</button>
  </div>
</section>

<!-- ===== RESULTS ===== -->
<section class="scr res" id="results">
  <div class="rt" id="resTitle"></div>
  <div class="rs" id="resSub"></div>
  <div class="ring">
    <svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="68"/><circle class="fg" id="resRing" cx="75" cy="75" r="68"/></svg>
    <div class="txt"><span class="pct mono" id="resPct">0%</span><span class="frac" id="resFrac"></span></div>
  </div>
  <div class="res-stats">
    <div class="res-stat"><span class="v" id="resCorrect">0</span><span class="l">正解</span></div>
    <div class="res-stat"><span class="v" id="resStreak">0</span><span class="l">連続日数</span></div>
    <div class="res-stat"><span class="v" id="resMastered">0</span><span class="l">習得済み</span></div>
  </div>
  <div class="res-msg" id="resMsg"></div>
  <div class="res-acts">
    <button class="start-btn" id="resAgain">続けて学習する</button>
    <button class="btn-ghost" data-go="home">ホームに戻る</button>
  </div>
</section>

</div>

/* __SRS_ENGINE__ */
</script>
<script>
/* __QUESTIONS_DATA__ */
</script>
<script>
'use strict';
(function(){
  var S = window.SRS;
  // 級ごとのデータセット。__DATASETS__ = { '1kyu': [...], '2kyu': [...] }
  var DATASETS = window.__DATASETS__ || { '2kyu': (window.__QUESTIONS__||[]) };

  // 級ごとの設定。すべて一次情報（jctc.jp / 国交省）に基づく。
  var GRADE_CONFIG = {
    '1kyu': {
      label: '1級',
      badge: '1級 · 公式過去問',
      // 1級一次の分野別解答数（本番=全101問中70問。応用能力=足切り対象）。予想得点の換算重み。
      subjectOrder: ['施工管理法応用','施工管理法','土木一般','専門土木','法規'],
      examWeights: {'施工管理法応用':15,'施工管理法':16,'土木一般':13,'専門土木':17,'法規':9},
      passLine: 60,
      // 応用能力（施工管理法応用）に独立の足切り（15問中9問=60%）
      cutoffCat: '施工管理法応用', cutoffLine: 60,
      defaultExam: '2027-07-04', // 令和9年度1級一次の推定日（例年7月第1日曜。正式日程は2026年12月公表）
      examNote: '令和9年度 1級一次（推定・正式日程は2026年12月公表）',
      intro: '1級土木一次の公式過去問（令和4〜8年度・全国建設研修センター公表）。正解番号は公式正答表と機械照合済み。図表を要する問題は除外。応用能力には本番同様の足切りがあります。'
    },
    '2kyu': {
      label: '2級',
      badge: '2級 · 公式過去問',
      subjectOrder: ['施工管理法','土木一般','専門土木','法規'],
      examWeights: {'施工管理法':19,'土木一般':11,'専門土木':6,'法規':9},
      passLine: 60,
      cutoffCat: null, cutoffLine: null,
      defaultExam: '2026-10-25', // 2級後期一次（一次情報）
      examNote: '2級後期 一次検定',
      intro: '2級土木一次の公式過去問（令和4〜8年度の前期・後期・全国建設研修センター公表）。正解番号は公式正答表と機械照合済み。図表を要する問題は除外。'
    }
  };

  var GRADE_KEY = 'sekokan-drill-grade';
  var currentGrade = loadGrade();
  var CFG = GRADE_CONFIG[currentGrade];
  var QUESTIONS = DATASETS[currentGrade] || [];
  var SUBJECT_ORDER = CFG.subjectOrder;
  var EXAM_WEIGHTS = CFG.examWeights;
  var PASS_LINE = CFG.passLine;

  function loadGrade(){
    var g = null;
    try{ g = localStorage.getItem(GRADE_KEY); }catch(e){}
    if(g && GRADE_CONFIG[g] && (DATASETS[g]||[]).length) return g;
    // データがある級を優先（1級があれば1級、なければ2級）
    if((DATASETS['1kyu']||[]).length) return '1kyu';
    return '2kyu';
  }
  function setGrade(g){
    if(!GRADE_CONFIG[g] || !(DATASETS[g]||[]).length) return;
    currentGrade = g;
    try{ localStorage.setItem(GRADE_KEY, g); }catch(e){}
    CFG = GRADE_CONFIG[g]; QUESTIONS = DATASETS[g]; SUBJECT_ORDER = CFG.subjectOrder;
    EXAM_WEIGHTS = CFG.examWeights; PASS_LINE = CFG.passLine;
    state = load();
    renderHome();
  }

  // 学習記録は級ごとに分離（キーに級を含める）
  function storeKey(){ return 'sekokan-drill-v1-' + currentGrade; }

  var state = load();

  function load(){
    try{
      var raw = localStorage.getItem(storeKey());
      if(raw){ var p = JSON.parse(raw); if(p && p.cards) return normalize(p); }
    }catch(e){}
    return normalize({cards:{}, streak:0, lastStudyDay:null, examDate:CFG.defaultExam, goalDoneDay:null, goalDoneCount:0});
  }
  function normalize(p){
    p.cards = p.cards||{}; p.streak = p.streak||0; p.examDate = p.examDate||CFG.defaultExam;
    p.lastStudyDay = (p.lastStudyDay===undefined)?null:p.lastStudyDay;
    p.goalDoneDay = (p.goalDoneDay===undefined)?null:p.goalDoneDay;
    p.goalDoneCount = p.goalDoneCount||0;
    return p;
  }
  function save(){ try{ localStorage.setItem(storeKey(), JSON.stringify(state)); }catch(e){} }
  function today(){ return S.epochDay(Date.now()); }
  function examDaysLeft(){
    if(!state.examDate) return null;
    var ex = S.epochDay(new Date(state.examDate+'T00:00:00').getTime());
    return ex - today();
  }

  // --- helpers ---
  function el(id){ return document.getElementById(id); }
  function go(name){
    document.querySelectorAll('.scr').forEach(function(s){ s.classList.remove('on'); });
    el(name).classList.add('on');
    window.scrollTo(0,0);
    if(name==='home') renderHome();
    if(name==='cats') renderCats();
  }
  function toast(msg){
    var t = el('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 1900);
  }
  function fmtDate(iso){
    if(!iso) return '';
    var d = new Date(iso+'T00:00:00');
    var w = ['日','月','火','水','木','金','土'][d.getDay()];
    return (d.getMonth()+1)+'月'+d.getDate()+'日('+w+')';
  }

  // --- streak update on study ---
  function bumpStreak(){
    var t = today();
    if(state.lastStudyDay === t) return; // 今日すでにカウント済み
    if(state.lastStudyDay === t-1) state.streak += 1;
    else state.streak = 1;
    state.lastStudyDay = t;
  }
  function goalCountToday(){
    return (state.goalDoneDay===today()) ? state.goalDoneCount : 0;
  }
  function addGoalProgress(n){
    var t = today();
    if(state.goalDoneDay!==t){ state.goalDoneDay=t; state.goalDoneCount=0; }
    state.goalDoneCount += n;
  }

  // --- queue building ---
  function reviewQueue(){
    return QUESTIONS.filter(function(q){ return S.isDue(state.cards[q.qid], today()); });
  }
  function newQueue(){
    return QUESTIONS.filter(function(q){ var c=state.cards[q.qid]; return !c || !c.seen; });
  }
  function todayGoal(){
    var remaining = QUESTIONS.filter(function(q){ var c=state.cards[q.qid]; return !c || !c.mastered; }).length;
    var dl = examDaysLeft();
    return S.dailyGoal(remaining, dl==null?null:Math.max(dl,1), 10);
  }
  function todayQueue(){
    // 復習優先→未着手→既習。buildQueueの順で、今日の目標数だけ取る
    var q = S.buildQueue(QUESTIONS, state.cards, today(), SUBJECT_ORDER);
    // masteredで期限前のものは今日やる対象から外す（無限に既習を混ぜない）
    var pri = q.filter(function(x){
      var c = state.cards[x.qid];
      if(S.isDue(c, today())) return true;
      if(!c || !c.seen) return true;
      return false;
    });
    var goal = todayGoal();
    return pri.slice(0, Math.max(goal,1));
  }

  // --- quiz session ---
  var session = null;
  function startSession(title, list, opts){
    opts = opts||{};
    if(!list.length){ toast('対象の問題がありません'); return; }
    session = { title:title, list:list, idx:0, correct:0, answered:false, mode:opts.mode||'', masteredBefore:countMastered() };
    go('quiz');
    renderQuestion();
  }
  function countMastered(){
    return QUESTIONS.filter(function(q){ var c=state.cards[q.qid]; return c && c.mastered; }).length;
  }
  function renderQuestion(){
    session.answered = false;
    var q = session.list[session.idx];
    el('qProg').style.width = (session.idx/session.list.length*100)+'%';
    el('qCount').textContent = (session.idx+1)+' / '+session.list.length;
    var meta = '<span class="chip cat">'+q.cat+'</span><span class="chip src">'+q.year+'</span>';
    if(S.isDue(state.cards[q.qid], today()) && state.cards[q.qid] && state.cards[q.qid].seen) meta += '<span class="chip rev">復習</span>';
    el('qMeta').innerHTML = meta;
    el('qText').textContent = q.q;
    var wrap = el('qOpts'); wrap.innerHTML = '';
    q.opts.forEach(function(text, i){
      var b = document.createElement('button');
      b.className = 'opt'; b.type='button';
      b.innerHTML = '<span class="num">'+(i+1)+'</span><span>'+escapeHtml(text)+'</span>';
      b.addEventListener('click', function(){ answer(i); });
      wrap.appendChild(b);
    });
    el('expl').classList.remove('show');
    el('nextBtn').classList.remove('show');
    el('nextBtn').textContent = (session.idx === session.list.length-1) ? '結果を見る →' : '次の問題 →';
  }
  function answer(pick){
    if(session.answered) return;
    session.answered = true;
    var q = session.list[session.idx];
    var correct = (pick === q.ans);
    if(correct) session.correct++;
    // 分野別集計（足切り判定用）
    if(!session.byCat) session.byCat = {};
    if(!session.byCat[q.cat]) session.byCat[q.cat] = {total:0, correct:0};
    session.byCat[q.cat].total++;
    if(correct) session.byCat[q.cat].correct++;
    // SRS更新
    state.cards[q.qid] = S.reviewCard(state.cards[q.qid], correct, today());
    bumpStreak();
    save();
    // 視覚フィードバック
    var opts = el('qOpts').children;
    for(var i=0;i<opts.length;i++){
      opts[i].classList.add('dis');
      opts[i].disabled = true;
      if(i===q.ans){ opts[i].classList.add(i===pick?'pick-ok':'reveal-ok'); }
      else if(i===pick){ opts[i].classList.add('pick-ng'); }
      else { opts[i].classList.add('faded'); }
    }
    var flash = el('flash'); flash.className='flash '+(correct?'f-ok':'f-ng');
    setTimeout(function(){ flash.className='flash'; }, 560);
    // 解説（過去問は公式解説なし→正解番号を表示し、詳しい解説は外部サイトへのリンクに委ねる）
    var v = el('verdict'); v.textContent = correct?'正解':'不正解';
    v.className = 'verdict '+(correct?'ok':'ng');
    var linkEl = el('explLink');
    if(q.ex && q.ex.trim()){
      el('explText').textContent = q.ex;
      linkEl.classList.remove('show');
    } else {
      var ansText = q.opts[q.ans];
      el('explText').textContent = '正解は ('+(q.ans+1)+') 「'+ansText+'」。 出典: '+CFG.label+' '+q.year;
      if(q.srcUrl){
        linkEl.href = q.srcUrl;
        linkEl.classList.add('show');
      } else {
        el('explText').textContent += ' この問題は解説ページが見つかっていないため、選択肢の正誤は各自でご確認ください。';
        linkEl.classList.remove('show');
      }
    }
    el('expl').classList.add('show');
    el('nextBtn').classList.add('show');
    el('qProg').style.width = ((session.idx+1)/session.list.length*100)+'%';
  }
  function next(){
    if(!session.answered) return;
    if(session.idx < session.list.length-1){ session.idx++; renderQuestion(); }
    else finish();
  }
  function finish(){
    // 今日の目標に反映（今日やる／復習／新規のときだけ）
    if(session.mode==='today' || session.mode==='review' || session.mode==='new'){
      addGoalProgress(session.list.length);
      save();
    }
    var total = session.list.length, correct = session.correct;
    var pct = Math.round(correct/total*100);
    var overallPass = pct >= PASS_LINE;
    // 足切り判定（1級の模試のみ）: 応用能力分野が60%未満なら、総合が合格でも不合格
    var cutoffFail = false, cutoffPct = null;
    if(CFG.cutoffCat && session.mode==='exam' && session.byCat && session.byCat[CFG.cutoffCat]){
      var cc = session.byCat[CFG.cutoffCat];
      cutoffPct = cc.total>0 ? Math.round(cc.correct/cc.total*100) : null;
      if(cutoffPct!==null && cutoffPct < CFG.cutoffLine) cutoffFail = true;
    }
    var pass = overallPass && !cutoffFail;
    go('results');
    el('resTitle').textContent = pass ? 'よくできました' : (cutoffFail ? '足切りに注意' : 'あと少し');
    el('resSub').textContent = session.title;
    el('resPct').textContent = pct+'%';
    el('resFrac').textContent = correct+' / '+total;
    el('resCorrect').textContent = correct;
    el('resStreak').textContent = state.streak;
    el('resMastered').textContent = countMastered();
    var newlyMastered = countMastered() - session.masteredBefore;
    var msg;
    if(cutoffFail) msg = '総合は'+pct+'%ですが、'+CFG.cutoffCat+'が'+cutoffPct+'%で足切りライン'+CFG.cutoffLine+'%に届いていません。1級一次は総合60%かつ応用能力60%の両方が必要です。応用能力を重点的に。';
    else if(pass && newlyMastered>0) msg = '合格ライン'+PASS_LINE+'%を超えました。今回'+newlyMastered+'問が「習得済み」に。間違えた問題は間隔をあけて再出題されます。';
    else if(pass) msg = '合格ライン'+PASS_LINE+'%を超えました。この調子で続けましょう。2回連続で正解した問題は「習得済み」になります。';
    else msg = '合格ラインは'+PASS_LINE+'%（本番も60%）。間違えた問題は明日また出題されます。解説を読み直して次に備えましょう。';
    el('resMsg').textContent = msg;
    var ring = el('resRing');
    ring.classList.toggle('pass', pass);
    setTimeout(function(){ ring.style.strokeDashoffset = String(427 - 427*pct/100); }, 80);
  }

  function escapeHtml(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // --- home render ---
  function renderHome(){
    var dl = examDaysLeft();
    el('cdDays').innerHTML = (dl==null?'—':Math.max(dl,0))+' <span class="u">日</span>';
    el('cdDate').textContent = state.examDate ? fmtDate(state.examDate)+' 実施' : '';
    el('streakN').textContent = state.streak;
    var goal = todayGoal();
    var done = goalCountToday();
    el('goalTotal').textContent = goal;
    el('goalDone').textContent = Math.min(done,goal);
    el('goalBar').style.width = (goal>0?Math.min(done/goal*100,100):0)+'%';
    var startBtn = el('startToday');
    if(goal>0 && done>=goal){ startBtn.textContent='今日のノルマ達成 ✓'; startBtn.classList.add('done'); }
    else { startBtn.textContent='今日の学習を始める'; startBtn.classList.remove('done'); }
    el('reviewCount').textContent = reviewQueue().length+' 問';
    el('newCount').textContent = newQueue().length+' 問';
    el('examCount').textContent = QUESTIONS.length+' 問';
    var catCount = SUBJECT_ORDER.filter(function(c){ return QUESTIONS.some(function(q){ return q.cat===c; }); }).length;
    el('catAll').textContent = '全'+catCount+'分野';
    el('qTotal2').textContent = QUESTIONS.length;
    // 予想得点
    var proj = S.projectedScore(QUESTIONS, state.cards, EXAM_WEIGHTS);
    var pct = proj.totalExam>0 ? Math.round(proj.totalProjected/proj.totalExam*100) : 0;
    el('projPct').textContent = pct;
    var answeredAny = QUESTIONS.some(function(q){ var c=state.cards[q.qid]; return c&&c.seen; });
    el('boardNote').textContent = answeredAny
      ? '解いた問題の正答率を本番の配点に換算した推定値です（合格ライン60%）。'
      : 'まだ学習記録がありません。問題を解くと、本番の配点に換算した推定得点がここに表示されます。';
    var bars = el('catBars'); bars.innerHTML='';
    SUBJECT_ORDER.forEach(function(cat){
      var c = proj.byCat[cat]; if(!c) return;
      var rate = Math.round(c.rate*100);
      var color = c.answered===0 ? 'var(--el)' : (rate>=60?'var(--ok)':(rate>=40?'var(--acc)':'var(--ng)'));
      var row = document.createElement('div');
      row.className='catbar'; row.style.marginBottom='10px';
      row.innerHTML = '<div class="cr"><span class="cn">'+cat+'</span>'+
        '<span class="cv">'+(c.answered===0?'未着手':rate+'% · '+c.answered+'問')+'</span></div>'+
        '<div class="track"><i style="width:'+(c.answered===0?4:Math.max(rate,3))+'%;background:'+color+'"></i></div>';
      bars.appendChild(row);
    });
    el('gradeBadge').textContent = CFG.badge;
    el('examDate').value = state.examDate||'';
    el('introText').textContent = CFG.intro;
    el('examSetNote').textContent = CFG.examNote;
    // 級切替タブの状態
    var has1 = (DATASETS['1kyu']||[]).length>0, has2 = (DATASETS['2kyu']||[]).length>0;
    var sw = el('gradeSwitch');
    if(has1 && has2){
      sw.style.display='flex';
      el('grade1').classList.toggle('on', currentGrade==='1kyu');
      el('grade2').classList.toggle('on', currentGrade==='2kyu');
    } else { sw.style.display='none'; }
  }

  function renderCats(){
    var list = el('catList'); list.innerHTML='';
    SUBJECT_ORDER.forEach(function(cat){
      var qs = QUESTIONS.filter(function(q){ return q.cat===cat; });
      if(!qs.length) return;
      var done = qs.filter(function(q){ var c=state.cards[q.qid]; return c&&c.seen; }).length;
      var mastered = qs.filter(function(q){ var c=state.cards[q.qid]; return c&&c.mastered; }).length;
      var card = document.createElement('button');
      card.className='mode'; card.style.gridColumn='1 / -1'; card.style.marginBottom='0';
      card.innerHTML = '<div class="m-t">'+cat+'</div>'+
        '<div class="m-s">'+qs.length+'問中 '+done+'問学習・'+mastered+'問習得</div>'+
        '<div class="m-b">解く →</div>';
      card.addEventListener('click', function(){
        startSession(cat, shuffle(qs.slice()), {mode:'cat'});
      });
      list.appendChild(card);
    });
  }

  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  // --- theme ---
  function applyTheme(t){
    if(t==='auto'){ document.documentElement.removeAttribute('data-theme'); }
    else document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('sekokan-theme', t); }catch(e){}
  }
  function initTheme(){
    var t = 'auto';
    try{ t = localStorage.getItem('sekokan-theme')||'auto'; }catch(e){}
    applyTheme(t);
  }
  function cycleTheme(){
    var cur = document.documentElement.getAttribute('data-theme')||'auto';
    var order = ['auto','light','dark'];
    var nextT = order[(order.indexOf(cur)+1)%3];
    applyTheme(nextT);
    toast(nextT==='auto'?'テーマ: 端末に合わせる':(nextT==='light'?'テーマ: ライト':'テーマ: ダーク'));
  }

  // --- wire up ---
  el('startToday').addEventListener('click', function(){
    var goal = todayGoal(), done = goalCountToday();
    if(goal>0 && done>=goal){ toast('今日のノルマは達成済みです'); return; }
    startSession('今日やる', todayQueue(), {mode:'today'});
  });
  el('modeReview').addEventListener('click', function(){
    var q = reviewQueue();
    if(!q.length){ toast('今日復習する問題はありません'); return; }
    startSession('復習', S.buildQueue(q, state.cards, today(), SUBJECT_ORDER), {mode:'review'});
  });
  el('modeNew').addEventListener('click', function(){
    var q = newQueue();
    if(!q.length){ toast('未着手の問題はありません（全問学習済み）'); return; }
    startSession('新しい問題', S.buildQueue(q, state.cards, today(), SUBJECT_ORDER).slice(0,10), {mode:'new'});
  });
  el('modeCat').addEventListener('click', function(){ go('cats'); });
  el('modeExam').addEventListener('click', function(){
    startSession('模試（全'+QUESTIONS.length+'問）', shuffle(QUESTIONS.slice()), {mode:'exam'});
  });
  el('nextBtn').addEventListener('click', next);
  el('qClose').addEventListener('click', function(){
    if(confirm('学習を中断してホームに戻りますか？（ここまでの記録は保存されます）')) go('home');
  });
  el('resAgain').addEventListener('click', function(){ startSession('今日やる', todayQueue(), {mode:'today'}); });
  el('themeBtn').addEventListener('click', cycleTheme);
  el('examDate').addEventListener('change', function(e){
    state.examDate = e.target.value||null; save(); renderHome();
    toast(state.examDate?'試験日を設定しました':'試験日をクリアしました');
  });
  el('resetBtn').addEventListener('click', function(){
    if(confirm('学習記録（正誤・習得状況・連続日数）をすべて消去します。よろしいですか？')){
      state = normalize({cards:{}, streak:0, lastStudyDay:null, examDate:state.examDate, goalDoneDay:null, goalDoneCount:0});
      save(); renderHome(); toast('学習記録をリセットしました');
    }
  });
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(){ go(b.getAttribute('data-go')); });
  });
  el('grade1').addEventListener('click', function(){ if(currentGrade!=='1kyu'){ setGrade('1kyu'); toast('1級に切り替えました'); } });
  el('grade2').addEventListener('click', function(){ if(currentGrade!=='2kyu'){ setGrade('2kyu'); toast('2級に切り替えました'); } });

  el('verLabel').textContent = 'v2 · '+QUESTIONS.length+'問';
  initTheme();
